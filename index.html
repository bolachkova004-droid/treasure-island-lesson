ss(1.08)}\n.btn.ghost{color:var(--deep);background:#fffaf0;border:1px solid var(--line);\n  box-shadow:0 3px 0 #d4c9b3}\n.btn.go,.btn.warm,.btn.flag,.btn.warn{background:var(--accent);border-color:#85482e;box-shadow:0 4px 0 #81472f}\n.btn.go{background:var(--tide);border-color:#1d555c;box-shadow:0 4px 0 #194d54}\n.btn:disabled{filter:grayscale(.4);opacity:.55}\ninput.field,textarea.field,select.field,.field{\n  color:var(--ink);background:#fffdfa;border:1.5px solid #cfc4ae;border-radius:11px;\n  box-shadow:inset 0 2px 2px rgba(45,59,50,.03);\n}\n.field:focus{outline:2px solid rgba(36,107,115,.23);border-color:var(--tide);background:#fff}\na{color:var(--tide);text-underline-offset:3px}\n.note,.note-ru,.frame,.mono-note{color:var(--ink-soft)}\n.note,.note-ru{background:#f3ead9;border-left:3px solid #b88e4d;border-radius:6px 12px 12px 6px}\n\n/* Main chapter I–II · explorer's ledger */\n.shell{grid-template-columns:252px minmax(0,1fr)}\n.rail{\n  padding:25px 18px 18px;\n  background:radial-gradient(circle at -25% -20%,#37656b 0%,transparent 45%),#16373f;\n  color:#f6eede;border-right:1px solid #416168;\n}\n.rail-mark{padding:5px 0;background:transparent;color:#e0bb7d}\n.rail-title{font-size:29px;color:#fff6e5;margin-top:14px}\n.rail-sub{color:#b9cac5;font-size:13px;line-height:1.55}\n.rail .gauge-copy{color:#c9d7ce}\n.rail .ink-gauge{height:6px;background:#416066}\n.rail .ink-gauge i{background:linear-gradient(90deg,#ae7c47,#e9c888)}\n.rail .tabs{gap:4px}\n.rail .tab{border-radius:8px;color:#d1dfd7;background:transparent;font-size:14px;box-shadow:none}\n.rail .tab:hover{color:#fff;background:#29515a}\n.rail .tab.on{background:#efd6a8;color:#173b41;box-shadow:none}\n.rail .tab .flag{background:#41666a!important;color:#e3d1ac}\n.rail .tab.on .flag{background:#fff6dc!important}\n.rail .more-ch{border-top:1px solid #4a6869}\n.rail .more-ch span{color:#b8c9c4}\n.rail .more-ch a{color:#f7e8c7;background:#2d5660;border:1px solid #4c7274;border-radius:8px;box-shadow:none}\n.rail .more-ch a.wide{color:#183a41;background:#e7d4ae;border:0;box-shadow:none}\n.sheet{padding-top:22px;background:transparent}\n.sheet .bar{\n  border:1px solid var(--line);border-radius:14px;background:rgba(255,252,245,.96);\n  box-shadow:0 4px 24px rgba(31,56,53,.065);padding:10px 16px;\n}\n.bar-v{font-size:15px;color:var(--deep)}\n.xp-line,.ink-gauge,.meter,.progress .bar{height:6px;background:#dfd3bf}\n.xp-line i,.meter i,.progress .bar i{background:linear-gradient(90deg,#538d81,#b6a06a)}\n.xp-rank{background:#e9dcc4;color:#365758;letter-spacing:.06em}\n.seal-dot.on{color:#c29852;text-shadow:none}\n.bar-btn{font-size:13px;border:1px solid var(--line);border-radius:9px;background:#fbf5e9;box-shadow:none;color:var(--deep)}\n.bar-btn b{background:var(--deep)}\n.page.on{animation:journal-in .35s ease both}\n@keyframes journal-in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}\n.folio{\n  background:var(--paper);border:1px solid var(--line);border-radius:19px;\n  box-shadow:0 12px 32px rgba(36,55,51,.07);padding:var(--pad);\n}\n.folio+.folio{margin-top:18px}\n.folio.has-hero{padding-top:0}\n.folio .head{border-bottom:1px solid #e4dac8}\n.head h2{color:var(--deep);font-size:clamp(29px,3.7vw,46px)}\n.folio .stamp{padding:6px 11px;font-size:11px;text-transform:uppercase;letter-spacing:.09em}\n.hero{\n  background:#385e62;min-height:clamp(260px,32vw,400px);\n  margin-bottom:27px;\n}\n.hero::before{content:\"\";position:absolute;inset:0;z-index:1;\n  background:linear-gradient(90deg,rgba(14,37,42,.64),rgba(14,37,42,.1) 75%),linear-gradient(0deg,rgba(14,37,42,.34),transparent 65%);\n  pointer-events:none;\n}\n.hero .head{\n  z-index:2;max-width:min(580px,100%);padding:20px 24px;\n  background:rgba(20,53,59,.87);border:1px solid rgba(239,218,180,.32);\n  border-radius:10px;box-shadow:none;backdrop-filter:blur(5px);\n}\n.hero .head h2{color:#fff4dc}\n.hero .head .kicker{color:#efd39e}\n.hero .head .stamp{background:#e5cca0;color:#173a40}\n.page.on .hero img{animation:none;transform:none}\n.cover{background:#143b41}\n.cover-art{background:#356b6e}\n.cover-copy{\n  background:rgba(255,250,239,.965);border:1px solid #e1d2b9;\n  border-radius:12px;box-shadow:0 18px 46px rgba(9,32,37,.25);\n}\n.cover h1{color:var(--deep);font-size:clamp(47px,6vw,76px)}\n.cover h1 i{color:var(--accent)}\n.deck{color:#49645d;line-height:1.55}\n.cover-copy .id-box label{letter-spacing:.08em}\n.cover-copy .menu button{border:1px solid var(--line);border-radius:10px;background:#fffdf7;color:var(--deep);box-shadow:0 2px 0 #d6c8b2}\n.cover-copy .menu button.main{background:var(--deep);border-color:var(--deep);color:#fff;box-shadow:0 3px 0 #102b30}\n.cover-copy .menu button.main small{color:#e8dbb9}\n.cast-card{border:1px solid #d5cab5;background:#fffaee;box-shadow:0 4px 18px rgba(21,48,51,.14);border-radius:11px}\n.cast-card span{color:#6d6257}\n.folio .slab,.folio .rule,.folio .write,.folio .scene-panel{\n  background:#f7f0e3;border-color:#e5dac5;border-radius:13px;\n}\n.folio .scene{border:1px solid #d3c4aa;border-radius:14px}\n.folio .opts .opt,.folio .tile,.folio .item{\n  background:#fffdf7;border:1px solid #d8cbb6;border-radius:11px;color:var(--deep);\n}\n.folio .opt:hover,.folio .tile:hover{border-color:#9b7646}\n.folio .opt.pick,.folio .tile.sel{background:#e6d3b0;border-color:#bb9359;color:#173940}\n.folio .opt.pick::before{color:#fff;background:#285a62}\n.folio .opt.right,.folio .opt.hit{color:#fff;background:#287c59;border-color:#287c59}\n.folio .opt.wrong,.folio .opt.miss{color:#fff;background:var(--signal);border-color:var(--signal)}\n.folio .cards{gap:12px}\n.folio .card{--c:#9c7856!important;border:1px solid #dfd0b8;background:#fffaf0;border-radius:12px;box-shadow:0 3px 0 #e7d9c4}\n.folio .card:nth-child(2n){--c:#4a7977!important}\n.folio .card.done{background:#e6f1e7;border-color:#8db39b}\n.folio .card .tagline{background:var(--deep)}\n.folio .talk,.talk{\n  background:linear-gradient(125deg,#204950,#12333b);box-shadow:0 5px (36,55,51,.07);padding:30px}\n.wrap .stage .head,.stage-head{border-bottom:1px solid #e5dbc9}\n.wrap .stage h2,.stage-head h2{color:var(--deep)}\n.wrap .stage .slab,.wrap .stage .rule,.hw-part{\n  background:#f7f0e4;border:1px solid #e4d7c1;border-radius:12px;\n}\n.wrap .stage .opt,.wrap .stage .tile,.wrap .stage .item,.wrap .stage .chip,\n.wrap .stage .mode,.wrap .stage .sets button,.wrap .stage .flip{\n  border:1px solid #ded1bc;border-radius:11px;background:#fffdf7;color:var(--ink);\n}\n.wrap .stage .opt:hover,.wrap .stage .mode:hover{border-color:#ad8254}\n.wrap .stage .opt.pick,.wrap .stage .mode.on,.wrap .stage .sets button.on{\n  background:#245963;color:#fff;border-color:#245963;box-shadow:0 3px 0 #1a414a;\n}\n.wrap .stage .opt.hit,.wrap .stage .tile.good{background:var(--moss);color:#fff;border-color:var(--moss)}\n.wrap .stage .opt.miss,.wrap .stage .tile.bad{background:var(--signal);color:#fff;border-color:var(--signal)}\n.wrap .stage .card{--c:#9c7856!important;border:1px solid #ded1bc;background:#fffaf0;border-radius:11px}\n.wrap .stage .card:nth-child(2n){--c:#4a7977!important}\n.wrap .stage .flip{background:#fffaf0}\n.wrap .stage .flip .big{color:var(--deep)}\n.wrap .stage .talk{background:#204950}\n.wrap .stage .note{background:#f2e7d2}\n.wrap .stage .count{background:#173b41;color:#fff}\n.wrap .stage .stamp{background:#173b41;color:#fff}\n.wrap .stage .form{background:#376c71;color:#fff}\n.wrap .stage .rule.evt{background:#f2e3d4;border-color:#dac4ab}\n.wrap .stage .link,.wrap .stage .tf,.wrap .stage .gline,.wrap .stage .write{\n  border:1px solid #ded1bc;border-radius:11px;background:#fffdf7;box-shadow:none;\n}\n.wrap .stage .check input{accent-color:var(--tide)}\n.wrap .modes,.wrap .sets,.wrap .chips{gap:10px}\n.wrap .modes .mode i{background:#efe5d3;border-radius:7px}\n.wrap .modes .mode.on span{color:#f3e8d5}\n.wrap .section-k{margin-top:30px;color:#745b3d}\n.wrap .letter{background:#f1ddb3;border-color:#ceac6f;border-radius:9px;box-shadow:0 3px 0 #b58c53}\n.wrap .ear{background:#306974;box-shadow:0 5px 0 #183f48,0 0 0 7px rgba(36,107,115,.15)}\n\n/* Mobile reading comfort & safe areas */\n@media(max-width:1000px){\n  .shell{display:block}\n  .mob{background:#173b42;color:#fff3de;border-bottom:1px solid #4c6d70}\n  .mob b{font-family:var(--display);font-weight:600}\n  .mob span{color:#c1d2c9}\n  .mob button{background:#e1c18c;color:#163940;border:0;border-radius:8px;box-shadow:none}\n  #mobSet{background:#fff5df!important;border-color:#d9c7a4!important;color:#163940!important;box-shadow:none!important}\n  .mobnav{background:#183b42;border-color:#426269}\n  .mobnav .tab{color:#eff2e9;background:transparent;box-shadow:none}\n  .mobnav .tab.on{color:#203d40;background:#e5c68c;box-shadow:none}\n  .mobnav .more-ch span{color:#d3ded4}\n  .mobnav .more-ch a{background:#2b5861;color:#fff}\n  .sheet{padding:14px 13px 105px}\n  .foot{left:0}\n  .cover-copy{margin:-32px 12px 16px}\n}\n@media(max-width:650px){\n  body{font-size:16px}\n  .wrap{padding:12px 11px 58px}\n  .wrap .top{padding:21px 18px;border-radius:14px;gap:12px}\n  .wrap .top h1{font-size:clamp(32px,8vw,44px)}\n  .wrap .top svg{max-width:190px}\n  .wrap .stage{padding:19px 15px;border-radius:13px;margin-top:15px}\n  .wrap .steps{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}\n  .wrap .step{min-height:64px;padding:7px 2px}\n  .wrap .step span{font-size:10px}\n  .sheet{padding:10px 10px calc(96px + env(safe-area-inset-bottom))}\n  .sheet .bar{padding:11px;border-radius:11px}\n  .folio{border-radius:13px}\n  .hero{min-height:220px;padding:12px}\n  .hero .head{padding:12px 13px;border-radius:8px}\n  .hero .head h2{font-size:26px}\n  .cover{background:#163c44}\n  .cover-copy{margin:-25px 10px 15px;padding:23px 19px;border-radius:10px}\n  .cover h1{font-size:clamp(39px,10vw,54px)}\n  .cast-wrap{margin:0 10px 17px}\n  .cast-card{border-radius:8px}\n  .mob{padding-top:max(10px,env(safe-area-inset-top))}\n  .mobnav .tab{min-height:44px}\n  .folio .slab,.folio .scene-panel{padding:15px}\n  .foot{padding-bottom:max(12px,env(safe-area-inset-bottom));gap:8px}\n  .btn,.opt,.bar-btn,.step,.mode,.chip,.tile,.letter,.sets button{min-height:44px}\n  .field,input,textarea,select{font-size:16px!important}\n}\n@media(prefers-reduced-motion:reduce){\n  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"app\">\u003c/div>\n\u003cscript>\n/* Английская озвучка для всех страниц урока.\n   Браузер сам по себе часто читает английский русским голосом или\n   голосом-«шуткой» (на Mac: Albert, Bad News…). Здесь выбираем лучший\n   доступный английский голос, даём выбрать его вручную и держим скорость\n   в диапазоне, где речь не ломается. */\n(() => {\n'use strict';\n\nconst synth = 'speechSynthesis' in window ? window.speechSynthesis : null;\nconst PREF = 'tts-voice-v1';\nconst SAMPLE = 'Jim had to keep an eye out for a sailor with one leg.';\n\n/* голоса-эффекты macOS и роботизированные Eloquence */\nconst NOVELTY = /^(albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|pipe organ|superstar|trinoids|whisper|wobble|zarvox|deranged|hysterical|fred|junior|ralph|kathy|princess)\\b/i;\nconst ROBOTIC = /^(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley)\\b/i;\nconst NICE = /(samantha|daniel|serena|kate|oliver|arthur|martha|karen|moira|tessa|libby|sonia|ryan|aria|jenny|guy|hazel|susan|george|google uk english|google us english)/i;\nconst HQ = /(natural|neural|premium|enhanced|online)/i;\n\nlet voices = [];\nfunction load(){ if(synth) voices = synth.getVoices() || []; return voices; }\nif(synth){\n  load();\n  if(typeof synth.addEventListener === 'function') synth.addEventListener('voiceschanged', () => { load(); refreshPicker(); });\n  else synth.onvoiceschanged = () => { load(); refreshPicker(); };\n}\n\nfunction score(v){\n  const lang = (v.lang || '').replace('_', '-').toLowerCase();\n  if(!lang.startsWith('en')) return -1;\n  const name = v.name || '';\n  if(NOVELTY.test(name)) return -1;\n  let s = 10;\n  if(ROBOTIC.test(name)) s -= 30;\n  if(HQ.test(name)) s += 50;\n  if(NICE.test(name)) s += 40;\n  if(/^microsoft .* desktop/i.test(name)) s += 5;\n  if(lang === 'en-gb') s += 20; else if(lang === 'en-us') s += 15; else s += 5;\n  return s;\n}\nfunction english(){\n  return load().filter(v => score(v) > -1).sort((a, b) => score(b) - score(a));\n}\nfunction current(){\n  const list = english();\n  let pref = '';\n  try { pref = localStorage.getItem(PREF) || ''; } catch(e){}\n  return list.find(v => v.voiceURI === pref || v.name === pref) || list[0] || null;\n}\n\nlet warned = false;\nfunction notice(msg){\n  const t = document.getElementById('toast');\n  if(t){ t.textContent = msg; t.classList.add('show'); clearTimeout(notice._t); notice._t = setTimeout(() => t.classList.remove('show'), 3200); }\n}\n\n/* rate: 1 — обычная речь; всё ниже .7 у большинства голосов звучит «сломанно» */\nfunction speak(text, rate, voiceOverride){\n  if(!synth){ notice('В этом браузере нет озвучки. Попробуйте Chrome, Edge или Safari.'); return false; }\n  const v = voiceOverride || current();\n  if(!v && !warned){ warned = true; notice('На устройстве нет английского голоса — нажмите «🔊 Голос», там инструкция.'); }\n  synth.cancel();\n  const u = new SpeechSynthesisUtterance(String(text));\n  if(v){ u.voice = v; u.lang = v.lang; } else u.lang = 'en-GB';\n  const r = Number(rate) || .9;\n  u.rate = Math.min(1.05, Math.max(.72, r \u003c .75 ? .72 : r + .08));\n  u.pitch = 1;\n  window.__ttsUtterance = u;           /* Chrome иначе может собрать фразу сборщиком мусора и оборвать её */\n  setTimeout(() => synth.speak(u), 50); /* Chrome теряет фразу, если speak вызвать сразу после cancel */\n  return true;\n}\n\n/* Длинный текст читаем по предложениям: Chrome обрывает одну длинную фразу\n   примерно через 15 секунд. onEach(i) вызывается в начале каждого предложения. */\nlet queueId = 0;\nfunction speakQueue(list, rate, onEach, onDone){\n  if(!synth){ notice('В этом браузере нет озвучки. Попробуйте Chrome, Edge или Safari.'); return false; }\n  const v = current(), id = ++queueId;\n  if(!v && !warned){ warned = true; notice('На устройстве нет английского голоса — нажмите «🔊 Голос», там инструкция.'); }\n  synth.cancel();\n  const r = Number(rate) || .9;\n  const us = list.map((text, i) => {\n    const u = new SpeechSynthesisUtterance(String(text));\n    if(v){ u.voice = v; u.lang = v.lang; } else u.lang = 'en-GB';\n    u.rate = Math.min(1.05, Math.max(.72, r \u003c .75 ? .72 : r + .08)); u.pitch = 1;\n    u.onstart = () => { if(id === queueId && onEach) onEach(i); };\n    if(i === list.length - 1) u.onend = () => { if(id === queueId && onDone) onDone(); };\n    return u;\n  });\n  window.__ttsUtterance = us;\n  setTimeout(() => us.forEach(u => synth.speak(u)), 50);\n  return true;\n}\nfunction stop(){ queueId++; if(synth) synth.cancel(); }\n\n/* ---------- окно выбора голоса ---------- */\nlet box = null;\nfunction css(){\n  if(document.getElementById('tts-style')) return;\n  const st = document.createElement('style'); st.id = 'tts-style';\n  st.textContent =\n    '.tts-bg{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center;background:rgba(35,58,87,.45)}' +\n    '.tts-bg.open{display:flex}' +\n    '.tts{width:min(560px,100%);max-height:88vh;overflow-y:auto;padding:22px 18px calc(22px + env(safe-area-inset-bottom));color:#233a57;background:#f4f9ff;border-radius:26px 26px 0 0;font-family:Nunito,\"Trebuchet MS\",sans-serif;font-weight:600}' +\n    '@media (min-width:640px){.tts-bg{align-items:center}.tts{border-radius:26px}}' +\n    '.tts h2{margin:0;font-family:Rubik,\"Trebuchet MS\",sans-serif;font-size:26px;font-weight:800}' +\n    '.tts p{margin:8px 0;font-size:15px;color:#5d6f88}' +\n    '.tts-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;margin-top:8px;padding:10px 12px;background:#fff;border:2px solid #dbe7f3;border-radius:16px}' +\n    '.tts-row.on{border-color:#4cc25a;background:#eafbe9}' +\n    '.tts-row b{display:block;font-family:Rubik,\"Trebuchet MS\",sans-serif;font-size:15.5px}' +\n    '.tts-row span{font-size:13px;color:#5d6f88}' +\n    '.tts-row em{display:inline-block;margin-left:6px;padding:1px 7px;font-style:normal;font-size:11px;font-weight:800;color:#fff;background:#ffb020;border-radius:999px}' +\n    '.tts button{min-height:40px;padding:6px 12px;font-family:Rubik,\"Trebuchet MS\",sans-serif;font-size:13.5px;font-weight:800;color:#233a57;background:#fff;border:2px solid #dbe7f3;border-radius:12px;cursor:pointer}' +\n    '.tts button.pick{color:#fff;background:#38b6ff;border-color:#38b6ff}' +\n    '.tts .tts-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}' +\n    '.tts details{margin-top:14px;padding:10px 12px;background:#fff8dc;border:2px dashed #f0d27a;border-radius:16px;font-size:14.5px}' +\n    '.tts summary{font-family:Rubik,\"Trebuchet MS\",sans-serif;font-weight:800;color:#b07a00;cursor:pointer}' +\n    '.tts details li{margin:6px 0}' +\n    '.tts .tts-empty{padding:14px;text-align:center;background:#fff0f0;border:2px solid #ffd0d2;border-radius:16px;color:#b82c31}';\n  document.head.appendChild(st);\n}\nfunction rows(){\n  const list = english().slice(0, 14), cur = current();\n  if(!list.length){\n    return '\u003cdiv class=\"tts-empty\">Английских голосов на этом устройстве не найдено. Установите голос по инструкции ниже и перезагрузите страницу.\u003c/div>';\n  }\n  return list.map((v, i) =>\n    '\u003cdiv class=\"tts-row ' + (cur && v.voiceURI === cur.voiceURI ? 'on' : '') + '\">\u003cdiv>\u003cb>' + v.name.replace(/\u003c/g, '&lt;') +\n    (HQ.test(v.name) || NICE.test(v.name) ? '\u003cem>хороший\u003c/em>' : '') + '\u003c/b>\u003cspan>' + v.lang + (v.localService === false ? ' · нужен интернет' : '') + '\u003c/span>\u003c/div>' +\n    '\u003cbutton data-tts-try=\"' + i + '\" aria-label=\"Послушать\">▶\u003c/button>' +\n    '\u003cbutton class=\"' + (cur && v.voiceURI === cur.voiceURI ? 'pick' : '') + '\" data-tts-use=\"' + i + '\">' + (cur && v.voiceURI === cur.voiceURI ? 'выбран' : 'выбрать') + '\u003c/button>\u003c/div>').join('');\n}\nfunction refreshPicker(){\n  if(!box || !box.classList.contains('open')) return;\n  const list = english().slice(0, 14);\n  box.querySelector('#ttsList').innerHTML = rows();\n  box.querySelectorAll('[data-tts-try]').forEach(b => b.addEventListener('click', () => speak(SAMPLE, .9, list[+b.dataset.ttsTry])));\n  box.querySelectorAll('[data-tts-use]').forEach(b => b.addEventListener('click', () => {\n    const v = list[+b.dataset.ttsUse];\n    try { localStorage.setItem(PREF, v.voiceURI || v.name); } catch(e){}\n    speak(SAMPLE, .9, v); refreshPicker();\n  }));\n}\nfunction openPicker(){\n  css();\n  if(!box){\n    box = document.createElement('div');\n    box.className = 'tts-bg';\n    box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true'); box.setAttribute('aria-label', 'Выбор голоса');\n    box.innerHTML = '\u003cdiv class=\"tts\">\u003cdiv class=\"tts-head\">\u003cdiv>\u003ch2>Английский голос\u003c/h2>' +\n      '\u003cp>Нажми ▶, чтобы послушать, и выбери голос, который звучит естественно. Лучшие стоят сверху и помечены «хороший».\u003c/p>\u003c/div>' +\n      '\u003cbutton data-tts-close>Закрыть\u003c/button>\u003c/div>\u003cdiv id=\"ttsList\">\u003c/div>' +\n      '\u003cdetails>\u003csummary>Голос звучит плохо или его нет?\u003c/summary>\u003cul>' +\n      '\u003cli>\u003cb>iPhone / iPad:\u003c/b> Настройки → Универсальный доступ → Устный контент → Голоса → Английский → скачайте голос с пометкой «улучшенный» или «премиум» (например, Serena, Daniel, Samantha).\u003c/li>' +\n      '\u003cli>\u003cb>Mac:\u003c/b> Системные настройки → Универсальный доступ → Устный контент → Системный голос → Управлять голосами → English.\u003c/li>' +\n      '\u003cli>\u003cb>Windows:\u003c/b> откройте урок в Microsoft Edge — там есть естественные голоса (Libby, Sonia, Ryan).\u003c/li>' +\n      '\u003cli>\u003cb>Android:\u003c/b> Настройки → Специальные возможности → Синтез речи → Синтезатор Google → установите английский язык.\u003c/li>' +\n      '\u003cli>После установки перезагрузите страницу.\u003c/li>\u003c/ul>\u003c/details>\u003c/div>';\n    document.body.appendChild(box);\n    box.addEventListener('click', e => { if(e.target === box || e.target.closest('[data-tts-close]')) box.classList.remove('open'); });\n    document.addEventListener('keydown', e => { if(e.key === 'Escape') box.classList.remove('open'); });\n  }\n  load();\n  box.classList.add('open');\n  refreshPicker();\n}\n\nwindow.TTS = { speak, speakQueue, stop, openPicker, current, available: () => !!synth };\n})();\n\n\u003c/script>\n\u003cscript>\n/* Глава IV · The Sea-Chest — тексты и ответы. Движок: chapter-kit.js */\nconst PASTCONT = /\\b(was|were) [a-z]+ing\\b/;\nwindow.CHAPTER = {\n  key:'benbow-ch4-v1', num:'IV',\n  title:'The Sea-Chest', titleRu:'Сундук капитана',\n  intro:'Капитан мёртв, до десяти вечера пираты вернутся. Джим и его мама остаются одни с сундуком, в котором лежат их деньги — и что-то ещё. Девять заданий на урок — от прогноза до дневника Джима — и домашнее задание.',\n  art:`\u003csvg viewBox=\"0 0 230 170\" role=\"img\" aria-label=\"Открытый морской сундук с золотом и свёртком бумаг при свече\">\n      \u003cellipse cx=\"115\" cy=\"152\" rx=\"100\" ry=\"10\" fill=\"#0c1d30\" opacity=\".5\"/>\n      \u003ccircle cx=\"196\" cy=\"42\" r=\"30\" fill=\"#ffd36b\" opacity=\".18\"/>\n      \u003crect x=\"190\" y=\"52\" width=\"12\" height=\"40\" rx=\"3\" fill=\"#f6ead0\"/>\n      \u003cpath d=\"M196 30 q8 12 0 22 q-8 -10 0 -22z\" fill=\"#ffb020\"/>\n      \u003cpath d=\"M38 60 L42 28 Q115 2 188 28 L192 60 Z\" fill=\"#7a4b26\" stroke=\"#3d2412\" stroke-width=\"3\" transform=\"rotate(-8 115 60)\"/>\n      \u003crect x=\"34\" y=\"70\" width=\"162\" height=\"78\" rx=\"8\" fill=\"#8b5a2b\" stroke=\"#3d2412\" stroke-width=\"3\"/>\n      \u003crect x=\"34\" y=\"62\" width=\"162\" height=\"16\" rx=\"5\" fill=\"#5e3a1b\" stroke=\"#3d2412\" stroke-width=\"3\"/>\n      \u003cg fill=\"#ffcf3f\" stroke=\"#c98a12\" stroke-width=\"2\">\n        \u003ccircle cx=\"70\" cy=\"66\" r=\"9\"/>\u003ccircle cx=\"88\" cy=\"60\" r=\"9\"/>\u003ccircle cx=\"106\" cy=\"64\" r=\"9\"/>\u003ccircle cx=\"124\" cy=\"58\" r=\"9\"/>\u003ccircle cx=\"142\" cy=\"64\" r=\"9\"/>\u003ccircle cx=\"160\" cy=\"60\" r=\"9\"/>\n      \u003c/g>\n      \u003crect x=\"100\" y=\"38\" width=\"44\" height=\"28\" rx=\"4\" fill=\"#d9c79c\" stroke=\"#7a6640\" stroke-width=\"2\" transform=\"rotate(-10 122 52)\"/>\n      \u003cpath d=\"M104 46 h34 M104 53 h28\" stroke=\"#7a6640\" stroke-width=\"2\" transform=\"rotate(-10 122 52)\"/>\n      \u003crect x=\"104\" y=\"96\" width=\"22\" height=\"26\" rx=\"4\" fill=\"#ffcf3f\" stroke=\"#c98a12\" stroke-width=\"2\"/>\n      \u003ccircle cx=\"115\" cy=\"107\" r=\"4\" fill=\"#3d2412\"/>\n      \u003cpath d=\"M56 78 v70 M174 78 v70\" stroke=\"#3d2412\" stroke-width=\"3\"/>\n      \u003ctext x=\"115\" y=\"140\" text-anchor=\"middle\" font-family=\"Georgia,serif\" font-size=\"16\" font-style=\"italic\" fill=\"#f6ead0\">B\u003c/text>\n    \u003c/svg>`,\n  steps:[\n    { short:'Прогноз',    kicker:'до чтения',       title:'Before the chest opens', min:'5 минут' },\n    { short:'Слова',      kicker:'лексика',         title:'Words to take with you', min:'10 минут' },\n    { short:'Цепь',       kicker:'после чтения',    title:'Rebuild the night',      min:'7 минут' },\n    { short:'Правда?',    kicker:'понимание',       title:'True or false?',         min:'6 минут' },\n    { short:'Сундук',     kicker:'детали',          title:'What was in the chest?', min:'5 минут' },\n    { short:'Грамматика', kicker:'Past Continuous', title:'Counting when…',         min:'10 минут' },\n    { short:'Разговор',   kicker:'говорение',       title:'Mother’s choice',        min:'10 минут' },\n    { short:'Дневник',    kicker:'письмо',          title:'Jim’s diary',            min:'12 минут' },\n    { short:'Финал',      kicker:'проверка',        title:'Close the chest',        min:'5 минут' },\n    { short:'Домашка',    kicker:'домашнее задание', title:'Homework: after ten o’clock', min:'30–40 минут' }\n  ],\n  recap:{\n    pickN:3,\n    html:'\u003cb>Что было в главе III.\u003c/b> Недавно умер отец Джима, и мама с сыном остались одни. В холодный вечер к трактиру приходит слепой нищий \u003cb>Pew\u003c/b>. Он хватает Джима за руку, заставляет отвести его к капитану и вручает Билли Бонсу \u003cb>the black spot\u003c/b> — «чёрную метку», пиратское предупреждение. На ней написано: \u003ci>“You have till ten tonight.”\u003c/i> Капитан вскакивает, шатается и падает замертво.',\n    task:'Пираты вернутся к десяти вечера. А в комнате стоит сундук капитана, и капитан был должен трактиру деньги. \u003cb>Что, по-твоему, лежит в сундуке?\u003c/b> Выбери три предмета. После чтения сравнишь с правдой в задании 5.',\n    doneText:'Прогноз записан. Теперь читай главу IV и проверь себя в задании 5.',\n    frame:'“I think there is/are … in the chest, because the captain …” / “I don’t think there is … because …”',\n    teach:'Не подтверждайте и не опровергайте прогноз до чтения. Вопрос «What would make you change your mind?» удерживает интерес к тексту. Главу лучше читать дома или вслух по абзацам, а задания 3–5 делать сразу после чтения.'\n  },\n  words:{ items:[\n  { id:'tell',   en:'tell somebody everything', ru:'рассказать кому-то всё',               ex:'Jim told his mother everything he knew.' },\n  { id:'help',   en:'ask for help',             ru:'попросить о помощи',                   ex:'They ran to the village to ask for help.' },\n  { id:'afraid', en:'be too afraid to do',      ru:'слишком бояться, чтобы что-то сделать', ex:'The men were too afraid to come back to the inn.' },\n  { id:'dare',   en:'dare to do',               ru:'осмелиться, решиться',                 ex:'“If you don’t dare, Jim and I dare,” said his mother.' },\n  { id:'lock',   en:'lock the door',            ru:'запереть дверь',                       ex:'They went back home and locked the door.' },\n  { id:'owe',    en:'owe somebody money',       ru:'быть должным кому-то',                 ex:'The captain owed them a lot of money.' },\n  { id:'hurry',  en:'in a hurry',               ru:'в спешке, второпях',                   ex:'They left the inn in a hurry.' },\n  { id:'faint',  en:'faint',                    ru:'упасть в обморок',                     ex:'Near the bridge, Jim’s mother fainted.' }\n],\n    ballast:'hamlet — деревушка · quadrant — квадрант, морской прибор · oilskin packet — свёрток в промасленной ткани · guineas, doubloons, louis d’ors, pieces of eight — старинные монеты · latch — щеколда · tarry string — просмолённая верёвка.' },\n  events:[\n  'Jim tells his mother everything he knows about the captain.',\n  'They run to the nearby village to ask for help.',\n  'The men are too afraid of Captain Flint’s name to come with them.',\n  'Jim and his mother go back to the inn alone and lock the door.',\n  'Jim finds the key on a string around the dead captain’s neck.',\n  'They open the chest and find a bag of gold and a packet of papers.',\n  'His mother starts counting only the money the captain owed her.',\n  'They hear the blind man’s stick and a whistle, so they run away with the packet.'\n],\n  order0:[3,0,5,1,7,2,6,4],\n  chainHint:'Подсказка: сначала просьба о помощи, потом ключ, потом сундук; звуки снаружи — в самом конце.',\n  truth:[\n  { t:'The men from the village agreed to defend the inn with Jim and his mother.', a:false, why:'Защищать трактир не согласился никто. Согласились только послать одного парня верхом к доктору Ливси.' },\n  { t:'Someone from the village rode to Dr Livesey’s house for help.', a:true, why:'Да: один парень поскакал к доктору за вооружённой помощью.' },\n  { t:'Jim found the key in the captain’s pocket.', a:false, why:'В карманах были монетки, напёрсток, нитки, табак и нож. Ключ висел на просмолённой верёвке на шее капитана.' },\n  { t:'Under an old sea-cloak there was a bag of gold.', a:true, why:'Да: под старым морским плащом лежали свёрток в промасленной ткани и холщовый мешочек с золотом.' },\n  { t:'All the coins in the bag were English guineas.', a:false, why:'Монеты были из разных стран: дублоны, луидоры, гинеи, пиастры. Мама умела считать только гинеи, поэтому дело шло медленно.' },\n  { t:'Jim’s mother wanted to take all the money in the bag.', a:false, why:'Нет: только то, что капитан был им должен, — и ни пенни больше. Она хотела показать, что она честная женщина.' },\n  { t:'The blind man tried to open the door of the inn.', a:true, why:'Да: он стучал палкой и дёргал ручку, но дверь была заперта.' },\n  { t:'Jim took the gold, and his mother took the packet.', a:false, why:'Наоборот: мама взяла деньги, которые успела отсчитать, а Джим — свёрток в промасленной ткани.' }\n],\n  pick:{\n    task:'Нажми на всё, что \u003cb>действительно лежало\u003c/b> в сундуке капитана. Четыре предмета здесь лишние. Потом проверь — и сравни со своим прогнозом из задания 1.',\n    checkLabel:'Открыть сундук',\n    items:[\n  { id:'clothes', icon:'🧥', en:'a suit of good clothes', ru:'хороший костюм', in:true },\n  { id:'pistols', icon:'🔫', en:'two pairs of pistols',   ru:'две пары пистолетов', in:true },\n  { id:'silver',  icon:'🪙', en:'a bar of silver',        ru:'слиток серебра', in:true },\n  { id:'watch',   icon:'⌚', en:'an old Spanish watch',   ru:'старые испанские часы', in:true },\n  { id:'parrot',  icon:'🦜', en:'a parrot in a cage',     ru:'попугай в клетке', in:false },\n  { id:'shells',  icon:'🐚', en:'five or six sea shells', ru:'пять-шесть морских ракушек', in:true },\n  { id:'tobacco', icon:'🍂', en:'some tobacco',           ru:'табак', in:true },\n  { id:'crown',   icon:'👑', en:'a diamond crown',        ru:'алмазная корона', in:false },\n  { id:'gold',    icon:'💰', en:'a bag of gold',          ru:'мешочек с золотом', in:true },\n  { id:'leg',     icon:'🦵', en:'a wooden leg',           ru:'деревянная нога', in:false },\n  { id:'packet',  icon:'📜', en:'a packet of papers',     ru:'свёрток с бумагами', in:true },\n  { id:'rum',     icon:'🍾', en:'a bottle of rum',        ru:'бутылка рома', in:false }\n],\n    extra:'Лишними были попугай (он у Джона Сильвера — встретишь позже), корона, деревянная нога и ром.',\n    frame:'“There was a … and some … in the chest, but there wasn’t a …” / “I was right / wrong about …”',\n    teach:'Задание тренирует there was / there were и some / any. Попросите описать сундук по памяти, закрыв экран.'\n  },\n  gram:{\n    rules:'\u003cdiv class=\"rule-pair\">\u003cdiv class=\"rule\">\u003ch3>Длинное действие — фон\u003c/h3>\u003cspan class=\"form\">was / were + -ing\u003c/span>' +\n    '\u003cp>Mother \u003cb>was counting\u003c/b> the coins…\u003c/p>\u003cp class=\"note\" style=\"padding:8px 10px;margin:0\">Что происходило в тот момент. Действие уже шло и не закончилось.\u003c/p>\u003c/div>' +\n    '\u003cdiv class=\"rule evt\">\u003ch3>Короткое действие — удар\u003c/h3>\u003cspan class=\"form\">Past Simple\u003c/span>' +\n    '\u003cp>…when they \u003cb>heard\u003c/b> a whistle.\u003c/p>\u003cp class=\"note\" style=\"padding:8px 10px;margin:0\">Что случилось и прервало фон. Слова-сигналы: \u003cb>when\u003c/b> (короткое), \u003cb>while\u003c/b> (длинное).\u003c/p>\u003c/div>\u003c/div>' +\n    '\u003csvg class=\"timeline\" viewBox=\"0 0 560 90\" role=\"img\" aria-label=\"Схема: длинная полоса was counting прерывается моментом heard a whistle\">' +\n    '\u003crect x=\"30\" y=\"34\" width=\"420\" height=\"22\" rx=\"11\" fill=\"#bfe3ff\"/>\u003ctext x=\"200\" y=\"27\" text-anchor=\"middle\" font-family=\"Rubik,sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#1f6fb0\">was counting the coins\u003c/text>' +\n    '\u003cpath d=\"M330 18 L340 45 L330 72\" stroke=\"#e5533d\" stroke-width=\"4\" fill=\"none\"/>\u003ccircle cx=\"336\" cy=\"45\" r=\"8\" fill=\"#e5533d\"/>' +\n    '\u003ctext x=\"350\" y=\"86\" font-family=\"Rubik,sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#e5533d\">heard a whistle!\u003c/text>' +\n    '\u003cpath d=\"M460 45 h70\" stroke=\"#98a6b8\" stroke-width=\"3\" stroke-dasharray=\"6 6\"/>\u003ctext x=\"495\" y=\"70\" text-anchor=\"middle\" font-family=\"Nunito,sans-serif\" font-size=\"12\" fill=\"#5d6f88\">время\u003c/text>\u003c/svg>',\n    items:[\n  { pre:'Mother', opts:['was counting','counted'], post:'the coins when they heard a stick on the road.', a:0, why:'Долгое действие (считала) прервано коротким (услышали) — was counting.' },\n  { pre:'They were counting the money when somebody', opts:['turned','was turning'], post:'the door handle.', a:0, why:'Короткое действие, которое прервало длинное, — Past Simple.' },\n  { pre:'Jim', opts:['searched','was searching'], post:'the captain’s pockets when he noticed a string round his neck.', a:1, why:'Он был в процессе поиска, когда заметил верёвку, — was searching.' },\n  { pre:'When they opened the chest, they', opts:['noticed','were noticing'], post:'a smell of tobacco and tar.', a:0, why:'Два коротких действия одно за другим — оба в Past Simple.' },\n  { pre:'While they', opts:['ran','were running'], post:'to the bridge, Jim’s mother felt weak.', a:1, why:'После while обычно идёт длительное действие — were running.' },\n  { pre:'The blind man', opts:['knocked','was knocking'], post:'on the door, and then he went away.', a:0, why:'Цепочка коротких событий (постучал, потом ушёл) — Past Simple.' }\n],\n    writeTask:'Два предложения с \u003cb>was/were + -ing\u003c/b> и \u003cb>when\u003c/b> или \u003cb>while\u003c/b>: одно о главе, одно о себе.',\n    writes:[\n      { label:'О главе: “Jim’s mother was … when …”', model:'Jim was searching the captain’s pockets when he saw the string.', minWords:6, checks:[{ re:PASTCONT, miss:'нет was/were + -ing' }, { re:/\\b(when|while)\\b/, miss:'нет when или while' }] },\n      { label:'О себе: “Yesterday I was … when …”', model:'Yesterday I was cooking dinner when my friend called me.', minWords:6, checks:[{ re:PASTCONT, miss:'нет was/were + -ing' }, { re:/\\b(when|while)\\b/, miss:'нет when или while' }] }\n    ],\n    teach:'Цель узкая: прерванное действие в рассказе. Не уходите во все значения Past Continuous. Хороший мост к говорению: “What were you doing yesterday at 8 p.m. when…?”'\n  },\n  talk:{ ...{\n  qs:[\n    'Is Jim’s mother honest, brave or foolish? Prove it with one detail from the chapter.',\n    'Why were the men in the village too afraid to help? Would you help?',\n    'Why does Jim take the packet and not the gold? What could be inside?',\n    'What would you take from the chest, and why?',\n    'Who is the real hero of this chapter: Jim or his mother?'\n  ],\n  tw:['Ответь за 30 секунд.','Используй три выражения из задания 2.','Говори от лица мамы Джима.','Поспорь со своим первым ответом.','Добавь одно предложение в Past Continuous.'],\n  frame:'\u003cb>A2:\u003c/b> “I think she is … because she …” · \u003cb>B1:\u003c/b> “Although she was in danger, she …, which shows that …”'\n},\n    intro:'Пираты вот-вот вернутся, а мама Джима \u003cb>отказывается брать больше, чем им должны\u003c/b>, и медленно считает незнакомые монеты. Твоё решение?',\n    votes:[\n  ['honest','Она права', 'берёт только своё — это честно'],\n  ['foolish','Смело, но глупо', 'опасность рядом, надо бежать сразу'],\n  ['all','Надо брать всё', 'пираты сами воры']\n],\n    checks:['решение названо прямо','деталь из главы','три выражения из задания 2','одно предложение в Past Continuous'],\n    teach:'Сначала монолог без вмешательства, потом один комментарий по содержанию и один по языку. Сильный вопрос для спора: “Is honesty still a virtue when your life is in danger?”' },\n  diary:{\n    task:'Ты — Джим. Ночью, спрятавшись под мостом, ты пишешь в дневник. \u003cb>50–90 слов\u003c/b>, минимум \u003cb>четыре выражения\u003c/b> из задания 2 и \u003cb>одно предложение в Past Continuous\u003c/b>. Подсветка ниже загорается сама.',\n    placeholder:'Dear diary, what a night! I told my mother everything…',\n    targets:[\n  { id:'tell',   label:'told … everything', re:/\\b(told|tell)\\b[^.!?]*\\beverything\\b/ },\n  { id:'help',   label:'ask for help',      re:/\\bask(ed)?\\b[^.!?]*\\bfor help\\b/ },\n  { id:'afraid', label:'too afraid to',     re:/\\btoo (afraid|scared|frightened) to\\b/ },\n  { id:'dare',   label:'dare',              re:/\\bdare(d|s)?\\b/ },\n  { id:'lock',   label:'locked the door',   re:/\\block(ed)?\\b[^.!?]*\\bdoor\\b/ },\n  { id:'owe',    label:'owed',              re:/\\bowe(d|s)?\\b/ },\n  { id:'hurry',  label:'in a hurry',        re:/\\bin a hurry\\b/ },\n  { id:'faint',  label:'fainted',           re:/\\bfaint(ed|s)?\\b/ }\n],\n    hits:4, min:50, max:90,\n    extra:{ re:PASTCONT, label:'Past Continuous', miss:'нет предложения с was/were + -ing' },\n    model:'Dear diary, what a terrible night! I told my mother everything about the captain. We ran to the village to ask for help, but the men were too afraid to come with us. So we went back alone and locked the door. The captain owed us money, so we opened his chest. My mother was counting the coins when we heard the blind man’s stick. Then somebody whistled on the hill. We left in a hurry, and near the bridge my mother fainted. I still have the packet.',\n    teach:'Устное обсуждение (задание 7) лучше провести до письма, иначе текст станет заученным монологом. При проверке смотрите на связность: first / then / suddenly / in the end.'\n  },\n  exit:{\n    gaps:[\n  { pre:'Jim ', post:' his mother everything he knew.', ok:['told'] },\n  { pre:'The men were too ', post:' to come back to the inn.', ok:['afraid','scared','frightened'] },\n  { pre:'They went back home and ', post:' the door.', ok:['locked'] },\n  { pre:'The captain ', post:' them a lot of money.', ok:['owed'] },\n  { pre:'Mother ', post:' counting the coins when they heard a whistle.', ok:['was'] },\n  { pre:'They left the inn in a ', post:'.', ok:['hurry'] },\n  { pre:'Near the bridge, his mother ', post:'.', ok:['fainted'] }\n],\n    button:'Закрыть сундук', idle:'Сундук ещё открыт', passText:'Сундук закрыт — глава IV пройдена!',\n    cando:['Я могу пересказать главу IV по порядку.', 'Я могу объяснить, почему мама Джима взяла не все деньги.', 'Я могу рассказать о прерванном действии: was …ing when …'],\n    teach:'5 из 7 и выше — тема закрыта, можно переходить к главе V. Меньше — повторите задание 2 через сутки и снова сделайте этот лист.'\n  },\n  home:{\n    tr:[\n  { ru:'Джим рассказал маме всё о капитане.', must:[/\\btold\\b/, /\\beverything\\b/], tip:'tell somebody everything', model:'Jim told his mother everything about the captain.' },\n  { ru:'Они побежали в деревню, чтобы попросить о помощи.', must:[/\\bask(ed)? for help\\b/], tip:'ask for help', model:'They ran to the village to ask for help.' },\n  { ru:'Мужчины слишком боялись, чтобы пойти с ними.', must:[/\\btoo (afraid|scared|frightened) to\\b/], tip:'too afraid to + глагол', model:'The men were too afraid to go with them.' },\n  { ru:'Капитан был должен им много денег.', must:[/\\bowed\\b/], tip:'owe somebody money → owed', model:'The captain owed them a lot of money.' },\n  { ru:'Они вернулись домой и заперли дверь.', must:[/\\blocked\\b/, /\\bdoor\\b/], tip:'lock the door → locked', model:'They went back home and locked the door.' },\n  { ru:'Они покинули трактир в спешке.', must:[/\\bin a hurry\\b/], tip:'in a hurry', model:'They left the inn in a hurry.' }\n],\n    brTitle:'Раскрой скобки',\n    brNote:'Past Continuous (was/were + -ing) или Past Simple? Впиши только глагол в нужной форме.',\n    br:[\n  { pre:'Jim’s mother', verb:'count', post:'the money when they heard a whistle.', ok:['was counting'] },\n  { pre:'They were walking to the village when they', verb:'see', post:'a light in a window.', ok:['saw'] },\n  { pre:'I', verb:'watch', post:'TV when my phone rang.', ok:['was watching'] },\n  { pre:'We', verb:'have', post:'dinner when the lights went out.', ok:['were having'] },\n  { pre:'When the blind man knocked, Jim', verb:'stop', post:'breathing for a second.', ok:['stopped'] },\n  { pre:'While she', verb:'read', post:'the letter, she started to cry.', ok:['was reading'] }\n].map(b => ({ ...b, why: /ing$/.test(b.ok[0]) ? 'действие шло в тот момент' : 'короткое действие' })),\n    dict:[\n  'Nobody in the village wanted to help them.',\n  'The key was on a string around his neck.',\n  'She took only the money that he owed her.',\n  'They were running to the bridge when she fainted.'\n],\n    prompt:{ title:'Что будет в десять часов?',\n      html:'Пираты обещали вернуться к десяти. Напиши прогноз к главе V: что они сделают, что будет с Джимом, мамой и свёртком.',\n      frames:'I think the pirates will probably… · Jim will… because… · I don’t think his mother will… · The packet is probably…',\n      placeholder:'I think the pirates will probably come back at ten o’clock…' },\n    checklist:['Прочитать главу V «The Last of the Blind Man» и проверить свой прогноз из части D. \u003ca href=\"chapter-5.html\">задания к главе V →\u003c/a>',\n       'Пройти тренажёр слов: «Набор 2 → Найди ошибку» (хотя бы на две звезды). \u003ca href=\"a2-words.html\">открыть тренажёр →\u003c/a>',\n       'Рассказать вслух за одну минуту, что случилось в главе IV, не глядя в текст.']\n  }\n};\n\u003c/script>\n\u003cscript>\n/* Движок страниц с главами Treasure Island.\n   Каждая страница главы задаёт window.CHAPTER (тексты и ответы),\n   а здесь — шапка, десять заданий, проверки и сохранение прогресса. */\n(() => {\n'use strict';\nconst C = window.CHAPTER;\nconst app = document.getElementById('app');\n\n/* ============ разметка страницы ============ */\nconst NAV = [['III','chapter-3.html'],['IV','chapter-4.html'],['V','chapter-5.html']];\napp.innerHTML =\n  '\u003cdiv class=\"wrap\">\u003cheader class=\"top\">\u003cdiv>' +\n  '\u003cspan class=\"mark\">TREASURE ISLAND · ГЛАВА ' + C.num + '\u003c/span>' +\n  '\u003ch1>' + C.title + '\u003ci>' + C.titleRu + '\u003c/i>\u003c/h1>\u003cp>' + C.intro + '\u003c/p>' +\n  '\u003cdiv class=\"progress\">\u003cspan>Выполнено\u003c/span>\u003cdiv class=\"bar\">\u003ci id=\"progFill\">\u003c/i>\u003c/div>\u003cspan id=\"progText\">0 / 10\u003c/span>\u003c/div>' +\n  '\u003cnav class=\"chapters\" aria-label=\"Главы\">' + NAV.map(([n, href]) => '\u003ca href=\"' + href + '\" class=\"' + (n === C.num ? 'on' : '') + '\">Глава ' + n + '\u003c/a>').join('') + '\u003c/nav>' +\n  '\u003cdiv class=\"top-links\">\u003ca href=\"index.html\">← Главы I–II\u003c/a>\u003ca href=\"a2-words.html\">Тренажёр слов A2\u003c/a>\u003ca href=\"#\" id=\"voiceBtn\" role=\"button\">🔊 Голос\u003c/a>\u003c/div>' +\n  '\u003c/div>' + C.art + '\u003c/header>' +\n  '\u003cnav class=\"steps\" id=\"steps\" aria-label=\"Задания главы ' + C.num + '\">\u003c/nav>' +\n  '\u003cmain class=\"stage\" id=\"stage\" aria-live=\"polite\">\u003c/main>\u003c/div>' +\n  '\u003cdiv class=\"foot\">\u003cbutton class=\"btn ghost\" id=\"prevBtn\">← Назад\u003c/button>\u003cspan class=\"mid\" id=\"footLabel\">\u003c/span>\u003cbutton class=\"btn go\" id=\"nextBtn\">Дальше →\u003c/button>\u003c/div>' +\n  '\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>';\n\n/* ============ состояние ============ */\nlet S = { step:0, done:[], predict:[], order:[], quiz:null, truth:{}, chest:{}, chestChecked:false,\n  gram:{}, gw:[], vote:'', talkQ:0, talkT:-1, req:[], diary:'', gaps:{}, hw:null };\ntry { S = { ...S, ...JSON.parse(localStorage.getItem(C.key) || '{}') }; } catch(e){}\n['done','predict','order','req','gw'].forEach(k => { if(!Array.isArray(S[k])) S[k] = []; });\nwhile(S.gw.length \u003c C.gram.writes.length) S.gw.push('');\nif(S.order.length !== C.events.length) S.order = C.order0.slice();\n['truth','chest','gram','gaps'].forEach(k => { if(!S[k] || typeof S[k] !== 'object') S[k] = {}; });\nS.hw = { tr:{}, br:{}, dc:{}, txt:'', chk:[], ...(S.hw && typeof S.hw === 'object' ? S.hw : {}) };\nconst save = () => { try { localStorage.setItem(C.key, JSON.stringify(S)); } catch(e){} };\n\n/* ============ помощники ============ */\nconst $ = id => document.getElementById(id);\nconst stage = $('stage');\nconst clean = s => (s || '').toLowerCase().replace(/[’']/g, \"'\").replace(/[^a-z0-9'\\s-]/g, ' ').replace(/\\s+/g, ' ').trim();\nconst shuffle = a => { a = [...a]; for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };\nconst esc = s => String(s).replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/\"/g,'&quot;');\nconst countWords = v => v ? v.split(' ').length : 0;\nfunction toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }\nfunction speak(text, rate){ if(window.TTS) TTS.speak(text, rate); else toast('Озвучка не загрузилась — обнови страницу'); }\nlet actx = null;\nfunction blip(freq, dur, type){\n  try{\n    actx = actx || new (window.AudioContext || window.webkitAudioContext)();\n    const o = actx.createOscillator(), g = actx.createGain();\n    o.type = type || 'triangle'; o.frequency.value = freq;\n    g.gain.setValueAtTime(.0001, actx.currentTime);\n    g.gain.exponentialRampToValueAtTime(.12, actx.currentTime + .02);\n    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + (dur || .18));\n    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + (dur || .18) + .02);\n  } catch(e){}\n}\nconst good = () => { blip(660,.12); setTimeout(() => blip(990,.16), 90); };\nconst bad = () => blip(180,.22,'sawtooth');\nconst teach = text => '\u003cdetails class=\"teach\">\u003csummary>🎓 Для преподавателя\u003c/summary>\u003cp>' + text + '\u003c/p>\u003c/details>';\n\nconst STEPS = [\n  { id:'recap', render:recap }, { id:'words', render:words }, { id:'chain', render:chain }, { id:'truth', render:truth },\n  { id:'chest', render:pick }, { id:'gram', render:gram }, { id:'talk', render:talk }, { id:'diary', render:diary },\n  { id:'exit', render:exit }, { id:'home', render:homework }\n].map((st, i) => ({ ...st, ...C.steps[i] }));\n\nfunction complete(id){\n  if(S.done.includes(id)) return;\n  S.done.push(id); save(); renderSteps(); good();\n  toast('Задание выполнено: ' + STEPS.find(s => s.id === id).short + ' ✓');\n}\n\n/* ============ навигация ============ */\nfunction renderSteps(){\n  $('steps').innerHTML = STEPS.map((st, i) =>\n    '\u003cbutton class=\"step ' + (i === S.step ? 'on ' : '') + (S.done.includes(st.id) ? 'done' : '') + '\" data-step=\"' + i + '\" aria-current=\"' + (i === S.step) + '\">' +\n    '\u003cb>\u003cem>' + (i + 1) + '\u003c/em>\u003c/b>\u003cspan>' + st.short + '\u003c/span>\u003c/button>').join('');\n  const n = S.done.length;\n  $('progFill').style.width = Math.round(n / STEPS.length * 100) + '%';\n  $('progText').textContent = n + ' / ' + STEPS.length;\n  const on = $('steps').querySelector('.step.on');\n  if(on && $('steps').scrollWidth > $('steps').clientWidth) $('steps').scrollLeft = on.offsetLeft - 40;\n}\n$('steps').addEventListener('click', e => { const b = e.target.closest('[data-step]'); if(b) go(+b.dataset.step); });\nfunction go(i){\n  if(window.TTS && TTS.stop) TTS.stop();\n  S.step = Math.max(0, Math.min(STEPS.length - 1, i)); save();\n  try { history.replaceState(null, '', '#task-' + (S.step + 1)); } catch(e){}\n  show();\n  stage.scrollIntoView({ block:'start' });\n}\nfunction show(){\n  const st = STEPS[S.step];\n  renderSteps();\n  stage.innerHTML = '\u003cdiv class=\"pop\">\u003cdiv class=\"head\">\u003cdiv>\u003cp class=\"kicker\">Задание ' + (S.step + 1) + ' · ' + st.kicker + '\u003c/p>\u003ch2>' + st.title + '\u003c/h2>\u003c/div>\u003cspan class=\"stamp\">' + st.min + '\u003c/span>\u003c/div>\u003cdiv id=\"body\">\u003c/div>\u003c/div>';\n  st.render($('body'));\n  $('prevBtn').disabled = S.step === 0;\n  $('nextBtn').textContent = S.step === STEPS.length - 1 ? 'К заданию 1 ↺' : 'Дальше →';\n  $('footLabel').textContent = 'Задание ' + (S.step + 1) + ' из ' + STEPS.length + ' · ' + st.short;\n}\n$('prevBtn').addEventListener('click', () => go(S.step - 1));\n$('nextBtn').addEventListener('click', () => go(S.step === STEPS.length - 1 ? 0 : S.step + 1));\n$('voiceBtn').addEventListener('click', e => { e.preventDefault(); if(window.TTS) TTS.openPicker(); });\n\n/* ============ 1. прогноз ============ */\nfunction recap(el){\n  const R = C.recap, items = C.pick.items, N = R.pickN || 3;\n  el.innerHTML = '\u003cdiv class=\"note\">' + R.html + '\u003c/div>' +\n    '\u003cp class=\"task\" style=\"margin-top:16px\">' + R.task + '\u003c/p>' +\n    '\u003cdiv class=\"opts\" id=\"predict\">' + items.map(c =>\n      '\u003cbutton class=\"opt ' + (S.predict.includes(c.id) ? 'pick' : '') + '\" data-p=\"' + c.id + '\">\u003cspan style=\"font-size:24px\">' + c.icon + '\u003c/span>\u003cspan>' + c.en + '\u003csmall>' + c.ru + '\u003c/small>\u003c/span>\u003c/button>').join('') + '\u003c/div>' +\n    '\u003cdiv class=\"status\" id=\"pStatus\">\u003c/div>' +\n    '\u003cdiv class=\"frame\">\u003cb>Скажи вслух:\u003c/b> ' + R.frame + '\u003c/div>' + teach(R.teach);\n  const upd = () => {\n    $('pStatus').textContent = S.predict.length === N ? R.doneText : 'Выбрано: ' + S.predict.length + ' из ' + N;\n    $('pStatus').className = 'status' + (S.predict.length === N ? ' ok' : '');\n  };\n  el.querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => {\n    const id = b.dataset.p;\n    S.predict = S.predict.includes(id) ? S.predict.filter(x => x !== id) : [...S.predict, id].slice(-N);\n    save();\n    el.querySelectorAll('[data-p]').forEach(x => x.classList.toggle('pick', S.predict.includes(x.dataset.p)));\n    upd();\n    if(S.predict.length === N) complete('recap');\n  }));\n  upd();\n}\n\n/* ============ 2. слова ============ */\nfunction words(el){\n  const W = C.words.items;\n  el.innerHTML =\n    '\u003cp class=\"task\">' + W.length + ' выражений из главы, которые пригодятся и в обычной речи. Сначала прочитай пример и попробуй догадаться о значении, потом открой перевод. В конце — быстрая проверка.\u003c/p>' +\n    '\u003cdiv class=\"cards\">' + W.map(w =>\n      '\u003carticle class=\"card\">\u003ch3 class=\"term\">' + w.en + '\u003c/h3>\u003cp class=\"ex\">' + w.ex + '\u003c/p>\u003cp class=\"ru\" id=\"ru-' + w.id + '\">' + w.ru + '\u003c/p>' +\n      '\u003cdiv class=\"acts\">\u003cbutton data-say=\"' + esc(w.ex) + '\">🔊\u003c/button>\u003cbutton data-ru=\"' + w.id + '\">перевод\u003c/button>\u003c/div>\u003c/article>').join('') + '\u003c/div>' +\n    '\u003cdiv class=\"note ballast\">\u003cb>Понять и отпустить (в активный запас не идут):\u003c/b> ' + C.words.ballast + '\u003c/div>' +\n    '\u003cdiv class=\"quiz\" id=\"quiz\">\u003c/div>' +\n    teach('Сначала пример, потом догадка, потом перевод. В проверке слова идут в случайном порядке; 6 из 8 и выше — можно переходить к говорению, ниже — повторить карточки.');\n  el.querySelectorAll('[data-say]').forEach(b => b.addEventListener('click', () => speak(b.dataset.say, .85)));\n  el.querySelectorAll('[data-ru]').forEach(b => b.addEventListener('click', () => $('ru-' + b.dataset.ru).classList.toggle('open')));\n  quizStart();\n}\nfunction quizStart(){\n  const box = $('quiz'), n = C.words.items.length;\n  if(S.quiz !== null){\n    box.innerHTML = '\u003cp class=\"quiz-q\">\u003csmall>Проверка пройдена\u003c/small>' + S.quiz + ' из ' + n + '\u003c/p>\u003cdiv class=\"row\" style=\"justify-content:center\">\u003cbutton class=\"btn ghost small\" id=\"qAgain\">Пройти ещё раз\u003c/button>\u003c/div>';\n    $('qAgain').addEventListener('click', () => { S.quiz = null; save(); quizRun(); });\n    return;\n  }\n  box.innerHTML = '\u003cp class=\"quiz-q\">\u003csmall>Быстрая проверка\u003c/small>Русское значение → английское выражение\u003c/p>\u003cdiv class=\"row\" style=\"justify-content:center\">\u003cbutton class=\"btn warm\" id=\"qGo\">Начать проверку\u003c/button>\u003c/div>';\n  $('qGo').addEventListener('click', quizRun);\n}\nfunction quizRun(){\n  const W = C.words.items, box = $('quiz'), items = shuffle(W), pass = Math.ceil(W.length * .75);\n  let n = 0, score = 0, locked = false;\n  const next = () => {\n    if(n >= items.length){ S.quiz = score; save(); if(score >= pass) complete('words'); else toast('Повтори карточки и попробуй ещё раз'); quizStart(); return; }\n    locked = false;\n    const w = items[n], opts = shuffle([w, ...shuffle(W.filter(x => x !== w)).slice(0, 3)]);\n    box.innerHTML = '\u003cp class=\"quiz-q pop\">\u003csmall>' + (n + 1) + ' из ' + items.length + '\u003c/small>' + w.ru + '\u003c/p>' +\n      '\u003cdiv class=\"opts\">' + opts.map(o => '\u003cbutton class=\"opt\" data-q=\"' + o.id + '\">' + o.en + '\u003c/button>').join('') + '\u003c/div>\u003cdiv class=\"status\" id=\"qFb\">\u003c/div>';\n    box.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => {\n      if(locked) return; locked = true;\n      const ok = b.dataset.q === w.id;\n      box.querySelectorAll('[data-q]').forEach(x => { if(x.dataset.q === w.id) x.classList.add('hit'); });\n      if(ok){ score++; good(); } else { b.classList.add('miss'); bad(); }\n      $('qFb').className = 'status ' + (ok ? 'ok' : 'no');\n      $('qFb').textContent = w.ex;\n      speak(w.ex, .9);\n      n++; setTimeout(next, ok ? 1300 : 2300);\n    }));\n  };\n  next();\n}\n\n/* ============ 3. цепь ============ */\nfunction chain(el){\n  const E = C.events;\n  el.innerHTML = '\u003cp class=\"task\">Расставь ' + E.length + ' событий главы по порядку. \u003cb>Книгу не открывай\u003c/b> — вспоминай. Стрелки двигают строку вверх и вниз.\u003c/p>' +\n    '\u003cdiv class=\"chain\" id=\"chain\">\u003c/div>' +\n    '\u003cdiv class=\"row\" style=\"margin-top:14px\">\u003cbutton class=\"btn warm\" id=\"chCheck\">Проверить порядок\u003c/button>\u003cbutton class=\"btn ghost\" id=\"chMix\">Перемешать\u003c/button>\u003c/div>' +\n    '\u003cdiv class=\"status\" id=\"chStatus\">\u003c/div>' +\n    teach('После проверки — пересказ цепочки за 40 секунд со словами first / then / after that / suddenly / in the end. Ошибки во время пересказа не исправляйте, запишите две и вернитесь к ним в задании 6.');\n  const draw = () => {\n    $('chain').innerHTML = S.order.map((n, pos) =>\n      '\u003cdiv class=\"link\" data-pos=\"' + pos + '\">\u003cspan>' + E[n] + '\u003c/span>\u003cdiv class=\"arrows\">\u003cbutton data-mv=\"-1\" aria-label=\"Выше\">↑\u003c/button>\u003cbutton data-mv=\"1\" aria-label=\"Ниже\">↓\u003c/button>\u003c/div>\u003c/div>').join('');\n    $('chain').querySelectorAll('[data-mv]').forEach(b => b.addEventListener('click', () => {\n      const p = +b.closest('.link').dataset.pos, q = p + +b.dataset.mv;\n      if(q \u003c 0 || q >= S.order.length) return;\n      [S.order[p], S.order[q]] = [S.order[q], S.order[p]]; save(); draw(); $('chStatus').textContent = '';\n    }));\n  };\n  draw();\n  $('chCheck').addEventListener('click', () => {\n    const all = S.order.every((n, i) => n === i);\n    [...$('chain').children].forEach((row, i) => { row.classList.remove('ok','no'); row.classList.add(S.order[i] === i ? 'ok' : 'no'); });\n    $('chStatus').className = 'status ' + (all ? 'ok' : 'no');\n    $('chStatus').textContent = all ? 'Верно! Перескажи главу за 40 секунд: first, then, suddenly, in the end.' : 'Есть сбой. ' + C.chainHint;\n    if(all) complete('chain'); else bad();\n  });\n  $('chMix').addEventListener('click', () => { S.order = shuffle(S.order); save(); draw(); $('chStatus').textContent = ''; });\n}\n\n/* ============ 4. правда или ложь ============ */\nfunction truth(el){\n  const T = C.truth;\n  el.innerHTML = '\u003cp class=\"task\">' + T.length + ' утверждений о главе. Отметь \u003cb>True\u003c/b> или \u003cb>False\u003c/b>. После ответа появится объяснение — прочитай его, даже если ответ верный.\u003c/p>\u003cdiv id=\"tfList\">\u003c/div>\u003cdiv class=\"status\" id=\"tfStatus\">\u003c/div>' +\n    teach('Для неверных утверждений просите исправить фразу вслух по-английски: “No, he didn’t. He…”. Это тренирует отрицания в Past Simple.');\n  const draw = () => {\n    $('tfList').innerHTML = T.map((q, i) => {\n      const ans = S.truth[i];\n      const cls = v => ans === undefined ? '' : (v === q.a ? 'right' : (ans === v ? 'wrong' : ''));\n      return '\u003cdiv class=\"tf\">\u003cspan>' + (i + 1) + '. ' + q.t + '\u003c/span>\u003cdiv class=\"pair\">' +\n        '\u003cbutton class=\"' + cls(true) + '\" data-tf=\"' + i + '\" data-v=\"1\">True\u003c/button>\u003cbutton class=\"' + cls(false) + '\" data-tf=\"' + i + '\" data-v=\"0\">False\u003c/button>\u003c/div>' +\n        (ans !== undefined ? '\u003cdiv class=\"why\">' + (ans === q.a ? '✓ ' : '✗ ') + q.why + '\u003c/div>' : '') + '\u003c/div>';\n    }).join('');\n    $('tfList').querySelectorAll('[data-tf]').forEach(b => b.addEventListener('click', () => {\n      const i = +b.dataset.tf; if(S.truth[i] !== undefined) return;\n      S.truth[i] = b.dataset.v === '1'; save();\n      (S.truth[i] === T[i].a ? good : bad)();\n      draw();\n    }));\n    const done = Object.keys(S.truth).length, right = T.filter((q, i) => S.truth[i] === q.a).length;\n    $('tfStatus').className = 'status' + (done === T.length ? ' ok' : '');\n    $('tfStatus').innerHTML = done === T.length\n      ? 'Верно: ' + right + ' из ' + T.length + '. \u003cbutton class=\"btn ghost small\" id=\"tfReset\" style=\"margin-left:8px\">Заново\u003c/button>'\n      : 'Отвечено: ' + done + ' из ' + T.length;\n    if(done === T.length){\n      $('tfReset').addEventListener('click', () => { S.truth = {}; save(); draw(); });\n      complete('truth');\n    }\n  };\n  draw();\n}\n\n/* ============ 5. выбор деталей ============ */\nfunction pick(el){\n  const P = C.pick, items = P.items, outN = items.filter(c => !c.in).length;\n  el.innerHTML = '\u003cp class=\"task\">' + P.task + '\u003c/p>' +\n    '\u003cdiv class=\"chest\" id=\"chestGrid\">\u003c/div>' +\n    '\u003cdiv class=\"row\" style=\"margin-top:16px\">\u003cbutton class=\"btn warm\" id=\"chCheck2\">' + P.checkLabel + '\u003c/button>\u003cbutton class=\"btn ghost\" id=\"chReset\">Начать заново\u003c/button>\u003c/div>' +\n    '\u003cdiv class=\"status\" id=\"chestStatus\">\u003c/div>' +\n    '\u003cdiv class=\"frame\">\u003cb>Скажи вслух:\u003c/b> ' + P.frame + '\u003c/div>' + teach(P.teach);\n  const draw = () => {\n    $('chestGrid').innerHTML = items.map(c => {\n      const picked = !!S.chest[c.id];\n      const cls = S.chestChecked ? (picked === c.in ? 'right' : 'wrong') : (picked ? 'in' : '');\n      return '\u003cbutton class=\"item ' + cls + '\" data-c=\"' + c.id + '\" aria-pressed=\"' + picked + '\">\u003ci>' + c.icon + '\u003c/i>\u003cb>' + c.en + '\u003c/b>\u003cspan>' + c.ru + '\u003c/span>\u003c/button>';\n    }).join('');\n    $('chestGrid').querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => {\n      if(S.chestChecked) return;\n      S.chest[b.dataset.c] = !S.chest[b.dataset.c]; save(); draw();\n    }));\n  };\n  const report = () => {\n    const right = items.filter(c => !!S.chest[c.id] === c.in).length;\n    const hits = S.predict.filter(id => (items.find(c => c.id === id) || {}).in).length;\n    const ok = right >= items.length - 2;\n    $('chestStatus').className = 'status ' + (ok ? 'ok' : 'no');\n    $('chestStatus').innerHTML = 'Верно: ' + right + ' из ' + items.length + '. ' +\n      (S.predict.length === (C.recap.pickN || 3) ? 'Твой прогноз угадал ' + hits + ' из ' + S.predict.length + '. ' : '') + P.extra;\n    if(ok) complete('chest');\n  };\n  draw();\n  if(S.chestChecked) report();\n  $('chCheck2').addEventListener('click', () => { S.chestChecked = true; save(); draw(); report(); });\n  $('chReset').addEventListener('click', () => { S.chestChecked = false; S.chest = {}; save(); draw(); $('chestStatus').textContent = ''; });\n  if(outN === 0) console.warn('pick: no distractors');\n}\n\n/* ============ 6. грамматика ============ */\nfunction gram(el){\n  const G = C.gram;\n  el.innerHTML = G.rules +\n    '\u003cp class=\"task\">Выбери правильную форму.\u003c/p>\u003cdiv id=\"gList\">\u003c/div>\u003cdiv class=\"status\" id=\"gStatus\">\u003c/div>' +\n    '\u003ch3 style=\"font-size:21px;margin:22px 0 10px\">Now write it yourself\u003c/h3>' +\n    '\u003cp class=\"task\">' + G.writeTask + '\u003c/p>' +\n    '\u003cdiv id=\"gWrite\">\u003c/div>\u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"btn warm\" id=\"gwCheck\">Проверить предложения\u003c/button>\u003c/div>' + teach(G.teach);\n  const draw = () => {\n    $('gList').innerHTML = G.items.map((g, i) => {\n      const ans = S.gram[i];\n      return '\u003cdiv class=\"gline\">\u003cspan>' + (i + 1) + '. ' + g.pre + ' \u003cb>…\u003c/b> ' + g.post + '\u003c/span>\u003cdiv class=\"pair\">' +\n        g.opts.map((o, n) => '\u003cbutton class=\"' + (ans === undefined ? '' : n === g.a ? 'right' : ans === n ? 'wrong' : '') + '\" data-g=\"' + i + '\" data-o=\"' + n + '\">' + o + '\u003c/button>').join('') +\n        '\u003c/div>' + (ans !== undefined ? '\u003cdiv class=\"why\">' + (ans === g.a ? '✓ ' : '✗ ') + g.why + '\u003c/div>' : '') + '\u003c/div>';\n    }).join('');\n    $('gList').querySelectorAll('[data-g]').forEach(b => b.addEventListener('click', () => {\n      const i = +b.dataset.g; if(S.gram[i] !== undefined) return;\n      S.gram[i] = +b.dataset.o; save(); (S.gram[i] === G.items[i].a ? good : bad)(); draw(); checkDone();\n    }));\n    const done = Object.keys(S.gram).length, right = G.items.filter((g, i) => S.gram[i] === g.a).length;\n    $('gStatus').className = 'status' + (done === G.items.length ? ' ok' : '');\n    $('gStatus').innerHTML = done === G.items.length ? 'Верно: ' + right + ' из ' + G.items.length + ' \u003cbutton class=\"btn ghost small\" id=\"gReset\" style=\"margin-left:8px\">Заново\u003c/button>' : 'Отвечено: ' + done + ' из ' + G.items.length;\n    if($('gReset')) $('gReset').addEventListener('click', () => { S.gram = {}; save(); draw(); });\n  };\n  $('gWrite').innerHTML = G.writes.map((w, i) =>\n    '\u003cdiv class=\"write\" data-w=\"' + i + '\">\u003cdiv class=\"q\">' + w.label + '\u003c/div>\u003cinput class=\"field\" data-gw=\"' + i + '\" autocomplete=\"off\" spellcheck=\"false\">\u003cdiv class=\"fb\" data-wfb=\"' + i + '\">\u003c/div>\u003c/div>').join('');\n  $('gWrite').querySelectorAll('[data-gw]').forEach(inp => {\n    const i = +inp.dataset.gw; inp.value = S.gw[i] || '';\n    inp.addEventListener('input', () => { S.gw[i] = inp.value; save(); });\n  });\n  const problems = (w, v) => {\n    const miss = w.checks.filter(c => !c.re.test(v)).map(c => c.miss);\n    if(countWords(v) \u003c (w.minWords || 6)) miss.push('слишком коротко');\n    return miss;\n  };\n  function checkDone(){\n    if(Object.keys(S.gram).length === G.items.length && G.writes.every((w, i) => problems(w, clean(S.gw[i])).length === 0)) complete('gram');\n  }\n  $('gwCheck').addEventListener('click', () => {\n    G.writes.forEach((w, i) => {\n      const v = clean(S.gw[i]), box = document.querySelector('[data-w=\"' + i + '\"]'), fb = document.querySelector('[data-wfb=\"' + i + '\"]');\n      if(!v){ box.classList.remove('ok','no'); fb.textContent = 'Пусто.'; return; }\n      const miss = problems(w, v), ok = !miss.length;\n      box.classList.toggle('ok', ok); box.classList.toggle('no', !ok);\n      fb.innerHTML = (ok ? 'Конструкция на месте.' : 'Пока не так: ' + miss.join(', ') + '.') + '\u003cspan class=\"model\">Пример: ' + w.model + '\u003c/span>';\n    });\n    checkDone();\n    if(Object.keys(S.gram).length \u003c G.items.length) toast('Не забудь выбрать формы в предложениях выше');\n  });\n  draw();\n}\n\n/* ============ 7. разговор ============ */\nlet clockInt = null, clockLeft = 60;\nfunction talk(el){\n  const T = C.talk;\n  el.innerHTML =\n    '\u003cp class=\"task\">' + T.intro + '\u003c/p>' +\n    '\u003cdiv class=\"grid2\">\u003cdiv class=\"slab\">\u003ch3>Твой вердикт\u003c/h3>\u003cdiv class=\"opts\" style=\"grid-template-columns:1fr\" id=\"vote\">' +\n    T.votes.map(([id, t, d]) => '\u003cbutton class=\"opt ' + (S.vote === id ? 'pick' : '') + '\" data-vote=\"' + id + '\">\u003cspan>' + t + '\u003csmall>' + d + '\u003c/small>\u003c/span>\u003c/button>').join('') + '\u003c/div>' +\n    '\u003cdiv class=\"frame\">' + T.frame + '\u003c/div>\u003c/div>' +\n    '\u003cdiv class=\"slab\">\u003ch3>Одна минута\u003c/h3>\u003cp class=\"note\" style=\"padding:8px 10px\">Говори без чтения с экрана. Потом отметь, что получилось.\u003c/p>' +\n    '\u003cdiv class=\"clock\">\u003cb id=\"clockFace\">01:00\u003c/b>\u003cdiv class=\"row\" style=\"justify-content:center;margin-top:8px\">\u003cbutton class=\"btn small\" id=\"clockGo\">Старт\u003c/button>\u003cbutton class=\"btn small ghost\" id=\"clockReset\">Сброс\u003c/button>\u003c/div>\u003c/div>' +\n    '\u003cdiv style=\"margin-top:12px\">' + T.checks.map((t, i) =>\n      '\u003clabel class=\"check\">\u003cinput type=\"checkbox\" data-req=\"' + i + '\" ' + (S.req[i] ? 'checked' : '') + '> ' + t + '\u003c/label>').join('') + '\u003c/div>\u003c/div>\u003c/div>' +\n    '\u003cdiv class=\"talk\">\u003cdiv>\u003cp class=\"kicker\" style=\"color:#ffe1b8\">Пауза на разговор\u003c/p>\u003ch3>Pick a side\u003c/h3>\u003cp>Вытяни карту, ответь и задай один встречный вопрос.\u003c/p>\u003c/div>' +\n    '\u003cdiv class=\"talk-card\">\u003cp class=\"talk-q\" id=\"talkQ\">\u003c/p>\u003cdiv class=\"row\">\u003cbutton class=\"btn small\" id=\"talkDraw\">другая карта\u003c/button>\u003cbutton class=\"btn small ghost\" id=\"talkTwist\">поворот\u003c/button>\u003c/div>\u003cdiv class=\"twist\" id=\"talkTw\" hidden>\u003c/div>\u003c/div>\u003c/div>' +\n    teach(T.teach);\n  const drawTalk = () => {\n    $('talkQ').textContent = T.qs[S.talkQ % T.qs.length];\n    $('talkTw').hidden = S.talkT \u003c 0;\n    if(S.talkT >= 0) $('talkTw').textContent = T.tw[S.talkT % T.tw.length];\n  };\n  drawTalk();\n  $('talkDraw').addEventListener('click', () => { S.talkQ = (S.talkQ + 1 + Math.floor(Math.random() * (T.qs.length - 1))) % T.qs.length; S.talkT = -1; save(); drawTalk(); });\n  $('talkTwist').addEventListener('click', () => { let n = Math.floor(Math.random() * T.tw.length); if(n === S.talkT) n = (n + 1) % T.tw.length; S.talkT = n; save(); drawTalk(); });\n  const maybeDone = () => { if(S.vote && S.req.filter(Boolean).length >= 3) complete('talk'); };\n  el.querySelectorAll('[data-vote]').forEach(b => b.addEventListener('click', () => {\n    S.vote = b.dataset.vote; save();\n    el.querySelectorAll('[data-vote]').forEach(x => x.classList.toggle('pick', x.dataset.vote === S.vote));\n    maybeDone();\n  }));\n  el.querySelectorAll('[data-req]').forEach(c => c.addEventListener('change', () => { S.req[+c.dataset.req] = c.checked; save(); maybeDone(); }));\n  const face = () => { $('clockFace').textContent = '0' + Math.floor(clockLeft / 60) + ':' + String(clockLeft % 60).padStart(2, '0'); };\n  clearInterval(clockInt); clockInt = null; clockLeft = 60; face();\n  $('clockGo').addEventListener('click', () => {\n    if(clockInt){ clearInterval(clockInt); clockInt = null; $('clockGo').textContent = 'Продолжить'; return; }\n    if(clockLeft \u003c= 0) clockLeft = 60;\n    $('clockGo').textContent = 'Пауза';\n    clockInt = setInterval(() => {\n      clockLeft--; face();\n      if(clockLeft \u003c= 0){ clearInterval(clockInt); clockInt = null; $('clockGo').textContent = 'Ещё раз'; blip(880,.3); toast('Время! Договори начатое предложение.'); }\n    }, 1000);\n  });\n  $('clockReset').addEventListener('click', () => { clearInterval(clockInt); clockInt = null; clockLeft = 60; face(); $('clockGo').textContent = 'Старт'; });\n}\n\n/* ============ 8. дневник ============ */\nfunction diary(el){\n  const D = C.diary;\n  el.innerHTML =\n    '\u003cp class=\"task\">' + D.task + '\u003c/p>' +\n    '\u003cdiv class=\"targets\" id=\"dTargets\">\u003c/div>' +\n    '\u003ctextarea class=\"field\" id=\"dText\" placeholder=\"' + esc(D.placeholder) + '\">\u003c/textarea>' +\n    '\u003cdiv class=\"meter-row\">\u003cspan>Слов: \u003cb id=\"dWords\">0\u003c/b>\u003c/span>\u003cspan>Выражений: \u003cb id=\"dHits\">0\u003c/b> / ' + D.hits + '\u003c/span>\u003cspan>' + D.extra.label + ': \u003cb id=\"dPc\">нет\u003c/b>\u003c/span>\u003c/div>' +\n    '\u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"btn warm\" id=\"dCheck\">Сдать запись\u003c/button>\u003cbutton class=\"btn ghost small\" id=\"dModel\">Показать образец\u003c/button>\u003cbutton class=\"btn ghost small\" id=\"dCopy\">Скопировать текст\u003c/button>\u003c/div>' +\n    '\u003cdiv class=\"status\" id=\"dStatus\">\u003c/div>\u003cdiv class=\"note\" id=\"dModelBox\" hidden style=\"margin-top:12px\">\u003c/div>' + teach(D.teach);\n  const t = $('dText'); t.value = S.diary || '';\n  const analyse = () => {\n    const v = clean(t.value), w = countWords(v);\n    const hits = D.targets.filter(d => d.re.test(v)).map(d => d.id);\n    $('dTargets').innerHTML = D.targets.map(d => '\u003cspan class=\"' + (hits.includes(d.id) ? 'hit' : '') + '\">' + d.label + '\u003c/span>').join('');\n    $('dWords').textContent = w; $('dHits').textContent = hits.length; $('dPc').textContent = D.extra.re.test(v) ? 'есть' : 'нет';\n    return { words:w, hits:hits.length, extra:D.extra.re.test(v) };\n  };\n  t.addEventListener('input', () => { S.diary = t.value; save(); analyse(); });\n  analyse();\n  $('dCheck').addEventListener('click', () => {\n    const r = analyse(), miss = [];\n    if(r.words \u003c D.min) miss.push('добавь слов (сейчас ' + r.words + ')');\n    if(r.words > D.max) miss.push('сократи до ' + D.max + ' слов');\n    if(r.hits \u003c D.hits) miss.push('нужно ещё выражений: ' + (D.hits - r.hits));\n    if(!r.extra) miss.push(D.extra.miss);\n    $('dStatus').className = 'status ' + (miss.length ? 'no' : 'ok');\n    $('dStatus').textContent = miss.length ? 'Почти: ' + miss.join('; ') + '.' : 'Запись принята! Теперь прочитай её вслух, не глядя в текст через каждое слово.';\n    if(!miss.length) complete('diary'); else bad();\n  });\n  $('dModel').addEventListener('click', () => { const b = $('dModelBox'); b.hidden = !b.hidden; b.textContent = D.model; });\n  $('dCopy').addEventListener('click', async () => {\n    try { await navigator.clipboard.writeText(t.value); toast('Текст скопирован — можно отправить преподавателю'); }\n    catch(e){ t.select(); toast('Выдели и скопируй текст вручную'); }\n  });\n}\n\n/* ============ 9. финал ============ */\nfunction exit(el){\n  const X = C.exit;\n  el.innerHTML = '\u003cdiv class=\"grid2\">\u003cdiv>\u003cp class=\"task\">Впиши пропущенное слово без подсказок и без задания 2. Форму слова можно менять.\u003c/p>\u003cdiv id=\"gapList\">\u003c/div>' +\n    '\u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"btn warm\" id=\"gapCheck\">' + X.button + '\u003c/button>\u003c/div>\u003c/div>' +\n    '\u003cdiv class=\"slab\">\u003cdiv class=\"seal\">\u003cdiv>\u003cb id=\"sealScore\">—\u003c/b>\u003cspan>выражений вспомнено\u003c/span>\u003c/div>\u003c/div>\u003cp id=\"sealLine\" style=\"text-align:center;font-weight:800;color:var(--ink-soft)\">' + X.idle + '\u003c/p>' +\n    '\u003ch3>Can-do\u003c/h3>' + X.cando.map(t => '\u003clabel class=\"check\">\u003cinput type=\"checkbox\"> ' + t + '\u003c/label>').join('') + '\u003c/div>\u003c/div>' + teach(X.teach);\n  $('gapList').innerHTML = X.gaps.map((g, i) =>\n    '\u003clabel class=\"gapline\" data-gl=\"' + i + '\">\u003cspan>' + g.pre + '\u003cb>______\u003c/b>' + g.post + '\u003c/span>\u003cinput class=\"field\" data-gi=\"' + i + '\" autocomplete=\"off\" spellcheck=\"false\" aria-label=\"Ответ ' + (i + 1) + '\">\u003c/label>').join('');\n  $('gapList').querySelectorAll('[data-gi]').forEach(inp => {\n    const i = +inp.dataset.gi; inp.value = S.gaps[i] || '';\n    inp.addEventListener('input', () => { S.gaps[i] = inp.value; save(); });\n  });\n  $('gapCheck').addEventListener('click', () => {\n    let score = 0;\n    X.gaps.forEach((g, i) => {\n      const ok = g.ok.includes(clean(S.gaps[i]));\n      if(ok) score++;\n      const row = document.querySelector('[data-gl=\"' + i + '\"]');\n      row.classList.toggle('ok', ok); row.classList.toggle('no', !ok);\n      if(!ok){ row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake'); }\n    });\n    const pass = score >= X.gaps.length - 2;\n    $('sealScore').textContent = score + '/' + X.gaps.length;\n    $('sealLine').textContent = pass ? X.passText : 'Пока рано: повтори задание 2 и попробуй снова';\n    $('sealLine').style.color = pass ? '#2e9e3c' : 'var(--signal)';\n    if(pass) complete('exit'); else bad();\n  });\n}\n\n/* ============ 10. домашнее задание ============ */\nfunction skeleton(t){ return t.split(' ').map(w => { const l = w.replace(/[^A-Za-z’']/g, ''); return l.length \u003c= 2 ? w : w[0] + '_'.repeat(l.length - 1) + w.slice(l.length); }).join(' '); }\nfunction homework(el){\n  const H = S.hw, K = C.home;\n  el.innerHTML =\n    '\u003cp class=\"task\">Домашка из пяти частей, около 30–40 минут. Ответы сохраняются сами — можно делать в несколько подходов. В конце нажми \u003cb>«Отправить преподавателю»\u003c/b>: все ответы соберутся в одно сообщение.\u003c/p>' +\n    '\u003csection class=\"hw-part\" id=\"hwA\">\u003ch3>\u003cb>A\u003c/b> Переведи на английский\u003c/h3>\u003cp class=\"note\" style=\"padding:8px 12px\">Используй выражения из задания 2. Проверка смотрит на нужное выражение, а не на точное совпадение слов.\u003c/p>\u003cdiv id=\"hwTr\">\u003c/div>' +\n      '\u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"btn warm\" id=\"hwTrCheck\">Проверить перевод\u003c/button>\u003cspan class=\"note\" id=\"hwTrScore\" style=\"padding:6px 12px\">\u003c/span>\u003c/div>\u003c/section>' +\n    '\u003csection class=\"hw-part\" id=\"hwB\">\u003ch3>\u003cb>B\u003c/b> ' + K.brTitle + '\u003c/h3>\u003cp class=\"note\" style=\"padding:8px 12px\">' + K.brNote + '\u003c/p>\u003cdiv id=\"hwBr\">\u003c/div>' +\n      '\u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"btn warm\" id=\"hwBrCheck\">Проверить формы\u003c/button>\u003cspan class=\"note\" id=\"hwBrScore\" style=\"padding:6px 12px\">\u003c/span>\u003c/div>\u003c/section>' +\n    '\u003csection class=\"hw-part\" id=\"hwC\">\u003ch3>\u003cb>C\u003c/b> Диктант на слух\u003c/h3>\u003cp class=\"note\" style=\"padding:8px 12px\">Четыре новых предложения о главе ' + C.num + '. Слушай сколько угодно и записывай \u003cb>целиком\u003c/b>. Голос с акцентом? Нажми \u003cbutton class=\"btn ghost small\" type=\"button\" id=\"hwVoice\">🔊 Голос\u003c/button>\u003c/p>\u003cdiv id=\"hwDc\">\u003c/div>' +\n      '\u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"btn warm\" id=\"hwDcCheck\">Проверить диктант\u003c/button>\u003cspan class=\"note\" id=\"hwDcScore\" style=\"padding:6px 12px\">\u003c/span>\u003c/div>\u003c/section>' +\n    '\u003csection class=\"hw-part\" id=\"hwD\">\u003ch3>\u003cb>D\u003c/b> ' + K.prompt.title + '\u003c/h3>' +\n      '\u003cp class=\"task\" style=\"font-size:16px\">' + K.prompt.html + ' \u003cb>40–70 слов\u003c/b>. Можно вместо текста записать голосовое на 60 секунд и отправить преподавателю.\u003c/p>' +\n      '\u003cdiv class=\"frame\" style=\"margin:0 0 10px;border:0;padding:0\">\u003cb>Опоры:\u003c/b> ' + K.prompt.frames + '\u003c/div>' +\n      '\u003ctextarea class=\"field\" id=\"hwTxt\" style=\"min-height:140px\" placeholder=\"' + esc(K.prompt.placeholder) + '\">\u003c/textarea>' +\n      '\u003cdiv class=\"meter-row\">\u003cspan>Слов: \u003cb id=\"hwWords\">0\u003c/b> / 40–70\u003c/span>\u003cspan id=\"hwTxtState\">\u003c/span>\u003c/div>\u003c/section>' +\n    '\u003csection class=\"hw-part\" id=\"hwE\">\u003ch3>\u003cb>E\u003c/b> Подготовка к следующему уроку\u003c/h3>' +\n      K.checklist.map((t, i) => '\u003clabel class=\"check\">\u003cinput type=\"checkbox\" data-hwchk=\"' + i + '\" ' + (H.chk[i] ? 'checked' : '') + '> ' + t + '\u003c/label>').join('') + '\u003c/section>' +\n    '\u003cdiv class=\"tally\" style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;padding:16px;background:#fff8dc;border:2px dashed #f0d27a;border-radius:20px\">' +\n      '\u003cspan id=\"hwSummary\" style=\"font-family:var(--ui);font-weight:800;color:#8a5a00\">\u003c/span>' +\n      '\u003cbutton class=\"btn go\" id=\"hwSend\">📨 Отправить преподавателю\u003c/button>\u003c/div>' +\n    teach('Части A–C проверяются автоматически, D и E — вами. Если в части C больше двух ошибок, попросите переслушать с кнопкой «медленнее» и записать заново; сравнение «было/стало» полезнее новой порции.');\n\n  $('hwTr').innerHTML = K.tr.map((it, i) =>\n    '\u003cdiv class=\"hw-line\" data-tr=\"' + i + '\">\u003cdiv class=\"q\">' + (i + 1) + '. ' + it.ru + '\u003c/div>' +\n    '\u003cinput class=\"field\" data-trin=\"' + i + '\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"по-английски\">\u003cdiv class=\"fb\" data-trfb=\"' + i + '\">\u003c/div>\u003c/div>').join('');\n  $('hwBr').innerHTML = K.br.map((it, i) =>\n    '\u003cdiv class=\"hw-line\" data-br=\"' + i + '\">\u003cdiv class=\"q\">' + (i + 1) + '. ' + it.pre + ' ____ (\u003ci>' + it.verb + '\u003c/i>) ' + it.post + '\u003c/div>' +\n    '\u003cinput class=\"field\" data-brin=\"' + i + '\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"форма глагола\">\u003cdiv class=\"fb\" data-brfb=\"' + i + '\">\u003c/div>\u003c/div>').join('');\n  $('hwDc').innerHTML = K.dict.map((t, i) =>\n    '\u003cdiv class=\"hw-line\" data-dc=\"' + i + '\">\u003cdiv class=\"tools\">\u003cb style=\"align-self:center;margin-right:4px\">№ ' + (i + 1) + '\u003c/b>' +\n    '\u003cbutton class=\"btn ghost small\" data-dcplay=\"' + i + '\">▶ слушать\u003c/button>\u003cbutton class=\"btn ghost small\" data-dcslow=\"' + i + '\">🐢 медленнее\u003c/button>\u003cbutton class=\"btn ghost small\" data-dctip=\"' + i + '\">подсказка\u003c/button>\u003c/div>' +\n    '\u003cinput class=\"field\" data-dcin=\"' + i + '\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"запиши предложение целиком\">\u003cdiv class=\"fb\" data-dcfb=\"' + i + '\">\u003c/div>\u003c/div>').join('');\n\n  const bind = (attr, store) => el.querySelectorAll('[' + attr + ']').forEach(inp => {\n    const i = inp.getAttribute(attr); inp.value = store[i] || '';\n    inp.addEventListener('input', () => { store[i] = inp.value; save(); });\n  });\n  bind('data-trin', H.tr); bind('data-brin', H.br); bind('data-dcin', H.dc);\n\n  el.querySelectorAll('[data-dcplay]').forEach(b => b.addEventListener('click', () => speak(K.dict[+b.dataset.dcplay], .9)));\n  el.querySelectorAll('[data-dcslow]').forEach(b => b.addEventListener('click', () => speak(K.dict[+b.dataset.dcslow], .7)));\n  el.querySelectorAll('[data-dctip]').forEach(b => b.addEventListener('click', () => {\n    document.querySelector('[data-dcfb=\"' + b.dataset.dctip + '\"]').innerHTML = 'Скелет: \u003cb>' + skeleton(K.dict[+b.dataset.dctip]) + '\u003c/b>';\n  }));\n  $('hwVoice').addEventListener('click', () => window.TTS && TTS.openPicker());\n\n  const mark = (sel, ok) => { const box = document.querySelector(sel); box.classList.toggle('ok', ok); box.classList.toggle('no', !ok); };\n  const trOk = i => { const v = clean(H.tr[i]); return !!v && K.tr[i].must.every(re => re.test(v)); };\n  const brOk = i => K.br[i].ok.includes(clean(H.br[i]));\n  const dcRes = i => {\n    const target = clean(K.dict[i]).split(' '), given = clean(H.dc[i]).split(' ').filter(Boolean);\n    let right = 0;\n    const marked = target.map((w, n) => { const ok = given[n] === w; if(ok) right++; return '\u003cspan class=\"' + (ok ?
