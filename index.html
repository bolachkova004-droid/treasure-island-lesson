 'w-ok' : 'w-no') + '\">' + (given[n] || '…') + '\u003c/span>'; }).join(' ');\n    return { full: right === target.length && given.length === target.length, right, total: target.length, marked, empty: !given.length };\n  };\n  const scores = () => ({\n    tr: K.tr.filter((t, i) => trOk(i)).length,\n    br: K.br.filter((t, i) => brOk(i)).length,\n    dc: K.dict.filter((t, i) => dcRes(i).full).length,\n    words: countWords(clean(H.txt))\n  });\n  function summary(){\n    const sc = scores();\n    $('hwA').classList.toggle('done', sc.tr >= 4); $('hwB').classList.toggle('done', sc.br >= 4);\n    $('hwC').classList.toggle('done', sc.dc >= 3); $('hwD').classList.toggle('done', sc.words >= 40 && sc.words \u003c= 70);\n    $('hwE').classList.toggle('done', H.chk.filter(Boolean).length === K.checklist.length);\n    $('hwSummary').textContent = 'A ' + sc.tr + '/' + K.tr.length + ' · B ' + sc.br + '/' + K.br.length + ' · C ' + sc.dc + '/' + K.dict.length + ' · D ' + sc.words + ' слов';\n    if(sc.tr >= 4 && sc.br >= 4 && sc.dc >= 3 && sc.words >= 40) complete('home');\n  }\n\n  $('hwTrCheck').addEventListener('click', () => {\n    K.tr.forEach((it, i) => {\n      const fb = document.querySelector('[data-trfb=\"' + i + '\"]');\n      if(!clean(H.tr[i])){ fb.textContent = 'Пусто.'; return; }\n      const ok = trOk(i); mark('[data-tr=\"' + i + '\"]', ok);\n      fb.innerHTML = ok ? 'Выражение на месте. \u003cspan class=\"model\">Вариант: ' + it.model + '\u003c/span>' : 'Нужно выражение \u003cb>' + it.tip + '\u003c/b>. \u003cspan class=\"model\">Вариант: ' + it.model + '\u003c/span>';\n    });\n    const n = scores().tr; $('hwTrScore').textContent = 'Принято: ' + n + ' из ' + K.tr.length; (n >= 4 ? good : bad)(); summary();\n  });\n  $('hwBrCheck').addEventListener('click', () => {\n    K.br.forEach((it, i) => {\n      const fb = document.querySelector('[data-brfb=\"' + i + '\"]');\n      if(!clean(H.br[i])){ fb.textContent = 'Пусто.'; return; }\n      const ok = brOk(i); mark('[data-br=\"' + i + '\"]', ok);\n      fb.innerHTML = ok ? 'Верно.' : 'Правильно: \u003cb>' + it.ok[0] + '\u003c/b>' + (it.why ? ' — ' + it.why : '') + '.';\n    });\n    const n = scores().br; $('hwBrScore').textContent = 'Верно: ' + n + ' из ' + K.br.length; (n >= 4 ? good : bad)(); summary();\n  });\n  $('hwDcCheck').addEventListener('click', () => {\n    K.dict.forEach((t, i) => {\n      const r = dcRes(i), fb = document.querySelector('[data-dcfb=\"' + i + '\"]');\n      if(r.empty){ fb.textContent = 'Пусто.'; return; }\n      mark('[data-dc=\"' + i + '\"]', r.full);\n      fb.innerHTML = (r.full ? 'Точно! ' : 'Верных слов: ' + r.right + ' из ' + r.total + '. ') + r.marked + (r.full ? '' : '\u003cspan class=\"model\">Оригинал: ' + t + '\u003c/span>');\n    });\n    const n = scores().dc; $('hwDcScore').textContent = 'Точно: ' + n + ' из ' + K.dict.length; (n >= 3 ? good : bad)(); summary();\n  });\n  const t = $('hwTxt'); t.value = H.txt || '';\n  const txtState = () => {\n    const w = scores().words; $('hwWords').textContent = w;\n    $('hwTxtState').textContent = w \u003c 40 ? 'нужно ещё ' + (40 - w) : w > 70 ? 'слишком длинно' : '✓ объём в норме';\n  };\n  t.addEventListener('input', () => { H.txt = t.value; save(); txtState(); summary(); });\n  el.querySelectorAll('[data-hwchk]').forEach(c => c.addEventListener('change', () => { H.chk[+c.dataset.hwchk] = c.checked; save(); summary(); }));\n\n  $('hwSend').addEventListener('click', async () => {\n    const sc = scores();\n    const text = [\n      'Treasure Island · глава ' + C.num + ' · домашнее задание', '',\n      'A. Перевод (' + sc.tr + '/' + K.tr.length + '):', ...K.tr.map((it, i) => (i + 1) + '. ' + (H.tr[i] || '—')), '',\n      'B. ' + K.brTitle + ' (' + sc.br + '/' + K.br.length + '):', ...K.br.map((it, i) => (i + 1) + '. ' + (H.br[i] || '—')), '',\n      'C. Диктант (' + sc.dc + '/' + K.dict.length + '):', ...K.dict.map((it, i) => (i + 1) + '. ' + (H.dc[i] || '—')), '',\n      'D. ' + K.prompt.title + ' (' + sc.words + ' слов):', H.txt || '— (голосовое отдельно)', '',\n      'E. Подготовка: ' + H.chk.filter(Boolean).length + '/' + K.checklist.length\n    ].join('\\n');\n    if(navigator.share){ try { await navigator.share({ title:'Домашнее задание · глава ' + C.num, text }); return; } catch(e){ if(e && e.name === 'AbortError') return; } }\n    try { await navigator.clipboard.writeText(text); toast('Ответы скопированы — вставь их в сообщение преподавателю'); }\n    catch(e){\n      let out = $('hwOut');\n      if(!out){ out = document.createElement('textarea'); out.id = 'hwOut'; out.className = 'field'; out.readOnly = true; out.style.marginTop = '12px'; $('hwSend').parentNode.after(out); }\n      out.value = text; out.select(); toast('Скопируй текст из поля ниже и отправь преподавателю');\n    }\n  });\n  txtState(); summary();\n}\n\n/* ============ запуск ============ */\nconst fromHash = location.hash.match(/^#task-(\\d+)$/);\nif(fromHash) S.step = Math.max(0, Math.min(STEPS.length - 1, +fromHash[1] - 1));\nshow();\n})();\n\n\u003c/script>\n\u003cscript>\n(() => {\n  const FILES = {\"lesson-1-2.html\": \"12\", \"chapter-3.html\": \"ch3\", \"chapter-4.html\": \"ch4\", \"chapter-5.html\": \"ch5\", \"a2-words.html\": \"words\", \"index.html\": \"12\", \"index-3.html\": \"12\"};\n  const part = href => FILES[String(href || '').split('#')[0].split('?')[0].split('/').pop()];\n  const inHub = window.parent !== window;\n  window.__tiGo = href => { const id = part(href); if(inHub && id) window.parent.postMessage({ tiGo:id }, '*'); else location.href = href; };\n  document.addEventListener('click', e => {\n    const a = e.target.closest && e.target.closest('a[href]');\n    if(!a || !inHub) return;\n    const id = part(a.getAttribute('href'));\n    if(id){ e.preventDefault(); window.parent.postMessage({ tiGo:id }, '*'); }\n  }, true);\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n" },
  "ch5": { title:"Глава V · The Last of the Blind Man", html:"\u003c!doctype html>\n\u003chtml lang=\"ru\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003cmeta name=\"theme-color\" content=\"#9fdcff\">\n\u003cmeta name=\"format-detection\" content=\"telephone=no\">\n\u003ctitle>The Last of the Blind Man · Treasure Island V\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Nunito:ital,wght@0,600;0,700;0,800;1,600&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n/* Общие стили страниц с главами Treasure Island (III–V). */\n:root{\n  --ink:#233a57; --ink-soft:#5d6f88; --ink-dim:#98a6b8;\n  --paper-2:#f4f9ff; --line:#dbe7f3; --rule:#e6eef7; --shadow:#d3e1ef;\n  --tide:#38b6ff; --signal:#ff5a5f; --moss:#4cc25a; --accent:#e07a2e;\n  --ui:Rubik,\"Trebuchet MS\",sans-serif; --story:Nunito,\"Trebuchet MS\",sans-serif;\n}\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%;background:#cfeeff;overflow-x:hidden}\nbody{margin:0;min-height:100vh;min-height:100dvh;overflow-x:clip;color:var(--ink);font-family:var(--story);font-size:17px;font-weight:600;line-height:1.5;\n  background:\n    radial-gradient(ellipse 22% 9% at 12% 16%,rgba(255,255,255,.9),transparent 70%),\n    radial-gradient(ellipse 18% 7% at 78% 10%,rgba(255,255,255,.85),transparent 70%),\n    linear-gradient(180deg,#9fdcff 0%,#d8f2ff 45%,#fff6e0 100%);background-attachment:fixed}\nbutton,input,textarea{font:inherit;color:inherit}\nbutton{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}\n:focus-visible{outline:3px solid var(--accent);outline-offset:3px}\nh1,h2,h3{margin:0;font-family:var(--ui);font-weight:800;line-height:1.1}\np{margin:0 0 10px}\nb,strong{font-weight:800}\n[hidden]{display:none!important}\n\n.wrap{max-width:1100px;margin:0 auto;padding:18px 18px 110px}\n\n/* шапка */\n.top{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:18px;align-items:center;padding:22px 24px;overflow:hidden;\n  color:#fff;background:linear-gradient(150deg,#16324f 0%,#23476e 55%,#3a5d86 100%);border-radius:26px;box-shadow:0 7px 0 #0f2238}\n.top::before{content:\"\";position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,rgba(255,214,120,.35),transparent 40%);pointer-events:none}\n.top .mark{display:inline-block;padding:3px 10px;font-family:var(--ui);font-size:11px;font-weight:700;letter-spacing:.12em;color:#16324f;background:#ffd36b;border-radius:999px}\n.top h1{margin-top:8px;font-size:clamp(32px,5vw,52px)}\n.top h1 i{display:block;font-style:normal;font-size:.55em;color:#ffd36b}\n.top p{max-width:56ch;margin:8px 0 0;font-size:15.5px;color:rgba(255,255,255,.88)}\n.top-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}\n.top-links a{display:inline-flex;align-items:center;min-height:40px;padding:6px 14px;font-family:var(--ui);font-size:13px;font-weight:700;color:#fff;text-decoration:none;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);border-radius:14px}\n.top svg{position:relative;width:100%;height:auto}\n.progress{display:flex;align-items:center;gap:10px;margin-top:14px;font-family:var(--ui);font-size:13px;font-weight:700;color:rgba(255,255,255,.85)}\n.progress .bar{flex:1;max-width:260px;height:10px;background:rgba(255,255,255,.18);border-radius:10px;overflow:hidden}\n.progress .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd36b,#ffb020);border-radius:10px;transition:width .4s}\n\n/* шаги */\n.steps{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px;margin:22px 0 0}\n.step{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:74px;padding:8px 4px;text-align:center;background:#fff;border:2px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--shadow)}\n.step b{display:grid;place-items:center;width:30px;height:30px;font-family:var(--ui);font-size:14px;color:#fff;background:var(--accent);border-radius:50%}\n.step span{font-family:var(--ui);font-size:11.5px;font-weight:700;line-height:1.15;color:var(--ink-soft)}\n.step.done b{background:var(--moss)}\n.step.done b::after{content:\"✓\";font-size:13px}\n.step.done b em{display:none}\n.step em{font-style:normal}\n.step.on{background:var(--accent);border-color:color-mix(in srgb,var(--accent) 75%,#000);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000)}\n.step.on span{color:#fff}\n.step.on b{color:var(--accent);background:#fff}\n\n/* лист */\n.stage{margin-top:22px;padding:26px;background:#fff;border:2px solid var(--line);border-radius:26px;box-shadow:0 7px 0 var(--shadow)}\n.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:14px;margin-bottom:18px;border-bottom:2px dashed var(--line)}\n.kicker{margin:0 0 6px;font-family:var(--ui);font-size:12.5px;font-weight:700;letter-spacing:.08em;color:var(--accent)}\n.head h2{font-size:clamp(26px,3.4vw,38px)}\n.stamp{padding:6px 12px;font-family:var(--ui);font-size:13px;font-weight:700;color:#fff;background:var(--accent);border-radius:999px}\n.task{max-width:72ch;font-size:17px}\n.task b{color:color-mix(in srgb,var(--accent) 85%,#000)}\n.note{max-width:72ch;padding:14px 16px;font-size:15.5px;color:var(--ink-soft);background:#eef8ff;border-radius:16px}\n.note b{color:var(--ink)}\n.teach{margin-top:18px;padding:0;font-size:15px;color:#5a4a1a;background:#fff8dc;border:2px dashed #f0d27a;border-radius:18px}\n.teach summary{padding:12px 16px;font-family:var(--ui);font-size:13px;font-weight:800;color:#b07a00;cursor:pointer}\n.teach p{margin:0;padding:0 16px 14px}\n\n.btn{min-height:46px;padding:10px 20px;font-family:var(--ui);font-size:15px;font-weight:800;color:#fff;background:var(--tide);border:0;border-radius:16px;box-shadow:0 5px 0 color-mix(in srgb,var(--tide) 70%,#000);transition:transform .1s}\n.btn:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--tide) 70%,#000)}\n.btn.ghost{color:var(--ink);background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--shadow)}\n.btn.go{background:linear-gradient(180deg,#5ddc6a,#35c04a);box-shadow:0 5px 0 #248a37}\n.btn.warm{background:var(--accent);box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 65%,#000)}\n.btn.small{min-height:40px;padding:6px 13px;font-size:13.5px;border-radius:13px}\n.btn:disabled{opacity:.4}\n.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}\n.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}\n.slab{padding:18px;background:var(--paper-2);border:2px solid var(--rule);border-radius:20px}\n.slab h3{font-size:20px;margin-bottom:8px}\n.status{min-height:24px;margin-top:12px;font-size:16px;font-weight:700;color:var(--ink-soft)}\n.status.ok{color:#2e9e3c}\n.status.no{color:var(--signal)}\n.field{width:100%;min-height:48px;padding:11px 14px;color:var(--ink);background:#f6faff;border:2px solid var(--line);border-radius:14px;font-weight:700}\n.field:focus{outline:none;border-color:var(--accent);background:#fff}\ntextarea.field{min-height:180px;resize:vertical;line-height:1.5}\n.frame{margin-top:12px;padding-top:10px;border-top:2px dashed var(--line);font-size:15px;color:var(--ink-soft)}\n\n/* выбор вариантов */\n.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}\n.opt{display:flex;align-items:center;gap:10px;min-height:54px;padding:10px 14px;text-align:left;font-size:16px;font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--shadow)}\n.opt:hover{border-color:var(--accent)}\n.opt.pick{color:#fff;background:var(--accent);border-color:color-mix(in srgb,var(--accent) 75%,#000)}\n.opt.hit{color:#fff;background:var(--moss);border-color:#2ea343}\n.opt.miss{color:#fff;background:var(--signal);border-color:#d8383e}\n.opt small{display:block;font-size:13px;font-weight:700;opacity:.8}\n\n/* карточки слов */\n.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}\n.card{display:flex;flex-direction:column;padding:14px;background:#fff;border:2px solid color-mix(in srgb,var(--c) 45%,#fff);border-radius:18px;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 40%,#fff)}\n.cards .card:nth-child(4n+1){--c:#ff8a3d}.cards .card:nth-child(4n+2){--c:#22c3b3}.cards .card:nth-child(4n+3){--c:#8a63d2}.cards .card:nth-child(4n){--c:#38a0ff}\n.card .term{margin:0 0 6px;font-family:var(--ui);font-size:18px;font-weight:800;line-height:1.15}\n.card .ex{margin:0 0 8px;font-size:14px;font-style:italic;color:var(--ink-soft)}\n.card .ru{display:none;margin:0 0 8px;font-size:14.5px;font-weight:800;color:color-mix(in srgb,var(--c) 80%,#000)}\n.card .ru.open{display:block}\n.card .acts{display:flex;gap:6px;margin-top:auto}\n.card .acts button{min-height:36px;padding:4px 10px;font-family:var(--ui);font-size:12.5px;font-weight:800;background:var(--paper-2);border:2px solid var(--line);border-radius:11px}\n.ballast{margin-top:14px}\n.quiz{margin-top:22px;padding:20px;background:var(--paper-2);border:2px solid var(--rule);border-radius:20px}\n.quiz-q{margin:0 0 14px;font-family:var(--ui);font-size:clamp(20px,2.6vw,26px);font-weight:800;text-align:center}\n.quiz-q small{display:block;margin-bottom:4px;font-family:var(--story);font-size:14px;color:var(--ink-soft)}\n\n/* цепь */\n.chain{display:grid;gap:10px;counter-reset:c}\n.link{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:10px 12px;background:#fff;border:2px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--shadow)}\n.link::before{counter-increment:c;content:counter(c);display:grid;place-items:center;width:34px;height:34px;font-family:var(--ui);font-size:15px;font-weight:800;color:#fff;background:var(--accent);border-radius:50%}\n.link.ok{background:#eafbe9;border-color:#9fe0a5}\n.link.ok::before{background:var(--moss)}\n.link.no{background:#fff0f0;border-color:#ffb3b5}\n.arrows{display:flex;gap:6px}\n.arrows button{width:42px;min-height:42px;font-size:18px;font-weight:800;background:var(--paper-2);border:2px solid var(--line);border-radius:12px;box-shadow:0 3px 0 var(--shadow)}\n\n/* правда / ложь */\n.tf{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;background:#fff;border:2px solid var(--line);border-radius:16px}\n.tf+.tf{margin-top:10px}\n.tf .pair{display:flex;gap:6px}\n.tf .pair button{min-width:86px;min-height:42px;padding:6px 10px;font-family:var(--ui);font-size:14px;font-weight:800;background:var(--paper-2);border:2px solid var(--line);border-radius:12px;box-shadow:0 3px 0 var(--shadow)}\n.tf .pair button.right{color:#fff;background:var(--moss);border-color:#2ea343}\n.tf .pair button.wrong{color:#fff;background:var(--signal);border-color:#d8383e}\n.tf .why{grid-column:1/-1;font-size:14.5px;color:var(--ink-soft)}\n\n/* сундук */\n.chest{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}\n.item{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:112px;padding:12px 8px;text-align:center;background:#fff;border:2px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--shadow)}\n.item i{font-style:normal;font-size:30px;line-height:1}\n.item b{font-family:var(--ui);font-size:14.5px;line-height:1.15}\n.item span{font-size:12.5px;color:var(--ink-soft)}\n.item.in{background:#fff3df;border-color:#f0b35a;box-shadow:0 4px 0 #f0b35a}\n.item.right{background:#eafbe9;border-color:#9fe0a5;box-shadow:0 4px 0 #9fe0a5}\n.item.wrong{background:#fff0f0;border-color:#ffb3b5;box-shadow:0 4px 0 #ffb3b5}\n\n/* грамматика */\n.rule-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:18px}\n.rule{padding:16px;background:#eef8ff;border:2px solid #bfe3ff;border-radius:18px}\n.rule.evt{background:#fff3ea;border-color:#ffd0b0}\n.rule h3{font-size:18px;margin-bottom:6px}\n.form{display:inline-block;margin:0 0 8px;padding:3px 11px;font-family:var(--ui);font-size:13px;font-weight:800;color:#fff;background:var(--tide);border-radius:999px}\n.rule.evt .form{background:#ff8a3d}\n.timeline{display:block;width:100%;max-width:560px;height:auto;margin:0 auto 18px}\n.gline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;background:#fff;border:2px solid var(--line);border-radius:16px}\n.gline+.gline{margin-top:10px}\n.gline .pair{display:flex;gap:6px;flex-wrap:wrap}\n.gline .pair button{min-height:42px;padding:6px 12px;font-family:var(--ui);font-size:14px;font-weight:700;background:var(--paper-2);border:2px solid var(--line);border-radius:12px;box-shadow:0 3px 0 var(--shadow)}\n.gline .pair button.right{color:#fff;background:var(--moss);border-color:#2ea343}\n.gline .pair button.wrong{color:#fff;background:var(--signal);border-color:#d8383e}\n.gline .why{grid-column:1/-1;font-size:14.5px;color:var(--ink-soft)}\n.write{padding:14px;background:#fff;border:2px solid var(--line);border-radius:18px}\n.write+.write{margin-top:10px}\n.write.ok{background:#eafbe9;border-color:#9fe0a5}\n.write.no{background:#fff0f0;border-color:#ffb3b5}\n.write .q{margin-bottom:8px;font-weight:800}\n.fb{min-height:20px;margin-top:8px;font-size:15px;color:var(--ink-soft)}\n.fb .model{display:block;margin-top:4px;font-weight:800;color:#2a8fd6}\n\n/* разговор */\n.talk{display:grid;grid-template-columns:minmax(170px,.35fr) minmax(0,1fr);gap:18px;align-items:center;margin-top:18px;padding:20px;color:#fff;\n  background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.18) 1.5px,transparent 2px) 0 0/18px 18px,linear-gradient(135deg,#e07a2e,#8a4fc0);border-radius:22px;box-shadow:0 6px 0 #6a3a90}\n.talk h3{font-size:24px;color:#fff}\n.talk p{font-size:15px;color:rgba(255,255,255,.92)}\n.talk-card{padding:18px;color:var(--ink);background:#fff;border-radius:18px}\n.talk-q{min-height:52px;margin:0 0 14px;font-family:var(--ui);font-size:clamp(18px,2vw,22px);font-weight:700;line-height:1.3}\n.twist{margin-top:12px;padding:9px 12px;font-size:15px;font-weight:700;color:#8a4a00;background:#fff3cf;border-radius:12px}\n.clock{padding:16px;text-align:center;background:#fff;border:2px solid var(--line);border-radius:18px}\n.clock b{display:block;font-family:var(--ui);font-size:46px;font-weight:800;font-variant-numeric:tabular-nums}\n.check{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;font-size:16px}\n.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--moss)}\n\n/* дневник */\n.targets{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}\n.targets span{padding:4px 10px;font-family:var(--ui);font-size:13px;font-weight:700;color:var(--ink-soft);background:var(--paper-2);border:2px solid var(--line);border-radius:999px}\n.targets span.hit{color:#fff;background:var(--moss);border-color:#2ea343}\n.meter-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-family:var(--ui);font-size:14px;font-weight:700;color:var(--ink-soft)}\n.meter-row b{color:var(--ink)}\n\n/* финал */\n.gapline{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,.35fr);gap:12px;align-items:center;padding:12px 14px;background:#fff;border:2px solid var(--line);border-radius:16px}\n.gapline+.gapline{margin-top:10px}\n.hw-part{margin-top:22px;padding:18px;background:var(--paper-2);border:2px solid var(--rule);border-radius:20px}\n.hw-part:first-of-type{margin-top:4px}\n.hw-part h3{display:flex;align-items:center;gap:10px;font-size:21px;margin-bottom:6px}\n.hw-part h3 b{display:grid;place-items:center;width:32px;height:32px;font-size:15px;color:#fff;background:var(--accent);border-radius:50%}\n.hw-part.done h3 b{background:var(--moss)}\n.hw-line{padding:12px 14px;background:#fff;border:2px solid var(--line);border-radius:16px}\n.hw-line+.hw-line{margin-top:10px}\n.hw-line.ok{background:#eafbe9;border-color:#9fe0a5}\n.hw-line.no{background:#fff0f0;border-color:#ffb3b5}\n.hw-line .q{margin-bottom:8px;font-weight:800}\n.hw-line .tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}\n.fb .w-ok{color:#2e9e3c;font-weight:800}\n.fb .w-no{color:var(--signal);text-decoration:line-through}\n.gapline.ok{background:#eafbe9;border-color:#9fe0a5}\n.gapline.no{background:#fff0f0;border-color:#ffb3b5}\n.seal{display:grid;place-items:center;width:160px;height:160px;margin:6px auto 14px;text-align:center;background:radial-gradient(circle at 35% 30%,#ffe066,#ffb020 70%);border:4px solid #fff;border-radius:50%;box-shadow:0 7px 0 #e59400,0 0 0 8px rgba(255,194,26,.25)}\n.seal b{display:block;font-family:var(--ui);font-size:40px;font-weight:800;color:#7a4a00}\n.seal span{font-family:var(--ui);font-size:11px;font-weight:800;color:#7a4a00}\n\n/* низ */\n.foot{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;\n  padding:12px max(18px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));background:rgba(255,255,255,.96);border-top:2px solid var(--line)}\n.foot .mid{font-family:var(--ui);font-size:13px;font-weight:700;color:var(--ink-soft)}\n.toast{position:fixed;left:50%;bottom:92px;z-index:50;max-width:min(440px,calc(100vw - 32px));padding:12px 18px;font-size:15.5px;font-weight:700;color:#fff;background:var(--ink);border-radius:16px;box-shadow:0 5px 0 rgba(0,0,0,.2);transform:translate(-50%,14px);opacity:0;transition:.25s;pointer-events:none}\n.toast.show{opacity:1;transform:translate(-50%,0)}\n.pop{animation:pop .4s cubic-bezier(.2,1.3,.4,1) both}\n@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}\n.shake{animation:shake .38s linear}\n@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}\n\n@media (max-width:900px){\n  .steps{grid-template-columns:repeat(5,minmax(0,1fr))}\n  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}\n  .chest{grid-template-columns:repeat(3,minmax(0,1fr))}\n}\n@media (max-width:640px){\n  .wrap{padding:10px 10px 100px}\n  .top{grid-template-columns:1fr;padding:18px 16px;border-radius:20px}\n  .top svg{display:none}\n  .steps{display:flex;overflow-x:auto;gap:8px;padding:2px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:none}\n  .steps::-webkit-scrollbar{display:none}\n  .step{flex:0 0 84px;scroll-snap-align:start}\n  .stage{padding:16px;border-radius:20px}\n  .opts,.grid2,.rule-pair,.talk,.cards{grid-template-columns:1fr}\n  .chest{grid-template-columns:repeat(2,minmax(0,1fr))}\n  .tf,.gline,.gapline{grid-template-columns:1fr}\n  .foot .mid{display:none}\n  .foot .btn{flex:1}\n  input.field,textarea.field{font-size:16px}\n}\n@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}\n\n/* навигация между главами */\n.chapters{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}\n.chapters a{display:inline-flex;align-items:center;min-height:36px;padding:4px 12px;font-family:var(--ui);font-size:13px;font-weight:800;color:#fff;text-decoration:none;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);border-radius:12px}\n.chapters a.on{color:#16324f;background:#ffd36b;border-color:#ffd36b}\n.top-links button{display:inline-flex;align-items:center;min-height:40px;padding:6px 14px;font-family:var(--ui);font-size:13px;font-weight:700;color:#fff;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);border-radius:14px}\n\n\u003c/style>\n\u003cstyle>\n/* Treasure Island · The Navigator's Journal · visual skin v1\n   CSS only. No lesson data, state, IDs or behaviour are modified. */\n@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,500,20,0;9..144,600,20,0;9..144,700,20,0&display=swap');\n\n:root{\n  --ink:#213b40;--ink-soft:#506864;--ink-dim:#667e79;\n  --paper:#fffcf5;--paper-2:#f3ede0;--paper-3:#fffaf0;\n  --line:#d9d0bc;--rule:#e5dcc9;--shadow:#e2d8c6;\n  --tide:#246b73;--brass:#ca9d55;--signal:#ae493c;--moss:#287c59;\n  --deep:#183a41;--accent:#a65f3e;--pad:30px;--r:22px;\n  --ui:\"Nunito\",\"Trebuchet MS\",sans-serif;\n  --story:\"Nunito\",\"Trebuchet MS\",sans-serif;\n  --display:\"Fraunces\",Georgia,\"Times New Roman\",serif;\n}\nhtml{background:#ede5d5;scroll-behavior:smooth}\nbody{\n  color:var(--ink);\n  background:\n    radial-gradient(ellipse at 0% 0%,rgba(190,161,100,.14),transparent 44%),\n    repeating-linear-gradient(0deg,rgba(31,64,66,.018) 0px,rgba(31,64,66,.018) 1px,transparent 1px,transparent 40px),\n    #ede5d5;\n  background-attachment:scroll;\n  font-family:var(--story);font-weight:600;\n}\nh1,h2,h3,.head h2,.cover h1,.top h1,.rail-title,.stage-head h2,.flip .big{\n  font-family:var(--display);\n  font-weight:600;letter-spacing:-.035em;line-height:1.11;\n}\np{line-height:1.58}\nbutton,a,input,textarea,select{accent-color:var(--tide)}\nbutton{transition:background-color .2s,border-color .2s,box-shadow .2s,transform .2s}\n:focus-visible{outline:3px solid #b67941!important;outline-offset:3px}\n::selection{background:#ecd29f;color:#173b40}\n.kicker,.section-k,.rail-mark,.top .mark,.bar-k{\n  font-family:var(--ui);font-size:11px;font-weight:800;\n  text-transform:uppercase;letter-spacing:.16em;color:var(--accent);\n}\n.stamp,.count,.skill,.xp-rank{border-radius:4px;background:var(--deep);color:#fff}\n.btn,.bar-btn,.opt,.step,.tab,.tile,.mode,.menu button,.chip,.set button,\n.card,.flip,.slab,.scene,.stage,.folio,.back,.sets button{\n  -webkit-tap-highlight-color:transparent;\n}\n.btn,.bar-btn,.back,.menu button,.opts .opt,.mode,.tile,.sets button,.chip,.card,\n.step,.item,.link,.gline,.tf,.flip{\n  box-shadow:0 3px 0 rgba(38,69,67,.10);\n}\n.btn{\n  background:var(--tide);border:1px solid #1d555c;border-radius:12px;\n  box-shadow:0 4px 0 #194d54;color:#fff;letter-spacing:.01em;\n}\n.btn:hover:not(:disabled){filter:brightness(1.08)}\n.btn.ghost{color:var(--deep);background:#fffaf0;border:1px solid var(--line);\n  box-shadow:0 3px 0 #d4c9b3}\n.btn.go,.btn.warm,.btn.flag,.btn.warn{background:var(--accent);border-color:#85482e;box-shadow:0 4px 0 #81472f}\n.btn.go{background:var(--tide);border-color:#1d555c;box-shadow:0 4px 0 #194d54}\n.btn:disabled{filter:grayscale(.4);opacity:.55}\ninput.field,textarea.field,select.field,.field{\n  color:var(--ink);background:#fffdfa;border:1.5px solid #cfc4ae;border-radius:11px;\n  box-shadow:inset 0 2px 2px rgba(45,59,50,.03);\n}\n.field:focus{outline:2px solid rgba(36,107,115,.23);border-color:var(--tide);background:#fff}\na{color:var(--tide);text-underline-offset:3px}\n.note,.note-ru,.frame,.mono-note{color:var(--ink-soft)}\n.note,.note-ru{background:#f3ead9;border-left:3px solid #b88e4d;border-radius:6px 12px 12px 6px}\n\n/* Main chapter I–II · explorer's ledger */\n.shell{grid-template-columns:252px minmax(0,1fr)}\n.rail{\n  padding:25px 18px 18px;\n  background:radial-gradient(circle at -25% -20%,#37656b 0%,transparent 45%),#16373f;\n  color:#f6eede;border-right:1px solid #416168;\n}\n.rail-mark{padding:5px 0;background:transparent;color:#e0bb7d}\n.rail-title{font-size:29px;color:#fff6e5;margin-top:14px}\n.rail-sub{color:#b9cac5;font-size:13px;line-height:1.55}\n.rail .gauge-copy{color:#c9d7ce}\n.rail .ink-gauge{height:6px;background:#416066}\n.rail .ink-gauge i{background:linear-gradient(90deg,#ae7c47,#e9c888)}\n.rail .tabs{gap:4px}\n.rail .tab{border-radius:8px;color:#d1dfd7;background:transparent;font-size:14px;box-shadow:none}\n.rail .tab:hover{color:#fff;background:#29515a}\n.rail .tab.on{background:#efd6a8;color:#173b41;box-shadow:none}\n.rail .tab .flag{background:#41666a!important;color:#e3d1ac}\n.rail .tab.on .flag{background:#fff6dc!important}\n.rail .more-ch{border-top:1px solid #4a6869}\n.rail .more-ch span{color:#b8c9c4}\n.rail .more-ch a{color:#f7e8c7;background:#2d5660;border:1px solid #4c7274;border-radius:8px;box-shadow:none}\n.rail .more-ch a.wide{color:#183a41;background:#e7d4ae;border:0;box-shadow:none}\n.sheet{padding-top:22px;background:transparent}\n.sheet .bar{\n  border:1px solid var(--line);border-radius:14px;background:rgba(255,252,245,.96);\n  box-shadow:0 4px 24px rgba(31,56,53,.065);padding:10px 16px;\n}\n.bar-v{font-size:15px;color:var(--deep)}\n.xp-line,.ink-gauge,.meter,.progress .bar{height:6px;background:#dfd3bf}\n.xp-line i,.meter i,.progress .bar i{background:linear-gradient(90deg,#538d81,#b6a06a)}\n.xp-rank{background:#e9dcc4;color:#365758;letter-spacing:.06em}\n.seal-dot.on{color:#c29852;text-shadow:none}\n.bar-btn{font-size:13px;border:1px solid var(--line);border-radius:9px;background:#fbf5e9;box-shadow:none;color:var(--deep)}\n.bar-btn b{background:var(--deep)}\n.page.on{animation:journal-in .35s ease both}\n@keyframes journal-in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}\n.folio{\n  background:var(--paper);border:1px solid var(--line);border-radius:19px;\n  box-shadow:0 12px 32px rgba(36,55,51,.07);padding:var(--pad);\n}\n.folio+.folio{margin-top:18px}\n.folio.has-hero{padding-top:0}\n.folio .head{border-bottom:1px solid #e4dac8}\n.head h2{color:var(--deep);font-size:clamp(29px,3.7vw,46px)}\n.folio .stamp{padding:6px 11px;font-size:11px;text-transform:uppercase;letter-spacing:.09em}\n.hero{\n  background:#385e62;min-height:clamp(260px,32vw,400px);\n  margin-bottom:27px;\n}\n.hero::before{content:\"\";position:absolute;inset:0;z-index:1;\n  background:linear-gradient(90deg,rgba(14,37,42,.64),rgba(14,37,42,.1) 75%),linear-gradient(0deg,rgba(14,37,42,.34),transparent 65%);\n  pointer-events:none;\n}\n.hero .head{\n  z-index:2;max-width:min(580px,100%);padding:20px 24px;\n  background:rgba(20,53,59,.87);border:1px solid rgba(239,218,180,.32);\n  border-radius:10px;box-shadow:none;backdrop-filter:blur(5px);\n}\n.hero .head h2{color:#fff4dc}\n.hero .head .kicker{color:#efd39e}\n.hero .head .stamp{background:#e5cca0;color:#173a40}\n.page.on .hero img{animation:none;transform:none}\n.cover{background:#143b41}\n.cover-art{background:#356b6e}\n.cover-copy{\n  background:rgba(255,250,239,.965);border:1px solid #e1d2b9;\n  border-radius:12px;box-shadow:0 18px 46px rgba(9,32,37,.25);\n}\n.cover h1{color:var(--deep);font-size:clamp(47px,6vw,76px)}\n.cover h1 i{color:var(--accent)}\n.deck{color:#49645d;line-height:1.55}\n.cover-copy .id-box label{letter-spacing:.08em}\n.cover-copy .menu button{border:1px solid var(--line);border-radius:10px;background:#fffdf7;color:var(--deep);box-shadow:0 2px 0 #d6c8b2}\n.cover-copy .menu button.main{background:var(--deep);border-color:var(--deep);color:#fff;box-shadow:0 3px 0 #102b30}\n.cover-copy .menu button.main small{color:#e8dbb9}\n.cast-card{border:1px solid #d5cab5;background:#fffaee;box-shadow:0 4px 18px rgba(21,48,51,.14);border-radius:11px}\n.cast-card span{color:#6d6257}\n.folio .slab,.folio .rule,.folio .write,.folio .scene-panel{\n  background:#f7f0e3;border-color:#e5dac5;border-radius:13px;\n}\n.folio .scene{border:1px solid #d3c4aa;border-radius:14px}\n.folio .opts .opt,.folio .tile,.folio .item{\n  background:#fffdf7;border:1px solid #d8cbb6;border-radius:11px;color:var(--deep);\n}\n.folio .opt:hover,.folio .tile:hover{border-color:#9b7646}\n.folio .opt.pick,.folio .tile.sel{background:#e6d3b0;border-color:#bb9359;color:#173940}\n.folio .opt.pick::before{color:#fff;background:#285a62}\n.folio .opt.right,.folio .opt.hit{color:#fff;background:#287c59;border-color:#287c59}\n.folio .opt.wrong,.folio .opt.miss{color:#fff;background:var(--signal);border-color:var(--signal)}\n.folio .cards{gap:12px}\n.folio .card{--c:#9c7856!important;border:1px solid #dfd0b8;background:#fffaf0;border-radius:12px;box-shadow:0 3px 0 #e7d9c4}\n.folio .card:nth-child(2n){--c:#4a7977!important}\n.folio .card.done{background:#e6f1e7;border-color:#8db39b}\n.folio .card .tagline{background:var(--deep)}\n.folio .talk,.talk{\n  background:linear-gradient(125deg,#204950,#12333b);box-shadow:0 5px 0 #0e2b31;\n  border:1px solid #547070;border-radius:14px;\n}\n.folio .talk-card,.talk-card{background:#fffaf0;border-radius:10px;box-shadow:none}\n.talk-q::before{content:\"\"}\n.twist{background:#f2e1bd;color:#62491d;border-radius:6px}\n.foot{background:rgba(255,251,242,.97);border-top:1px solid #d8cbb6;box-shadow:0 -8px 20px rgba(24,58,65,.045);left:252px}\n.foot .btn{background:var(--tide);border-color:#1d555c;box-shadow:0 4px 0 #194d54}\n.foot .btn.ghost{background:#fffaf0;color:var(--deep);border:1px solid #d7cab4;box-shadow:0 3px 0 #d7cab4}\n\n/* Chapter III–V and the A2 vocabulary room */\n.wrap{max-width:1130px;padding:26px 22px 110px}\n.wrap .top{\n  color:#fff2d6;\n  background:radial-gradient(circle at 96% 10%,rgba(220,173,102,.19),transparent 42%),\n    linear-gradient(135deg,#153942,#245158);\n  border:1px solid #3d6768;border-radius:18px;box-shadow:0 10px 30px rgba(18,49,50,.16);\n  padding:30px 34px;\n}\n.wrap .top::before{opacity:.45}\n.wrap .top h1{font-size:clamp(34px,5vw,61px);color:#fff7e5}\n.wrap .top h1 i{font-family:var(--display);color:#dfbb7d;font-size:.58em}\n.wrap .top p,.wrap .top .total{color:#d5e3db}\n.wrap .top .total b{color:#edd09a}\n.wrap .top .mark{padding:4px 0;border-radius:0;background:transparent;color:#e3c18b}\n.wrap .top .top-links a,.wrap .top .back{color:#fff1d4;border:1px solid #698585;border-radius:8px;background:#2e5960;box-shadow:none}\n.wrap .top .progress{color:#d5e3db}\n.wrap .steps{gap:6px;margin-top:19px}\n.wrap .step{background:rgba(255,251,241,.9);border:1px solid var(--line);border-radius:10px;box-shadow:none}\n.wrap .step b{background:#d1c0a3;color:#1b4448}\n.wrap .step span{color:#516c68}\n.wrap .step.done b{background:var(--moss);color:#fff}\n.wrap .step.on{background:#1c4850;border-color:#1c4850;box-shadow:none}\n.wrap .step.on span{color:#fff}\n.wrap .step.on b{background:#dfc187;color:#24434a}\n.wrap .stage{background:#fffdf7;border:1px solid var(--line);border-radius:17px;\n  box-shadow:0 12px 32px rgba(36,55,51,.07);padding:30px}\n.wrap .stage .head,.stage-head{border-bottom:1px solid #e5dbc9}\n.wrap .stage h2,.stage-head h2{color:var(--deep)}\n.wrap .stage .slab,.wrap .stage .rule,.hw-part{\n  background:#f7f0e4;border:1px solid #e4d7c1;border-radius:12px;\n}\n.wrap .stage .opt,.wrap .stage .tile,.wrap .stage .item,.wrap .stage .chip,\n.wrap .stage .mode,.wrap .stage .sets button,.wrap .stage .flip{\n  border:1px solid #ded1bc;border-radius:11px;background:#fffdf7;color:var(--ink);\n}\n.wrap .stage .opt:hover,.wrap .stage .mode:hover{border-color:#ad8254}\n.wrap .stage .opt.pick,.wrap .stage .mode.on,.wrap .stage .sets button.on{\n  background:#245963;color:#fff;border-color:#245963;box-shadow:0 3px 0 #1a414a;\n}\n.wrap .stage .opt.hit,.wrap .stage .tile.good{background:var(--moss);color:#fff;border-color:var(--moss)}\n.wrap .stage .opt.miss,.wrap .stage .tile.bad{background:var(--signal);color:#fff;border-color:var(--signal)}\n.wrap .stage .card{--c:#9c7856!important;border:1px solid #ded1bc;background:#fffaf0;border-radius:11px}\n.wrap .stage .card:nth-child(2n){--c:#4a7977!important}\n.wrap .stage .flip{background:#fffaf0}\n.wrap .stage .flip .big{color:var(--deep)}\n.wrap .stage .talk{background:#204950}\n.wrap .stage .note{background:#f2e7d2}\n.wrap .stage .count{background:#173b41;color:#fff}\n.wrap .stage .stamp{background:#173b41;color:#fff}\n.wrap .stage .form{background:#376c71;color:#fff}\n.wrap .stage .rule.evt{background:#f2e3d4;border-color:#dac4ab}\n.wrap .stage .link,.wrap .stage .tf,.wrap .stage .gline,.wrap .stage .write{\n  border:1px solid #ded1bc;border-radius:11px;background:#fffdf7;box-shadow:none;\n}\n.wrap .stage .check input{accent-color:var(--tide)}\n.wrap .modes,.wrap .sets,.wrap .chips{gap:10px}\n.wrap .modes .mode i{background:#efe5d3;border-radius:7px}\n.wrap .modes .mode.on span{color:#f3e8d5}\n.wrap .section-k{margin-top:30px;color:#745b3d}\n.wrap .letter{background:#f1ddb3;border-color:#ceac6f;border-radius:9px;box-shadow:0 3px 0 #b58c53}\n.wrap .ear{background:#306974;box-shadow:0 5px 0 #183f48,0 0 0 7px rgba(36,107,115,.15)}\n\n/* Mobile reading comfort & safe areas */\n@media(max-width:1000px){\n  .shell{display:block}\n  .mob{background:#173b42;color:#fff3de;border-bottom:1px solid #4c6d70}\n  .mob b{font-family:var(--display);font-weight:600}\n  .mob span{color:#c1d2c9}\n  .mob button{background:#e1c18c;color:#163940;border:0;border-radius:8px;box-shadow:none}\n  #mobSet{background:#fff5df!important;border-color:#d9c7a4!important;color:#163940!important;box-shadow:none!important}\n  .mobnav{background:#183b42;border-color:#426269}\n  .mobnav .tab{color:#eff2e9;background:transparent;box-shadow:none}\n  .mobnav .tab.on{color:#203d40;background:#e5c68c;box-shadow:none}\n  .mobnav .more-ch span{color:#d3ded4}\n  .mobnav .more-ch a{background:#2b5861;color:#fff}\n  .sheet{padding:14px 13px 105px}\n  .foot{left:0}\n  .cover-copy{margin:-32px 12px 16px}\n}\n@media(max-width:650px){\n  body{font-size:16px}\n  .wrap{padding:12px 11px 58px}\n  .wrap .top{padding:21px 18px;border-radius:14px;gap:12px}\n  .wrap .top h1{font-size:clamp(32px,8vw,44px)}\n  .wrap .top svg{max-width:190px}\n  .wrap .stage{padding:19px 15px;border-radius:13px;margin-top:15px}\n  .wrap .steps{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}\n  .wrap .step{min-height:64px;padding:7px 2px}\n  .wrap .step span{font-size:10px}\n  .sheet{padding:10px 10px calc(96px + env(safe-area-inset-bottom))}\n  .sheet .bar{padding:11px;border-radius:11px}\n  .folio{border-radius:13px}\n  .hero{min-height:220px;padding:12px}\n  .hero .head{padding:12px 13px;border-radius:8px}\n  .hero .head h2{font-size:26px}\n  .cover{background:#163c44}\n  .cover-copy{margin:-25px 10px 15px;padding:23px 19px;border-radius:10px}\n  .cover h1{font-size:clamp(39px,10vw,54px)}\n  .cast-wrap{margin:0 10px 17px}\n  .cast-card{border-radius:8px}\n  .mob{padding-top:max(10px,env(safe-area-inset-top))}\n  .mobnav .tab{min-height:44px}\n  .folio .slab,.folio .scene-panel{padding:15px}\n  .foot{padding-bottom:max(12px,env(safe-area-inset-bottom));gap:8px}\n  .btn,.opt,.bar-btn,.step,.mode,.chip,.tile,.letter,.sets button{min-height:44px}\n  .field,input,textarea,select{font-size:16px!important}\n}\n@media(prefers-reduced-motion:reduce){\n  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"app\">\u003c/div>\n\u003cscript>\n/* Английская озвучка для всех страниц урока.\n   Браузер сам по себе часто читает английский русским голосом или\n   голосом-«шуткой» (на Mac: Albert, Bad News…). Здесь выбираем лучший\n   доступный английский голос, даём выбрать его вручную и держим скорость\n   в диапазоне, где речь не ломается. */\n(() => {\n'use strict';\n\nconst synth = 'speechSynthesis' in window ? window.speechSynthesis : null;\nconst PREF = 'tts-voice-v1';\nconst SAMPLE = 'Jim had to keep an eye out for a sailor with one leg.';\n\n/* голоса-эффекты macOS и роботизированные Eloquence */\nconst NOVELTY = /^(albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|pipe organ|superstar|trinoids|whisper|wobble|zarvox|deranged|hysterical|fred|junior|ralph|kathy|princess)\\b/i;\nconst ROBOTIC = /^(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley)\\b/i;\nconst NICE = /(samantha|daniel|serena|kate|oliver|arthur|martha|karen|moira|tessa|libby|sonia|ryan|aria|jenny|guy|hazel|susan|george|google uk english|google us english)/i;\nconst HQ = /(natural|neural|premium|enhanced|online)/i;\n\nlet voices = [];\nfunction load(){ if(synth) voices = synth.getVoices() || []; return voices; }\nif(synth){\n  load();\n  if(typeof synth.addEventListener === 'function') synth.addEventListener('voiceschanged', () => { load(); refreshPicker(); });\n  else synth.onvoiceschanged = () => { load(); refreshPicker(); };\n}\n\nfunction score(v){\n  const lang = (v.lang || '').replace('_', '-').toLowerCase();\n  if(!lang.startsWith('en')) return -1;\n  const name = v.name || '';\n  if(NOVELTY.test(name)) return -1;\n  let s = 10;\n  if(ROBOTIC.test(name)) s -= 30;\n  if(HQ.test(name)) s += 50;\n  if(NICE.test(name)) s += 40;\n  if(/^microsoft .* desktop/i.test(name)) s += 5;\n  if(lang === 'en-gb') s += 20; else if(lang === 'en-us') s += 15; else s += 5;\n  return s;\n}\nfunction english(){\n  return load().filter(v => score(v) > -1).sort((a, b) => score(b) - score(a));\n}\nfunction current(){\n  const list = english();\n  let pref = '';\n  try { pref = localStorage.getItem(PREF) || ''; } catch(e){}\n  return list.find(v => v.voiceURI === pref || v.name === pref) || list[0] || null;\n}\n\nlet warned = false;\nfunction notice(msg){\n  const t = document.getElementById('toast');\n  if(t){ t.textContent = msg; t.classList.add('show'); clearTimeout(notice._t); notice._t = setTimeout(() => t.classList.remove('show'), 3200); }\n}\n\n/* rate: 1 — обычная речь; всё ниже .7 у большинства голосов звучит «сломанно» */\nfunction speak(text, rate, voiceOverride){\n  if(!synth){ notice('В этом браузере нет озвучки. Попробуйте Chrome, Edge или Safari.'); return false; }\n  const v = voiceOverride || current();\n  if(!v && !warned){ warned = true; notice('На устройстве нет английского голоса — нажмите «🔊 Голос», там инструкция.'); }\n  synth.cancel();\n  const u = new SpeechSynthesisUtterance(String(text));\n  if(v){ u.voice = v; u.lang = v.lang; } else u.lang = 'en-GB';\n  const r = Number(rate) || .9;\n  u.rate = Math.min(1.05, Math.max(.72, r \u003c .75 ? .72 : r + .08));\n  u.pitch = 1;\n  window.__ttsUtterance = u;           /* Chrome иначе может собрать фразу сборщиком мусора и оборвать её */\n  setTimeout(() => synth.speak(u), 50); /* Chrome теряет фразу, если speak вызвать сразу после cancel */\n  return true;\n}\n\n/* Длинный текст читаем по предложениям: Chrome обрывает одну длинную фразу\n   примерно через 15 секунд. onEach(i) вызывается в начале каждого предложения. */\nlet queueId = 0;\nfunction speakQueue(list, rate, onEach, onDone){\n  if(!synth){ notice('В этом браузере нет озвучки. Попробуйте Chrome, Edge или Safari.'); return false; }\n  const v = current(), id = ++queueId;\n  if(!v && !warned){ warned = true; notice('На устройстве нет английского голоса — нажмите «🔊 Голос», там инструкция.'); }\n  synth.cancel();\n  const r = Number(rate) || .9;\n  const us = list.map((text, i) => {\n    const u = new SpeechSynthesisUtterance(String(text));\n    if(v){ u.voice = v; u.lang = v.lang; } else u.lang = 'en-GB';\n    u.rate = Math.min(1.05, Math.max(.72, r \u003c .75 ? .72 : r + .08)); u.pitch = 1;\n    u.onstart = () => { if(id === queueId && onEach) onEach(i); };\n    if(i === list.length - 1) u.onend = () => { if(id === queueId && onDone) onDone(); };\n    return u;\n  });\n  window.__ttsUtterance = us;\n  setTimeout(() => us.forEach(u => synth.speak(u)), 50);\n  return true;\n}\nfunction stop(){ queueId++; if(synth) synth.cancel(); }\n\n/* ---------- окно выбора голоса ---------- */\nlet box = null;\nfunction css(){\n  if(document.getElementById('tts-style')) return;\n  const st = document.createElement('style'); st.id = 'tts-style';\n  st.textContent =\n    '.tts-bg{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center;background:rgba(35,58,87,.45)}' +\n    '.tts-bg.open{display:flex}' +\n    '.tts{width:min(560px,100%);max-height:88vh;overflow-y:auto;padding:22px 18px calc(22px + env(safe-area-inset-bottom));color:#233a57;background:#f4f9ff;border-radius:26px 26px 0 0;font-family:Nunito,\"Trebuchet MS\",sans-serif;font-weight:600}' +\n    '@media (min-width:640px){.tts-bg{align-items:center}.tts{border-radius:26px}}' +\n    '.tts h2{margin:0;font-family:Rubik,\"Trebuchet MS\",sans-serif;font-size:26px;font-weight:800}' +\n    '.tts p{margin:8px 0;font-size:15px;color:#5d6f88}' +\n    '.tts-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;margin-top:8px;padding:10px 12px;background:#fff;border:2px solid #dbe7f3;border-radius:16px}' +\n    '.tts-row.on{border-color:#4cc25a;background:#eafbe9}' +\n    '.tts-row b{display:block;font-family:Rubik,\"Trebuchet MS\",sans-serif;font-size:15.5px}' +\n    '.tts-row span{font-size:13px;color:#5d6f88}' +\n    '.tts-row em{display:inline-block;margin-left:6px;padding:1px 7px;font-style:normal;font-size:11px;font-weight:800;color:#fff;background:#ffb020;border-radius:999px}' +\n    '.tts button{min-height:40px;padding:6px 12px;font-family:Rubik,\"Trebuchet MS\",sans-serif;font-size:13.5px;font-weight:800;color:#233a57;background:#fff;border:2px solid #dbe7f3;border-radius:12px;cursor:pointer}' +\n    '.tts button.pick{color:#fff;background:#38b6ff;border-color:#38b6ff}' +\n    '.tts .tts-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}' +\n    '.tts details{margin-top:14px;padding:10px 12px;background:#fff8dc;border:2px dashed #f0d27a;border-radius:16px;font-size:14.5px}' +\n    '.tts summary{font-family:Rubik,\"Trebuchet MS\",sans-serif;font-weight:800;color:#b07a00;cursor:pointer}' +\n    '.tts details li{margin:6px 0}' +\n    '.tts .tts-empty{padding:14px;text-align:center;background:#fff0f0;border:2px solid #ffd0d2;border-radius:16px;color:#b82c31}';\n  document.head.appendChild(st);\n}\nfunction rows(){\n  const list = english().slice(0, 14), cur = current();\n  if(!list.length){\n    return '\u003cdiv class=\"tts-empty\">Английских голосов на этом устройстве не найдено. Установите голос по инструкции ниже и перезагрузите страницу.\u003c/div>';\n  }\n  return list.map((v, i) =>\n    '\u003cdiv class=\"tts-row ' + (cur && v.voiceURI === cur.voiceURI ? 'on' : '') + '\">\u003cdiv>\u003cb>' + v.name.replace(/\u003c/g, '&lt;') +\n    (HQ.test(v.name) || NICE.test(v.name) ? '\u003cem>хороший\u003c/em>' : '') + '\u003c/b>\u003cspan>' + v.lang + (v.localService === false ? ' · нужен интернет' : '') + '\u003c/span>\u003c/div>' +\n    '\u003cbutton data-tts-try=\"' + i + '\" aria-label=\"Послушать\">▶\u003c/button>' +\n    '\u003cbutton class=\"' + (cur && v.voiceURI === cur.voiceURI ? 'pick' : '') + '\" data-tts-use=\"' + i + '\">' + (cur && v.voiceURI === cur.voiceURI ? 'выбран' : 'выбрать') + '\u003c/button>\u003c/div>').join('');\n}\nfunction refreshPicker(){\n  if(!box || !box.classList.contains('open')) return;\n  const list = english().slice(0, 14);\n  box.querySelector('#ttsList').innerHTML = rows();\n  box.querySelectorAll('[data-tts-try]').forEach(b => b.addEventListener('click', () => speak(SAMPLE, .9, list[+b.dataset.ttsTry])));\n  box.querySelectorAll('[data-tts-use]').forEach(b => b.addEventListener('click', () => {\n    const v = list[+b.dataset.ttsUse];\n    try { localStorage.setItem(PREF, v.voiceURI || v.name); } catch(e){}\n    speak(SAMPLE, .9, v); refreshPicker();\n  }));\n}\nfunction openPicker(){\n  css();\n  if(!box){\n    box = document.createElement('div');\n    box.className = 'tts-bg';\n    box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true'); box.setAttribute('aria-label', 'Выбор голоса');\n    box.innerHTML = '\u003cdiv class=\"tts\">\u003cdiv class=\"tts-head\">\u003cdiv>\u003ch2>Английский голос\u003c/h2>' +\n      '\u003cp>Нажми ▶, чтобы послушать, и выбери голос, который звучит естественно. Лучшие стоят сверху и помечены «хороший».\u003c/p>\u003c/div>' +\n      '\u003cbutton data-tts-close>Закрыть\u003c/button>\u003c/div>\u003cdiv id=\"ttsList\">\u003c/div>' +\n      '\u003cdetails>\u003csummary>Голос звучит плохо или его нет?\u003c/summary>\u003cul>' +\n      '\u003cli>\u003cb>iPhone / iPad:\u003c/b> Настройки → Универсальный доступ → Устный контент → Голоса → Английский → скачайте голос с пометкой «улучшенный» или «премиум» (например, Serena, Daniel, Samantha).\u003c/li>' +\n      '\u003cli>\u003cb>Mac:\u003c/b> Системные настройки → Универсальный доступ → Устный контент → Системный голос → Управлять голосами → English.\u003c/li>' +\n      '\u003cli>\u003cb>Windows:\u003c/b> откройте урок в Microsoft Edge — там есть естественные голоса (Libby, Sonia, Ryan).\u003c/li>' +\n      '\u003cli>\u003cb>Android:\u003c/b> Настройки → Специальные возможности → Синтез речи → Синтезатор Google → установите английский язык.\u003c/li>' +\n      '\u003cli>После установки перезагрузите страницу.\u003c/li>\u003c/ul>\u003c/details>\u003c/div>';\n    document.body.appendChild(box);\n    box.addEventListener('click', e => { if(e.target === box || e.target.closest('[data-tts-close]')) box.classList.remove('open'); });\n    document.addEventListener('keydown', e => { if(e.key === 'Escape') box.classList.remove('open'); });\n  }\n  load();\n  box.classList.add('open');\n  refreshPicker();\n}\n\nwindow.TTS = { speak, speakQueue, stop, openPicker, current, available: () => !!synth };\n})();\n\n\u003c/script>\n\u003cscript>\n/* Глава V · The Last of the Blind Man — тексты и ответы. Движок: chapter-kit.js */\nconst PASTPERF = /\\bhad (already |just |never |not )?([a-z]+ed|been|gone|done|seen|taken|left|run|hidden|found|come|become|got|gotten|put|lost|told|said|heard|known|eaten|written|given|stolen|broken|fallen|thrown|caught|brought|bought|thought|felt|kept|slept|sat|stood|won|begun|drunk|forgotten|ridden|driven|woken|worn|flown|grown|shown|made|had|read|met|held|sent|spent|built|lent|meant|led|fled|hit|cut|shut|set|let)\\b/;\nwindow.CHAPTER = {\n  key:'benbow-ch5-v1', num:'V',\n  title:'The Last of the Blind Man', titleRu:'Конец слепого',\n  intro:'Десять часов. Мама без сил лежит под мостом, у Джима за пазухой свёрток капитана, а к трактиру бегут пираты. Девять заданий на урок — от прогноза до рассказа Джима доктору — и домашнее задание.',\n  art:`\u003csvg viewBox=\"0 0 230 170\" role=\"img\" aria-label=\"Каменный мост над ручьём ночью, луна и фонарь\">\n      \u003ccircle cx=\"184\" cy=\"40\" r=\"24\" fill=\"#f6ead0\" opacity=\".9\"/>\n      \u003ccircle cx=\"176\" cy=\"34\" r=\"24\" fill=\"#23476e\" opacity=\".85\"/>\n      \u003cpath d=\"M0 132 q60 -10 115 0 t115 0 V170 H0z\" fill=\"#16324f\"/>\n      \u003cpath d=\"M10 140 q30 -6 60 0 M120 146 q30 -6 60 0\" stroke=\"#7fa8a0\" stroke-width=\"2\" fill=\"none\" opacity=\".6\"/>\n      \u003cpath d=\"M14 132 V96 H216 V132 H176 Q176 104 115 104 Q54 104 54 132 Z\" fill=\"#8a8f98\" stroke=\"#3d4450\" stroke-width=\"3\"/>\n      \u003cpath d=\"M14 96 H216\" stroke=\"#3d4450\" stroke-width=\"5\"/>\n      \u003cpath d=\"M40 96 v-8 M80 96 v-8 M120 96 v-8 M160 96 v-8 M200 96 v-8\" stroke=\"#3d4450\" stroke-width=\"3\"/>\n      \u003cg transform=\"translate(150 62)\">\n        \u003cpath d=\"M0 0 h14 v20 h-14z\" fill=\"#ffd36b\" stroke=\"#6b4423\" stroke-width=\"2\"/>\n        \u003cpath d=\"M-2 0 h18 M7 -6 v6\" stroke=\"#6b4423\" stroke-width=\"2\"/>\n        \u003ccircle cx=\"7\" cy=\"10\" r=\"16\" fill=\"#ffd36b\" opacity=\".2\"/>\n      \u003c/g>\n      \u003cpath d=\"M44 86 l6 -16 l6 16 M47 78 h6\" stroke=\"#f6ead0\" stroke-width=\"2\" fill=\"none\" opacity=\".7\"/>\n    \u003c/svg>`,\n  steps:[\n    { short:'Прогноз',    kicker:'до чтения',        title:'Who will come tonight?',  min:'5 минут' },\n    { short:'Слова',      kicker:'лексика',          title:'Words to take with you',  min:'10 минут' },\n    { short:'Цепь',       kicker:'после чтения',     title:'Rebuild the attack',      min:'7 минут' },\n    { short:'Правда?',    kicker:'понимание',        title:'True or false?',          min:'6 минут' },\n    { short:'Кто был?',   kicker:'детали',           title:'Who was on the road?',    min:'5 минут' },\n    { short:'Грамматика', kicker:'Past Perfect',     title:'The packet had gone',     min:'10 минут' },\n    { short:'Разговор',   kicker:'говорение',        title:'Who is to blame?',        min:'10 минут' },\n    { short:'Рассказ',    kicker:'письмо',           title:'Jim’s report',            min:'12 минут' },\n    { short:'Финал',      kicker:'проверка',         title:'Close the case',          min:'5 минут' },\n    { short:'Домашка',    kicker:'домашнее задание', title:'Homework: the packet',    min:'30–40 минут' }\n  ],\n  recap:{\n    pickN:3,\n    html:'\u003cb>Что было в главе IV.\u003c/b> Джим и мама вернулись в трактир, открыли сундук капитана и стали отсчитывать то, что он им был должен. Услышав палку слепого у двери и свист на холме, они убежали: мама унесла часть денег, Джим — свёрток в промасленной ткани. У моста маме стало плохо, и Джим спрятал её под мостом.',\n    task:'Сейчас около десяти вечера. \u003cb>Кто появится на дороге этой ночью?\u003c/b> Выбери троих. После чтения проверишь себя в задании 5.',\n    doneText:'Прогноз записан. Теперь читай главу V и проверь себя в задании 5.',\n    frame:'“I think … will come because …” / “I don’t think … will come because …”',\n    teach:'Прогноз держит интерес к тексту. Спросите: “What would you do if you were Jim: stay under the bridge or go and watch?” — и вернитесь к этому вопросу после чтения.'\n  },\n  words:{\n    items:[\n      { id:'curious', en:'be curious',              ru:'быть любопытным',             ex:'Jim was too curious to stay under the bridge.' },\n      { id:'hide',    en:'hide behind',             ru:'прятаться за',                ex:'He hid behind a bush near the road.' },\n      { id:'door',    en:'break down the door',     ru:'выломать дверь',              ex:'“Break down the door!” shouted the blind man.' },\n      { id:'search',  en:'search for',              ru:'искать, обыскивать',          ex:'The pirates searched the house for the papers.' },\n      { id:'upside',  en:'turn something upside down', ru:'перевернуть вверх дном',  ex:'They turned the whole inn upside down.' },\n      { id:'behind',  en:'leave somebody behind',   ru:'бросить, оставить кого-то',   ex:'His friends ran away and left the blind man behind.' },\n      { id:'knock',   en:'be knocked down',         ru:'быть сбитым с ног',           ex:'The blind man was knocked down by a horse.' },\n      { id:'time',    en:'just in time',            ru:'как раз вовремя',             ex:'The officers arrived just in time.' }\n    ],\n    ballast:'lugger — люггер, небольшое парусное судно · revenue officers — таможенники · supervisor — начальник · bank — склон, берег ручья · lookout — дозорный · hoofs — копыта · gallop — скакать галопом.'\n  },\n  events:[\n    'Jim leaves his mother under the bridge and hides behind a bush to watch.',\n    'Seven or eight men run towards the inn, and the blind man is with them.',\n    'They find the door open and the captain dead on the floor.',\n    'They search the chest, but the packet of papers is gone.',\n    'The blind man shouts at them to find Jim and his mother.',\n    'They hear a whistle and the sound of horses, and the pirates run away.',\n    'The pirates leave the blind man behind, and a horse knocks him down.',\n    'Mr Dance and his officers arrive, and Jim decides to take the packet to Dr Livesey.'\n  ],\n  order0:[4,0,6,2,7,1,5,3],\n  chainHint:'Подсказка: сначала Джим прячется, потом пираты в доме; лошади и гибель слепого — в самом конце, а Джим уезжает к доктору последним.',\n  truth:[\n    { t:'Jim stayed under the bridge with his mother all the time.', a:false, why:'Любопытство победило страх: Джим выбрался и спрятался за кустом, чтобы видеть трактир.' },\n    { t:'The blind man came to the inn with the other pirates.', a:true, why:'Да: он бежал вместе с ними и командовал.' },\n    { t:'The pirates found the money in the captain’s chest.', a:true, why:'Да: деньги были на месте, но пиратам нужны были не они.' },\n    { t:'The pirates were really looking for the packet of papers.', a:true, why:'Да: слепой был в ярости, когда понял, что свёртка нет.' },\n    { t:'The other pirates stayed to protect the blind man.', a:false, why:'Нет: услышав лошадей, они разбежались и бросили его.' },\n    { t:'The blind man was knocked down by a horse.', a:true, why:'Да: в панике он выбежал прямо под копыта.' },\n    { t:'The officers caught the pirates’ ship.', a:false, why:'Нет: судно пиратов ушло в море.' },\n    { t:'Jim decided to give the packet to Mr Dance.', a:false, why:'Нет: Джим решил отвезти свёрток доктору Ливси, и мистер Данс взялся его проводить.' }\n  ],\n  pick:{\n    task:'Кто \u003cb>действительно был\u003c/b> у трактира и на дороге в эту ночь? Нажми на всех. Четверо здесь лишние.',\n    checkLabel:'Проверить',\n    items:[\n      { id:'pew',     icon:'🦯', en:'the blind man',          ru:'слепой нищий',               in:true },\n      { id:'jim',     icon:'🧒', en:'Jim',                    ru:'Джим',                       in:true },\n      { id:'livesey', icon:'👨‍⚕️', en:'Dr Livesey',            ru:'доктор Ливси',               in:false },\n      { id:'pirates', icon:'🏴‍☠️', en:'seven or eight pirates', ru:'семь-восемь пиратов',       in:true },\n      { id:'mother',  icon:'👩', en:'Jim’s mother',           ru:'мама Джима',                 in:true },\n      { id:'silver',  icon:'🦜', en:'Long John Silver',       ru:'Долговязый Джон Сильвер',    in:false },\n      { id:'dance',   icon:'🎖️', en:'Mr Dance',               ru:'мистер Данс, начальник таможенников', in:true },\n      { id:'squire',  icon:'🎩', en:'Squire Trelawney',       ru:'сквайр Трелони',             in:false },\n      { id:'riders',  icon:'🐎', en:'officers on horses',     ru:'таможенники верхом',         in:true },\n      { id:'captain', icon:'⚓', en:'the captain, alive',     ru:'капитан — живой',            in:false }\n    ],\n    extra:'Доктор Ливси и сквайр Трелони появятся в главе VI, Сильвер — ещё позже. А капитан, увы, лежал мёртвым на полу.',\n    frame:'“There was / were … on the road, but there wasn’t …” / “I was right / wrong about …”',\n    teach:'Задание повторяет there was / there were. Попросите перечислить героев по памяти и сказать, что каждый делал в ту ночь: “Jim was hiding behind a bush…”'\n  },\n  gram:{\n    rules:'\u003cdiv class=\"rule-pair\">\u003cdiv class=\"rule\">\u003ch3>Что случилось раньше\u003c/h3>\u003cspan class=\"form\">had + третья форма\u003c/span>' +\n      '\u003cp>When the pirates opened the chest, Jim \u003cb>had\u003c/b> already \u003cb>taken\u003c/b> the packet.\u003c/p>\u003c/div>' +\n      '\u003cdiv class=\"rule evt\">\u003ch3>Что случилось потом\u003c/h3>\u003cspan class=\"form\">Past Simple\u003c/span>' +\n      '\u003cp>The pirates \u003cb>opened\u003c/b> the chest and \u003cb>shouted\u003c/b> with anger.\u003c/p>\u003c/div>\u003c/div>' +\n      '\u003cp class=\"note\" style=\"margin-bottom:18px\">Past Perfect нужен, когда мы рассказываем о прошлом и «отматываем назад»: \u003cb>had + третья форма\u003c/b>. Если события идут по порядку (сначала… потом…) — хватает Past Simple. Сигналы: \u003cb>by the time, already, before, after\u003c/b>.\u003c/p>',\n    items:[\n      { pre:'When the pirates opened the chest, Jim', opts:['had already taken','already took'], post:'the packet.', a:0, why:'Джим взял свёрток раньше, чем пираты открыли сундук, — had taken.' },\n      { pre:'Mr Dance arrived after the pirates', opts:['ran away','had run away'], post:'.', a:1, why:'Сначала пираты убежали, потом приехал Данс — had run away.' },\n      { pre:'The pirates', opts:['searched','had searched'], post:'the house, and then they heard the horses.', a:0, why:'События по порядку (and then) — Past Simple.' },\n      { pre:'The blind man didn’t understand that his friends', opts:['had left','left'], post:'him alone on the road.', a:0, why:'Они ушли раньше, чем он это понял, — had left.' },\n      { pre:'By the time the officers reached the sea, the ship', opts:['sailed','had sailed'], post:'away.', a:1, why:'By the time — сигнал Past Perfect: корабль ушёл раньше.' },\n      { pre:'Jim', opts:['hid','had hidden'], post:'behind a bush and watched the men.', a:0, why:'Цепочка действий по порядку — Past Simple.' }\n    ],\n    writeTask:'Два предложения с \u003cb>had + третья форма\u003c/b>: одно о главе, одно о себе.',\n    writes:[\n      { label:'Соедини: “Jim took the packet. Later the pirates opened the chest.” → When the pirates opened the chest, …', model:'When the pirates opened the chest, Jim had already taken the packet.', minWords:6,\n        checks:[{ re:/\\bhad (already |just )?taken\\b/, miss:'нужно had taken' }, { re:/\\bwhen\\b/, miss:'нет when' }] },\n      { label:'О себе: “When I got home yesterday, … had …”', model:'When I got home yesterday, my sister had already eaten all the cake.', minWords:6,\n        checks:[{ re:PASTPERF, miss:'нет had + третья форма' }, { re:/\\b(when|by the time|before|after)\\b/, miss:'нет when / by the time / before / after' }] }\n    ],\n    teach:'Цель узкая: «отмотать назад» в рассказе. Нарисуйте на доске линию времени ночи: Джим берёт свёрток → пираты открывают сундук. Устно: “What had happened before the officers arrived?”'\n  },\n  talk:{\n    intro:'Пираты бросили слепого на дороге, и он погиб под копытами. \u003cb>Кто виноват?\u003c/b>',\n    votes:[['pew','Сам слепой','он был жестоким и сам выбежал на дорогу'],['crew','Другие пираты','они бросили товарища'],['nobody','Никто','это несчастный случай']],\n    qs:[\n      'Was Jim brave or foolish to come back and watch the pirates?',\n      'Did the blind man deserve what happened to him? Why or why not?',\n      'Why did the pirates run away instead of fighting the officers?',\n      'Why does Jim want to give the packet to Dr Livesey and not to Mr Dance?',\n      'What do you think is inside the packet, and why is it so important?'\n    ],\n    tw:['Ответь за 30 секунд.','Используй три выражения из задания 2.','Говори от лица слепого.','Добавь одно предложение в Past Perfect.','Поспорь со своим первым ответом.'],\n    frame:'\u003cb>A2:\u003c/b> “I think … is to blame because …” · \u003cb>B1:\u003c/b> “By the time the officers arrived, the pirates had …, so …”',\n    checks:['вывод назван прямо','деталь из главы','три выражения из задания 2','одно предложение в Past Perfect'],\n    teach:'Тема вины даёт повод для спора. Для сильного B1 можно ввести “They shouldn’t have left him”. Сначала беглость, потом один комментарий по содержанию и один по языку.'\n  },\n  diary:{\n    task:'Ты — Джим. Ночью ты приезжаешь к доктору Ливси и рассказываешь, что случилось. Напиши этот рассказ: \u003cb>50–90 слов\u003c/b>, минимум \u003cb>четыре выражения\u003c/b> из задания 2 и \u003cb>одно предложение в Past Perfect\u003c/b> (had + третья форма). Подсветка ниже загорается сама.',\n    placeholder:'Doctor, you won’t believe what happened tonight…',\n    targets:[\n      { id:'curious', label:'curious',             re:/\\bcurious\\b/ },\n      { id:'hide',    label:'hid behind',          re:/\\b(hid|hide|hides|hiding|hidden) behind\\b/ },\n      { id:'door',    label:'break down the door', re:/\\b(break|broke|broken|breaking) down the door\\b|\\bdown with the door\\b/ },\n      { id:'search',  label:'searched',            re:/\\bsearch(ed|es|ing)?\\b/ },\n      { id:'upside',  label:'upside down',         re:/\\bupside down\\b/ },\n      { id:'behind',  label:'left … behind',       re:/\\b(leave|left|leaves|leaving)\\b[^.!?]*\\bbehind\\b/ },\n      { id:'knock',   label:'knocked down',        re:/\\bknock(ed|s)? (him |her |them )?down\\b/ },\n      { id:'time',    label:'just in time',        re:/\\bjust in time\\b/ }\n    ],\n    hits:4, min:50, max:90,\n    extra:{ re:PASTPERF, label:'Past Perfect', miss:'нет предложения с had + третья форма' },\n    model:'Doctor, you won’t believe what happened tonight! I was too curious to stay under the bridge, so I hid behind a bush and watched the inn. The pirates searched the house and turned it upside down. When they opened the chest, I had already taken the packet. Then they heard horses, ran away and left the blind man behind. He was knocked down by a horse. Mr Dance and his officers arrived just in time. Here is the packet.',\n    teach:'Устное обсуждение (задание 7) лучше провести до письма. Хорошее упражнение после: прочитать рассказ вслух «как доктору» — быстро, взволнованно, но понятно.'\n  },\n  exit:{\n    gaps:[\n      { pre:'Jim was too ', post:' to stay under the bridge.', ok:['curious'] },\n      { pre:'He hid ', post:' a bush near the road.', ok:['behind'] },\n      { pre:'The pirates searched the house ', post:' the papers.', ok:['for'] },\n      { pre:'They turned the whole inn upside ', post:'.', ok:['down'] },\n      { pre:'His friends ran away and left the blind man ', post:'.', ok:['behind'] },\n      { pre:'The blind man was knocked ', post:' by a horse.', ok:['down'] },\n      { pre:'The officers arrived just in ', post:'.', ok:['time'] }\n    ],\n    button:'Закрыть дело', idle:'Дело ещё открыто', passText:'Глава V пройдена — пора к доктору Ливси!',\n    cando:['Я могу пересказать главу V по порядку.','Я могу объяснить, кто виноват в гибели слепого, и поспорить.','Я могу рассказать, что случилось раньше: had + третья форма.'],\n    teach:'5 из 7 и выше — тема закрыта, можно переходить к главе VI. Меньше — повторите задание 2 через сутки и снова сделайте этот лист.'\n  },\n  home:{\n    tr:[\n      { ru:'Джиму было слишком любопытно, чтобы оставаться под мостом.', must:[/\\bcurious\\b/], tip:'too curious to …', model:'Jim was too curious to stay under the bridge.' },\n      { ru:'Он спрятался за кустом.', must:[/\\bhid behind\\b/], tip:'hide → hid behind', model:'He hid behind a bush.' },\n      { ru:'Пираты обыскали весь дом.', must:[/\\bsearched\\b/], tip:'search → searched', model:'The pirates searched the whole house.' },\n      { ru:'Они перевернули трактир вверх дном.', must:[/\\bupside down\\b/], tip:'turn something upside down', model:'They turned the inn upside down.' },\n      { ru:'Друзья бросили слепого.', must:[/\\bleft\\b/, /\\bbehind\\b/], tip:'leave somebody behind → left … behind', model:'His friends left the blind man behind.' },\n      { ru:'Таможенники приехали как раз вовремя.', must:[/\\bjust in time\\b/], tip:'just in time', model:'The officers arrived just in time.' }\n    ],\n    brTitle:'Past Perfect или Past Simple',\n    brNote:'Впиши глагол в нужной форме. Что случилось \u003cb>раньше\u003c/b> — had + третья форма; события по порядку — Past Simple.',\n    br:[\n      { pre:'When the pirates opened the chest, the packet', verb:'already / disappear', post:'.', ok:['had already disappeared'], why:'это случилось раньше' },\n      { pre:'The officers arrived after the pirates', verb:'run', post:'away.', ok:['had run'], why:'сначала убежали — had run' },\n      { pre:'Jim', verb:'hide', post:'behind a bush and watched.', ok:['hid'], why:'события по порядку' },\n      { pre:'By the time I got to the station, the train', verb:'leave', post:'.', ok:['had left'], why:'by the time → had left' },\n      { pre:'She', verb:'never / see', post:'the sea before that holiday.', ok:['had never seen'], why:'опыт до момента в прошлом' },\n      { pre:'We', verb:'finish', post:'dinner and then watched a film.', ok:['finished'], why:'события по порядку' }\n    ],\n    dict:[\n      'Jim was too curious to stay under the bridge.',\n      'The pirates turned the whole inn upside down.',\n      'His friends ran away and left the blind man behind.',\n      'The officers arrived just in time.'\n    ],\n    prompt:{ title:'Что в свёртке?',\n      html:'Джим везёт свёрток доктору Ливси. Напиши прогноз к главе VI: что лежит в свёртке и что с ним сделает доктор.',\n      frames:'I think the packet might be… · It must be important because… · Dr Livesey will probably… · I don’t think…',\n      placeholder:'I think the packet might be…' },\n    checklist:['Прочитать главу VI «The Captain’s Papers» и проверить свой прогноз из части D.',\n      'Пройти тренажёр слов: «Набор 2 → Пропуски» хотя бы на две звезды. \u003ca href=\"a2-words.html\">открыть тренажёр →\u003c/a>',\n      'Рассказать вслух за одну минуту, что случилось в главе V, не глядя в текст.']\n  }\n};\n\u003c/script>\n\u003cscript>\n/* Движок страниц с главами Treasure Island.\n   Каждая страница главы задаёт window.CHAPTER (тексты и ответы),\n   а здесь — шапка, десять заданий, проверки и сохранение прогресса. */\n(() => {\n'use strict';\nconst C = window.CHAPTER;\nconst app = document.getElementById('app');\n\n/* ============ разметка страницы ============ */\nconst NAV = [['III','chapter-3.html'],['IV','chapter-4.html'],['V','chapter-5.html']];\napp.innerHTML =\n  '\u003cdiv class=\"wrap\">\u003cheader class=\"top\">\u003cdiv>' +\n  '\u003cspan class=\"mark\">TREASURE ISLAND · ГЛАВА ' + C.num + '\u003c/span>' +\n  '\u003ch1>' + C.title + '\u003ci>' + C.titleRu + '\u003c/i>\u003c/h1>\u003cp>' + C.intro + '\u003c/p>' +\n  '\u003cdiv class=\"progress\">\u003cspan>Выполнено\u003c/span>\u003cdiv class=\"bar\">\u003ci id=\"progFill\">\u003c/i>\u003c/div>\u003cspan id=\"progText\">0 / 10\u003c/span>\u003c/div>' +\n  '\u003cnav class=\"chapters\" aria-label=\"Главы\">' + NAV.map(([n, href]) => '\u003ca href=\"' + href + '\" class=\"' + (n === C.num ? 'on' : '') + '\">Глава ' + n + '\u003c/a>').join('') + '\u003c/nav>' +\n  '\u003cdiv class=\"top-links\">\u003ca href=\"index.html\">← Главы I–II\u003c/a>\u003ca href=\"a2-words.html\">Тренажёр слов A2\u003c/a>\u003ca href=\"#\" id=\"voiceBtn\" role=\"button\">🔊 Голос\u003c/a>\u003c/div>' +\n  '\u003c/div>' + C.art + '\u003c/header>' +\n  '\u003cnav class=\"steps\" id=\"steps\" aria-label=\"Задания главы ' + C.num + '\">\u003c/nav>' +\n  '\u003cmain class=\"stage\" id=\"stage\" aria-live=\"polite\">\u003c/main>\u003c/div>' +\n  '\u003cdiv class=\"foot\">\u003cbutton class=\"btn ghost\" id=\"prevBtn\">← Назад\u003c/button>\u003cspan class=\"mid\" id=\"footLabel\">\u003c/span>\u003cbutton class=\"btn go\" id=\"nextBtn\">Дальше →\u003c/button>\u003c/div>' +\n  '\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>';\n\n/* ============ состояние ============ */\nlet S = { step:0, done:[], predict:[], order:[], quiz:null, truth:{}, chest:{}, chestChecked:false,\n  gram:{}, gw:[], vote:'', talkQ:0, talkT:-1, req:[], diary:'', gaps:{}, hw:null };\ntry { S = { ...S, ...JSON.parse(localStorage.getItem(C.key) || '{}') }; } catch(e){}\n['done','predict','order','req','gw'].forEach(k => { if(!Array.isArray(S[k])) S[k] = []; });\nwhile(S.gw.length \u003c C.gram.writes.length) S.gw.push('');\nif(S.order.length !== C.events.length) S.order = C.order0.slice();\n['truth','chest','gram','gaps'].forEach(k => { if(!S[k] || typeof S[k] !== 'object') S[k] = {}; });\nS.hw = { tr:{}, br:{}, dc:{}, txt:'', chk:[], ...(S.hw && typeof S.hw === 'object' ? S.hw : {}) };\nconst save = () => { try { localStorage.setItem(C.key, JSON.stringify(S)); } catch(e){} };\n\n/* ============ помощники ============ */\nconst $ = id => document.getElementById(id);\nconst stage = $('stage');\nconst clean = s => (s || '').toLowerCase().replace(/[’']/g, \"'\").replace(/[^a-z0-9'\\s-]/g, ' ').replace(/\\s+/g, ' ').trim();\nconst shuffle = a => { a = [...a]; for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };\nconst esc = s => String(s).replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/\"/g,'&quot;');\nconst countWords = v => v ? v.split(' ').length : 0;\nfunction toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }\nfunction speak(text, rate){ if(window.TTS) TTS.speak(text, rate); else toast('Озвучка не загрузилась — обнови страницу'); }\nlet actx = null;\nfunction blip(freq, dur, type){\n  try{\n    actx = actx || new (window.AudioContext || window.webkitAudioContext)();\n    const o = actx.createOscillator(), g = actx.createGain();\n    o.type = type || 'triangle'; o.frequency.value = freq;\n    g.gain.setValueAtTime(.0001, actx.currentTime);\n    g.gain.exponentialRampToValueAtTime(.12, actx.currentTime + .02);\n    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + (dur || .18));\n    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + (dur || .18) + .02);\n  } catch(e){}\n}\nconst good = () => { blip(660,.12); setTimeout(() => blip(990,.16), 90); };\nconst bad = () => blip(180,.22,'sawtooth');\nconst teach = text => '\u003cdetails class=\"teach\">\u003csummary>🎓 Для преподавателя\u003c/summary>\u003cp>' + text + '\u003c/p>\u003c/details>';\n\nconst STEPS = [\n  { id:'recap', render:recap }, { id:'words', render:words }, { id:'chain', render:chain }, { id:'truth', render:truth },\n  { id:'chest', render:pick }, { id:'gram', render:gram }, { id:'talk', render:talk }, { id:'diary', render:diary },\n  { id:'exit', render:exit }, { id:'home', render:homework }\n].map((st, i) => ({ ...st, ...C.steps[i] }));\n\nfunction complete(id){\n  if(S.done.includes(id)) return;\n  S.done.push(id); save(); renderSteps(); good();\n  toast('Задание выполнено: ' + STEPS.find(s => s.id === id).short + ' ✓');\n}\n\n/* ============ навигация ============ */\nfunction renderSteps(){\n  $('steps').innerHTML = STEPS.map((st, i) =>\n    '\u003cbutton class=\"step ' + (i === S.step ? 'on ' : '') + (S.done.includes(st.id) ? 'done' : '') + '\" data-step=\"' + i + '\" aria-current=\"' + (i === S.step) + '\">' +\n    '\u003cb>\u003cem>' + (i + 1) + '\u003c/em>\u003c/b>\u003cspan>' + st.short + '\u003c/span>\u003c/button>').join('');\n  const n = S.done.length;\n  $('progFill').style.width = Math.round(n / STEPS.length * 100) + '%';\n  $('progText').textContent = n + ' / ' + STEPS.length;\n  const on = $('steps').querySelector('.step.on');\n  if(on && $('steps').scrollWidth > $('steps').clientWidth) $('steps').scrollLeft = on.offsetLeft - 40;\n}\n$('steps').addEventListener('click', e => { const b = e.target.closest('[data-step]'); if(b) go(+b.dataset.step); });\nfunction go(i){\n  if(window.TTS && TTS.stop) TTS.stop();\n  S.step = Math.max(0, Math.min(STEPS.length - 1, i)); save();\n  try { history.replaceState(null, '', '#task-' + (S.step + 1)); } catch(e){}\n  show();\n  stage.scrollIntoView({ block:'start' });\n}\nfunction show(){\n  const st = STEPS[S.step];\n  renderSteps();\n  stage.innerHTML = '\u003cdiv class=\"pop\">\u003cdiv class=\"head\">\u003cdiv>\u003cp class=\"kicker\">Задание ' + (S.step + 1) + ' · ' + st.kicker + '\u003c/p>\u003ch2>' + st.title + '\u003c/h2>\u003c/div>\u003cspan class=\"stamp\">' + st.min + '\u003c/span>\u003c/div>\u003cdiv id=\"body\">\u003c/div>\u003c/div>';\n  st.render($('body'));\n  $('prevBtn').disabled = S.step === 0;\n  $('nextBtn').textContent = S.step === STEPS.length - 1 ? 'К заданию 1 ↺' : 'Дальше →';\n  $('footLabel').textContent = 'Задание ' + (S.step + 1) + ' из ' + STEPS.length + ' · ' + st.short;\n}\n$('prevBtn').addEventListener('click', () => go(S.step - 1));\n$('nextBtn').addEventListener('click', () => go(S.step === STEPS.length - 1 ? 0 : S.step + 1));\n$('voiceBtn').addEventListener('click', e => { e.preventDefault(); if(window.TTS) TTS.openPicker(); });\n\n/* ============ 1. прогноз ============ */\nfunction recap(el){\n  const R = C.recap, items = C.pick.items, N = R.pickN || 3;\n  el.innerHTML = '\u003cdiv class=\"note\">' + R.html + '\u003c/div>' +\n    '\u003cp class=\"task\" style=\"margin-top:16px\">' + R.task + '\u003c/p>' +\n    '\u003cdiv class=\"opts\" id=\"predict\">' + items.map(c =>\n      '\u003cbutton class=\"opt ' + (S.predict.includes(c.id) ? 'pick' : '') + '\" data-p=\"' + c.id + '\">\u003cspan style=\"font-size:24px\">' + c.icon + '\u003c/span>\u003cspan>' + c.en + '\u003csmall>' + c.ru + '\u003c/small>\u003c/span>\u003c/button>').join('') + '\u003c/div>' +\n    '\u003cdiv class=\"status\" id=\"pStatus\">\u003c/div>' +\n    '\u003cdiv class=\"frame\">\u003cb>Скажи вслух:\u003c/b> ' + R.frame + '\u003c/div>' + teach(R.teach);\n  const upd = () => {\n    $('pStatus').textContent = S.predict.length === N ? R.doneText : 'Выбрано: ' + S.predict.length + ' из ' + N;\n    $('pStatus').className = 'status' + (S.predict.length === N ? ' ok' : '');\n  };\n  el.querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => {\n    const id = b.dataset.p;\n    S.predict = S.predict.includes(id) ? S.predict.filter(x => x !== id) : [...S.predict, id].slice(-N);\n    save();\n    el.querySelectorAll('[data-p]').forEach(x => x.classList.toggle('pick', S.predict.includes(x.dataset.p)));\n    upd();\n    if(S.predict.length === N) complete('recap');\n  }));\n  upd();\n}\n\n/* ============ 2. слова ============ */\nfunction words(el){\n  const W = C.words.items;\n  el.innerHTML =\n    '\u003cp class=\"task\">' + W.length + ' выражений из главы, которые пригодятся и в обычной речи. Сначала прочитай пример и попробуй догадаться о значении, потом открой перевод. В конце — быстрая проверка.\u003c/p>' +\n    '\u003cdiv class=\"cards\">' + W.map(w =>\n      '\u003carticle class=\"card\">\u003ch3 class=\"term\">' + w.en + '\u003c/h3>\u003cp class=\"ex\">' + w.ex + '\u003c/p>\u003cp class=\"ru\" id=\"ru-' + w.id + '\">' + w.ru + '\u003c/p>' +\n      '\u003cdiv class=\"acts\">\u003cbutton data-say=\"' + esc(w.ex) + '\">🔊\u003c/button>\u003cbutton data-ru=\"' + w.id + '\">перевод\u003c/button>\u003c/div>\u003c/article>').join('') + '\u003c/div>' +\n    '\u003cdiv class=\"note ballast\">\u003cb>Понять и отпустить (в активный запас не идут):\u003c/b> ' + C.words.ballast + '\u003c/div>' +\n    '\u003cdiv class=\"quiz\" id=\"quiz\">\u003c/div>' +\n    teach('Сначала пример, потом догадка, потом перевод. В проверке слова идут в случайном порядке; 6 из 8 и выше — можно переходить к говорению, ниже — повторить карточки.');\n  el.querySelectorAll('[data-say]').forEach(b => b.addEventListener('click', () => speak(b.dataset.say, .85)));\n  el.querySelectorAll('[data-ru]').forEach(b => b.addEventListener('click', () => $('ru-' + b.dataset.ru).classList.toggle('open')));\n  quizStart();\n}\nfunction quizStart(){\n  const box = $('quiz'), n = C.words.items.length;\n  if(S.quiz !== null){\n    box.innerHTML = '\u003cp class=\"quiz-q\">\u003csmall>Проверка пройдена\u003c/small>' + S.quiz
