ым enough стоит перед ним: enough money.' },\n  { w:'during',   good:'I fell asleep during the film.',         bad:'I fell asleep during I watched the film.', why:'during + существительное. Перед предложением — while: while I was watching.' },\n  { w:'already',  good:'I have already seen this film.',         bad:'I have seen already this film.',         why:'already стоит между have и смысловым глаголом.' },\n  { w:'believe',  good:'Do you believe in ghosts?',              bad:'Do you believe to ghosts?',              why:'Верить в существование чего-то — believe in.' },\n  { w:'still',    good:'She still lives in Moscow.',             bad:'She lives still in Moscow.',             why:'still стоит перед обычным глаголом: still lives.' },\n  { w:'probably', good:'I will probably be late.',               bad:'I will be probably late.',               why:'probably стоит сразу после will: will probably be.' },\n  { w:'however',  good:'The room was small. However, it was clean.', bad:'However the room was small, it was clean.', why:'However связывает два предложения. «Хотя …» в начале — although.' },\n  { w:'ago',        good:'I saw him three days ago.',           bad:'I saw him before three days.',         why:'«Три дня назад» — three days ago: ago стоит после срока.' },\n  { w:'since',      good:'I have lived here since 2020.',       bad:'I live here since 2020.',              why:'С since («с какого-то момента до сих пор») нужен Present Perfect: have lived.' },\n  { w:'borrow',     good:'Can I borrow your pen?',              bad:'Can you borrow me your pen?',          why:'borrow — взять у кого-то. Попросить дать — Can you lend me your pen?' },\n  { w:'explain',    good:'Can you explain it to me?',           bad:'Can you explain me it?',               why:'explain something to somebody — без to нельзя.' },\n  { w:'agree',      good:'I agree with you.',                   bad:'I am agree with you.',                 why:'agree — глагол, am перед ним не нужен.' },\n  { w:'depend',     good:'It depends on the price.',            bad:'It depends of the price.',             why:'«Зависеть от» — depend on.' },\n  { w:'spend',      good:'She spends a lot of money on clothes.', bad:'She spends a lot of money for clothes.', why:'Тратить на что-то — spend on.' },\n  { w:'suggest',    good:'I suggest going to the cinema.',      bad:'I suggest you to go to the cinema.',   why:'suggest + -ing (или suggest that you go). Конструкции suggest you to do нет.' },\n  { w:'interested', good:'I’m interested in music.',            bad:'I’m interesting in music.',            why:'О человеке — interested in. Interesting — это «интересный» о предмете.' },\n  { w:'miss',       good:'I miss you so much.',                 bad:'I miss for you so much.',              why:'Скучать по кому-то — miss somebody, без предлога.' }\n];\n\n/* ============ состояние ============ */\nconst KEY = 'a2-top10-v1';\nlet S = { stars:{}, miss:{}, set:1 };\ntry { S = { ...S, ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch(e){}\nS.stars = S.stars || {}; S.miss = S.miss || {}; S.set = S.set === 2 ? 2 : 1;\nObject.keys(S.stars).forEach(k => { if(!k.includes(':')){ S.stars['1:' + k] = Math.max(S.stars['1:' + k] || 0, S.stars[k]); delete S.stars[k]; } });\nlet WORDS = [], GAPS = [], MISTAKES = [];\nfunction useSet(n){\n  S.set = n;\n  WORDS = WORDS_ALL.filter(w => w.set === n);\n  GAPS = GAPS_ALL.filter(g => WORDS.some(w => w.en === g.w));\n  MISTAKES = MISTAKES_ALL.filter(m => WORDS.some(w => w.en === m.w));\n}\nuseSet(S.set);\nconst save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };\n\n/* ============ помощники ============ */\nconst $ = id => document.getElementById(id);\nconst shuffle = a => { a = [...a]; for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };\nconst norm = s => (s || '').toLowerCase().replace(/[’']/g, \"'\").replace(/[^a-z']/g, '');\nconst byEn = en => WORDS_ALL.find(w => w.en === en);\nconst esc = s => String(s).replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/\"/g,'&quot;');\nfunction others(word, n, key){\n  return shuffle(WORDS.filter(w => w.en !== word.en)).slice(0, n).map(w => w[key]);\n}\nfunction toast(msg){\n  const t = $('toast'); t.textContent = msg; t.classList.add('show');\n  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);\n}\nfunction speak(text, rate){\n  if(window.TTS) return TTS.speak(text, rate);\n  toast('Озвучка не загрузилась — обнови страницу'); return false;\n}\nlet actx = null;\nfunction blip(freq, dur, type){\n  try{\n    actx = actx || new (window.AudioContext || window.webkitAudioContext)();\n    const o = actx.createOscillator(), g = actx.createGain();\n    o.type = type || 'triangle'; o.frequency.value = freq;\n    g.gain.setValueAtTime(.0001, actx.currentTime);\n    g.gain.exponentialRampToValueAtTime(.12, actx.currentTime + .02);\n    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + (dur || .18));\n    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + (dur || .18) + .02);\n  } catch(e){}\n}\nconst good = () => { blip(660,.12); setTimeout(() => blip(990,.16), 90); };\nconst bad = () => blip(180,.22,'sawtooth');\nconst miss = en => { S.miss[en] = (S.miss[en] || 0) + 1; save(); renderChips(); };\nconst shake = el => { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); };\nconst starsOf = (score, total) => { const p = score / total; return p >= 1 ? 3 : p >= .7 ? 2 : p >= .4 ? 1 : 0; };\nconst starLine = n => '\u003cem>' + '★'.repeat(n) + '\u003c/em>' + '★'.repeat(3 - n);\n\n/* ============ список слов ============ */\nfunction renderChips(){\n  $('chips').innerHTML = WORDS.map(w =>\n    '\u003cbutton class=\"chip ' + ((S.miss[w.en] || 0) >= 2 ? 'weak' : '') + '\" data-say=\"' + w.en + '\" title=\"' + esc(w.ex) + '\">' +\n    '\u003cb>' + w.en + '\u003c/b>\u003cspan>' + w.ru + '\u003c/span>\u003c/button>').join('');\n}\n$('chips').addEventListener('click', e => { const b = e.target.closest('[data-say]'); if(b) speak(b.dataset.say, .8); });\n\n/* ============ меню тренажёров ============ */\nconst MODES = [\n  { id:'cards',    icon:'🃏', name:'Карточки',      sub:'значение и пример', run:cards },\n  { id:'quiz',     icon:'🎯', name:'Перевод',       sub:'выбери вариант',    run:quiz },\n  { id:'match',    icon:'🧩', name:'Пары',          sub:'соедини слово',     run:match },\n  { id:'gaps',     icon:'✏️', name:'Пропуски',      sub:'слово в предложении', run:gaps },\n  { id:'letters',  icon:'🔤', name:'Буквы',         sub:'собери слово',      run:letters },\n  { id:'listen',   icon:'🎧', name:'На слух',       sub:'услышь и напиши',   run:listen },\n  { id:'mistakes', icon:'🔍', name:'Найди ошибку',  sub:'типичные ошибки',   run:mistakes }\n];\nlet current = 'cards';\nfunction renderModes(){\n  $('modes').innerHTML = MODES.map(m =>\n    '\u003cbutton class=\"mode ' + (m.id === current ? 'on' : '') + '\" data-mode=\"' + m.id + '\">\u003ci>' + m.icon + '\u003c/i>\u003cdiv>\u003cb>' + m.name + '\u003c/b>' +\n    '\u003cspan>' + m.sub + '\u003c/span>\u003cdiv class=\"stars\">' + starLine(S.stars[S.set + ':' + m.id] || 0) + '\u003c/div>\u003c/div>\u003c/button>').join('');\n  $('totalStars').textContent = Object.values(S.stars).reduce((n, v) => n + v, 0);\n  $('sets').querySelectorAll('[data-set]').forEach(b => { b.classList.toggle('on', +b.dataset.set === S.set); b.setAttribute('aria-pressed', String(+b.dataset.set === S.set)); });\n}\n$('modes').addEventListener('click', e => { const b = e.target.closest('[data-mode]'); if(b) open(b.dataset.mode, true); });\nfunction open(id, scroll){\n  current = id; renderModes();\n  document.onkeydown = null;\n  MODES.find(m => m.id === id).run();\n  if(scroll) $('stage').scrollIntoView({ behavior:'smooth', block:'start' });\n}\n\nfunction head(title, text, counter){\n  return '\u003cdiv class=\"stage-head\">\u003cdiv>\u003ch2>' + title + '\u003c/h2>\u003cp>' + text + '\u003c/p>\u003c/div>' +\n    (counter ? '\u003cspan class=\"count\" id=\"counter\">' + counter + '\u003c/span>' : '') + '\u003c/div>' +\n    '\u003cdiv class=\"meter\">\u003ci id=\"meter\" style=\"width:0\">\u003c/i>\u003c/div>';\n}\nfunction progress(done, total){\n  $('meter').style.width = Math.round(done / total * 100) + '%';\n  const c = $('counter'); if(c) c.textContent = Math.min(done + 1, total) + ' / ' + total;\n}\nfunction finish(id, score, total, weak, extra){\n  const st = starsOf(score, total);\n  const key = S.set + ':' + id;\n  if(st > (S.stars[key] || 0)){ S.stars[key] = st; save(); }\n  renderModes();\n  const idx = MODES.findIndex(m => m.id === id), next = MODES[(idx + 1) % MODES.length];\n  const medal = st === 3 ? '🏆' : st === 2 ? '🥈' : st === 1 ? '🥉' : '💪';\n  const weakList = [...new Set(weak)];\n  $('stage').innerHTML = '\u003cdiv class=\"result pop\">\u003cdiv class=\"medal\">' + medal + '\u003c/div>' +\n    '\u003cdiv class=\"big-stars\">' + starLine(st) + '\u003c/div>' +\n    '\u003ch3>' + score + ' из ' + total + '\u003c/h3>' +\n    '\u003cp class=\"note\">' + (st === 3 ? 'Безупречно! Переходи к следующему тренажёру.' : st >= 2 ? 'Хороший результат. Ещё один круг — и будет три звезды.' : 'Слова пока путаются. Повтори карточки и попробуй снова.') + '\u003c/p>' +\n    (weakList.length ? '\u003cdiv class=\"weak\">\u003cb>Повтори:\u003c/b> ' + weakList.map(w => { const x = byEn(w); return x ? w + ' — ' + x.ru : w; }).join(' · ') + '\u003c/div>' : '') +\n    (extra || '') +\n    '\u003cdiv class=\"row center\" style=\"margin-top:16px\">\u003cbutton class=\"btn ghost\" id=\"again\">Ещё раз\u003c/button>' +\n    '\u003cbutton class=\"btn go\" id=\"next\">' + next.icon + ' ' + next.name + ' →\u003c/button>\u003c/div>\u003c/div>';\n  $('again').addEventListener('click', () => open(id));\n  $('next').addEventListener('click', () => open(next.id, true));\n  if(st === 3) good();\n}\n\n/* ============ 1. карточки ============ */\nfunction cards(){\n  let dir = 'en', queue = shuffle(WORDS), firstTry = new Set(WORDS.map(w => w.en)), shown = false, known = 0;\n  $('stage').innerHTML = head('Карточки', 'Вспомни значение, потом переверни карточку и честно оцени себя. «Ещё повторю» вернёт слово в конец стопки.', '1 / 10') +\n    '\u003cdiv class=\"row center\" style=\"margin-bottom:14px\">\u003cbutton class=\"btn ghost small\" id=\"dir\">\u003c/button>\u003c/div>' +\n    '\u003cdiv id=\"cardBox\">\u003c/div>';\n  const setDir = () => { $('dir').textContent = dir === 'en' ? 'Сторона: английский → русский' : 'Сторона: русский → английский'; };\n  $('dir').addEventListener('click', () => { dir = dir === 'en' ? 'ru' : 'en'; setDir(); show(); });\n  setDir();\n  function show(){\n    const w = queue[0];\n    if(!w){ finish('cards', firstTry.size, WORDS.length, WORDS.filter(x => !firstTry.has(x.en)).map(x => x.en)); return; }\n    shown = false;\n    $('counter').textContent = 'осталось: ' + queue.length;\n    $('meter').style.width = Math.round(known / WORDS.length * 100) + '%';\n    const front = dir === 'en'\n      ? '\u003cdiv class=\"big\">' + w.en + '\u003c/div>\u003cdiv class=\"ipa\">' + w.ipa + '\u003c/div>'\n      : '\u003cdiv class=\"big\" style=\"font-size:clamp(28px,5vw,40px)\">' + w.ru + '\u003c/div>';\n    $('cardBox').innerHTML = '\u003cbutton class=\"flip pop\" id=\"flip\">' + front + '\u003cdiv class=\"hint\">нажми, чтобы перевернуть\u003c/div>\u003c/button>' +\n      '\u003cdiv class=\"row center\" style=\"margin-top:16px\">\u003cbutton class=\"btn ghost small\" id=\"cardSay\">🔊 Звук\u003c/button>\u003c/div>' +\n      '\u003cdiv class=\"row center\" id=\"rate\" style=\"margin-top:12px\" hidden>\u003cbutton class=\"btn warn\" id=\"again1\">Ещё повторю\u003c/button>\u003cbutton class=\"btn go\" id=\"know\">Знаю ✓\u003c/button>\u003c/div>';\n    if(dir === 'en') speak(w.en, .8);\n    $('cardSay').addEventListener('click', () => speak(w.en, .8));\n    $('flip').addEventListener('click', flip);\n    $('know').addEventListener('click', () => rate(true));\n    $('again1').addEventListener('click', () => rate(false));\n  }\n  function flip(){\n    if(shown) return;\n    shown = true;\n    const w = queue[0];\n    $('flip').innerHTML = '\u003cdiv class=\"big\" style=\"font-size:clamp(28px,5vw,40px)\">' + (dir === 'en' ? w.ru : w.en) + '\u003c/div>' +\n      (dir === 'ru' ? '\u003cdiv class=\"ipa\">' + w.ipa + '\u003c/div>' : '') +\n      '\u003cp class=\"ex\">' + w.ex + '\u003cspan>' + w.exRu + '\u003c/span>\u003c/p>\u003cdiv class=\"tip\">💡 ' + w.tip + '\u003c/div>';\n    $('rate').hidden = false;\n    if(dir === 'ru') speak(w.en, .8);\n  }\n  function rate(ok){\n    if(!shown) return;\n    const w = queue.shift();\n    if(ok){ known++; good(); }\n    else { firstTry.delete(w.en); miss(w.en); queue.push(w); }\n    show();\n  }\n  document.onkeydown = e => {\n    if(e.key === ' ' || e.key === 'Enter'){ if(!shown){ e.preventDefault(); flip(); } }\n    else if(shown && (e.key === '1' || e.key === 'ArrowLeft')) rate(false);\n    else if(shown && (e.key === '2' || e.key === 'ArrowRight')) rate(true);\n  };\n  show();\n}\n\n/* ============ 2. перевод ============ */\nfunction quiz(){\n  const items = shuffle(WORDS).map((w, i) => ({ w, dir: i % 2 ? 'ru' : 'en' }));\n  let n = 0, score = 0, weak = [], locked = false;\n  $('stage').innerHTML = head('Перевод', 'Десять вопросов: то с английского, то с русского. Клавиши 1–4 тоже работают.', '1 / 10') + '\u003cdiv id=\"qBox\">\u003c/div>';\n  function show(){\n    if(n >= items.length){ finish('quiz', score, items.length, weak); return; }\n    locked = false; progress(n, items.length);\n    const { w, dir } = items[n];\n    const right = dir === 'en' ? w.ru : w.en;\n    const opts = shuffle([right, ...others(w, 3, dir === 'en' ? 'ru' : 'en')]);\n    $('qBox').innerHTML = '\u003cp class=\"q pop\">\u003csmall>' + (dir === 'en' ? 'Как это по-русски?' : 'Как это по-английски?') + '\u003c/small>' + (dir === 'en' ? w.en : w.ru) + '\u003c/p>' +\n      '\u003cdiv class=\"opts\">' + opts.map((o, i) => '\u003cbutton class=\"opt\" data-o=\"' + esc(o) + '\">\u003cspan>' + (i + 1) + '\u003c/span>' + o + '\u003c/button>').join('') + '\u003c/div>' +\n      '\u003cdiv class=\"fb\" id=\"qFb\">\u003c/div>';\n    if(dir === 'en') speak(w.en, .8);\n    $('qBox').querySelectorAll('[data-o]').forEach(b => b.addEventListener('click', () => answer(b, right, w)));\n  }\n  function answer(b, right, w){\n    if(locked) return; locked = true;\n    const ok = b.dataset.o === right;\n    if(ok){ score++; b.classList.add('hit'); good(); $('qFb').className = 'fb ok'; $('qFb').innerHTML = 'Верно! \u003csmall>' + w.ex + '\u003c/small>'; }\n    else {\n      b.classList.add('miss'); bad(); weak.push(w.en); miss(w.en);\n      $('qBox').querySelectorAll('[data-o]').forEach(x => { if(x.dataset.o === right) x.classList.add('hit'); });\n      $('qFb').className = 'fb no'; $('qFb').innerHTML = w.en + ' — ' + w.ru + '\u003csmall>' + w.ex + '\u003c/small>';\n    }\n    if(!ok || items[n].dir === 'ru') speak(w.en, .8);\n    n++; setTimeout(show, ok ? 900 : 2000);\n  }\n  document.onkeydown = e => { if(/^[1-4]$/.test(e.key)){ const b = $('qBox').querySelectorAll('[data-o]')[+e.key - 1]; b && b.click(); } };\n  show();\n}\n\n/* ============ 3. пары ============ */\nfunction match(){\n  const rounds = [shuffle(WORDS).slice(0, 5)];\n  rounds.push(shuffle(WORDS.filter(w => !rounds[0].includes(w))));\n  let r = 0, errors = 0, firstOk = 0, weak = [], matched = 0, pick = null;\n  $('stage').innerHTML = head('Пары', 'Нажми английское слово, потом его перевод. Два раунда по пять пар. Верная пара с первой попытки — очко.', 'раунд 1 / 2') + '\u003cdiv id=\"mBox\">\u003c/div>';\n  function show(){\n    if(r >= rounds.length){ finish('match', firstOk, WORDS.length, weak); return; }\n    $('counter').textContent = 'раунд ' + (r + 1) + ' / 2';\n    const set = rounds[r], tried = new Set();\n    pick = null;\n    $('mBox').innerHTML = '\u003cdiv class=\"match pop\">\u003cdiv class=\"match-col\">' +\n      shuffle(set).map(w => '\u003cbutton class=\"tile\" data-l=\"' + w.en + '\">' + w.en + '\u003c/button>').join('') + '\u003c/div>\u003cdiv class=\"match-col\">' +\n      shuffle(set).map(w => '\u003cbutton class=\"tile\" data-r=\"' + w.en + '\">' + w.ru + '\u003c/button>').join('') + '\u003c/div>\u003c/div>';\n    $('mBox').querySelectorAll('[data-l]').forEach(b => b.addEventListener('click', () => {\n      $('mBox').querySelectorAll('[data-l]').forEach(x => x.classList.remove('sel'));\n      b.classList.add('sel'); pick = b; speak(b.dataset.l, .85);\n    }));\n    $('mBox').querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => {\n      if(!pick){ toast('Сначала выбери английское слово слева'); return; }\n      const en = pick.dataset.l;\n      if(b.dataset.r === en){\n        if(!tried.has(en)) firstOk++;\n        [pick, b].forEach(x => { x.classList.remove('sel'); x.classList.add('good'); });\n        const p = pick; pick = null; matched++; good();\n        progress(matched, WORDS.length);\n        setTimeout(() => { p.classList.add('done'); b.classList.add('done');\n          if([...$('mBox').querySelectorAll('.tile')].every(x => x.classList.contains('done'))){ r++; setTimeout(show, 250); } }, 380);\n      } else {\n        errors++; tried.add(en); weak.push(en); miss(en); bad();\n        b.classList.add('bad'); shake(b); setTimeout(() => b.classList.remove('bad'), 500);\n      }\n    }));\n  }\n  show();\n}\n\n/* ============ 4. пропуски ============ */\nfunction gaps(){\n  const items = shuffle(GAPS);\n  let n = 0, score = 0, weak = [], locked = false;\n  $('stage').innerHTML = head('Пропуски', 'Выбери слово, которое подходит в предложение. Русский перевод можно открыть, если совсем непонятно.', '1 / 10') + '\u003cdiv id=\"gBox\">\u003c/div>';\n  function show(){\n    if(n >= items.length){ finish('gaps', score, items.length, weak); return; }\n    locked = false; progress(n, items.length);\n    const it = items[n], w = byEn(it.w);\n    const opts = shuffle([it.w, ...others(w, 3, 'en')]);\n    $('gBox').innerHTML = '\u003cp class=\"q pop\">' + it.s.replace('___', '\u003cspan class=\"gap\">&nbsp;?&nbsp;\u003c/span>') + '\u003c/p>' +\n      '\u003cp class=\"q-ru\">\u003cbutton class=\"btn ghost small\" id=\"gRu\">показать перевод\u003c/button>\u003c/p>' +\n      '\u003cdiv class=\"opts\">' + opts.map((o, i) => '\u003cbutton class=\"opt\" data-o=\"' + o + '\">\u003cspan>' + (i + 1) + '\u003c/span>' + o + '\u003c/button>').join('') + '\u003c/div>' +\n      '\u003cdiv class=\"fb\" id=\"gFb\">\u003c/div>';\n    $('gRu').addEventListener('click', () => { $('gRu').parentNode.textContent = it.ru; });\n    $('gBox').querySelectorAll('[data-o]').forEach(b => b.addEventListener('click', () => answer(b, it)));\n  }\n  function answer(b, it){\n    if(locked) return; locked = true;\n    const ok = b.dataset.o === it.w;\n    const word = /(^|[.!?]\\s+)___/.test(it.s) ? it.w[0].toUpperCase() + it.w.slice(1) : it.w;\n    const full = it.s.replace('___', word);\n    $('gBox').querySelector('.gap').textContent = word;\n    if(ok){ score++; b.classList.add('hit'); good(); $('gFb').className = 'fb ok'; $('gFb').innerHTML = 'Верно!\u003csmall>' + it.ru + '\u003c/small>'; }\n    else {\n      b.classList.add('miss'); bad(); weak.push(it.w); miss(it.w);\n      $('gBox').querySelectorAll('[data-o]').forEach(x => { if(x.dataset.o === it.w) x.classList.add('hit'); });\n      $('gFb').className = 'fb no'; $('gFb').innerHTML = 'Нужно: ' + it.w + ' — ' + byEn(it.w).ru + '\u003csmall>' + it.ru + '\u003c/small>';\n    }\n    speak(full, .85);\n    n++; setTimeout(show, ok ? 1500 : 2600);\n  }\n  document.onkeydown = e => { if(/^[1-4]$/.test(e.key)){ const b = $('gBox').querySelectorAll('[data-o]')[+e.key - 1]; b && b.click(); } };\n  show();\n}\n\n/* ============ 5. буквы ============ */\nfunction letters(){\n  const items = shuffle(WORDS);\n  let n = 0, score = 0, weak = [], typed = [], clean = true;\n  $('stage').innerHTML = head('Буквы', 'Собери английское слово из букв. Ошибся — нажми «стереть». Подсказка ставит следующую букву, но слово тогда не засчитывается.', '1 / 10') + '\u003cdiv id=\"lBox\">\u003c/div>';\n  function show(){\n    if(n >= items.length){ finish('letters', score, items.length, weak); return; }\n    progress(n, items.length);\n    const w = items[n];\n    typed = []; clean = true;\n    let mixed = shuffle(w.en.split(''));\n    if(mixed.join('') === w.en) mixed = mixed.reverse();\n    $('lBox').innerHTML = '\u003cp class=\"q pop\">\u003csmall>Собери слово\u003c/small>' + w.ru + '\u003c/p>' +\n      '\u003cdiv class=\"slots\" id=\"slots\">' + w.en.split('').map(() => '\u003cspan class=\"slot\">\u003c/span>').join('') + '\u003c/div>' +\n      '\u003cdiv class=\"letters\" id=\"letters\">' + mixed.map((ch, i) => '\u003cbutton class=\"letter\" data-i=\"' + i + '\" data-ch=\"' + ch + '\">' + ch + '\u003c/button>').join('') + '\u003c/div>' +\n      '\u003cdiv class=\"row center\" style=\"margin-top:16px\">\u003cbutton class=\"btn ghost small\" id=\"lDel\">⌫ стереть\u003c/button>\u003cbutton class=\"btn ghost small\" id=\"lHint\">подсказка\u003c/button>\u003cbutton class=\"btn ghost small\" id=\"lSay\">🔊 звук\u003c/button>\u003c/div>' +\n      '\u003cdiv class=\"fb\" id=\"lFb\">\u003c/div>';\n    $('letters').querySelectorAll('.letter').forEach(b => b.addEventListener('click', () => put(b)));\n    $('lDel').addEventListener('click', del);\n    $('lSay').addEventListener('click', () => { clean = false; speak(w.en, .7); toast('Со звуком — без очка, но слово запомнится'); });\n    $('lHint').addEventListener('click', hint);\n  }\n  function draw(){\n    const w = items[n];\n    $('slots').querySelectorAll('.slot').forEach((s, i) => { s.textContent = typed[i] ? typed[i].dataset.ch : ''; s.classList.toggle('full', !!typed[i]); });\n    if(typed.length === w.en.length){\n      const got = typed.map(b => b.dataset.ch).join('');\n      if(got === w.en){\n        $('slots').classList.add('ok'); good(); speak(w.en, .8);\n        if(clean) score++; else weak.push(w.en);\n        $('lFb').className = 'fb ok'; $('lFb').innerHTML = (clean ? 'Верно!' : 'Собрано с подсказкой.') + '\u003csmall>' + w.ex + '\u003c/small>';\n        n++; setTimeout(show, 1500);\n      } else {\n        $('slots').classList.add('no'); bad(); clean = false; shake($('slots'));\n        if(!weak.includes(w.en)){ weak.push(w.en); miss(w.en); }\n        $('lFb').className = 'fb no'; $('lFb').textContent = 'Не то слово. Сотри лишние буквы и попробуй ещё.';\n        setTimeout(() => $('slots') && $('slots').classList.remove('no'), 600);\n      }\n    }\n  }\n  function put(b){ if(b.disabled || typed.length >= items[n].en.length) return; typed.push(b); b.disabled = true; $('lFb').textContent = ''; draw(); }\n  function del(){ const b = typed.pop(); if(b) b.disabled = false; draw(); }\n  function hint(){\n    const w = items[n]; clean = false;\n    while(typed.length && typed.map(b => b.dataset.ch).join('') !== w.en.slice(0, typed.length)) del();\n    const need = w.en[typed.length];\n    const b = [...$('letters').querySelectorAll('.letter')].find(x => !x.disabled && x.dataset.ch === need);\n    if(b) put(b);\n  }\n  document.onkeydown = e => {\n    if(!$('letters')) return;\n    if(e.key === 'Backspace'){ e.preventDefault(); del(); return; }\n    if(/^[a-z]$/i.test(e.key)){\n      const b = [...$('letters').querySelectorAll('.letter')].find(x => !x.disabled && x.dataset.ch === e.key.toLowerCase());\n      if(b) put(b);\n    }\n  };\n  show();\n}\n\n/* ============ 6. на слух ============ */\nfunction listen(){\n  const items = shuffle(WORDS);\n  let n = 0, score = 0, weak = [], tips = 0, tried = false;\n  const voice = 'speechSynthesis' in window;\n  $('stage').innerHTML = head('На слух', 'Послушай слово и напиши его по-английски. Можно слушать сколько угодно раз. Если звука нет — ориентируйся на транскрипцию и перевод в подсказке.', '1 / 10') + '\u003cdiv id=\"eBox\">\u003c/div>';\n  function show(){\n    if(n >= items.length){ finish('listen', score, items.length, weak); return; }\n    progress(n, items.length);\n    const w = items[n]; tips = 0; tried = false;\n    $('eBox').innerHTML = '\u003cdiv class=\"listen-box pop\">' +\n      '\u003cbutton class=\"ear\" id=\"ePlay\" aria-label=\"Послушать слово\">🔊\u003c/button>' +\n      '\u003cdiv class=\"row center\" style=\"margin-bottom:14px\">\u003cbutton class=\"btn ghost small\" id=\"eSlow\">🐢 медленно\u003c/button>\u003cbutton class=\"btn ghost small\" id=\"eTip\">подсказка\u003c/button>\u003c/div>' +\n      '\u003cinput class=\"field\" id=\"eIn\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" placeholder=\"напиши слово\">' +\n      '\u003cdiv class=\"row center\" style=\"margin-top:12px\">\u003cbutton class=\"btn go\" id=\"eCheck\">Проверить\u003c/button>\u003c/div>' +\n      '\u003cdiv class=\"fb\" id=\"eFb\">' + (voice ? '' : 'Озвучки нет — нажми «подсказка».') + '\u003c/div>\u003c/div>';\n    $('ePlay').addEventListener('click', () => speak(w.en, .8));\n    $('eSlow').addEventListener('click', () => speak(w.en, .5));\n    $('eTip').addEventListener('click', () => {\n      tips++;\n      $('eFb').className = 'fb';\n      $('eFb').innerHTML = tips === 1 ? 'Транскрипция: \u003cb>' + w.ipa + '\u003c/b>' :\n        'Значение: \u003cb>' + w.ru + '\u003c/b> · первая буква: \u003cb>' + w.en[0] + '\u003c/b>, букв: ' + w.en.length;\n    });\n    $('eCheck').addEventListener('click', check);\n    $('eIn').addEventListener('keydown', e => { if(e.key === 'Enter') check(); });\n    setTimeout(() => { speak(w.en, .8); try { $('eIn').focus({ preventScroll:true }); } catch(e){} }, 250);\n  }\n  function check(){\n    const w = items[n], v = norm($('eIn').value);\n    if(!v){ toast('Сначала напиши слово'); return; }\n    if(v === w.en){\n      const clean = !tried && tips \u003c 2;\n      if(clean) score++; else if(!weak.includes(w.en)) weak.push(w.en);\n      good(); $('eIn').disabled = true; $('eCheck').disabled = true;\n      $('eFb').className = 'fb ok'; $('eFb').innerHTML = 'Верно: ' + w.en + ' — ' + w.ru + '\u003csmall>' + w.ex + '\u003c/small>';\n      n++; setTimeout(show, 1600);\n    } else if(!tried){\n      tried = true; bad(); shake($('eIn')); miss(w.en); weak.push(w.en);\n      $('eFb').className = 'fb no'; $('eFb').textContent = 'Почти. Послушай ещё раз и исправь — вторая попытка.';\n    } else {\n      bad(); $('eIn').disabled = true; $('eCheck').disabled = true;\n      $('eFb').className = 'fb no'; $('eFb').innerHTML = 'Правильно: \u003cb>' + w.en + '\u003c/b> ' + w.ipa + ' — ' + w.ru + '\u003csmall>' + w.ex + '\u003c/small>';\n      speak(w.en, .7);\n      n++; setTimeout(show, 2600);\n    }\n  }\n  show();\n}\n\n/* ============ 7. найди ошибку ============ */\nfunction mistakes(){\n  const items = shuffle(MISTAKES);\n  let n = 0, score = 0, weak = [], locked = false;\n  $('stage').innerHTML = head('Найди ошибку', 'Два предложения — выбери то, в котором нет ошибки. Это самые частые ошибки русскоговорящих с этими словами.', '1 / ' + items.length) + '\u003cdiv id=\"xBox\">\u003c/div>';\n  function show(){\n    if(n >= items.length){ finish('mistakes', score, items.length, weak); return; }\n    locked = false; progress(n, items.length);\n    const it = items[n];\n    const opts = shuffle([it.good, it.bad]);\n    $('xBox').innerHTML = '\u003cp class=\"q pop\" style=\"font-size:clamp(18px,2.4vw,22px)\">\u003csmall>Слово: ' + it.w + ' — ' + byEn(it.w).ru + '\u003c/small>Какое предложение правильное?\u003c/p>' +\n      '\u003cdiv class=\"opts one\">' + opts.map((o, i) => '\u003cbutton class=\"opt\" data-o=\"' + esc(o) + '\">\u003cspan>' + (i + 1) + '\u003c/span>' + o + '\u003c/button>').join('') + '\u003c/div>' +\n      '\u003cdiv class=\"fb\" id=\"xFb\">\u003c/div>';\n    $('xBox').querySelectorAll('[data-o]').forEach(b => b.addEventListener('click', () => answer(b, it)));\n  }\n  function answer(b, it){\n    if(locked) return; locked = true;\n    const ok = b.dataset.o === it.good;\n    $('xBox').querySelectorAll('[data-o]').forEach(x => x.classList.add(x.dataset.o === it.good ? 'hit' : 'miss'));\n    if(ok){ score++; good(); } else { bad(); weak.push(it.w); miss(it.w); }\n    $('xFb').className = 'fb ' + (ok ? 'ok' : 'no');\n    $('xFb').innerHTML = (ok ? 'Верно!' : 'Ошибка в выбранном варианте.') + '\u003csmall>💡 ' + it.why + '\u003c/small>' +\n      '\u003cdiv class=\"row center\" style=\"margin-top:12px\">\u003cbutton class=\"btn small\" id=\"xNext\">Дальше →\u003c/button>\u003c/div>';\n    speak(it.good, .85);\n    $('xNext').addEventListener('click', () => { n++; show(); });\n    $('xNext').focus({ preventScroll:true });\n  }\n  document.onkeydown = e => {\n    if(/^[12]$/.test(e.key)){ const b = $('xBox').querySelectorAll('[data-o]')[+e.key - 1]; b && b.click(); }\n  };\n  show();\n}\n\n/* ============ запуск ============ */\n$('sets').addEventListener('click', e => {\n  const b = e.target.closest('[data-set]'); if(!b || +b.dataset.set === S.set) return;\n  useSet(+b.dataset.set); save(); renderChips(); open(current);\n  toast('Набор ' + S.set + ': ' + WORDS.map(w => w.en).slice(0, 3).join(', ') + '…');\n});\n$('voiceBtn').addEventListener('click', () => window.TTS && TTS.openPicker());\nrenderChips(); renderModes(); open('cards');\n})();\n\u003c/script>\n\u003cscript>\n(() => {\n  const FILES = {\"lesson-1-2.html\": \"12\", \"chapter-3.html\": \"ch3\", \"chapter-4.html\": \"ch4\", \"chapter-5.html\": \"ch5\", \"a2-words.html\": \"words\", \"index.html\": \"12\", \"index-3.html\": \"12\"};\n  const part = href => FILES[String(href || '').split('#')[0].split('?')[0].split('/').pop()];\n  const inHub = window.parent !== window;\n  window.__tiGo = href => { const id = part(href); if(inHub && id) window.parent.postMessage({ tiGo:id }, '*'); else location.href = href; };\n  document.addEventListener('click', e => {\n    const a = e.target.closest && e.target.closest('a[href]');\n    if(!a || !inHub) return;\n    const id = part(a.getAttribute('href'));\n    if(id){ e.preventDefault(); window.parent.postMessage({ tiGo:id }, '*'); }\n  }, true);\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n" }

  const tab = document.querySelector('.tab[data-part="' + id + '"]');
  if(tab && tab.scrollIntoView) tab.scrollIntoView({ block:'nearest', inline:'nearest' });
  try { localStorage.setItem(KEY, id); } catch(e){}
  if(!keepHash){ try { history.replaceState(null, '', '#' + id); } catch(e){} }
  document.title = PARTS[id].title + ' · Treasure Island';
  try { frames[id].contentWindow.focus(); } catch(e){}
}
document.querySelector('.tabs').addEventListener('click', e => { const t = e.target.closest('[data-part]'); if(t) show(t.dataset.part); });
window.addEventListener('message', e => { if(e.data && e.data.tiGo && Object.values(frames).some(f => f.contentWindow === e.source)) show(e.data.tiGo); });
/* старые ссылки вида #page-5 ведут на лист основного урока */
const hash = location.hash.slice(1), page = hash.match(/^page-(\d+)$/);
if(page){
  try {
    const k = 'benbow-ledger-v1', s = JSON.parse(localStorage.getItem(k) || '{}');
    s.page = Math.max(0, +page[1] - 1); localStorage.setItem(k, JSON.stringify(s));
  } catch(e){}
  show('12');
} else {
  let saved = ''; try { saved = localStorage.getItem(KEY) || ''; } catch(e){}
  show(PARTS[hash] ? hash : (saved || '12'), !PARTS[hash]);
}
})();
</script>
</body>
</html>
