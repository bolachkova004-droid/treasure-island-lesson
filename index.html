spot, the captain said: “Ten o’clock!”', a:true, why:'Да: пираты дали ему срок до десяти вечера.' }\n  ],\n  pick:{\n    task:'Каким был слепой нищий? Нажми на все детали, которые \u003cb>действительно есть\u003c/b> в описании из главы III. Четыре детали здесь лишние.',\n    checkLabel:'Проверить портрет',\n    items:[\n      { id:'stick',  icon:'🦯', en:'a stick that he tapped',     ru:'палка, которой он постукивал', in:true },\n      { id:'shade',  icon:'🟩', en:'a green shade over his eyes', ru:'зелёный козырёк на глазах',    in:true },\n      { id:'cloak',  icon:'🧥', en:'an old sea-cloak with a hood', ru:'старый плащ с капюшоном',    in:true },\n      { id:'leg',    icon:'🦵', en:'a wooden leg',               ru:'деревянная нога',              in:false },\n      { id:'back',   icon:'🧓', en:'a bent back',                ru:'сгорбленная спина',            in:true },\n      { id:'parrot', icon:'🦜', en:'a parrot on his shoulder',   ru:'попугай на плече',             in:false },\n      { id:'grip',   icon:'✊', en:'a very strong grip',         ru:'очень сильная хватка',         in:true },\n      { id:'scar',   icon:'⚔️', en:'a sabre scar on his cheek',  ru:'шрам от сабли на щеке',        in:false },\n      { id:'voice',  icon:'🎵', en:'a strange sing-song voice',  ru:'странный певучий голос',       in:true },\n      { id:'coat',   icon:'🎩', en:'a fine new coat and hat',    ru:'новый нарядный камзол и шляпа', in:false }\n    ],\n    extra:'Лишние детали: деревянная нога (это одноногий моряк, которого боится капитан), попугай, шрам от сабли (он у самого капитана) и нарядная одежда — на слепом были лохмотья.',\n    frame:'“He had a … and he wore …” / “He didn’t have a …”',\n    teach:'Портрет тренирует had / wore / was + прилагательное. Попросите описать слепого по памяти, закрыв экран, а потом — описать героя любого фильма так, чтобы его угадали.'\n  },\n  gram:{\n    rules:'\u003cdiv class=\"rule-pair\">\u003cdiv class=\"rule\">\u003ch3>Просьба\u003c/h3>\u003cspan class=\"form\">ask somebody to do\u003c/span>' +\n      '\u003cp>“Bring me some rum, Jim.” → The captain \u003cb>asked Jim to bring\u003c/b> him some rum.\u003c/p>\u003c/div>' +\n      '\u003cdiv class=\"rule evt\">\u003ch3>Приказ или запрет\u003c/h3>\u003cspan class=\"form\">tell somebody (not) to do\u003c/span>' +\n      '\u003cp>“Don’t drink!” → The doctor \u003cb>told him not to drink\u003c/b>.\u003c/p>\u003c/div>\u003c/div>' +\n      '\u003cp class=\"note\" style=\"margin-bottom:18px\">⚠️ Без \u003cb>that\u003c/b> и без \u003cb>-ing\u003c/b>: told him \u003cb>to go\u003c/b>, а не told him that he go / told him going. Отрицание — \u003cb>not\u003c/b> перед to.\u003c/p>',\n    items:[\n      { pre:'The captain asked Jim', opts:['to bring','bring'], post:'him a glass of rum.', a:0, why:'ask somebody + to + глагол.' },\n      { pre:'The doctor told the captain', opts:['don’t drink','not to drink'], post:'any more rum.', a:1, why:'Запрет в косвенной речи: tell somebody NOT to do.' },\n      { pre:'The blind man told Jim', opts:['to take','taking'], post:'him to the captain.', a:0, why:'tell somebody + to + глагол, без -ing.' },\n      { pre:'Jim asked the blind man', opts:['let go','to let go'], post:'of his hand.', a:1, why:'После ask somebody нужен to: to let go.' },\n      { pre:'The captain told Jim', opts:['not to tell','to not telling'], post:'anyone about the chest.', a:0, why:'not стоит перед to: not to tell.' },\n      { pre:'“Hold out your left hand,” said the blind man. → He told Bill', opts:['that he holds out','to hold out'], post:'his left hand.', a:1, why:'Приказ: told + кого + to + глагол.' }\n    ],\n    writeTask:'Перескажи прямую речь \u003cb>косвенной\u003c/b>: told / asked + кого + (not) to + глагол.',\n    writes:[\n      { label:'“Take me to the captain,” the blind man said to Jim.', model:'The blind man told Jim to take him to the captain.', minWords:6,\n        checks:[{ re:/\\b(told|asked|ordered)\\b/, miss:'нет told или asked' }, { re:/\\bto take\\b/, miss:'нет to take' }] },\n      { label:'“Don’t drink rum,” the doctor said to the captain.', model:'The doctor told the captain not to drink rum.', minWords:6,\n        checks:[{ re:/\\b(told|asked|ordered)\\b/, miss:'нет told или asked' }, { re:/\\bnot to drink\\b/, miss:'нужно not to drink' }] }\n    ],\n    teach:'Цель узкая: просьбы и приказы в косвенной речи (ask / tell somebody to do). Сдвиг времён в утверждениях здесь не трогаем. Устный дрилл: вы говорите приказ («Close the door!»), студент пересказывает: “You told me to close the door.”'\n  },\n  talk:{\n    intro:'Капитан умоляет Джима принести ром, хотя доктор сказал, что ром его убьёт. \u003cb>Как поступить Джиму?\u003c/b>',\n    votes:[['yes','Принести ром','капитану плохо и страшно'],['no','Отказать','доктор сказал, что ром его убьёт'],['one','Только один стакан','так и сделал Джим']],\n    qs:[\n      'Should Jim bring the captain rum? Prove your answer with one detail from the chapter.',\n      'Why does the captain trust Jim and not the adults?',\n      'Why is the blind man so frightening, even though he can’t see?',\n      'Should Jim have refused to lead the blind man to the captain? Could he refuse?',\n      'How does Jim feel at the end of the chapter, after two deaths?'\n    ],\n    tw:['Ответь за 30 секунд.','Используй три выражения из задания 2.','Говори от лица капитана.','Перескажи чужие слова: “He asked me to…”','Поспорь со своим первым ответом.'],\n    frame:'\u003cb>A2:\u003c/b> “I think Jim should … because …” · \u003cb>B1:\u003c/b> “Even though the doctor told him not to …, Jim …”',\n    checks:['решение названо прямо','деталь из главы','три выражения из задания 2','одна просьба в косвенной речи: asked / told … to …'],\n    teach:'Дилемма «помочь или навредить» естественно раскрывается через косвенную речь: “The doctor told him… but the captain begged him…”. Сначала беглость, потом один комментарий по содержанию и один по языку.'\n  },\n  diary:{\n    task:'Ты — Джим. Вечером, когда приходил слепой, ты пишешь в дневник. \u003cb>50–90 слов\u003c/b>, минимум \u003cb>четыре выражения\u003c/b> из задания 2 и \u003cb>одна просьба или приказ в косвенной речи\u003c/b> (asked / told … to …). Подсветка ниже загорается сама.',\n    placeholder:'Dear diary, today was the worst day of my life…',\n    targets:[\n      { id:'beg',    label:'begged',           re:/\\bbeg(ged|s|ging)?\\b/ },\n      { id:'refuse', label:'refused',          re:/\\brefus(e|ed|es|ing)\\b/ },\n      { id:'after',  label:'be after',         re:/\\b(is|are|was|were|'re|'s) after\\b/ },\n      { id:'die',    label:'died suddenly',    re:/\\bdied suddenly\\b|\\bsuddenly died\\b/ },\n      { id:'lead',   label:'lead / led',       re:/\\b(lead|led|leads|leading)\\b/ },\n      { id:'grip',   label:'gripped',          re:/\\bgrip(ped|s|ping)?\\b/ },\n      { id:'letgo',  label:'let go of',        re:/\\blet(s)? go\\b/ },\n      { id:'tears',  label:'burst into tears', re:/\\bburst into tears\\b/ }\n    ],\n    hits:4, min:50, max:90,\n    extra:{ re:REPORTED, label:'asked / told … to', miss:'нет просьбы в косвенной речи (asked / told … to …)' },\n    model:'Dear diary, today was the worst day of my life. The captain begged me for some rum. At first I refused, because the doctor had told him not to drink. The captain said that Flint’s old crew was after his sea-chest. Then a blind man came along the road. He gripped my hand and told me to lead him to the captain. He didn’t let go of my hand. When the captain fell dead, I burst into tears.',\n    teach:'Устное обсуждение (задание 7) лучше провести до письма. При проверке смотрите на связность (first / then / suddenly / in the end) и на косвенную речь.'\n  },\n  exit:{\n    gaps:[\n      { pre:'The sick captain ', post:' Jim for a glass of rum.', ok:['begged','asked'] },\n      { pre:'At first Jim ', post:' to bring him any rum.', ok:['refused'] },\n      { pre:'“It’s my old sea-chest they’re ', post:',” said the captain.', ok:['after'] },\n      { pre:'That evening Jim’s father died ', post:'.', ok:['suddenly'] },\n      { pre:'The blind man ', post:' Jim’s hand like a vice.', ok:['gripped','grabbed','held'] },\n      { pre:'He told Jim to ', post:' him to the captain.', ok:['take','lead','bring'] },\n      { pre:'When the captain fell dead, Jim burst into ', post:'.', ok:['tears'] }\n    ],\n    button:'Снять метку', idle:'Чёрная метка ещё не снята', passText:'Глава III пройдена!',\n    cando:['Я могу пересказать главу III по порядку.','Я могу описать слепого нищего.','Я могу передать чужую просьбу: He asked me to …'],\n    teach:'5 из 7 и выше — тема закрыта, можно переходить к главе IV. Меньше — повторите задание 2 через сутки и снова сделайте этот лист.'\n  },\n  home:{\n    tr:[\n      { ru:'Капитан умолял Джима принести ему рома.', must:[/\\bbegged\\b/], tip:'beg somebody to do / for something', model:'The captain begged Jim to bring him some rum.' },\n      { ru:'Сначала Джим отказался.', must:[/\\brefused\\b/], tip:'refuse → refused', model:'At first Jim refused.' },\n      { ru:'Пираты охотятся за сундуком капитана.', must:[/\\bafter\\b/, /\\bchest\\b/], tip:'be after something', model:'The pirates are after the captain’s chest.' },\n      { ru:'Слепой крепко схватил Джима за руку.', must:[/\\b(gripped|grabbed)\\b/], tip:'grip → gripped', model:'The blind man gripped Jim’s hand.' },\n      { ru:'Он велел Джиму отвести его к капитану.', must:[/\\btold jim to (take|lead|bring)\\b/], tip:'tell somebody to do', model:'He told Jim to take him to the captain.' },\n      { ru:'Джим расплакался.', must:[/\\bburst into tears\\b/], tip:'burst into tears', model:'Jim burst into tears.' }\n    ],\n    brTitle:'Просьбы и приказы в косвенной речи',\n    brNote:'Впиши глагол в нужной форме: \u003cb>to + глагол\u003c/b> или \u003cb>not to + глагол\u003c/b>.',\n    br:[\n      { pre:'The captain asked Jim', verb:'bring', post:'him some rum.', ok:['to bring'], why:'ask somebody to do' },\n      { pre:'The doctor told him', verb:'not / drink', post:'any rum.', ok:['not to drink'], why:'запрет: not to + глагол' },\n      { pre:'The blind man told Jim', verb:'take', post:'him inside.', ok:['to take'], why:'tell somebody to do' },\n      { pre:'Jim asked him', verb:'let', post:'go of his hand.', ok:['to let'], why:'ask somebody to do' },\n      { pre:'The captain asked Jim', verb:'not / tell', post:'anyone about the chest.', ok:['not to tell'], why:'запрет: not to + глагол' },\n      { pre:'My mum asked me', verb:'stay', post:'at home tonight.', ok:['to stay'], why:'ask somebody to do' }\n    ],\n    dict:[\n      'The captain asked Jim for a glass of rum.',\n      'Jim’s father died suddenly that evening.',\n      'The blind man tapped the road with his stick.',\n      'He fell to the floor and never got up again.'\n    ],\n    prompt:{ title:'Что сделают Джим и мама?',\n      html:'Капитан мёртв, в его комнате стоит сундук, а капитан был должен трактиру деньги. Напиши прогноз к главе IV: что сделают Джим и мама, кто им поможет, что случится в десять вечера.',\n      frames:'I think Jim and his mother will… · They might… · Somebody will probably… · At ten o’clock…',\n      placeholder:'I think Jim and his mother will…' },\n    checklist:['Прочитать главу IV «The Sea-Chest» и проверить свой прогноз из части D. \u003ca href=\"chapter-4.html\">задания к главе IV →\u003c/a>',\n      'Пройти тренажёр слов: любой набор, «Найди ошибку» хотя бы на две звезды. \u003ca href=\"a2-words.html\">открыть тренажёр →\u003c/a>',\n      'Рассказать вслух за одну минуту, что случилось в главе III, не глядя в текст.']\n  }\n};\n\u003c/script>\n\u003cscript>\n/* Движок страниц с главами Treasure Island.\n   Каждая страница главы задаёт window.CHAPTER (тексты и ответы),\n   а здесь — шапка, десять заданий, проверки и сохранение прогресса. */\n(() => {\n'use strict';\nconst C = window.CHAPTER;\nconst app = document.getElementById('app');\n\n/* ============ разметка страницы ============ */\nconst NAV = [['III','chapter-3.html'],['IV','chapter-4.html'],['V','chapter-5.html']];\napp.innerHTML =\n  '\u003cdiv class=\"wrap\">\u003cheader class=\"top\">\u003cdiv>' +\n  '\u003cspan class=\"mark\">TREASURE ISLAND · ГЛАВА ' + C.num + '\u003c/span>' +\n  '\u003ch1>' + C.title + '\u003ci>' + C.titleRu + '\u003c/i>\u003c/h1>\u003cp>' + C.intro + '\u003c/p>' +\n  '\u003cdiv class=\"progress\">\u003cspan>Выполнено\u003c/span>\u003cdiv class=\"bar\">\u003ci id=\"progFill\">\u003c/i>\u003c/div>\u003cspan id=\"progText\">0 / 10\u003c/span>\u003c/div>' +\n  '\u003cnav class=\"chapters\" aria-label=\"Главы\">' + NAV.map(([n, href]) => '\u003ca href=\"' + href + '\" class=\"' + (n === C.num ? 'on' : '') + '\">Глава ' + n + '\u003c/a>').join('') + '\u003c/nav>' +\n  '\u003cdiv class=\"top-links\">\u003ca href=\"index.html\">← Главы I–II\u003c/a>\u003ca href=\"a2-words.html\">Тренажёр слов A2\u003c/a>\u003ca href=\"#\" id=\"voiceBtn\" role=\"button\">🔊 Голос\u003c/a>\u003c/div>' +\n  '\u003c/div>' + C.art + '\u003c/header>' +\n  '\u003cnav class=\"steps\" id=\"steps\" aria-label=\"Задания главы ' + C.num + '\">\u003c/nav>' +\n  '\u003cmain class=\"stage\" id=\"stage\" aria-live=\"polite\">\u003c/main>\u003c/div>' +\n  '\u003cdiv class=\"foot\">\u003cbutton class=\"btn ghost\" id=\"prevBtn\">← Назад\u003c/button>\u003cspan class=\"mid\" id=\"footLabel\">\u003c/span>\u003cbutton class=\"btn go\" id=\"nextBtn\">Дальше →\u003c/button>\u003c/div>' +\n  '\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>';\n\n/* ============ состояние ============ */\nlet S = { step:0, done:[], predict:[], order:[], quiz:null, truth:{}, chest:{}, chestChecked:false,\n  gram:{}, gw:[], vote:'', talkQ:0, talkT:-1, req:[], diary:'', gaps:{}, hw:null };\ntry { S = { ...S, ...JSON.parse(localStorage.getItem(C.key) || '{}') }; } catch(e){}\n['done','predict','order','req','gw'].forEach(k => { if(!Array.isArray(S[k])) S[k] = []; });\nwhile(S.gw.length \u003c C.gram.writes.length) S.gw.push('');\nif(S.order.length !== C.events.length) S.order = C.order0.slice();\n['truth','chest','gram','gaps'].forEach(k => { if(!S[k] || typeof S[k] !== 'object') S[k] = {}; });\nS.hw = { tr:{}, br:{}, dc:{}, txt:'', chk:[], ...(S.hw && typeof S.hw === 'object' ? S.hw : {}) };\nconst save = () => { try { localStorage.setItem(C.key, JSON.stringify(S)); } catch(e){} };\n\n/* ============ помощники ============ */\nconst $ = id => document.getElementById(id);\nconst stage = $('stage');\nconst clean = s => (s || '').toLowerCase().replace(/[’']/g, \"'\").replace(/[^a-z0-9'\\s-]/g, ' ').replace(/\\s+/g, ' ').trim();\nconst shuffle = a => { a = [...a]; for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };\nconst esc = s => String(s).replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/\"/g,'&quot;');\nconst countWords = v => v ? v.split(' ').length : 0;\nfunction toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }\nfunction speak(text, rate){ if(window.TTS) TTS.speak(text, rate); else toast('Озвучка не загрузилась — обнови страницу'); }\nlet actx = null;\nfunction blip(freq, dur, type){\n  try{\n    actx = actx || new (window.AudioContext || window.webkitAudioContext)();\n    const o = actx.createOscillator(), g = actx.createGain();\n    o.type = type || 'triangle'; o.frequency.value = freq;\n    g.gain.setValueAtTime(.0001, actx.currentTime);\n    g.gain.exponentialRampToValueAtTime(.12, actx.currentTime + .02);\n    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + (dur || .18));\n    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + (dur || .18) + .02);\n  } catch(e){}\n}\nconst good = () => { blip(660,.12); setTimeout(() => blip(990,.16), 90); };\nconst bad = () => blip(180,.22,'sawtooth');\nconst teach = text => '\u003cdetails class=\"teach\">\u003csummary>🎓 Для преподавателя\u003c/summary>\u003cp>' + text + '\u003c/p>\u003c/details>';\n\nconst STEPS = [\n  { id:'recap', render:recap }, { id:'words', render:words }, { id:'chain', render:chain }, { id:'truth', render:truth },\n  { id:'chest', render:pick }, { id:'gram', render:gram }, { id:'talk', render:talk }, { id:'diary', render:diary },\n  { id:'exit', render:exit }, { id:'home', render:homework }\n].map((st, i) => ({ ...st, ...C.steps[i] }));\n\nfunction complete(id){\n  if(S.done.includes(id)) return;\n  S.done.push(id); save(); renderSteps(); good();\n  toast('Задание выполнено: ' + STEPS.find(s => s.id === id).short + ' ✓');\n}\n\n/* ============ навигация ============ */\nfunction renderSteps(){\n  $('steps').innerHTML = STEPS.map((st, i) =>\n    '\u003cbutton class=\"step ' + (i === S.step ? 'on ' : '') + (S.done.includes(st.id) ? 'done' : '') + '\" data-step=\"' + i + '\" aria-current=\"' + (i === S.step) + '\">' +\n    '\u003cb>\u003cem>' + (i + 1) + '\u003c/em>\u003c/b>\u003cspan>' + st.short + '\u003c/span>\u003c/button>').join('');\n  const n = S.done.length;\n  $('progFill').style.width = Math.round(n / STEPS.length * 100) + '%';\n  $('progText').textContent = n + ' / ' + STEPS.length;\n  const on = $('steps').querySelector('.step.on');\n  if(on && $('steps').scrollWidth > $('steps').clientWidth) $('steps').scrollLeft = on.offsetLeft - 40;\n}\n$('steps').addEventListener('click', e => { const b = e.target.closest('[data-step]'); if(b) go(+b.dataset.step); });\nfunction go(i){\n  if(window.TTS && TTS.stop) TTS.stop();\n  S.step = Math.max(0, Math.min(STEPS.length - 1, i)); save();\n  try { history.replaceState(null, '', '#task-' + (S.step + 1)); } catch(e){}\n  show();\n  stage.scrollIntoView({ block:'start' });\n}\nfunction show(){\n  const st = STEPS[S.step];\n  renderSteps();\n  stage.innerHTML = '\u003cdiv class=\"pop\">\u003cdiv class=\"head\">\u003cdiv>\u003cp class=\"kicker\">Задание ' + (S.step + 1) + ' · ' + st.kicker + '\u003c/p>\u003ch2>' + st.title + '\u003c/h2>\u003c/div>\u003cspan class=\"stamp\">' + st.min + '\u003c/span>\u003c/div>\u003cdiv id=\"body\">\u003c/div>\u003c/div>';\n  st.render($('body'));\n  $('prevBtn').disabled = S.step === 0;\n  $('nextBtn').textContent = S.step === STEPS.length - 1 ? 'К заданию 1 ↺' : 'Дальше →';\n  $('footLabel').textContent = 'Задание ' + (S.step + 1) + ' из ' + STEPS.length + ' · ' + st.short;\n}\n$('prevBtn').addEventListener('click', () => go(S.step - 1));\n$('nextBtn').addEventListener('click', () => go(S.step === STEPS.length - 1 ? 0 : S.step + 1));\n$('voiceBtn').addEventListener('click', e => { e.preventDefault(); if(window.TTS) TTS.openPicker(); });\n\n/* ============ 1. прогноз ============ */\nfunction recap(el){\n  const R = C.recap, items = C.pick.items, N = R.pickN || 3;\n  el.innerHTML = '\u003cdiv class=\"note\">' + R.html + '\u003c/div>' +\n    '\u003cp class=\"task\" style=\"margin-top:16px\">' + R.task + '\u003c/p>' +\n    '\u003cdiv class=\"opts\" id=\"predict\">' + items.map(c =>\n      '\u003cbutton class=\"opt ' + (S.predict.includes(c.id) ? 'pick' : '') + '\" data-p=\"' + c.id + '\">\u003cspan style=\"font-size:24px\">' + c.icon + '\u003c/span>\u003cspan>' + c.en + '\u003csmall>' + c.ru + '\u003c/small>\u003c/span>\u003c/button>').join('') + '\u003c/div>' +\n    '\u003cdiv class=\"status\" id=\"pStatus\">\u003c/div>' +\n    '\u003cdiv class=\"frame\">\u003cb>Скажи вслух:\u003c/b> ' + R.frame + '\u003c/div>' + teach(R.teach);\n  const upd = () => {\n    $('pStatus').textContent = S.predict.length === N ? R.doneText : 'Выбрано: ' + S.predict.length + ' из ' + N;\n    $('pStatus').className = 'status' + (S.predict.length === N ? ' ok' : '');\n  };\n  el.querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => {\n    const id = b.dataset.p;\n    S.predict = S.predict.includes(id) ? S.predict.filter(x => x !== id) : [...S.predict, id].slice(-N);\n    save();\n    el.querySelectorAll('[data-p]').forEach(x => x.classList.toggle('pick', S.predict.includes(x.dataset.p)));\n    upd();\n    if(S.predict.length === N) complete('recap');\n  }));\n  upd();\n}\n\n/* ============ 2. слова ============ */\nfunction words(el){\n  const W = C.words.items;\n  el.innerHTML =\n    '\u003cp class=\"task\">' + W.length + ' выражений из главы, которые пригодятся и в обычной речи. Сначала прочитай пример и попробуй догадаться о значении, потом открой перевод. В конце — быстрая проверка.\u003c/p>' +\n    '\u003cdiv class=\"cards\">' + W.map(w =>\n      '\u003carticle class=\"card\">\u003ch3 class=\"term\">' + w.en + '\u003c/h3>\u003cp class=\"ex\">' + w.ex + '\u003c/p>\u003cp class=\"ru\" id=\"ru-' + w.id + '\">' + w.ru + '\u003c/p>' +\n      '\u003cdiv class=\"acts\">\u003cbutton data-say=\"' + esc(w.ex) + '\">🔊\u003c/button>\u003cbutton data-ru=\"' + w.id + '\">перевод\u003c/button>\u003c/div>\u003c/article>').join('') + '\u003c/div>' +\n    '\u003cdiv class=\"note ballast\">\u003cb>Понять и отпустить (в активный запас не идут):\u003c/b> ' + C.words.ballast + '\u003c/div>' +\n    '\u003cdiv class=\"quiz\" id=\"quiz\">\u003c/div>' +\n    teach('Сначала пример, потом догадка, потом перевод. В проверке слова идут в случайном порядке; 6 из 8 и выше — можно переходить к говорению, ниже — повторить карточки.');\n  el.querySelectorAll('[data-say]').forEach(b => b.addEventListener('click', () => speak(b.dataset.say, .85)));\n  el.querySelectorAll('[data-ru]').forEach(b => b.addEventListener('click', () => $('ru-' + b.dataset.ru).classList.toggle('open')));\n  quizStart();\n}\nfunction quizStart(){\n  const box = $('quiz'), n = C.words.items.length;\n  if(S.quiz !== null){\n    box.innerHTML = '\u003cp class=\"quiz-q\">\u003csmall>Проверка пройдена\u003c/small>' + S.quiz + ' из ' + n + '\u003c/p>\u003cdiv class=\"row\" style=\"justify-content:center\">\u003cbutton class=\"btn ghost small\" id=\"qAgain\">Пройти ещё раз\u003c/button>\u003c/div>';\n    $('qAgain').addEventListener('click', () => { S.quiz = null; save(); quizRun(); });\n    return;\n  }\n  box.innerHTML = '\u003cp class=\"quiz-q\">\u003csmall>Быстрая проверка\u003c/small>Русское значение → английское выражение\u003c/p>\u003cdiv class=\"row\" style=\"justify-content:center\">\u003cbutton class=\"btn warm\" id=\"qGo\">Начать проверку\u003c/button>\u003c/div>';\n  $('qGo').addEventListener('click', quizRun);\n}\nfunction quizRun(){\n  const W = C.words.items, box = $('quiz'), items = shuffle(W), pass = Math.ceil(W.length * .75);\n  let n = 0, score = 0, locked = false;\n  const next = () => {\n    if(n >= items.length){ S.quiz = score; save(); if(score >= pass) complete('words'); else toast('Повтори карточки и попробуй ещё раз'); quizStart(); return; }\n    locked = false;\n    const w = items[n], opts = shuffle([w, ...shuffle(W.filter(x => x !== w)).slice(0, 3)]);\n    box.innerHTML = '\u003cp class=\"quiz-q pop\">\u003csmall>' + (n + 1) + ' из ' + items.length + '\u003c/small>' + w.ru + '\u003c/p>' +\n      '\u003cdiv class=\"opts\">' + opts.map(o => '\u003cbutton class=\"opt\" data-q=\"' + o.id + '\">' + o.en + '\u003c/button>').join('') + '\u003c/div>\u003cdiv class=\"status\" id=\"qFb\">\u003c/div>';\n    box.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => {\n      if(locked) return; locked = true;\n      const ok = b.dataset.q === w.id;\n      box.querySelectorAll('[data-q]').forEach(x => { if(x.dataset.q === w.id) x.classList.add('hit'); });\n      if(ok){ score++; good(); } else { b.classList.add('miss'); bad(); }\n      $('qFb').className = 'status ' + (ok ? 'ok' : 'no');\n      $('qFb').textContent = w.ex;\n      speak(w.ex, .9);\n      n++; setTimeout(next, ok ? 1300 : 2300);\n    }));\n  };\n  next();\n}\n\n/* ============ 3. цепь ============ */\nfunction chain(el){\n  const E = C.events;\n  el.innerHTML = '\u003cp class=\"task\">Расставь ' + E.length + ' событий главы по порядку. \u003cb>Книгу не открывай\u003c/b> — вспоминай. Стрелки двигают строку вверх и вниз.\u003c/p>' +\n    '\u003cdiv class=\"chain\" id=\"chain\">\u003c/div>' +\n    '\u003cdiv class=\"row\" style=\"margin-top:14px\">\u003cbutton class=\"btn warm\" id=\"chCheck\">Проверить порядок\u003c/button>\u003cbutton class=\"btn ghost\" id=\"chMix\">Перемешать\u003c/button>\u003c/div>' +\n    '\u003cdiv class=\"status\" id=\"chStatus\">\u003c/div>' +\n    teach('После проверки — пересказ цепочки за 40 секунд со словами first / then / after that / suddenly / in the end. Ошибки во время пересказа не исправляйте, запишите две и вернитесь к ним в задании 6.');\n  const draw = () => {\n    $('chain').innerHTML = S.order.map((n, pos) =>\n      '\u003cdiv class=\"link\" data-pos=\"' + pos + '\">\u003cspan>' + E[n] + '\u003c/span>\u003cdiv class=\"arrows\">\u003cbutton data-mv=\"-1\" aria-label=\"Выше\">↑\u003c/button>\u003cbutton data-mv=\"1\" aria-label=\"Ниже\">↓\u003c/button>\u003c/div>\u003c/div>').join('');\n    $('chain').querySelectorAll('[data-mv]').forEach(b => b.addEventListener('click', () => {\n      const p = +b.closest('.link').dataset.pos, q = p + +b.dataset.mv;\n      if(q \u003c 0 || q >= S.order.length) return;\n      [S.order[p], S.order[q]] = [S.order[q], S.order[p]]; save(); draw(); $('chStatus').textContent = '';\n    }));\n  };\n  draw();\n  $('chCheck').addEventListener('click', () => {\n    const all = S.order.every((n, i) => n === i);\n    [...$('chain').children].forEach((row, i) => { row.classList.remove('ok','no'); row.classList.add(S.order[i] === i ? 'ok' : 'no'); });\n    $('chStatus').className = 'status ' + (all ? 'ok' : 'no');\n    $('chStatus').textContent = all ? 'Верно! Перескажи главу за 40 секунд: first, then, suddenly, in the end.' : 'Есть сбой. ' + C.chainHint;\n    if(all) complete('chain'); else bad();\n  });\n  $('chMix').addEventListener('click', () => { S.order = shuffle(S.order); save(); draw(); $('chStatus').textContent = ''; });\n}\n\n/* ============ 4. правда или ложь ============ */\nfunction truth(el){\n  const T = C.truth;\n  el.innerHTML = '\u003cp class=\"task\">' + T.length + ' утверждений о главе. Отметь \u003cb>True\u003c/b> или \u003cb>False\u003c/b>. После ответа появится объяснение — прочитай его, даже если ответ верный.\u003c/p>\u003cdiv id=\"tfList\">\u003c/div>\u003cdiv class=\"status\" id=\"tfStatus\">\u003c/div>' +\n    teach('Для неверных утверждений просите исправить фразу вслух по-английски: “No, he didn’t. He…”. Это тренирует отрицания в Past Simple.');\n  const draw = () => {\n    $('tfList').innerHTML = T.map((q, i) => {\n      const ans = S.truth[i];\n      const cls = v => ans === undefined ? '' : (v === q.a ? 'right' : (ans === v ? 'wrong' : ''));\n      return '\u003cdiv class=\"tf\">\u003cspan>' + (i + 1) + '. ' + q.t + '\u003c/span>\u003cdiv class=\"pair\">' +\n        '\u003cbutton class=\"' + cls(true) + '\" data-tf=\"' + i + '\" data-v=\"1\">True\u003c/button>\u003cbutton class=\"' + cls(false) + '\" data-tf=\"' + i + '\" data-v=\"0\">False\u003c/button>\u003c/div>' +\n        (ans !== undefined ? '\u003cdiv class=\"why\">' + (ans === q.a ? '✓ ' : '✗ ') + q.why + '\u003c/div>' : '') + '\u003c/div>';\n    }).join('');\n    $('tfList').querySelectorAll('[data-tf]').forEach(b => b.addEventListener('click', () => {\n      const i = +b.dataset.tf; if(S.truth[i] !== undefined) return;\n      S.truth[i] = b.dataset.v === '1'; save();\n      (S.truth[i] === T[i].a ? good : bad)();\n      draw();\n    }));\n    const done = Object.keys(S.truth).length, right = T.filter((q, i) => S.truth[i] === q.a).length;\n    $('tfStatus').className = 'status' + (done === T.length ? ' ok' : '');\n    $('tfStatus').innerHTML = done === T.length\n      ? 'Верно: ' + right + ' из ' + T.length + '. \u003cbutton class=\"btn ghost small\" id=\"tfReset\" style=\"margin-left:8px\">Заново\u003c/button>'\n      : 'Отвечено: ' + done + ' из ' + T.length;\n    if(done === T.length){\n      $('tfReset').addEventListener('click', () => { S.truth = {}; save(); draw(); });\n      complete('truth');\n    }\n  };\n  draw();\n}\n\n/* ============ 5. выбор деталей ============ */\nfunction pick(el){\n  const P = C.pick, items = P.items, outN = items.filter(c => !c.in).length;\n  el.innerHTML = '\u003cp class=\"task\">' + P.task + '\u003c/p>' +\n    '\u003cdiv class=\"chest\" id=\"chestGrid\">\u003c/div>' +\n    '\u003cdiv class=\"row\" style=\"margin-top:16px\">\u003cbutton class=\"btn warm\" id=\"chCheck2\">' + P.checkLabel + '\u003c/button>\u003cbutton class=\"btn ghost\" id=\"chReset\">Начать заново\u003c/button>\u003c/div>' +\n    '\u003cdiv class=\"status\" id=\"chestStatus\">\u003c/div>' +\n    '\u003cdiv class=\"frame\">\u003cb>Скажи вслух:\u003c/b> ' + P.frame + '\u003c/div>' + teach(P.teach);\n  const draw = () => {\n    $('chestGrid').innerHTML = items.map(c => {\n      const picked = !!S.chest[c.id];\n      const cls = S.chestChecked ? (picked === c.in ? 'right' : 'wrong') : (picked ? 'in' : '');\n      return '\u003cbutton class=\"item ' + cls + '\" data-c=\"' + c.id + '\" aria-pressed=\"' + picked + '\">\u003ci>' + c.icon + '\u003c/i>\u003cb>' + c.en + '\u003c/b>\u003cspan>' + c.ru + '\u003c/span>\u003c/button>';\n    }).join('');\n    $('chestGrid').querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => {\n      if(S.chestChecked) return;\n      S.chest[b.dataset.c] = !S.chest[b.dataset.c]; save(); draw();\n    }));\n  };\n  const report = () => {\n    const right = items.filter(c => !!S.chest[c.id] === c.in).length;\n    const hits = S.predict.filter(id => (items.find(c => c.id === id) || {}).in).length;\n    const ok = right >= items.length - 2;\n    $('chestStatus').className = 'status ' + (ok ? 'ok' : 'no');\n    $('chestStatus').innerHTML = 'Верно: ' + right + ' из ' + items.length + '. ' +\n      (S.predict.length === (C.recap.pickN || 3) ? 'Твой прогноз угадал ' + hits + ' из ' + S.predict.length + '. ' : '') + P.extra;\n    if(ok) complete('chest');\n  };\n  draw();\n  if(S.chestChecked) report();\n  $('chCheck2').addEventListener('click', () => { S.chestChecked = true; save(); draw(); report(); });\n  $('chReset').addEventListener('click', () => { S.chestChecked = false; S.chest = {}; save(); draw(); $('chestStatus').textContent = ''; });\n  if(outN === 0) console.warn('pick: no distractors');\n}\n\n/* ============ 6. грамматика ============ */\nfunction gram(el){\n  const G = C.gram;\n  el.innerHTML = G.rules +\n    '\u003cp class=\"task\">Выбери правильную форму.\u003c/p>\u003cdiv id=\"gList\">\u003c/div>\u003cdiv class=\"status\" id=\"gStatus\">\u003c/div>' +\n    '\u003ch3 style=\"font-size:21px;margin:22px 0 10px\">Now write it yourself\u003c/h3>' +\n    '\u003cp class=\"task\">' + G.writeTask + '\u003c/p>' +\n    '\u003cdiv id=\"gWrite\">\u003c/div>\u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"btn warm\" id=\"gwCheck\">Проверить предложения\u003c/button>\u003c/div>' + teach(G.teach);\n  const draw = () => {\n    $('gList').innerHTML = G.items.map((g, i) => {\n      const ans = S.gram[i];\n      return '\u003cdiv class=\"gline\">\u003cspan>' + (i + 1) + '. ' + g.pre + ' \u003cb>…\u003c/b> ' + g.post + '\u003c/span>\u003cdiv class=\"pair\">' +\n        g.opts.map((o, n) => '\u003cbutton class=\"' + (ans === undefined ? '' : n === g.a ? 'right' : ans === n ? 'wrong' : '') + '\" data-g=\"' + i + '\" data-o=\"' + n + '\">' + o + '\u003c/button>').join('') +\n        '\u003c/div>' + (ans !== undefined ? '\u003cdiv class=\"why\">' + (ans === g.a ? '✓ ' : '✗ ') + g.why + '\u003c/div>' : '') + '\u003c/div>';\n    }).join('');\n    $('gList').querySelectorAll('[data-g]').forEach(b => b.addEventListener('click', () => {\n      const i = +b.dataset.g; if(S.gram[i] !== undefined) return;\n      S.gram[i] = +b.dataset.o; save(); (S.gram[i] === G.items[i].a ? good : bad)(); draw(); checkDone();\n    }));\n    const done = Object.keys(S.gram).length, right = G.items.filter((g, i) => S.gram[i] === g.a).length;\n    $('gStatus').className = 'status' + (done === G.items.length ? ' ok' : '');\n    $('gStatus').innerHTML = done === G.items.length ? 'Верно: ' + right + ' из ' + G.items.length + ' \u003cbutton class=\"btn ghost small\" id=\"gReset\" style=\"margin-left:8px\">Заново\u003c/button>' : 'Отвечено: ' + done + ' из ' + G.items.length;\n    if($('gReset')) $('gReset').addEventListener('click', () => { S.gram = {}; save(); draw(); });\n  };\n  $('gWrite').innerHTML = G.writes.map((w, i) =>\n    '\u003cdiv class=\"write\" data-w=\"' + i + '\">\u003cdiv class=\"q\">' + w.label + '\u003c/div>\u003cinput class=\"field\" data-gw=\"' + i + '\" autocomplete=\"off\" spellcheck=\"false\">\u003cdiv class=\"fb\" data-wfb=\"' + i + '\">\u003c/div>\u003c/div>').join('');\n  $('gWrite').querySelectorAll('[data-gw]').forEach(inp => {\n    const i = +inp.dataset.gw; inp.value = S.gw[i] || '';\n    inp.addEventListener('input', () => { S.gw[i] = inp.value; save(); });\n  });\n  const problems = (w, v) => {\n    const miss = w.checks.filter(c => !c.re.test(v)).map(c => c.miss);\n    if(countWords(v) \u003c (w.minWords || 6)) miss.push('слишком коротко');\n    return miss;\n  };\n  function checkDone(){\n    if(Object.keys(S.gram).length === G.items.length && G.writes.every((w, i) => problems(w, clean(S.gw[i])).length === 0)) complete('gram');\n  }\n  $('gwCheck').addEventListener('click', () => {\n    G.writes.forEach((w, i) => {\n      const v = clean(S.gw[i]), box = document.querySelector('[data-w=\"' + i + '\"]'), fb = document.querySelector('[data-wfb=\"' + i + '\"]');\n      if(!v){ box.classList.remove('ok','no'); fb.textContent = 'Пусто.'; return; }\n      const miss = problems(w, v), ok = !miss.length;\n      box.classList.toggle('ok', ok); box.classList.toggle('no', !ok);\n      fb.innerHTML = (ok ? 'Конструкция на месте.' : 'Пока не так: ' + miss.join(', ') + '.') + '\u003cspan class=\"model\">Пример: ' + w.model + '\u003c/span>';\n    });\n    checkDone();\n    if(Object.keys(S.gram).length \u003c G.items.length) toast('Не забудь выбрать формы в предложениях выше');\n  });\n  draw();\n}\n\n/* ============ 7. разговор ============ */\nlet clockInt = null, clockLeft = 60;\nfunction talk(el){\n  const T = C.talk;\n  el.innerHTML =\n    '\u003cp class=\"task\">' + T.intro + '\u003c/p>' +\n    '\u003cdiv class=\"grid2\">\u003cdiv class=\"slab\">\u003ch3>Твой вердикт\u003c/h3>\u003cdiv class=\"opts\" style=\"grid-template-columns:1fr\" id=\"vote\">' +\n    T.votes.map(([id, t, d]) => '\u003cbutton class=\"opt ' + (S.vote === id ? 'pick' : '') + '\" data-vote=\"' + id + '\">\u003cspan>' + t + '\u003csmall>' + d + '\u003c/small>\u003c/span>\u003c/button>').join('') + '\u003c/div>' +\n    '\u003cdiv class=\"frame\">' + T.frame + '\u003c/div>\u003c/div>' +\n    '\u003cdiv class=\"slab\">\u003ch3>Одна минута\u003c/h3>\u003cp class=\"note\" style=\"padding:8px 10px\">Говори без чтения с экрана. Потом отметь, что получилось.\u003c/p>' +\n    '\u003cdiv class=\"clock\">\u003cb id=\"clockFace\">01:00\u003c/b>\u003cdiv class=\"row\" style=\"justify-content:center;margin-top:8px\">\u003cbutton class=\"btn small\" id=\"clockGo\">Старт\u003c/button>\u003cbutton class=\"btn small ghost\" id=\"clockReset\">Сброс\u003c/button>\u003c/div>\u003c/div>' +\n    '\u003cdiv style=\"margin-top:12px\">' + T.checks.map((t, i) =>\n      '\u003clabel class=\"check\">\u003cinput type=\"checkbox\" data-req=\"' + i + '\" ' + (S.req[i] ? 'checked' : '') + '> ' + t + '\u003c/label>').join('') + '\u003c/div>\u003c/div>\u003c/div>' +\n    '\u003cdiv class=\"talk\">\u003cdiv>\u003cp class=\"kicker\" style=\"color:#ffe1b8\">Пауза на разговор\u003c/p>\u003ch3>Pick a side\u003c/h3>\u003cp>Вытяни карту, ответь и задай один встречный вопрос.\u003c/p>\u003c/div>' +\n    '\u003cdiv class=\"talk-card\">\u003cp class=\"talk-q\" id=\"talkQ\">\u003c/p>\u003cdiv class=\"row\">\u003cbutton class=\"btn small\" id=\"talkDraw\">другая карта\u003c/button>\u003cbutton class=\"btn small ghost\" id=\"talkTwist\">поворот\u003c/button>\u003c/div>\u003cdiv class=\"twist\" id=\"talkTw\" hidden>\u003c/div>\u003c/div>\u003c/div>' +\n    teach(T.teach);\n  const drawTalk = () => {\n    $('talkQ').textContent = T.qs[S.talkQ % T.qs.length];\n    $('talkTw').hidden = S.talkT \u003c 0;\n    if(S.talkT >= 0) $('talkTw').textContent = T.tw[S.talkT % T.tw.length];\n  };\n  drawTalk();\n  $('talkDraw').addEventListener('click', () => { S.talkQ = (S.talkQ + 1 + Math.floor(Math.random() * (T.qs.length - 1))) % T.qs.length; S.talkT = -1; save(); drawTalk(); });\n  $('talkTwist').addEventListener('click', () => { let n = Math.floor(Math.random() * T.tw.length); if(n === S.talkT) n = (n + 1) % T.tw.length; S.talkT = n; save(); drawTalk(); });\n  const maybeDone = () => { if(S.vote && S.req.filter(Boolean).length >= 3) complete('talk'); };\n  el.querySelectorAll('[data-vote]').forEach(b => b.addEventListener('click', () => {\n    S.vote = b.dataset.vote; save();\n    el.querySelectorAll('[data-vote]').forEach(x => x.classList.toggle('pick', x.dataset.vote === S.vote));\n    maybeDone();\n  }));\n  el.querySelectorAll('[data-req]').forEach(c => c.addEventListener('change', () => { S.req[+c.dataset.req] = c.checked; save(); maybeDone(); }));\n  const face = () => { $('clockFace').textContent = '0' + Math.floor(clockLeft / 60) + ':' + String(clockLeft % 60).padStart(2, '0'); };\n  clearInterval(clockInt); clockInt = null; clockLeft = 60; face();\n  $('clockGo').addEventListener('click', () => {\n    if(clockInt){ clearInterval(clockInt); clockInt = null; $('clockGo').textContent = 'Продолжить'; return; }\n    if(clockLeft \u003c= 0) clockLeft = 60;\n    $('clockGo').textContent = 'Пауза';\n    clockInt = setInterval(() => {\n      clockLeft--; face();\n      if(clockLeft \u003c= 0){ clearInterval(clockInt); clockInt = null; $('clockGo').textContent = 'Ещё раз'; blip(880,.3); toast('Время! Договори начатое предложение.'); }\n    }, 1000);\n  });\n  $('clockReset').addEventListener('click', () => { clearInterval(clockInt); clockInt = null; clockLeft = 60; face(); $('clockGo').textContent = 'Старт'; });\n}\n\n/* ============ 8. дневник ============ */\nfunction diary(el){\n  const D = C.diary;\n  el.innerHTML =\n    '\u003cp class=\"task\">' + D.task + '\u003c/p>' +\n    '\u003cdiv class=\"targets\" id=\"dTargets\">\u003c/div>' +\n    '\u003ctextarea class=\"field\" id=\"dText\" placeholder=\"' + esc(D.placeholder) + '\">\u003c/textarea>' +\n    '\u003cdiv class=\"meter-row\">\u003cspan>Слов: \u003cb id=\"dWords\">0\u003c/b>\u003c/span>\u003cspan>Выражений: \u003cb id=\"dHits\">0\u003c/b> / ' + D.hits + '\u003c/span>\u003cspan>' + D.extra.label + ': \u003cb id=\"dPc\">нет\u003c/b>\u003c/span>\u003c/div>' +\n    '\u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"btn warm\" id=\"dCheck\">Сдать запись\u003c/button>\u003cbutton class=\"btn ghost small\" id=\"dModel\">Показать образец\u003c/button>\u003cbutton class=\"btn ghost small\" id=\"dCopy\">Скопировать текст\u003c/button>\u003c/div>' +\n    '\u003cdiv class=\"status\" id=\"dStatus\">\u003c/div>\u003cdiv class=\"note\" id=\"dModelBox\" hidden style=\"margin-top:12px\">\u003c/div>' + teach(D.teach);\n  const t = $('dText'); t.value = S.diary || '';\n  const analyse = () => {\n    const v = clean(t.value), w = countWords(v);\n    const hits = D.targets.filter(d => d.re.test(v)).map(d => d.id);\n    $('dTargets').innerHTML = D.targets.map(d => '\u003cspan class=\"' + (hits.includes(d.id) ? 'hit' : '') + '\">' + d.label + '\u003c/span>').join('');\n    $('dWords').textContent = w; $('dHits').textContent = hits.length; $('dPc').textContent = D.extra.re.test(v) ? 'есть' : 'нет';\n    return { words:w, hits:hits.length, extra:D.extra.re.test(v) };\n  };\n  t.addEventListener('input', () => { S.diary = t.value; save(); analyse(); });\n  analyse();\n  $('dCheck').addEventListener('click', () => {\n    const r = analyse(), miss = [];\n    if(r.words \u003c D.min) miss.push('добавь слов (сейчас ' + r.words + ')');\n    if(r.words > D.max) miss.push('сократи до ' + D.max + ' слов');\n    if(r.hits \u003c D.hits) miss.push('нужно ещё выражений: ' + (D.hits - r.hits));\n    if(!r.extra) miss.push(D.extra.miss);\n    $('dStatus').className = 'status ' + (miss.length ? 'no' : 'ok');\n    $('dStatus').textContent = miss.length ? 'Почти: ' + miss.join('; ') + '.' : 'Запись принята! Теперь прочитай её вслух, не глядя в текст через каждое слово.';\n    if(!miss.length) complete('diary'); else bad();\n  });\n  $('dModel').addEventListener('click', () => { const b = $('dModelBox'); b.hidden = !b.hidden; b.textContent = D.model; });\n  $('dCopy').addEventListener('click', async () => {\n    try { await navigator.clipboard.writeText(t.value); toast('Текст скопирован — можно отправить преподавателю'); }\n    catch(e){ t.select(); toast('Выдели и скопируй текст вручную'); }\n  });\n}\n\n/* ============ 9. финал ============ */\nfunction exit(el){\n  const X = C.exit;\n  el.innerHTML = '\u003cdiv class=\"grid2\">\u003cdiv>\u003cp class=\"task\">Впиши пропущенное слово без подсказок и без задания 2. Форму слова можно менять.\u003c/p>\u003cdiv id=\"gapList\">\u003c/div>' +\n    '\u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"btn warm\" id=\"gapCheck\">' + X.button + '\u003c/button>\u003c/div>\u003c/div>' +\n    '\u003cdiv class=\"slab\">\u003cdiv class=\"seal\">\u003cdiv>\u003cb id=\"sealScore\">—\u003c/b>\u003cspan>выражений вспомнено\u003c/span>\u003c/div>\u003c/div>\u003cp id=\"sealLine\" style=\"text-align:center;font-weight:800;color:var(--ink-soft)\">' + X.idle + '\u003c/p>' +\n    '\u003ch3>Can-do\u003c/h3>' + X.cando.map(t => '\u003clabel class=\"check\">\u003cinput type=\"checkbox\"> ' + t + '\u003c/label>').join('') + '\u003c/div>\u003c/div>' + teach(X.teach);\n  $('gapList').innerHTML = X.gaps.map((g, i) =>\n    '\u003clabel class=\"gapline\" data-gl=\"' + i + '\">\u003cspan>' + g.pre + '\u003cb>______\u003c/b>' + g.post + '\u003c/span>\u003cinput class=\"field\" data-gi=\"' + i + '\" autocomplete=\"off\" spellcheck=\"false\" aria-label=\"Ответ ' + (i + 1) + '\">\u003c/label>').join('');\n  $('gapList').querySelectorAll('[data-gi]').forEach(inp => {\n    const i = +inp.dataset.gi; inp.value = S.gaps[i] || '';\n    inp.addEventListener('input', () => { S.gaps[i] = inp.value; save(); });\n  });\n  $('gapCheck').addEventListener('click', () => {\n    let score = 0;\n    X.gaps.forEach((g, i) => {\n      const ok = g.ok.includes(clean(S.gaps[i]));\n      if(ok) score++;\n      const row = document.querySelector('[data-gl=\"' + i + '\"]');\n      row.classList.toggle('ok', ok); row.classList.toggle('no', !ok);\n      if(!ok){ row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake'); }\n    });\n    const pass = score >= X.gaps.length - 2;\n    $('sealScore').textContent = score + '/' + X.gaps.length;\n    $('sealLine').textContent = pass ? X.passText : 'Пока рано: повтори задание 2 и попробуй снова';\n    $('sealLine').style.color = pass ? '#2e9e3c' : 'var(--signal)';\n    if(pass) complete('exit'); else bad();\n  });\n}\n\n/* ============ 10. домашнее задание ============ */\nfunction skeleton(t){ return t.split(' ').map(w => { const l = w.replace(/[^A-Za-z’']/g, ''); return l.length \u003c= 2 ? w : w[0] + '_'.repeat(l.length - 1) + w.slice(l.length); }).join(' '); }\nfunction homework(el){\n  const H = S.hw, K = C.home;\n  el.innerHTML =\n    '\u003cp class=\"task\">Домашка из пяти частей, около 30–40 минут. Ответы сохраняются сами — можно делать в несколько подходов. В конце нажми \u003cb>«Отправить преподавателю»\u003c/b>: все ответы соберутся в одно сообщение.\u003c/p>' +\n    '\u003csection class=\"hw-part\" id=\"hwA\">\u003ch3>\u003cb>A\u003c/b> Переведи на английский\u003c/h3>\u003cp class=\"note\" style=\"padding:8px 12px\">Используй выражения из задания 2. Проверка смотрит на нужное выражение, а не на точное совпадение слов.\u003c/p>\u003cdiv id=\"hwTr\">\u003c/div>' +\n      '\u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"btn warm\" id=\"hwTrCheck\">Проверить перевод\u003c/button>\u003cspan class=\"note\" id=\"hwTrScore\" style=\"padding:6px 12px\">\u003c/span>\u003c/div>\u003c/section>' +\n    '\u003csection class=\"hw-part\" id=\"hwB\">\u003ch3>\u003cb>B\u003c/b> ' + K.brTitle + '\u003c/h3>\u003cp class=\"note\" style=\"padding:8px 12px\">' + K.brNote + '\u003c/p>\u003cdiv id=\"hwBr\">\u003c/div>' +\n      '\u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"btn warm\" id=\"hwBrCheck\">Проверить формы\u003c/button>\u003cspan class=\"note\" id=\"hwBrScore\" style=\"padding:6px 12px\">\u003c/span>\u003c/div>\u003c/section>' +\n    '\u003csection class=\"hw-part\" id=\"hwC\">\u003ch3>\u003cb>C\u003c/b> Диктант на слух\u003c/h3>\u003cp class=\"note\" style=\"padding:8px 12px\">Четыре новых предложения о главе ' + C.num + '. Слушай сколько угодно и записывай \u003cb>целиком\u003c/b>. Голос с акцентом? Нажми \u003cbutton class=\"btn ghost small\" type=\"button\" id=\"hwVoice\">🔊 Голос\u003c/button>\u003c/p>\u003cdiv id=\"hwDc\">\u003c/div>' +\n      '\u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"btn warm\" id=\"hwDcCheck\">Проверить диктант\u003c/button>\u003cspan class=\"note\" id=\"hwDcScore\" style=\"padding:6px 12px\">\u003c/span>\u003c/div>\u003c/section>' +\n    '\u003csection class=\"hw-part\" id=\"hwD\">\u003ch3>\u003cb>D\u003c/b> ' + K.prompt.title + '\u003c/h3>' +\n      '\u003cp class=\"task\" style=\"font-size:16px\">' + K.prompt.html + ' \u003cb>40–70 слов\u003c/b>. Можно вместо текста записать голосовое на 60 секунд и отправить преподавателю.\u003c/p>' +\n      '\u003cdiv class=\"frame\" style=\"margin:0 0 10px;border:0;padding:0\">\u003cb>Опоры:\u003c/b> ' + K.prompt.frames + '\u003c/div>' +\n      '\u003ctextarea class=\"field\" id=\"hwTxt\" style=\"min-height:140px\" placeholder=\"' + esc(K.prompt.placeholder) + '\">\u003c/textarea>' +\n      '\u003cdiv class=\"meter-row\">\u003cspan>Слов: \u003cb id=\"hwWords\">0\u003c/b> / 40–70\u003c/span>\u003cspan id=\"hwTxtState\">\u003c/span>\u003c/div>\u003c/section>' +\n    '\u003csection class=\"hw-part\" id=\"hwE\">\u003ch3>\u003cb>E\u003c/b> Подготовка к следующему уроку\u003c/h3>' +\n      K.checklist.map((t, i) => '\u003clabel class=\"check\">\u003cinput type=\"checkbox\" data-hwchk=\"' + i + '\" ' + (H.chk[i] ? 'checked' : '') + '> ' + t + '\u003c/label>').join('') + '\u003c/section>' +\n    '\u003cdiv class=\"tally\" style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;padding:16px;background:#fff8dc;border:2px dashed #f0d27a;border-radius:20px\">' +\n      '\u003cspan id=\"hwSummary\" style=\"font-family:var(--ui);font-weight:800;color:#8a5a00\">\u003c/span>' +\n      '\u003cbutton class=\"btn go\" id=\"hwSend\">📨 Отправить преподавателю\u003c/button>\u003c/div>' +\n    teach('Части A–C проверяются автоматически, D и E — вами. Если в части C больше двух ошибок, попросите переслушать с кнопкой «медленнее» и записать заново; сравнение «было/стало» полезнее новой порции.');\n\n  $('hwTr').innerHTML = K.tr.map((it, i) =>\n    '\u003cdiv class=\"hw-line\" data-tr=\"' + i + '\">\u003cdiv class=\"q\">' + (i + 1) + '. ' + it.ru + '\u003c/div>' +\n    '\u003cinput class=\"field\" data-trin=\"' + i + '\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"по-английски\">\u003cdiv class=\"fb\" data-trfb=\"' + i + '\">\u003c/div>\u003c/div>').join('');\n  $('hwBr').innerHTML = K.br.map((it, i) =>\n    '\u003cdiv class=\"hw-line\" data-br=\"' + i + '\">\u003cdiv class=\"q\">' + (i + 1) + '. ' + it.pre + ' ____ (\u003ci>' + it.verb + '\u003c/i>) ' + it.post + '\u003c/div>' +\n    '\u003cinput class=\"field\" data-brin=\"' + i + '\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"форма глагола\">\u003cdiv class=\"fb\" data-brfb=\"' + i + '\">\u003c/div>\u003c/div>').join('');\n  $('hwDc').innerHTML = K.dict.map((t, i) =>\n    '\u003cdiv class=\"hw-line\" data-dc=\"' + i + '\">\u003cdiv class=\"tools\">\u003cb style=\"align-self:center;margin-right:4px\">№ ' + (i + 1) + '\u003c/b>' +\n    '\u003cbutton class=\"btn ghost small\" data-dcplay=\"' + i + '\">▶ слушать\u003c/button>\u003cbutton class=\"btn ghost small\" data-dcslow=\"' + i + '\">🐢 медленнее\u003c/button>\u003cbutton class=\"btn ghost small\" data-dctip=\"' + i + '\">подсказка\u003c/button>\u003c/div>' +\n    '\u003cinput class=\"field\" data-dcin=\"' + i + '\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"запиши предложение целиком\">\u003cdiv class=\"fb\" data-dcfb=\"' + i + '\">\u003c/div>\u003c/div>').join('');\n\n  const bind = (attr, store) => el.querySelectorAll('[' + attr + ']').forEach(inp => {\n    const i = inp.getAttribute(attr); inp.value = store[i] || '';\n    inp.addEventListener('input', () => { store[i] = inp.value; save(); });\n  });\n  bind('data-trin', H.tr); bind('data-brin', H.br); bind('data-dcin', H.dc);\n\n  el.querySelectorAll('[data-dcplay]').forEach(b => b.addEventListener('click', () => speak(K.dict[+b.dataset.dcplay], .9)));\n  el.querySelectorAll('[data-dcslow]').forEach(b => b.addEventListener('click', () => speak(K.dict[+b.dataset.dcslow], .7)));\n  el.querySelectorAll('[data-dctip]').forEach(b => b.addEventListener('click', () => {\n    document.querySelector('[data-dcfb=\"' + b.dataset.dctip + '\"]').innerHTML = 'Скелет: \u003cb>' + skeleton(K.dict[+b.dataset.dctip]) + '\u003c/b>';\n  }));\n  $('hwVoice').addEventListener('click', () => window.TTS && TTS.openPicker());\n\n  const mark = (sel, ok) => { const box = document.querySelector(sel); box.classList.toggle('ok', ok); box.classList.toggle('no', !ok); };\n  const trOk = i => { const v = clean(H.tr[i]); return !!v && K.tr[i].must.every(re => re.test(v)); };\n  const brOk = i => K.br[i].ok.includes(clean(H.br[i]));\n  const dcRes = i => {\n    const target = clean(K.dict[i]).split(' '), given = clean(H.dc[i]).split(' ').filter(Boolean);\n    let right = 0;\n    const marked = target.map((w, n) => { const ok = given[n] === w; if(ok) right++; return '\u003cspan class=\"' + (ok ? 'w-ok' : 'w-no') + '\">' + (given[n] || '…') + '\u003c/span>'; }).join(' ');\n    return { full: right === target.length && given.length === target.length, right, total: target.length, marked, empty: !given.length };\n  };\n  const scores = () => ({\n    tr: K.tr.filter((t, i) => trOk(i)).length,\n    br: K.br.filter((t, i) => brOk(i)).length,\n    dc: K.dict.filter((t, i) => dcRes(i).full).length,\n    words: countWords(clean(H.txt))\n  });\n  function summary(){\n    const sc = scores();\n    $('hwA').classList.toggle('done', sc.tr >= 4); $('hwB').classList.toggle('done', sc.br >= 4);\n    $('hwC').classList.toggle('done', sc.dc >= 3); $('hwD').classList.toggle('done', sc.words >= 40 && sc.words \u003c= 70);\n    $('hwE').classList.toggle('done', H.chk.filter(Boolean).length === K.checklist.length);\n    $('hwSummary').textContent = 'A ' + sc.tr + '/' + K.tr.length + ' · B ' + sc.br + '/' + K.br.length + ' · C ' + sc.dc + '/' + K.dict.length + ' · D ' + sc.words + ' слов';\n    if(sc.tr >= 4 && sc.br >= 4 && sc.dc >= 3 && sc.words >= 40) complete('home');\n  }\n\n  $('hwTrCheck').addEventListener('click', () => {\n    K.tr.forEach((it, i) => {\n      const fb = document.querySelector('[data-trfb=\"' + i + '\"]');\n      if(!clean(H.tr[i])){ fb.textContent = 'Пусто.'; return; }\n      const ok = trOk(i); mark('[data-tr=\"' + i + '\"]', ok);\n      fb.innerHTML = ok ? 'Выражение на месте. \u003cspan class=\"model\">Вариант: ' + it.model + '\u003c/span>' : 'Нужно выражение \u003cb>' + it.tip + '\u003c/b>. \u003cspan class=\"model\">Вариант: ' + it.model + '\u003c/span>';\n    });\n    const n = scores().tr; $('hwTrScore').textContent = 'Принято: ' + n + ' из ' + K.tr.length; (n >= 4 ? good : bad)(); summary();\n  });\n  $('hwBrCheck').addEventListener('click', () => {\n    K.br.forEach((it, i) => {\n      const fb = document.querySelector('[data-brfb=\"' + i + '\"]');\n      if(!clean(H.br[i])){ fb.textContent = 'Пусто.'; return; }\n      const ok = brOk(i); mark('[data-br=\"' + i + '\"]', ok);\n      fb.innerHTML = ok ? 'Верно.' : 'Правильно: \u003cb>' + it.ok[0] + '\u003c/b>' + (it.why ? ' — ' + it.why : '') + '.';\n    });\n    const n = scores().br; $('hwBrScore').textContent = 'Верно: ' + n + ' из ' + K.br.length; (n >= 4 ? good : bad)(); summary();\n  });\n  $('hwDcCheck').addEventListener('click', () => {\n    K.dict.forEach((t, i) => {\n      const r = dcRes(i), fb = document.querySelector('[data-dcfb=\"' + i + '\"]');\n      if(r.empty){ fb.textContent = 'Пусто.'; return; }\n      mark('[data-dc=\"' + i + '\"]', r.full);\n      fb.innerHTML = (r.full ? 'Точно! ' : 'Верных слов: ' + r.right + ' из ' + r.total + '. ') + r.marked + (r.full ? '' : '\u003cspan class=\"model\">Оригинал: ' + t + '\u003c/span>');\n    });\n    const n = scores().dc; $('hwDcScore').textContent = 'Точно: ' + n + ' из ' + K.dict.length; (n >= 3 ? good : bad)(); summary();\n  });\n  const t = $('hwTxt'); t.value = H.txt || '';\n  const txtState = () => {\n    const w = scores().words; $('hwWords').textContent = w;\n    $('hwTxtState').textContent = w \u003c 40 ? 'нужно ещё ' + (40 - w) : w > 70 ? 'слишком длинно' : '✓ объём в норме';\n  };\n  t.addEventListener('input', () => { H.txt = t.value; save(); txtState(); summary(); });\n  el.querySelectorAll('[data-hwchk]').forEach(c => c.addEventListener('change', () => { H.chk[+c.dataset.hwchk] = c.checked; save(); summary(); }));\n\n  $('hwSend').addEventListener('click', async () => {\n    const sc = scores();\n    const text = [\n      'Treasure Island · глава ' + C.num + ' · домашнее задание', '',\n      'A. Перевод (' + sc.tr + '/' + K.tr.length + '):', ...K.tr.map((it, i) => (i + 1) + '. ' + (H.tr[i] || '—')), '',\n      'B. ' + K.brTitle + ' (' + sc.br + '/' + K.br.length + '):', ...K.br.map((it, i) => (i + 1) + '. ' + (H.br[i] || '—')), '',\n      'C. Диктант (' + sc.dc + '/' + K.dict.length + '):', ...K.dict.map((it, i) => (i + 1) + '. ' + (H.dc[i] || '—')), '',\n      'D. ' + K.prompt.title + ' (' + sc.words + ' слов):', H.txt || '— (голосовое отдельно)', '',\n      'E. Подготовка: ' + H.chk.filter(Boolean).length + '/' + K.checklist.length\n    ].join('\\n');\n    if(navigator.share){ try { await navigator.share({ title:'Домашнее задание · глава ' + C.num, text }); return; } catch(e){ if(e && e.name === 'AbortError') return; } }\n    try { await navigator.clipboard.writeText(text); toast('Ответы скопированы — вставь их в сообщение преподавателю'); }\n    catch(e){\n      let out = $('hwOut');\n      if(!out){ out = document.createElement('textarea'); out.id = 'hwOut'; out.className = 'field'; out.readOnly = true; out.style.marginTop = '12px'; $('hwSend').parentNode.after(out); }\n      out.value = text; out.select(); toast('Скопируй текст из поля ниже и отправь преподавателю');\n    }\n  });\n  txtState(); summary();\n}\n\n/* ============ запуск ============ */\nconst fromHash = location.hash.match(/^#task-(\\d+)$/);\nif(fromHash) S.step = Math.max(0, Math.min(STEPS.length - 1, +fromHash[1] - 1));\nshow();\n})();\n\n\u003c/script>\n\u003cscript>\n(() => {\n  const FILES = {\"lesson-1-2.html\": \"12\", \"chapter-3.html\": \"ch3\", \"chapter-4.html\": \"ch4\", \"chapter-5.html\": \"ch5\", \"a2-words.html\": \"words\", \"index.html\": \"12\", \"index-3.html\": \"12\"};\n  const part = href => FILES[String(href || '').split('#')[0].split('?')[0].split('/').pop()];\n  const inHub = window.parent !== window;\n  window.__tiGo = href => { const id = part(href); if(inHub && id) window.parent.postMessage({ tiGo:id }, '*'); else location.href = href; };\n  document.addEventListener('click', e => {\n    const a = e.target.closest && e.target.closest('a[href]');\n    if(!a || !inHub) return;\n    const id = part(a.getAttribute('href'));\n    if(id){ e.preventDefault(); window.parent.postMessage({ tiGo:id }, '*'); }\n  }, true);\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n" },
  "ch4": { title:"Глава IV · The Sea-Chest", html:"\u003c!doctype html>\n\u003chtml lang=\"ru\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003cmeta name=\"theme-color\" content=\"#9fdcff\">\n\u003cmeta name=\"format-detection\" content=\"telephone=no\">\n\u003ctitle>The Sea-Chest · Treasure Island IV\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Nunito:ital,wght@0,600;0,700;0,800;1,600&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n/* Общие стили страниц с главами Treasure Island (III–V). */\n:root{\n  --ink:#233a57; --ink-soft:#5d6f88; --ink-dim:#98a6b8;\n  --paper-2:#f4f9ff; --line:#dbe7f3; --rule:#e6eef7; --shadow:#d3e1ef;\n  --tide:#38b6ff; --signal:#ff5a5f; --moss:#4cc25a; --accent:#e07a2e;\n  --ui:Rubik,\"Trebuchet MS\",sans-serif; --story:Nunito,\"Trebuchet MS\",sans-serif;\n}\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%;background:#cfeeff;overflow-x:hidden}\nbody{margin:0;min-height:100vh;min-height:100dvh;overflow-x:clip;color:var(--ink);font-family:var(--story);font-size:17px;font-weight:600;line-height:1.5;\n  background:\n    radial-gradient(ellipse 22% 9% at 12% 16%,rgba(255,255,255,.9),transparent 70%),\n    radial-gradient(ellipse 18% 7% at 78% 10%,rgba(255,255,255,.85),transparent 70%),\n    linear-gradient(180deg,#9fdcff 0%,#d8f2ff 45%,#fff6e0 100%);background-attachment:fixed}\nbutton,input,textarea{font:inherit;color:inherit}\nbutton{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}\n:focus-visible{outline:3px solid var(--accent);outline-offset:3px}\nh1,h2,h3{margin:0;font-family:var(--ui);font-weight:800;line-height:1.1}\np{margin:0 0 10px}\nb,strong{font-weight:800}\n[hidden]{display:none!important}\n\n.wrap{max-width:1100px;margin:0 auto;padding:18px 18px 110px}\n\n/* шапка */\n.top{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:18px;align-items:center;padding:22px 24px;overflow:hidden;\n  color:#fff;background:linear-gradient(150deg,#16324f 0%,#23476e 55%,#3a5d86 100%);border-radius:26px;box-shadow:0 7px 0 #0f2238}\n.top::before{content:\"\";position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,rgba(255,214,120,.35),transparent 40%);pointer-events:none}\n.top .mark{display:inline-block;padding:3px 10px;font-family:var(--ui);font-size:11px;font-weight:700;letter-spacing:.12em;color:#16324f;background:#ffd36b;border-radius:999px}\n.top h1{margin-top:8px;font-size:clamp(32px,5vw,52px)}\n.top h1 i{display:block;font-style:normal;font-size:.55em;color:#ffd36b}\n.top p{max-width:56ch;margin:8px 0 0;font-size:15.5px;color:rgba(255,255,255,.88)}\n.top-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}\n.top-links a{display:inline-flex;align-items:center;min-height:40px;padding:6px 14px;font-family:var(--ui);font-size:13px;font-weight:700;color:#fff;text-decoration:none;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);border-radius:14px}\n.top svg{position:relative;width:100%;height:auto}\n.progress{display:flex;align-items:center;gap:10px;margin-top:14px;font-family:var(--ui);font-size:13px;font-weight:700;color:rgba(255,255,255,.85)}\n.progress .bar{flex:1;max-width:260px;height:10px;background:rgba(255,255,255,.18);border-radius:10px;overflow:hidden}\n.progress .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd36b,#ffb020);border-radius:10px;transition:width .4s}\n\n/* шаги */\n.steps{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px;margin:22px 0 0}\n.step{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:74px;padding:8px 4px;text-align:center;background:#fff;border:2px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--shadow)}\n.step b{display:grid;place-items:center;width:30px;height:30px;font-family:var(--ui);font-size:14px;color:#fff;background:var(--accent);border-radius:50%}\n.step span{font-family:var(--ui);font-size:11.5px;font-weight:700;line-height:1.15;color:var(--ink-soft)}\n.step.done b{background:var(--moss)}\n.step.done b::after{content:\"✓\";font-size:13px}\n.step.done b em{display:none}\n.step em{font-style:normal}\n.step.on{background:var(--accent);border-color:color-mix(in srgb,var(--accent) 75%,#000);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000)}\n.step.on span{color:#fff}\n.step.on b{color:var(--accent);background:#fff}\n\n/* лист */\n.stage{margin-top:22px;padding:26px;background:#fff;border:2px solid var(--line);border-radius:26px;box-shadow:0 7px 0 var(--shadow)}\n.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:14px;margin-bottom:18px;border-bottom:2px dashed var(--line)}\n.kicker{margin:0 0 6px;font-family:var(--ui);font-size:12.5px;font-weight:700;letter-spacing:.08em;color:var(--accent)}\n.head h2{font-size:clamp(26px,3.4vw,38px)}\n.stamp{padding:6px 12px;font-family:var(--ui);font-size:13px;font-weight:700;color:#fff;background:var(--accent);border-radius:999px}\n.task{max-width:72ch;font-size:17px}\n.task b{color:color-mix(in srgb,var(--accent) 85%,#000)}\n.note{max-width:72ch;padding:14px 16px;font-size:15.5px;color:var(--ink-soft);background:#eef8ff;border-radius:16px}\n.note b{color:var(--ink)}\n.teach{margin-top:18px;padding:0;font-size:15px;color:#5a4a1a;background:#fff8dc;border:2px dashed #f0d27a;border-radius:18px}\n.teach summary{padding:12px 16px;font-family:var(--ui);font-size:13px;font-weight:800;color:#b07a00;cursor:pointer}\n.teach p{margin:0;padding:0 16px 14px}\n\n.btn{min-height:46px;padding:10px 20px;font-family:var(--ui);font-size:15px;font-weight:800;color:#fff;background:var(--tide);border:0;border-radius:16px;box-shadow:0 5px 0 color-mix(in srgb,var(--tide) 70%,#000);transition:transform .1s}\n.btn:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--tide) 70%,#000)}\n.btn.ghost{color:var(--ink);background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--shadow)}\n.btn.go{background:linear-gradient(180deg,#5ddc6a,#35c04a);box-shadow:0 5px 0 #248a37}\n.btn.warm{background:var(--accent);box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 65%,#000)}\n.btn.small{min-height:40px;padding:6px 13px;font-size:13.5px;border-radius:13px}\n.btn:disabled{opacity:.4}\n.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}\n.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}\n.slab{padding:18px;background:var(--paper-2);border:2px solid var(--rule);border-radius:20px}\n.slab h3{font-size:20px;margin-bottom:8px}\n.status{min-height:24px;margin-top:12px;font-size:16px;font-weight:700;color:var(--ink-soft)}\n.status.ok{color:#2e9e3c}\n.status.no{color:var(--signal)}\n.field{width:100%;min-height:48px;padding:11px 14px;color:var(--ink);background:#f6faff;border:2px solid var(--line);border-radius:14px;font-weight:700}\n.field:focus{outline:none;border-color:var(--accent);background:#fff}\ntextarea.field{min-height:180px;resize:vertical;line-height:1.5}\n.frame{margin-top:12px;padding-top:10px;border-top:2px dashed var(--line);font-size:15px;color:var(--ink-soft)}\n\n/* выбор вариантов */\n.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}\n.opt{display:flex;align-items:center;gap:10px;min-height:54px;padding:10px 14px;text-align:left;font-size:16px;font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--shadow)}\n.opt:hover{border-color:var(--accent)}\n.opt.pick{color:#fff;background:var(--accent);border-color:color-mix(in srgb,var(--accent) 75%,#000)}\n.opt.hit{color:#fff;background:var(--moss);border-color:#2ea343}\n.opt.miss{color:#fff;background:var(--signal);border-color:#d8383e}\n.opt small{display:block;font-size:13px;font-weight:700;opacity:.8}\n\n/* карточки слов */\n.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}\n.card{display:flex;flex-direction:column;padding:14px;background:#fff;border:2px solid color-mix(in srgb,var(--c) 45%,#fff);border-radius:18px;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 40%,#fff)}\n.cards .card:nth-child(4n+1){--c:#ff8a3d}.cards .card:nth-child(4n+2){--c:#22c3b3}.cards .card:nth-child(4n+3){--c:#8a63d2}.cards .card:nth-child(4n){--c:#38a0ff}\n.card .term{margin:0 0 6px;font-family:var(--ui);font-size:18px;font-weight:800;line-height:1.15}\n.card .ex{margin:0 0 8px;font-size:14px;font-style:italic;color:var(--ink-soft)}\n.card .ru{display:none;margin:0 0 8px;font-size:14.5px;font-weight:800;color:color-mix(in srgb,var(--c) 80%,#000)}\n.card .ru.open{display:block}\n.card .acts{display:flex;gap:6px;margin-top:auto}\n.card .acts button{min-height:36px;padding:4px 10px;font-family:var(--ui);font-size:12.5px;font-weight:800;background:var(--paper-2);border:2px solid var(--line);border-radius:11px}\n.ballast{margin-top:14px}\n.quiz{margin-top:22px;padding:20px;background:var(--paper-2);border:2px solid var(--rule);border-radius:20px}\n.quiz-q{margin:0 0 14px;font-family:var(--ui);font-size:clamp(20px,2.6vw,26px);font-weight:800;text-align:center}\n.quiz-q small{display:block;margin-bottom:4px;font-family:var(--story);font-size:14px;color:var(--ink-soft)}\n\n/* цепь */\n.chain{display:grid;gap:10px;counter-reset:c}\n.link{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:10px 12px;background:#fff;border:2px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--shadow)}\n.link::before{counter-increment:c;content:counter(c);display:grid;place-items:center;width:34px;height:34px;font-family:var(--ui);font-size:15px;font-weight:800;color:#fff;background:var(--accent);border-radius:50%}\n.link.ok{background:#eafbe9;border-color:#9fe0a5}\n.link.ok::before{background:var(--moss)}\n.link.no{background:#fff0f0;border-color:#ffb3b5}\n.arrows{display:flex;gap:6px}\n.arrows button{width:42px;min-height:42px;font-size:18px;font-weight:800;background:var(--paper-2);border:2px solid var(--line);border-radius:12px;box-shadow:0 3px 0 var(--shadow)}\n\n/* правда / ложь */\n.tf{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;background:#fff;border:2px solid var(--line);border-radius:16px}\n.tf+.tf{margin-top:10px}\n.tf .pair{display:flex;gap:6px}\n.tf .pair button{min-width:86px;min-height:42px;padding:6px 10px;font-family:var(--ui);font-size:14px;font-weight:800;background:var(--paper-2);border:2px solid var(--line);border-radius:12px;box-shadow:0 3px 0 var(--shadow)}\n.tf .pair button.right{color:#fff;background:var(--moss);border-color:#2ea343}\n.tf .pair button.wrong{color:#fff;background:var(--signal);border-color:#d8383e}\n.tf .why{grid-column:1/-1;font-size:14.5px;color:var(--ink-soft)}\n\n/* сундук */\n.chest{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}\n.item{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:112px;padding:12px 8px;text-align:center;background:#fff;border:2px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--shadow)}\n.item i{font-style:normal;font-size:30px;line-height:1}\n.item b{font-family:var(--ui);font-size:14.5px;line-height:1.15}\n.item span{font-size:12.5px;color:var(--ink-soft)}\n.item.in{background:#fff3df;border-color:#f0b35a;box-shadow:0 4px 0 #f0b35a}\n.item.right{background:#eafbe9;border-color:#9fe0a5;box-shadow:0 4px 0 #9fe0a5}\n.item.wrong{background:#fff0f0;border-color:#ffb3b5;box-shadow:0 4px 0 #ffb3b5}\n\n/* грамматика */\n.rule-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:18px}\n.rule{padding:16px;background:#eef8ff;border:2px solid #bfe3ff;border-radius:18px}\n.rule.evt{background:#fff3ea;border-color:# n-height:52px;margin:0 0 14px;font-family:var(--ui);font-size:clamp(18px,2vw,22px);font-weight:700;line-height:1.3}\n.twist{margin-top:12px;padding:9px 12px;font-size:15px;font-weight:700;color:#8a4a00;background:#fff3cf;border-radius:12px}\n.clock{padding:16px;text-align:center;background:#fff;border:2px solid var(--line);border-radius:18px}\n.clock b{display:block;font-family:var(--ui);font-size:46px;font-weight:800;font-variant-numeric:tabular-nums}\n.check{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;font-size:16px}\n.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--moss)}\n\n/* дневник */\n.targets{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}\n.targets span{padding:4px 10px;font-family:var(--ui);font-size:13px;font-weight:700;color:var(--ink-soft);background:var(--paper-2);border:2px solid var(--line);border-radius:999px}\n.targets span.hit{color:#fff;background:var(--moss);border-color:#2ea343}\n.meter-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-family:var(--ui);font-size:14px;font-weight:700;color:var(--ink-soft)}\n.meter-row b{color:var(--ink)}\n\n/* финал */\n.gapline{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,.35fr);gap:12px;align-items:center;padding:12px 14px;background:#fff;border:2px solid var(--line);border-radius:16px}\n.gapline+.gapline{margin-top:10px}\n.hw-part{margin-top:22px;padding:18px;background:var(--paper-2);border:2px solid var(--rule);border-radius:20px}\n.hw-part:first-of-type{margin-top:4px}\n.hw-part h3{display:flex;align-items:center;gap:10px;font-size:21px;margin-bottom:6px}\n.hw-part h3 b{display:grid;place-items:center;width:32px;height:32px;font-size:15px;color:#fff;background:var(--accent);border-radius:50%}\n.hw-part.done h3 b{background:var(--moss)}\n.hw-line{padding:12px 14px;background:#fff;border:2px solid var(--line);border-radius:16px}\n.hw-line+.hw-line{margin-top:10px}\n.hw-line.ok{background:#eafbe9;border-color:#9fe0a5}\n.hw-line.no{background:#fff0f0;border-color:#ffb3b5}\n.hw-line .q{margin-bottom:8px;font-weight:800}\n.hw-line .tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}\n.fb .w-ok{color:#2e9e3c;font-weight:800}\n.fb .w-no{color:var(--signal);text-decoration:line-through}\n.gapline.ok{background:#eafbe9;border-color:#9fe0a5}\n.gapline.no{background:#fff0f0;border-color:#ffb3b5}\n.seal{display:grid;place-items:center;width:160px;height:160px;margin:6px auto 14px;text-align:center;background:radial-gradient(circle at 35% 30%,#ffe066,#ffb020 70%);border:4px solid #fff;border-radius:50%;box-shadow:0 7px 0 #e59400,0 0 0 8px rgba(255,194,26,.25)}\n.seal b{display:block;font-family:var(--ui);font-size:40px;font-weight:800;color:#7a4a00}\n.seal span{font-family:var(--ui);font-size:11px;font-weight:800;color:#7a4a00}\n\n/* низ */\n.foot{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;\n  padding:12px max(18px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));background:rgba(255,255,255,.96);border-top:2px solid var(--line)}\n.foot .mid{font-family:var(--ui);font-size:13px;font-weight:700;color:var(--ink-soft)}\n.toast{position:fixed;left:50%;bottom:92px;z-index:50;max-width:min(440px,calc(100vw - 32px));padding:12px 18px;font-size:15.5px;font-weight:700;color:#fff;background:var(--ink);border-radius:16px;box-shadow:0 5px 0 rgba(0,0,0,.2);transform:translate(-50%,14px);opacity:0;transition:.25s;pointer-events:none}\n.toast.show{opacity:1;transform:translate(-50%,0)}\n.pop{animation:pop .4s cubic-bezier(.2,1.3,.4,1) both}\n@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}\n.shake{animation:shake .38s linear}\n@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}\n\n@media (max-width:900px){\n  .steps{grid-template-columns:repeat(5,minmax(0,1fr))}\n  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}\n  .chest{grid-template-columns:repeat(3,minmax(0,1fr))}\n}\n@media (max-width:640px){\n  .wrap{padding:10px 10px 100px}\n  .top{grid-template-columns:1fr;padding:18px 16px;border-radius:20px}\n  .top svg{display:none}\n  .steps{display:flex;overflow-x:auto;gap:8px;padding:2px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:none}\n  .steps::-webkit-scrollbar{display:none}\n  .step{flex:0 0 84px;scroll-snap-align:start}\n  .stage{padding:16px;border-radius:20px}\n  .opts,.grid2,.rule-pair,.talk,.cards{grid-template-columns:1fr}\n  .chest{grid-template-columns:repeat(2,minmax(0,1fr))}\n  .tf,.gline,.gapline{grid-template-columns:1fr}\n  .foot .mid{display:none}\n  .foot .btn{flex:1}\n  input.field,textarea.field{font-size:16px}\n}\n@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}\n\n/* навигация между главами */\n.chapters{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}\n.chapters a{display:inline-flex;align-items:center;min-height:36px;padding:4px 12px;font-family:var(--ui);font-size:13px;font-weight:800;color:#fff;text-decoration:none;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);border-radius:12px}\n.chapters a.on{color:#16324f;background:#ffd36b;border-color:#ffd36b}\n.top-links button{display:inline-flex;align-items:center;min-height:40px;padding:6px 14px;font-family:var(--ui);font-size:13px;font-weight:700;color:#fff;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);border-radius:14px}\n\n\u003c/style>\n\u003cstyle>\n/* Treasure Island · The Navigator's Journal · visual skin v1\n   CSS only. No lesson data, state, IDs or behaviour are modified. */\n@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,500,20,0;9..144,600,20,0;9..144,700,20,0&display=swap');\n\n:root{\n  --ink:#213b40;--ink-soft:#506864;--ink-dim:#667e79;\n  --paper:#fffcf5;--paper-2:
