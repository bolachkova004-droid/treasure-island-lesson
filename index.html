 .wrap{padding:12px 11px 58px}\n  .wrap .top{padding:21px 18px;border-radius:14px;gap:12px}\n  .wrap .top h1{font-size:clamp(32px,8vw,44px)}\n  .wrap .top svg{max-width:190px}\n  .wrap .stage{padding:19px 15px;border-radius:13px;margin-top:15px}\n  .wrap .steps{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}\n  .wrap .step{min-height:64px;padding:7px 2px}\n  .wrap .step span{font-size:10px}\n  .sheet{padding:10px 10px calc(96px + env(safe-area-inset-bottom))}\n  .sheet .bar{padding:11px;border-radius:11px}\n  .folio{border-radius:13px}\n  .hero{min-height:220px;padding:12px}\n  .hero .head{padding:12px 13px;border-radius:8px}\n  .hero .head h2{font-size:26px}\n  .cover{background:#163c44}\n  .cover-copy{margin:-25px 10px 15px;padding:23px 19px;border-radius:10px}\n  .cover h1{font-size:clamp(39px,10vw,54px)}\n  .cast-wrap{margin:0 10px 17px}\n  .cast-card{border-radius:8px}\n  .mob{padding-top:max(10px,env(safe-area-inset-top))}\n  .mobnav .tab{min-height:44px}\n  .folio .slab,.folio .scene-panel{padding:15px}\n  .foot{padding-bottom:max(12px,env(safe-area-inset-bottom));gap:8px}\n  .btn,.opt,.bar-btn,.step,.mode,.chip,.tile,.letter,.sets button{min-height:44px}\n  .field,input,textarea,select{font-size:16px!important}\n}\n@media(prefers-reduced-motion:reduce){\n  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"shell\">\n  \u003caside class=\"rail\">\n    \u003cdiv class=\"rail-mark\">LOG · 1751\u003c/div>\n    \u003ch1 class=\"rail-title\">The Benbow\u003cbr>Ledger\u003c/h1>\n    \u003cp class=\"rail-sub\">Treasure Island, главы I–II\u003cbr>Уровень A2–B1 · 11 заданий\u003c/p>\n    \u003cdiv class=\"ink-gauge\">\u003ci id=\"gauge\">\u003c/i>\u003c/div>\n    \u003cdiv class=\"gauge-copy\">\u003cspan>журнал заполнен\u003c/span>\u003cspan id=\"gaugeText\">0%\u003c/span>\u003c/div>\n    \u003cnav class=\"tabs\" id=\"tabsDesktop\" aria-label=\"Листы дела\">\u003c/nav>\n    \u003cdiv class=\"more-ch\">\u003cspan>Дальше по книге\u003c/span>\u003ca href=\"chapter-3.html\">Глава III\u003c/a>\u003ca href=\"chapter-4.html\">Глава IV\u003c/a>\u003ca href=\"chapter-5.html\">Глава V\u003c/a>\u003ca class=\"wide\" href=\"a2-words.html\">Тренажёр слов A2\u003c/a>\u003c/div>\n    \u003cdiv class=\"rail-tools\">\n      \u003cbutton class=\"switch\" id=\"swA2\" aria-pressed=\"false\">Опоры A2\u003c/button>\n      \u003cbutton class=\"switch\" id=\"swHard\" aria-pressed=\"false\">Hard mode\u003c/button>\n      \u003cbutton class=\"switch\" id=\"swTap\" aria-pressed=\"true\">Перевод по клику\u003c/button>\n      \u003cbutton class=\"switch\" id=\"swTeacher\" aria-pressed=\"false\">Заметки преподавателя\u003c/button>\n      \u003cbutton class=\"switch warn\" id=\"swReset\">Очистить журнал\u003c/button>\n    \u003c/div>\n  \u003c/aside>\n\n  \u003cdiv class=\"mob\">\n    \u003cdiv>\u003cb>The Benbow Ledger\u003c/b>\u003cspan id=\"mobStep\">Лист 1 из 12\u003c/span>\u003c/div>\n    \u003cbutton id=\"mobBtn\" aria-expanded=\"false\">Листы\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"mobnav\" id=\"mobNav\">\n    \u003cnav class=\"tabs\" id=\"tabsMobile\">\u003c/nav>\n    \u003cdiv class=\"more-ch\">\u003cspan>Дальше по книге\u003c/span>\u003ca href=\"chapter-3.html\">Глава III\u003c/a>\u003ca href=\"chapter-4.html\">Глава IV\u003c/a>\u003ca href=\"chapter-5.html\">Глава V\u003c/a>\u003ca class=\"wide\" href=\"a2-words.html\">Тренажёр слов A2\u003c/a>\u003c/div>\n    \u003cdiv class=\"mobtools\">\n      \u003cbutton class=\"switch\" id=\"swA2m\">Опоры A2\u003c/button>\n      \u003cbutton class=\"switch\" id=\"swHardm\">Hard mode\u003c/button>\n      \u003cbutton class=\"switch\" id=\"swTapm\">Перевод по клику\u003c/button>\n      \u003cbutton class=\"switch\" id=\"swTeacherm\">Преподаватель\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cmain class=\"sheet\">\n    \u003cdiv class=\"bar\">\n      \u003cdiv>\u003cspan class=\"bar-k\">дело ведёт\u003c/span>\u003cstrong class=\"bar-v\" id=\"agentName\">имя не вписано\u003c/strong>\u003c/div>\n      \u003cdiv class=\"bar-mid\">\u003cspan class=\"bar-k\">печати на полях\u003c/span>\u003cdiv class=\"seal-row\" id=\"sealRow\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"bar-btns\">\n        \u003cbutton class=\"bar-btn\" id=\"btnWords\">Словарь \u003cb id=\"wordCount\">0\u003c/b>\u003c/button>\n        \u003cbutton class=\"bar-btn\" id=\"btnFile\">Выводы \u003cb id=\"fileCount\">0\u003c/b>\u003c/button>\n        \u003cbutton class=\"bar-btn\" id=\"btnVoice\" type=\"button\">🔊 Голос\u003c/button>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- ЛИСТ 1 -->\n    \u003csection class=\"page on\" data-tab=\"Обложка дела\" data-flag=\"#e8442a,#f2e8d5\">\n      \u003cdiv class=\"folio cover\">\n        \u003cdiv class=\"cover-copy\">\n          \u003cp class=\"kicker\">Лист первый · до чтения\u003c/p>\n          \u003ch1 class=\"display\">The old\u003ci>sea-dog\u003c/i>\u003c/h1>\n          \u003cp class=\"deck\">В трактир на пустом берегу въезжает человек с сундуком и шрамом. Он платит вперёд, поёт страшные песни и каждый день смотрит на дорогу. Твоя задача — понять, кого он там высматривает.\u003c/p>\n          \u003cdiv class=\"id-box\">\n            \u003clabel for=\"agentInput\">Кто ведёт журнал\u003c/label>\n            \u003cdiv class=\"id-row\">\n              \u003cinput class=\"field\" id=\"agentInput\" maxlength=\"26\" placeholder=\"имя или прозвище\">\n              \u003cbutton class=\"btn small\" id=\"agentSave\">Вписать\u003c/button>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"row\">\u003cbutton class=\"btn flag\" data-go=\"1\">Открыть дело\u003c/button>\u003cspan class=\"mono-note\">70–90 минут · говорение, лексика, письмо на слух\u003c/span>\u003c/div>\n          \u003cdiv class=\"route\">\n            \u003cdiv>\u003cb>8 + 3\u003c/b>выражения, которые уходят в речь, а не в тетрадь\u003c/div>\n            \u003cdiv>\u003cb>would / Past Simple\u003c/b>привычка против одного события\u003c/div>\n            \u003cdiv>\u003cb>1 вывод\u003c/b>устное решение с двумя доказательствами\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"teach\">Порядок заданий рабочий, но не обязательный. Минимум на один урок: задания 1, 3, 5, 10, 11. Задания 7 (диктовка) и 8 (переписывание) можно отдать домой, если группа медленная. Глава II — отдельная домашняя миссия в конце задания 11.\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"cover-art\">\n          \u003csvg viewBox=\"0 0 420 560\" role=\"img\" aria-label=\"Ночь у трактира «Адмирал Бенбоу»: море, корабль на горизонте и человек с сундуком на дороге\">\n  \u003cdefs>\n    \u003cradialGradient id=\"moonGlow\" cx=\"50%\" cy=\"50%\">\u003cstop offset=\"0\" stop-color=\"#e8dcbe\" stop-opacity=\".5\"/>\u003cstop offset=\"1\" stop-color=\"#e8dcbe\" stop-opacity=\"0\"/>\u003c/radialGradient>\n    \u003cradialGradient id=\"lamp\" cx=\"50%\" cy=\"50%\">\u003cstop offset=\"0\" stop-color=\"#c08733\" stop-opacity=\".85\"/>\u003cstop offset=\"1\" stop-color=\"#c08733\" stop-opacity=\"0\"/>\u003c/radialGradient>\n    \u003clinearGradient id=\"night\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\u003cstop offset=\"0\" stop-color=\"#0a1a1d\"/>\u003cstop offset=\".55\" stop-color=\"#12302f\"/>\u003cstop offset=\"1\" stop-color=\"#0a1718\"/>\u003c/linearGradient>\n  \u003c/defs>\n  \u003crect width=\"420\" height=\"560\" fill=\"url(#night)\"/>\n  \u003ccircle cx=\"300\" cy=\"108\" r=\"110\" fill=\"url(#moonGlow)\"/>\n  \u003ccircle cx=\"300\" cy=\"108\" r=\"38\" fill=\"#e8dcbe\" opacity=\".92\"/>\n  \u003ccircle cx=\"286\" cy=\"98\" r=\"38\" fill=\"#0e2224\" opacity=\".85\"/>\n  \u003cg stroke=\"#e8dcbe\" stroke-width=\"1\" opacity=\".22\">\n    \u003cpath d=\"M40 78 h120 M56 96 h86 M232 54 h90 M18 150 h74\"/>\n  \u003c/g>\n  \u003cg stroke=\"#7fa8a0\" stroke-width=\"1.1\" fill=\"none\" opacity=\".45\">\n    \u003c t x=\"180\" y=\"312\" font-family=\"Georgia,serif\" font-style=\"italic\" font-size=\"10.5\" fill=\"#3b2a4a\">lonely inn · no neighbours\u003c/text>\n  \u003cpath d=\"M214 236 C248 200 272 168 300 128 C310 112 314 96 316 74 C318 54 322 36 330 16\" fill=\"none\" stroke=\"#e5533d\" stroke-width=\"2\" stroke-dasharray=\"8 6\"/>\n  \u003ctext x=\"330\" y=\"134\" font-family=\"Georgia,serif\" font-style=\"italic\" font-size=\"12.5\" fill=\"#e5533d\">the road he watches\u003c/text>\n  \u003cg transform=\"translate(70 118)\">\n    \u003crect width=\"42\" height=\"30\" fill=\"#ffffff\" stroke=\"#3b2a4a\" stroke-width=\"1.6\"/>\n    \u003cpath d=\"M0 11 H42\" stroke=\"#3b2a4a\" stroke-width=\"1.6\"/>\n    \u003cpath d=\"M21 11 V30\" stroke=\"#3b2a4a\" stroke-width=\"1.4\"/>\n    \u003crect x=\"17\" y=\"8\" width=\"8\" height=\"7\" fill=\"#e5533d\"/>\n  \u003c/g>\n  \u003ctext x=\"52\" y=\"172\" font-family=\"Georgia,serif\" font-style=\"italic\" font-size=\"12.5\" fill=\"#3b2a4a\">his sea-chest, never opened\u003c/text>\n  \u003cg transform=\"translate(486 52)\">\n    \u003cpath d=\"M-26 22 h52 l-10 11 h-32 z\" fill=\"#3b2a4a\"/>\n    \u003cpath d=\"M0 22 V-24 M16 22 V-8\" stroke=\"#3b2a4a\" stroke-width=\"1.6\"/>\n    \u003cpath d=\"M0 -22 q20 10 0 22 z M0 2 q22 10 0 20 z\" fill=\"#3b2a4a\" opacity=\".8\"/>\n    \u003cpath d=\"M16 -6 q14 8 0 16 z\" fill=\"#3b2a4a\" opacity=\".6\"/>\n  \u003c/g>\n  \u003ctext x=\"440\" y=\"104\" font-family=\"Georgia,serif\" font-style=\"italic\" font-size=\"12.5\" fill=\"#3b2a4a\">a ship standing off\u003c/text>\n  \u003cg transform=\"translate(575 236)\">\n    \u003ccircle r=\"34\" fill=\"none\" stroke=\"#3b2a4a\" stroke-width=\"1.2\"/>\n    \u003ccircle r=\"25\" fill=\"none\" stroke=\"#3b2a4a\" stroke-width=\".7\"/>\n    \u003cpath d=\"M0 -38 L8 -6 L0 0 L-8 -6 Z\" fill=\"#e5533d\"/>\n    \u003cpath d=\"M0 38 L8 6 L0 0 L-8 6 Z\" fill=\"#3b2a4a\"/>\n    \u003cpath d=\"M38 0 L6 8 L0 0 L6 -8 Z\" fill=\"#3b2a4a\" opacity=\".8\"/>\n    \u003cpath d=\"M-38 0 L-6 8 L0 0 L-6 -8 Z\" fill=\"#3b2a4a\" opacity=\".8\"/>\n    \u003ctext x=\"0\" y=\"-42\" text-anchor=\"middle\" font-family=\"Georgia,serif\" font-style=\"italic\" font-size=\"11\" fill=\"#3b2a4a\">N\u003c/text>\n  \u003c/g>\n  \u003cg transform=\"translate(34 344)\">\n    \u003crect width=\"214\" height=\"62\" fill=\"#ffffff\" stroke=\"#3b2a4a\" stroke-width=\"1\"/>\n    \u003crect x=\"4\" y=\"4\" width=\"206\" height=\"54\" fill=\"none\" stroke=\"#3b2a4a\" stroke-width=\".6\"/>\n    \u003ctext x=\"107\" y=\"26\" text-anchor=\"middle\" font-family=\"Georgia,serif\" font-style=\"italic\" font-size=\"14\" fill=\"#3b2a4a\">Chart of the Black Hill coast\u003c/text>\n    \u003ctext x=\"107\" y=\"44\" text-anchor=\"middle\" font-family=\"Georgia,serif\" font-style=\"italic\" font-size=\"10.5\" fill=\"#3b2a4a\">soundings in fathoms · survey of 17—\u003c/text>\n  \u003c/g>\n\u003c/svg>\n            \u003cbutton class=\"spot\" style=\"left:33%;top:56%\" data-spot=\"0\">?\u003cspan>Он выбрал трактир вдали от города.\u003c/span>\u003c/button>\n            \u003cbutton class=\"spot\" style=\"left:49%;top:26%\" data-spot=\"1\">?\u003cspan>Каждый день он смотрит на дорогу.\u003c/span>\u003c/button>\n            \u003cbutton class=\"spot\" style=\"left:14%;top:31%\" data-spot=\"2\">?\u003cspan>Сундук стоит закрытым, никто в него не заглядывал.\u003c/span>\u003c/button>\n            \u003cbutton class=\"spot\" style=\"left:78%;top:16%\" data-spot=\"3\">?\u003cspan>Он расспрашивает о моряках, которые проходили мимо.\u003c/span>\u003c/button>\n            \u003cdiv class=\"spot-count\" id=\"spotCount\">Отметок открыто: 0 / 4\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"scene-panel\">\n            \u003ch3 class=\"display\" style=\"font-size:22px;margin-bottom:10px\">Why does he watch the road?\u003c/h3>\n            \u003cdiv class=\"opts\" id=\"guessList\">\n              \u003cbutton class=\"opt\">He is waiting for an old friend.\u003c/button>\n              \u003cbutton class=\"opt\">He is hiding from someone dangerous.\u003c/button>\n              \u003cbutton class=\"opt\">He wants to rob the travellers.\u003c/button>\n              \u003cbutton class=\"opt\">He is looking for one particular sailor.\u003c/button>\n            \u003c/div>\n            \u003cdiv class=\"status\" id=\"guessStatus\">Сначала открой все четыре отметки.\u003c/div>\n            \u003cdiv class=\"frame\">\u003cb>Скажи так:\u003c/b> “My first guess is … because …” / “Another detail that supports it is …”\u003c/div>\n            \u003cdiv class=\"teach\">Не подтверждайте версию. После первого ответа спросите: “What would make you change your mind?” Информационный пробел нужен, чтобы чтение главы стало поиском ответа, а не переводом.\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- ЛИСТ 3 -->\n    \u003csection class=\"page\" data-tab=\"Цепь событий\" data-flag=\"#e8442a,#10293d\">\n      \u003cdiv class=\"folio\">\n        \u003cspan class=\"folio-mark\">sheet iii · after reading\u003c/span>\n        \u003cdiv class=\"head\">\n          \u003cdiv>\u003cp class=\"kicker\">Лист третий · после первого чтения\u003c/p>\u003ch2 class=\"display\">Rebuild the evening\u003c/h2>\u003c/div>\n          \u003cspan class=\"stamp\">7 минут\u003c/span>\n        \u003c/div>\n        \u003cp class=\"task\">Расставь шесть событий главы по порядку. \u003cb>Книгу не открывай\u003c/b> — вспоминай. Стрелки двигают строку вверх и вниз.\u003c/p>\n        \u003cdiv class=\"chain\" id=\"chain\">\u003c/div>\n        \u003cdiv class=\"row\" style=\"margin-top:14px\">\n          \u003cbutton class=\"btn\" id=\"chainCheck\">Проверить порядок\u003c/button>\n          \u003cbutton class=\"btn ghost\" id=\"chainShuffle\">Перемешать заново\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"status\" id=\"chainStatus\" aria-live=\"polite\">\u003c/div>\n        \u003cdiv class=\"talk\" data-talk=\"chain\">\u003c/div>\n        \u003cdiv class=\"teach\">После проверки попросите пересказать цепочку вслух: first / then / after that / in the end. Во время пересказа не исправляйте — запишите две ошибки и вернитесь к ним в задании 8.\u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- ЛИСТ 4 -->\n    \u003csection class=\"page\" data-tab=\"Груз и балласт\" data-flag=\"#4c6b3c,#f2e8d5\">\n      \u003cdiv class=\"folio\">\n        \u003cspan class=\"folio-mark\">sheet iv · vocabulary\u003c/span>\n        \u003cdiv class=\"head\">\n          \u003cdiv>\u003cp class=\"kicker\">Лист четвёртый · лексика\u003c/p>\u003ch2 class=\"display\">Cargo or ballast?\u003c/h2>\u003c/div>\n          \u003cspan class=\"stamp\">12 минут\u003c/span>\n        \u003c/div>\n        \u003cp class=\"task\">В главе много красивых, но мёртвых слов. \u003cb>Cargo\u003c/b> — то, что поедет с тобой в сегодняшний разговор. \u003cb>Ballast\u003c/b> — то, что нужно понять в этой истории и оставить в трюме. Сначала рассортируй, потом разбери карточки.\u003c/p>\n        \u003cdiv class=\"manifest\">\n          \u003cdiv class=\"manifest-copy\">\n            \u003ch3 class=\"display\" style=\"font-size:26px;margin-bottom:8px\">Manifest control\u003c/h3>\n            \u003cp>Двенадцать единиц с борта. Решай быстро, по первому впечатлению: пригодится ли это слово в разговоре о людях, или оно живёт только в морском романе XVIII века.\u003c/p>\n            \u003cp class=\"mono-note\" style=\"color:rgba(243,231,201,.6)\" id=\"crateProgress\">Единица 1 из 12\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"manifest-stage\">\n            \u003cdiv>\n              \u003cdiv class=\"crate\" id=\"crate\">avoid\u003c/div>\n              \u003cdiv class=\"crate-acts\" id=\"crateActs\">\n                \u003cbutton class=\"btn small\" data-crate=\"cargo\">CARGO · в речь\u003c/button>\n                \u003cbutton class=\"btn small ghost\" data-crate=\"ballast\">BALLAST · понять\u003c/button>\n              \u003c/div>\n              \u003cdiv class=\"status\" id=\"crateFb\">\u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"row\" style=\"margin:18px 0 12px;justify-content:space-between\">\n          \u003cspan class=\"mono-note\" id=\"cardCount\">Отмечено в работу: 0\u003c/span>\n          \u003cbutton class=\"btn ghost small\" id=\"revealAll\" data-reveal=\"1\">Показать все переводы\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"cards\" id=\"cards\">\u003c/div>\n        \u003cdiv class=\"note-ru\" style=\"margin-top:16px\">\u003cb>Ballast — понять и отпустить:\u003c/b> handspike, capstan, berth, fourpenny piece, assizes, incivility, parlour. Эти слова встретятся в тексте, но в активный запас не идут.\u003c/div>\n        \u003cdiv class=\"talk\" data-talk=\"cargo\">\u003c/div>\n        \u003cdiv class=\"teach\">Активный набор описывает наблюдение, избегание, давление и уступку — он переносится на любые разговоры о поведении людей. Перевод открывайте только после попытки догадаться: сначала пример, потом значение, потом русский.\u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- ЛИСТ 5 -->\n    \u003csection class=\"page\" data-tab=\"Хвосты глаголов\" data-flag=\"#123f63,#e8442a\">\n      \u003cdiv class=\"folio\">\n        \u003cspan class=\"folio-mark\">sheet v · patterns\u003c/span>\n        \u003cdiv class=\"head\">\n          \u003cdiv>\u003cp class=\"kicker\">Лист пятый · конструкции\u003c/p>\u003ch2 class=\"display\">The tail of the verb\u003c/h2>\u003c/div>\n          \u003cspan class=\"stamp\">8 минут\u003c/span>\n        \u003c/div>\n        \u003cp class=\"task\">Слово почти никогда не живёт одно: у него есть хвост. Выбери правильное продолжение, а потом впиши три фразы целиком — так они закрепляются быстрее, чем через правило.\u003c/p>\n        \u003cdiv class=\"rows\" id=\"patternRows\">\u003c/div>\n        \u003cdiv class=\"status\" id=\"patternStatus\">\u003c/div>\n        \u003ch3 class=\"display\" style=\"font-size:21px;margin:22px 0 10px\">Now write it out\u003c/h3>\n        \u003cdiv id=\"patternWrite\">\u003c/div>\n        \u003cdiv class=\"tally\">\u003cspan>Фраз собрано\u003c/span>\u003cstrong id=\"patternWriteScore\">0 / 3\u003c/strong>\u003cbutton class=\"btn flag\" id=\"patternWriteCheck\">Проверить фразы\u003c/button>\u003c/div>\n        \u003cdiv class=\"teach\">Мини-дрилл в конце: вы говорите глагол, студентка — хвост. insist → on doing; force somebody → to do; avoid → doing; let somebody → be. Тридцать секунд, быстрый темп, без записи.\u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- ЛИСТ 6 -->\n    \u003csection class=\"page\" data-tab=\"Компас времени\" data-flag=\"#e8442a,#10293d\">\n      \u003cdiv class=\"folio\">\n        \u003cspan class=\"folio-mark\">sheet vi · grammar\u003c/span>\n        \u003cdiv class=\"head\">\n          \u003cdiv>\u003cp class=\"kicker\">Лист шестой · грамматика в сюжете\u003c/p>\u003ch2 class=\"display\">Habit or one evening?\u003c/h2>\u003c/div>\n          \u003cspan class=\"stamp\">9 минут\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"rule-pair\">\n          \u003cdiv class=\"rule\">\n            \u003ch3 class=\"display\" style=\"font-size:20px\">Повторяющаяся привычка\u003c/h3>\n            \u003cspan class=\"form\">would + глагол\u003c/span>\n            \u003cp>He \u003cb>would ask\u003c/b> the same question every day: “Has any seafaring man gone by?”\u003c/p>\n            \u003cp class=\"mono-note\">Так описывают фон истории. Для состояний лучше used to be.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"rule evt\">\n            \u003ch3 class=\"display\" style=\"font-size:20px\">Одно событие\u003c/h3>\n            \u003cspan class=\"form\">Past Simple\u003c/span>\n            \u003cp>One evening he \u003cb>sprang\u003c/b> to his feet and \u003cb>drew\u003c/b> his knife.\u003c/p>\n            \u003cp class=\"mono-note\">Так двигают сюжет: фон обрывается, начинается сцена.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n        \u003cp class=\"task\">Определи для каждого предложения: фон или сцена.\u003c/p>\n        \u003cdiv class=\"rows\" id=\"timeRows\">\u003c/div>\n        \u003cdiv class=\"status\" id=\"timeStatus\">\u003c/div>\n        \u003ch3 class=\"display\" style=\"font-size:21px;margin:22px 0 10px\">Build the contrast yourself\u003c/h3>\n        \u003cp class=\"task\">Два предложения об одном человеке: сначала привычка через \u003cb>would\u003c/b>, потом одно событие в Past Simple, которое эту привычку сломало. Можно о капитане, можно о своём знакомом.\u003c/p>\n        \u003cdiv id=\"contrastWrite\">\u003c/div>\n        \u003cdiv class=\"tally\">\u003cspan>Контраст собран\u003c/span>\u003cstrong id=\"contrastScore\">0 / 2\u003c/strong>\u003cbutton class=\"btn flag\" id=\"contrastCheck\">Проверить\u003c/button>\u003c/div>\n        \u003cdiv class=\"talk\" data-talk=\"time\">\u003c/div>\n        \u003cdiv class=\"teach\">Не расширяйте тему до всех значений would. Цель узкая: заметить контраст фона и события и сразу его использовать в устном пересказе.\u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- ЛИСТ 7 -->\n    \u003csection class=\"page\" data-tab=\"Голос с допроса\" data-flag=\"#10293d,#f2e8d5\">\n      \u003cdiv class=\"folio\">\n        \u003cspan class=\"folio-mark\">sheet vii · listening\u003c/span>\n        \u003cdiv class=\"head\">\n          \u003cdiv>\u003cp class=\"kicker\">Лист седьмой · письмо на слух\u003c/p>\u003ch2 class=\"display\">Five recorded lines\u003c/h2>\u003c/div>\n          \u003cspan class=\"stamp\">10 минут\u003c/span>\n        \u003c/div>\n        \u003cp class=\"task\">Пять коротких показаний. Слушай и записывай \u003cb>целое предложение\u003c/b>, а не отдельные слова. Слушать можно сколько угодно, подсказка — только после честной попытки: сначала ключевое выражение и скелет из первых букв, потом полный текст.\u003c/p>\n        \u003cdiv id=\"dictList\">\u003c/div>\n        \u003cdiv class=\"tally\">\u003cspan>Записано точно\u003c/span>\u003cstrong id=\"dictScore\">0 / 5\u003c/strong>\u003cbutton class=\"btn flag\" id=\"dictCheck\">Проверить записи\u003c/button>\u003c/div>\n        \u003cdiv class=\"note-ru\">Голос звучит с акцентом или «ломается»? Нажми \u003cbutton class=\"btn ghost small\" type=\"button\" data-voice-pick>🔊 Выбрать голос\u003c/button> и выбери тот, что помечен «хороший». Если английского голоса нет совсем, листы читает преподаватель — темп и повторы те же.\u003c/div>\n        \u003cdiv class=\"teach\">Диктовка здесь работает как отложенное извлечение: те же восемь выражений возвращаются через другой канал. Ошибки в окончаниях фиксируйте, но не исправляйте сразу — пусть студентка сама сравнит с оригиналом.\u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- ЛИСТ 8 -->\n    \u003csection class=\"page\" data-tab=\"Переписать показания\" data-flag=\"#4c6b3c,#10293d\">\n      \u003cdiv class=\"folio\">\n        \u003cspan class=\"folio-mark\">sheet viii · rewriting\u003c/span>\n        \u003cdiv class=\"head\">\n          \u003cdiv>\u003cp class=\"kicker\">Лист восьмой · трансформации\u003c/p>\u003ch2 class=\"display\">Rewrite the witness\u003c/h2>\u003c/div>\n          \u003cspan class=\"stamp\">10 минут\u003c/span>\n        \u003c/div>\n        \u003cp class=\"task\">Свидетель говорит слишком просто. Перепиши каждую строку заданной конструкцией, сохранив смысл. Проверка смотрит на конструкцию и её хвост, а не на точное совпадение слов.\u003c/p>\n        \u003cdiv id=\"forgeList\">\u003c/div>\n        \u003cdiv class=\"tally\">\u003cspan>Показаний принято\u003c/span>\u003cstrong id=\"forgeScore\">0 / 6\u003c/strong>\u003cbutton class=\"btn flag\" id=\"forgeCheck\">Проверить показания\u003c/button>\u003c/div>\n        \u003cdiv class=\"talk\" data-talk=\"conflict\">\u003c/div>\n        \u003cdiv class=\"teach\">Это мост между узнаванием и продукцией. Если студентка пишет верную конструкцию, но теряет смысл, возвращайте к исходной строке: “Does your sentence still say the same thing?”\u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- ЛИСТ 9 -->\n    \u003csection class=\"page\" data-tab=\"Слушание дела\" data-flag=\"#e8442a,#e8442a\">\n      \u003cdiv class=\"folio\">\n        \u003cspan class=\"folio-mark\">sheet ix · speaking\u003c/span>\n        \u003cdiv class=\"head\">\n          \u003cdiv>\u003cp class=\"kicker\">Лист девятый · главное говорение\u003c/p>\u003ch2 class=\"display\">The Benbow hearing\u003c/h2>\u003c/div>\n          \u003cspan class=\"stamp\">12 минут\u003c/span>\n        \u003c/div>\n        \u003cp class=\"task\">\u003cb>Вопрос слушания:\u003c/b> should Jim’s family ask the captain to leave the inn now? Официального ответа нет. Сила ответа — в доказательствах из главы и в точных выражениях.\u003c/p>\n        \u003cdiv class=\"grid2\">\n          \u003cdiv class=\"slab tide\">\n            \u003ch3 class=\"display\" style=\"font-size:22px;margin-bottom:10px\">Your verdict\u003c/h3>\n            \u003cdiv class=\"opts\" id=\"verdictList\">\n              \u003cbutton class=\"opt\">Yes — he is too dangerous to keep.\u003c/button>\n              \u003cbutton class=\"opt\">No — the inn needs his money.\u003c/button>\n              \u003cbutton class=\"opt\">Not yet — watch him for one more week.\u003c/button>\n            \u003c/div>\n            \u003cp class=\"mono-note\" style=\"color:rgba(243,231,201,.7);margin-top:14px\">Выбор можно поменять в середине ответа — но тогда объясни, какая деталь тебя развернула.\u003c/p>\n            \u003cdiv class=\"frame\" style=\"color:rgba(243,231,201,.7);border-color:rgba(243,231,201,.3)\">\u003cb>A2:\u003c/b> “I think they should … because he …”\u003cbr>\u003cb>B1:\u003c/b> “Although …, the fact that … makes me think …”\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"slab\">\n            \u003ch3 class=\"display\" style=\"font-size:22px;margin-bottom:6px\">Сорок пять секунд\u003c/h3>\n            \u003cp class=\"mono-note\">Отметь минимум пять выражений, которые попробуешь вставить. Говорить — без чтения с экрана.\u003c/p>\n            \u003cdiv class=\"row\" id=\"bank\" style=\"margin:10px 0\">\u003c/div>\n            \u003cdiv class=\"clock\">\u003cb id=\"clockFace\">00:45\u003c/b>\n              \u003cdiv class=\"row\" style=\"justify-content:center;margin-top:8px\">\n                \u003cbutton class=\"btn small\" id=\"clockStart\">Старт\u003c/button>\n                \u003cbutton class=\"btn small ghost\" id=\"clockReset\">Сброс\u003c/button>\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv style=\"margin-top:12px\">\n              \u003clabel class=\"check\">\u003cinput type=\"checkbox\" class=\"req\"> решение названо прямо\u003c/label>\n              \u003clabel class=\"check\">\u003cinput type=\"checkbox\" class=\"req\"> две детали из главы\u003c/label>\n              \u003clabel class=\"check\">\u003cinput type=\"checkbox\" class=\"req\"> пять целевых выражений\u003c/label>\n              \u003clabel class=\"check\">\u003cinput type=\"checkbox\" class=\"req\"> один контраст: although / however\u003c/label>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"talk\" data-talk=\"hearing\">\u003c/div>\n        \u003cdiv class=\"teach\">Сначала fluency round без вмешательства. Потом один содержательный комментарий и один языковой. Просите повторить только исправленный фрагмент, а не весь монолог — так сохраняется коммуникативная цель.\u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- ЛИСТ 10 -->\n    \u003csection class=\"page\" data-tab=\"Печать дела\" data-flag=\"#e8442a,#e8442a\">\n      \u003cdiv class=\"folio\">\n        \u003cspan class=\"folio-mark\">sheet x · exit\u003c/span>\n        \u003cdiv class=\"head\">\n          \u003cdiv>\u003cp class=\"kicker\">Лист десятый · закрыть дело\u003c/p>\u003ch2 class=\"display\">Seal the file\u003c/h2>\u003c/div>\n          \u003cspan class=\"stamp\">5 минут\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"grid2\">\n          \u003cdiv>\n            \u003cp class=\"task\">Впиши без словаря и без карточек задания 3. Форму слова менять можно.\u003c/p>\n            \u003cdiv class=\"rows\" id=\"gapList\">\u003c/div>\n            \u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"btn flag\" id=\"gapCheck\">Поставить печать\u003c/button>\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"slab\">\n            \u003cdiv class=\"wax\">\u003cdiv>\u003cb id=\"finalScore\">—\u003c/b>\u003cspan>expressions retrieved\u003c/span>\u003c/div>\u003c/div>\n            \u003cp id=\"rankLine\" style=\"text-align:center;color:var(--signal)\">Печать не поставлена\u003c/p>\n            \u003ch3 class=\"display\" style=\"font-size:20px;margin-bottom:8px\">Can-do\u003c/h3>\n            \u003clabel class=\"check\">\u003cinput type=\"checkbox\" class=\"cando\"> Я могу объяснить конфликт главы своими словами.\u003c/label>\n            \u003clabel class=\"check\">\u003cinput type=\"checkbox\" class=\"cando\"> Я могу описать капитана и подтвердить это деталью.\u003c/label>\n            \u003clabel class=\"check\">\u003cinput type=\"checkbox\" class=\"cando\"> Я использовала минимум пять новых выражений в речи.\u003c/label>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"teach\">Меньше 4 из 6 — новых слов в домашнее задание не добавляем, повторяем те же через сутки. 5–6 из 6 — подключаем B1-набор: take someone aside, insist on doing, give in.\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"folio\">\n        \u003cspan class=\"folio-mark\">bonus · chapter ii\u003c/span>\n        \u003cdiv class=\"head\">\n          \u003cdiv>\u003cp class=\"kicker\">Домашняя миссия\u003c/p>\u003ch2 class=\"display\">The Black Dog file\u003c/h2>\u003c/div>\n          \u003cspan class=\"stamp\">чтение дома\u003c/span>\n        \u003c/div>\n        \u003cp class=\"task\">Не переводи каждую строку. Сначала прогноз, во время чтения — охота за доказательствами, после — отчёт голосом или текстом.\u003c/p>\n        \u003cdiv class=\"grid3\">\n          \u003cdiv class=\"slab\">\n            \u003cp class=\"kicker\">До чтения\u003c/p>\n            \u003cp class=\"task\" style=\"font-size:13.5px\">Выбери две версии: кто такой Black Dog?\u003c/p>\n            \u003cdiv class=\"row\" id=\"c2Guess\">\n              \u003cbutton class=\"btn ghost small\" data-c2g=\"friend\">старый друг\u003c/button>\n              \u003cbutton class=\"btn ghost small\" data-c2g=\"fear\">тот, кого капитан боится\u003c/button>\n              \u003cbutton class=\"btn ghost small\" data-c2g=\"animal\">настоящая собака\u003c/button>\n              \u003cbutton class=\"btn ghost small\" data-c2g=\"past\">человек из его прошлого\u003c/button>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"slab\">\n            \u003cp class=\"kicker\">Во время чтения\u003c/p>\n            \u003cdiv id=\"c2Hunt\">\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"slab\">\n            \u003cp class=\"kicker\">Взять в речь\u003c/p>\n            \u003cp class=\"task\" style=\"font-size:13.5px\">Найди все шесть, но активируй любые четыре.\u003c/p>\n            \u003cdiv class=\"row\" id=\"c2Chunks\">\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"tally\">\u003cspan>Миссия главы II\u003c/span>\u003cstrong id=\"c2Score\">0 / 3\u003c/strong>\u003cbutton class=\"btn ghost small\" id=\"c2Open\">Открыть часть после чтения\u003c/button>\u003c/div>\n        \u003cdiv id=\"c2After\" hidden>\n          \u003cdiv class=\"grid2\" style=\"margin-top:16px\">\n            \u003cdiv class=\"slab\">\n              \u003ch3 class=\"display\" style=\"font-size:20px;margin-bottom:8px\">Case report\u003c/h3>\n              \u003cp class=\"mono-note\">Пять–шесть предложений или ключевые слова. Потом расскажи вслух, не читая с экрана.\u003c/p>\n              \u003ctextarea class=\"field\" id=\"c2Report\" placeholder=\"Black Dog came to the inn because… Billy reacted by… The power changed when… In the end…\">\u003c/textarea>\n              \u003cdiv class=\"frame\">\u003cb>Использовать минимум четыре:\u003c/b> set out · point out · call somebody back · get away from · have no idea what to do · warn somebody that…\u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"slab\">\n              \u003ch3 class=\"display\" style=\"font-size:20px;margin-bottom:8px\">Формат на выбор\u003c/h3>\n              \u003cp class=\"task\" style=\"font-size:13.5px\">Голосовое 60–90 секунд без сценария — или письменный рапорт на 80–100 слов.\u003c/p>\n              \u003cp class=\"task\" style=\"font-size:13.5px\">Ответь на три вопроса: что нужно было Black Dog, в какой момент сместилась власть, что открыл обморок Билли.\u003c/p>\n              \u003cdiv class=\"talk\" data-talk=\"chapter2\" style=\"margin-top:0\">\u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"teach\">Прогноз включает контекст, охота за доказательствами удерживает цель чтения, отчёт превращает понимание в речь. Обсуждение проводите до письменного отчёта, иначе текст станет заученным монологом.\u003c/div>\n      \u003c/div>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cdiv class=\"foot\">\n    \u003cbutton class=\"btn ghost\" id=\"prevBtn\">← Назад\u003c/button>\n    \u003cspan class=\"mid\" id=\"footLabel\">Главное меню · 1 / 12\u003c/span>\n    \u003cbutton class=\"btn\" id=\"nextBtn\">Дальше →\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"drawer-bg\" id=\"fileBg\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Выводы по делу\">\n  \u003caside class=\"drawer\">\n    \u003cdiv class=\"row\" style=\"justify-content:space-between;align-items:flex-start\">\n      \u003cdiv>\u003cp class=\"kicker\">Собранные выводы\u003c/p>\u003ch2 class=\"display\">Досье\u003c/h2>\u003c/div>\n      \u003cbutton class=\"btn ghost small\" id=\"fileClose\">Закрыть\u003c/button>\n    \u003c/div>\n    \u003cp class=\"task\" style=\"margin-top:12px\">Каждый закрытый лист добавляет сюда одну строку. На слушании дела ссылайся на них.\u003c/p>\n    \u003cdiv id=\"fileList\">\u003c/div>\n  \u003c/aside>\n\u003c/div>\n\n\u003cdiv class=\"drawer-bg\" id=\"wordsBg\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Личный словарь\">\n  \u003caside class=\"drawer\">\n    \u003cdiv class=\"row\" style=\"justify-content:space-between;align-items:flex-start\">\n      \u003cdiv>\u003cp class=\"kicker\">Мой словарь\u003c/p>\u003ch2 class=\"display\">Word list\u003c/h2>\u003c/div>\n      \u003cbutton class=\"btn ghost small\" id=\"wordsClose\">Закрыть\u003c/button>\n    \u003c/div>\n    \u003cp class=\"task\" style=\"margin-top:12px\">Нажми на любое английское слово в уроке — появится перевод и кнопка «в словарь».\u003c/p>\n    \u003cdiv id=\"wordsList\">\u003c/div>\n    \u003cdiv class=\"row\" style=\"margin-top:14px\">\n      \u003cbutton class=\"btn small\" id=\"wordsCopy\">Скопировать списком\u003c/button>\n      \u003cbutton class=\"btn ghost small\" id=\"wordsClear\">Очистить\u003c/button>\n    \u003c/div>\n  \u003c/aside>\n\u003c/div>\n\n\u003cdiv class=\"tr\" id=\"tr\">\n  \u003cp class=\"tr-w\" id=\"trWord\">\u003c/p>\n  \u003cp class=\"tr-r\" id=\"trRu\">\u003c/p>\n  \u003cp class=\"tr-s\" id=\"trSrc\">\u003c/p>\n  \u003cdiv class=\"tr-a\">\n    \u003cbutton id=\"trSay\">Звук\u003c/button>\n    \u003cbutton class=\"keep\" id=\"trKeep\">В словарь\u003c/button>\n    \u003cbutton id=\"trClose\">Закрыть\u003c/button>\n  \u003c/div>\n\u003c/div>\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>\n\n\u003cscript>\n/* Английская озвучка для всех страниц урока.\n   Браузер сам по себе часто читает английский русским голосом или\n   голосом-«шуткой» (на Mac: Albert, Bad News…). Здесь выбираем лучший\n   доступный английский голос, даём выбрать его вручную и держим скорость\n   в диапазоне, где речь не ломается. */\n(() => {\n'use strict';\n\nconst synth = 'speechSynthesis' in window ? window.speechSynthesis : null;\nconst PREF = 'tts-voice-v1';\nconst SAMPLE = 'Jim had to keep an eye out for a sailor with one leg.';\n\n/* голоса-эффекты macOS и роботизированные Eloquence */\nconst NOVELTY = /^(albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|pipe organ|superstar|trinoids|whisper|wobble|zarvox|deranged|hysterical|fred|junior|ralph|kathy|princess)\\b/i;\nconst ROBOTIC = /^(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley)\\b/i;\nconst NICE = /(samantha|daniel|serena|kate|oliver|arthur|martha|karen|moira|tessa|libby|sonia|ryan|aria|jenny|guy|hazel|susan|george|google uk english|google us english)/i;\nconst HQ = /(natural|neural|premium|enhanced|online)/i;\n\nlet voices = [];\nfunction load(){ if(synth) voices = synth.getVoices() || []; return voices; }\nif(synth){\n  load();\n  if(typeof synth.addEventListener === 'function') synth.addEventListener('voiceschanged', () => { load(); refreshPicker(); });\n  else synth.onvoiceschanged = () => { load(); refreshPicker(); };\n}\n\nfunction score(v){\n  const lang = (v.lang || '').replace('_', '-').toLowerCase();\n  if(!lang.startsWith('en')) return -1;\n  const name = v.name || '';\n  if(NOVELTY.test(name)) return -1;\n  let s = 10;\n  if(ROBOTIC.test(name)) s -= 30;\n  if(HQ.test(name)) s += 50;\n  if(NICE.test(name)) s += 40;\n  if(/^microsoft .* desktop/i.test(name)) s += 5;\n  if(lang === 'en-gb') s += 20; else if(lang === 'en-us') s += 15; else s += 5;\n  return s;\n}\nfunction english(){\n  return load().filter(v => score(v) > -1).sort((a, b) => score(b) - score(a));\n}\nfunction current(){\n  const list = english();\n  let pref = '';\n  try { pref = localStorage.getItem(PREF) || ''; } catch(e){}\n  return list.find(v => v.voiceURI === pref || v.name === pref) || list[0] || null;\n}\n\nlet warned = false;\nfunction notice(msg){\n  const t = document.getElementById('toast');\n  if(t){ t.textContent = msg; t.classList.add('show'); clearTimeout(notice._t); notice._t = setTimeout(() => t.classList.remove('show'), 3200); }\n}\n\n/* rate: 1 — обычная речь; всё ниже .7 у большинства голосов звучит «сломанно» */\nfunction speak(text, rate, voiceOverride){\n  if(!synth){ notice('В этом браузере нет озвучки. Попробуйте Chrome, Edge или Safari.'); return false; }\n  const v = voiceOverride || current();\n  if(!v && !warned){ warned = true; notice('На устройстве нет английского голоса — нажмите «🔊 Голос», там инструкция.'); }\n  synth.cancel();\n  const u = new SpeechSynthesisUtterance(String(text));\n  if(v){ u.voice = v; u.lang = v.lang; } else u.lang = 'en-GB';\n  const r = Number(rate) || .9;\n  u.rate = Math.min(1.05, Math.max(.72, r \u003c .75 ? .72 : r + .08));\n  u.pitch = 1;\n  window.__ttsUtterance = u;           /* Chrome иначе может собрать фразу сборщиком мусора и оборвать её */\n  setTimeout(() => synth.speak(u), 50); /* Chrome теряет фразу, если speak вызвать сразу после cancel */\n  return true;\n}\n\n/* Длинный текст читаем по предложениям: Chrome обрывает одну длинную фразу\n   примерно через 15 секунд. onEach(i) вызывается в начале каждого предложения. */\nlet queueId = 0;\nfunction speakQueue(list, rate, onEach, onDone){\n  if(!synth){ notice('В этом браузере нет озвучки. Попробуйте Chrome, Edge или Safari.'); return false; }\n  const v = current(), id = ++queueId;\n  if(!v && !warned){ warned = true; notice('На устройстве нет английского голоса — нажмите «🔊 Голос», там инструкция.'); }\n  synth.cancel();\n  const r = Number(rate) || .9;\n  const us = list.map((text, i) => {\n    const u = new SpeechSynthesisUtterance(String(text));\n    if(v){ u.voice = v; u.lang = v.lang; } else u.lang = 'en-GB';\n    u.rate = Math.min(1.05, Math.max(.72, r \u003c .75 ? .72 : r + .08)); u.pitch = 1;\n    u.onstart = () => { if(id === queueId && onEach) onEach(i); };\n    if(i === list.length - 1) u.onend = () => { if(id === queueId && onDone) onDone(); };\n    return u;\n  });\n  window.__ttsUtterance = us;\n  setTimeout(() => us.forEach(u => synth.speak(u)), 50);\n  return true;\n}\nfunction stop(){ queueId++; if(synth) synth.cancel(); }\n\n/* ---------- окно выбора голоса ---------- */\nlet box = null;\nfunction css(){\n  if(document.getElementById('tts-style')) return;\n  const st = document.createElement('style'); st.id = 'tts-style';\n  st.textContent =\n    '.tts-bg{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center;background:rgba(35,58,87,.45)}' +\n    '.tts-bg.open{display:flex}' +\n    '.tts{width:min(560px,100%);max-height:88vh;overflow-y:auto;padding:22px 18px calc(22px + env(safe-area-inset-bottom));color:#233a57;background:#f4f9ff;border-radius:26px 26px 0 0;font-family:Nunito,\"Trebuchet MS\",sans-serif;font-weight:600}' +\n    '@media (min-width:640px){.tts-bg{align-items:center}.tts{border-radius:26px}}' +\n    '.tts h2{margin:0;font-family:Rubik,\"Trebuchet MS\",sans-serif;font-size:26px;font-weight:800}' +\n    '.tts p{margin:8px 0;font-size:15px;color:#5d6f88}' +\n    '.tts-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;margin-top:8px;padding:10px 12px;background:#fff;border:2px solid #dbe7f3;border-radius:16px}' +\n    '.tts-row.on{border-color:#4cc25a;background:#eafbe9}' +\n    '.tts-row b{display:block;font-family:Rubik,\"Trebuchet MS\",sans-serif;font-size:15.5px}' +\n    '.tts-row span{font-size:13px;color:#5d6f88}' +\n    '.tts-row em{display:inline-block;margin-left:6px;padding:1px 7px;font-style:normal;font-size:11px;font-weight:800;color:#fff;background:#ffb020;border-radius:999px}' +\n    '.tts button{min-height:40px;padding:6px 12px;font-family:Rubik,\"Trebuchet MS\",sans-serif;font-size:13.5px;font-weight:800;color:#233a57;background:#fff;border:2px solid #dbe7f3;border-radius:12px;cursor:pointer}' +\n    '.tts button.pick{color:#fff;background:#38b6ff;border-color:#38b6ff}' +\n    '.tts .tts-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}' +\n    '.tts details{margin-top:14px;padding:10px 12px;background:#fff8dc;border:2px dashed #f0d27a;border-radius:16px;font-size:14.5px}' +\n    '.tts summary{font-family:Rubik,\"Trebuchet MS\",sans-serif;font-weight:800;color:#b07a00;cursor:pointer}' +\n    '.tts details li{margin:6px 0}' +\n    '.tts .tts-empty{padding:14px;text-align:center;background:#fff0f0;border:2px solid #ffd0d2;border-radius:16px;color:#b82c31}';\n  document.head.appendChild(st);\n}\nfunction rows(){\n  const list = english().slice(0, 14), cur = current();\n  if(!list.length){\n    return '\u003cdiv class=\"tts-empty\">Английских голосов на этом устройстве не найдено. Установите голос по инструкции ниже и перезагрузите страницу.\u003c/div>';\n  }\n  return list.map((v, i) =>\n    '\u003cdiv class=\"tts-row ' + (cur && v.voiceURI === cur.voiceURI ? 'on' : '') + '\">\u003cdiv>\u003cb>' + v.name.replace(/\u003c/g, '&lt;') +\n    (HQ.test(v.name) || NICE.test(v.name) ? '\u003cem>хороший\u003c/em>' : '') + '\u003c/b>\u003cspan>' + v.lang + (v.localService === false ? ' · нужен интернет' : '') + '\u003c/span>\u003c/div>' +\n    '\u003cbutton data-tts-try=\"' + i + '\" aria-label=\"Послушать\">▶\u003c/button>' +\n    '\u003cbutton class=\"' + (cur && v.voiceURI === cur.voiceURI ? 'pick' : '') + '\" data-tts-use=\"' + i + '\">' + (cur && v.voiceURI === cur.voiceURI ? 'выбран' : 'выбрать') + '\u003c/button>\u003c/div>').join('');\n}\nfunction refreshPicker(){\n  if(!box || !box.classList.contains('open')) return;\n  const list = english().slice(0, 14);\n  box.querySelector('#ttsList').innerHTML = rows();\n  box.querySelectorAll('[data-tts-try]').forEach(b => b.addEventListener('click', () => speak(SAMPLE, .9, list[+b.dataset.ttsTry])));\n  box.querySelectorAll('[data-tts-use]').forEach(b => b.addEventListener('click', () => {\n    const v = list[+b.dataset.ttsUse];\n    try { localStorage.setItem(PREF, v.voiceURI || v.name); } catch(e){}\n    speak(SAMPLE, .9, v); refreshPicker();\n  }));\n}\nfunction openPicker(){\n  css();\n  if(!box){\n    box = document.createElement('div');\n    box.className = 'tts-bg';\n    box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true'); box.setAttribute('aria-label', 'Выбор голоса');\n    box.innerHTML = '\u003cdiv class=\"tts\">\u003cdiv class=\"tts-head\">\u003cdiv>\u003ch2>Английский голос\u003c/h2>' +\n      '\u003cp>Нажми ▶, чтобы послушать, и выбери голос, который звучит естественно. Лучшие стоят сверху и помечены «хороший».\u003c/p>\u003c/div>' +\n      '\u003cbutton data-tts-close>Закрыть\u003c/button>\u003c/div>\u003cdiv id=\"ttsList\">\u003c/div>' +\n      '\u003cdetails>\u003csummary>Голос звучит плохо или его нет?\u003c/summary>\u003cul>' +\n      '\u003cli>\u003cb>iPhone / iPad:\u003c/b> Настройки → Универсальный доступ → Устный контент → Голоса → Английский → скачайте голос с пометкой «улучшенный» или «премиум» (например, Serena, Daniel, Samantha).\u003c/li>' +\n      '\u003cli>\u003cb>Mac:\u003c/b> Системные настройки → Универсальный доступ → Устный контент → Системный голос → Управлять голосами → English.\u003c/li>' +\n      '\u003cli>\u003cb>Windows:\u003c/b> откройте урок в Microsoft Edge — там есть естественные голоса (Libby, Sonia, Ryan).\u003c/li>' +\n      '\u003cli>\u003cb>Android:\u003c/b> Настройки → Специальные возможности → Синтез речи → Синтезатор Google → установите английский язык.\u003c/li>' +\n      '\u003cli>После установки перезагрузите страницу.\u003c/li>\u003c/ul>\u003c/details>\u003c/div>';\n    document.body.appendChild(box);\n    box.addEventListener('click', e => { if(e.target === box || e.target.closest('[data-tts-close]')) box.classList.remove('open'); });\n    document.addEventListener('keydown', e => { if(e.key === 'Escape') box.classList.remove('open'); });\n  }\n  load();\n  box.classList.add('open');\n  refreshPicker();\n}\n\nwindow.TTS = { speak, speakQueue, stop, openPicker, current, available: () => !!synth };\n})();\n\n\u003c/script>\n\u003cscript>\n(() => {\n'use strict';\n\n/* ======== данные игрового слоя ======== */\nconst rapid = [['высматривать, быть начеку','keep an eye out for'],\n  ['сообщить, дать знать','let somebody know'],\n  ['избегать','avoid'],\n  ['оставить в покое','let somebody be'],\n  ['сердито смотреть на','glare at'],\n  ['заставить кого-то сделать','force somebody to do'],\n  ['притворяться','pretend to do'],\n  ['угрожать сделать','threaten to do'],\n  ['отвести в сторону','take somebody aside'],\n  ['настаивать на том, чтобы','insist on doing'],\n  ['уступить, сдаться','give in']\n];\nconst voiceLines = [\n  'He avoided meeting other sailors.',\n  'Let me know the moment he appears.',\n  'The captain forced the guests to sing.',\n  'He threatened to hurt the doctor.',\n  'They learned to let him be.',\n  'In the end the old captain gave in.'\n];\nconst deck = rapid.map(([ru,en]) => ({ id:en, ru, en }));\nconst RANKS = [[0,'Юнга'],[120,'Матрос'],[280,'Штурман'],[520,'Капитан'],[820,'Адмирал']];\n\nconst GK = 'benbow-game-v1';\nlet G = { xp:0, best:0, streak:0, voice:{}, sched:{}, sound:true, seals:0, plays:0 };\ntry { G = { ...G, ...JSON.parse(localStorage.getItem(GK) || '{}') }; } catch(e){}\nG.voice = G.voice || {}; G.sched = G.sched || {};\nconst gsave = () => { try { localStorage.setItem(GK, JSON.stringify(G)); } catch(e){} };\nconst rankOf = xp => RANKS.filter(r => xp >= r[0]).pop()[1];\nconst nextRank = xp => RANKS.find(r => xp \u003c r[0]);\n\n/* ======== звук и вибрация ======== */\nlet actx = null;\nfunction blip(freq, dur, type){\n  if(!G.sound) return;\n  try{\n    actx = actx || new (window.AudioContext || window.webkitAudioContext)();\n    const o = actx.createOscillator(), g = actx.createGain();\n    o.type = type || 'triangle'; o.frequency.value = freq;\n    g.gain.setValueAtTime(.0001, actx.currentTime);\n    g.gain.exponentialRampToValueAtTime(.14, actx.currentTime + .02);\n    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + (dur || .18));\n    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + (dur || .18) + .02);\n  } catch(e){}\n}\nconst buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} };\nconst good = () => { blip(660,.12); setTimeout(() => blip(990,.16), 90); buzz(18); };\nconst bad  = () => { blip(180,.22,'sawtooth'); buzz([12,40,12]); };\n\n/* ======== новые листы ======== */\nconst rapidPage = `\n\u003csection class=\"page\" data-tab=\"Скоростной рейс\" data-flag=\"#8e2b1e,#e8dcbe\">\n  \u003cdiv class=\"folio\">\n    \u003cspan class=\"folio-mark\">sheet · drill\u003c/span>\n    \u003cdiv class=\"head\">\n      \u003cdiv>\u003cp class=\"kicker\">Игровой лист · на скорость\u003c/p>\u003ch2 class=\"display\">Sixty seconds at the helm\u003c/h2>\u003c/div>\n      \u003cspan class=\"stamp\">60 секунд\u003c/span>\n    \u003c/div>\n    \u003cp class=\"task\">Русское значение — выбери английское выражение. Серия верных ответов поднимает множитель: три подряд — двойная цена, шесть — тройная. Ошибка сбивает серию, но не отнимает очки.\u003c/p>\n    \u003cdiv class=\"arena\">\n      \u003cdiv class=\"arena-top\">\n        \u003cdiv>\u003cspan class=\"arena-k\">время\u003c/span>\u003cb id=\"rfTime\">60\u003c/b>\u003c/div>\n        \u003cdiv>\u003cspan class=\"arena-k\">очки\u003c/span>\u003cb id=\"rfScore\">0\u003c/b>\u003c/div>\n        \u003cdiv>\u003cspan class=\"arena-k\">серия\u003c/span>\u003cb id=\"rfCombo\">×1\u003c/b>\u003c/div>\n        \u003cdiv>\u003cspan class=\"arena-k\">рекорд\u003c/span>\u003cb id=\"rfBest\">0\u003c/b>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"arena-bar\">\u003ci id=\"rfBar\">\u003c/i>\u003c/div>\n      \u003cp class=\"arena-q\" id=\"rfQ\">Нажми «Отдать швартовы», чтобы начать\u003c/p>\n      \u003cdiv class=\"arena-opts\" id=\"rfOpts\">\u003c/div>\n      \u003cdiv class=\"row\" style=\"margin-top:14px\">\u003cbutton class=\"btn flag\" id=\"rfStart\">Отдать швартовы\u003c/button>\u003cspan class=\"mono-note\" id=\"rfHint\">Клавиши 1–4 тоже работают\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"teach\">Скоростной раунд ставится после разбора лексики и перед говорением: он разогревает извлечение из памяти. Если счёт ниже 120, возвращайтесь к карточкам, а не к говорению.\u003c/div>\n  \u003c/div>\n\u003c/section>`;\n\nconst voicePage = `\n\u003csection class=\"page\" data-tab=\"Голосовой рапорт\" data-flag=\"#1c4c4a,#c08733\">\n  \u003cdiv class=\"folio\">\n    \u003cspan class=\"folio-mark\">sheet · voice\u003c/span>\n    \u003cdiv class=\"head\">\n      \u003cdiv>\u003cp class=\"kicker\">Игровой лист · речь вслух\u003c/p>\u003ch2 class=\"display\">Say it to the machine\u003c/h2>\u003c/div>\n      \u003cspan class=\"stamp\">8 минут\u003c/span>\n    \u003c/div>\n    \u003cp class=\"task\">Шесть фраз. Нажимаешь кнопку и произносишь фразу вслух — браузер распознаёт речь и показывает, какие слова он услышал. Семьдесят процентов совпадения и выше — фраза принята. Это не тест на акцент, а проверка того, что фраза выходит целиком и без пауз.\u003c/p>\n    \u003cdiv id=\"voiceList\">\u003c/div>\n    \u003cdiv class=\"tally\">\u003cspan>Фраз принято\u003c/span>\u003cstrong id=\"voiceScore\">0 / 6\u003c/strong>\u003cspan class=\"mono-note\" id=\"voiceNote\">\u003c/span>\u003c/div>\n    \u003cdiv class=\"teach\">Распознавание работает в Chrome, Edge и на Android; в Safari его может не быть — тогда лист превращается в запись голоса, и студентка сравнивает себя с эталоном на слух. Просите произносить фразу целиком: разорванная речь не распознаётся, и это честная обратная связь про беглость.\u003c/div>\n  \u003c/div>\n\u003c/section>`;\n\nconst sheet = document.querySelector('.sheet');\nconst list = () => [...document.querySelectorAll('.page')];\nif(sheet){\n  const p = list();\n  p[4] && p[4].insertAdjacentHTML('beforebegin', rapidPage);\n  const p2 = list();\n  const hearing = p2.find(s => s.dataset.tab === 'Слушание дела');\n  hearing && hearing.insertAdjacentHTML('beforebegin', voicePage);\n}\n\n/* ======== запуск после основного скрипта ======== */\nfunction init(){\n  const $ = id => document.getElementById(id);\n  const norm = s => (s||'').toLowerCase().replace(/[^a-z0-9\\s]/g,' ').replace(/\\s+/g,' ').trim();\n  const toast = msg => {\n    const t = $('toast'); if(!t) return;\n    t.textContent = msg; t.classList.add('show');\n    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400);\n  };\n  const say = (text, rate) => { if(window.TTS) TTS.speak(text, rate); };\n\n  /* ---- XP-полоса в шапке ---- */\n  const bar = document.querySelector('.bar');\n  if(bar && !$('xpWrap')){\n    bar.insertAdjacentHTML('beforeend',\n      '\u003cdiv id=\"xpWrap\" class=\"xp-wrap\">\u003cspan class=\"bar-k\">ранг и опыт\u003c/span>' +\n      '\u003cstrong class=\"xp-rank\" id=\"xpRank\">Юнга\u003c/strong>' +\n      '\u003cdiv class=\"xp-line\">\u003ci id=\"xpFill\">\u003c/i>\u003c/div>' +\n      '\u003cspan class=\"xp-copy\" id=\"xpCopy\">0 XP\u003c/span>' +\n      '\u003cdiv class=\"xp-btns\">\u003cbutton class=\"bar-btn\" id=\"revBtn\">Повторение \u003cb id=\"revCount\">0\u003c/b>\u003c/button>' +\n      '\u003cbutton class=\"bar-btn\" id=\"cardBtn\">Карточка\u003c/button>' +\n      '\u003cbutton class=\"bar-btn\" id=\"sndBtn\" aria-pressed=\"true\">Звук\u003c/button>\u003c/div>\u003c/div>');\n  }\n  function addXP(n, why){\n    G.xp += n; gsave(); renderXP();\n    if(why) toast('+' + n + ' XP · ' + why);\n  }\n  function renderXP(){\n    const r = rankOf(G.xp), nx = nextRank(G.xp);\n    $('xpRank').textContent = r;\n    $('xpCopy').textContent = G.xp + ' XP' + (nx ? ' · до звания «' + nx[1] + '»: ' + (nx[0] - G.xp) : ' · высшее звание');\n    const floor = RANKS.filter(x => G.xp >= x[0]).pop()[0];\n    const ceil = nx ? nx[0] : floor + 1;\n    $('xpFill').style.width = Math.min(100, Math.round((G.xp - floor) / (ceil - floor) * 100)) + '%';\n    $('sndBtn').textContent = G.sound ? 'Звук' : 'Без звука';\n    $('sndBtn').setAttribute('aria-pressed', String(G.sound));\n  }\n  $('sndBtn').addEventListener('click', () => { G.sound = !G.sound; gsave(); renderXP(); if(G.sound) good(); });\n\n  /* ---- печати основного урока дают опыт ---- */\n  const sealRow = $('sealRow');\n  if(sealRow){\n    const count = () => sealRow.querySelectorAll('.seal-dot.on').length;\n    G.seals = G.seals || 0;\n    new MutationObserver(() => {\n      const n = count();\n      if(n > G.seals){ addXP((n - G.seals) * 25, 'лист закрыт'); good(); }\n      G.seals = n; gsave();\n    }).observe(sealRow, { childList:true, subtree:true });\n    G.seals = Math.max(G.seals, count()); gsave();\n  }\n\n  /* ---- курс в боковой панели ---- */\n  const gauge = document.querySelector('.gauge-copy');\n  if(gauge && !$('courseMap')){\n    gauge.insertAdjacentHTML('afterend',\n      '\u003csvg id=\"courseMap\" viewBox=\"0 0 230 96\" aria-hidden=\"true\">' +\n      '\u003cpath id=\"coursePath\" d=\"M8 78 C44 26 78 88 112 44 C142 6 176 70 222 24\" fill=\"none\" stroke=\"#2a8fd6\" stroke-width=\"2\" stroke-dasharray=\"5 5\"/>' +\n      '\u003cg id=\"courseStops\">\u003c/g>' +\n      '\u003cg id=\"courseShip\">\u003cpath d=\"M-7 4 h14 l-3 4 h-8 z\" fill=\"#a0602e\"/>\u003cpath d=\"M0 4 V-8 M0 -7 l7 6 h-7z\" stroke=\"#a0602e\" stroke-width=\"1.4\" fill=\"#fff\"/>\u003c/g>' +\n      '\u003c/svg>');\n  }\n  function drawCourse(){\n    const path = $('coursePath'); if(!path || typeof path.getTotalLength !== 'function') return;\n    const pages = list(), len = path.getTotalLength();\n    const idx = pages.findIndex(p => p.classList.contains('on'));\n    const stops = pages.map((p,i) => path.getPointAtLength(len * i / (pages.length - 1)));\n    $('courseStops').innerHTML = stops.map((pt,i) =>\n      '\u003ccircle cx=\"' + pt.x.toFixed(1) + '\" cy=\"' + pt.y.toFixed(1) + '\" r=\"' + (i === idx ? 3.4 : 2.2) + '\" fill=\"' + (i \u003c= idx ? '#ff8a3d' : '#9ccbea') + '\"/>').join('');\n    const s = stops[Math.max(0, idx)];\n    $('courseShip').setAttribute('transform', 'translate(' + s.x.toFixed(1) + ' ' + (s.y - 6).toFixed(1) + ')');\n  }\n  const tabsHost = $('tabsDesktop');\n  if(tabsHost) new MutationObserver(drawCourse).observe(tabsHost, { childList:true, subtree:true });\n\n  /* ---- скоростной рейс ---- */\n  let rfTimer = null, rfLeft = 60, rfScore = 0, rfCombo = 0, rfItem = null;\n  $('rfBest').textContent = G.best;\n  function rfMul(){ return rfCombo >= 6 ? 3 : rfCombo >= 3 ? 2 : 1; }\n  function rfNext(){\n    const item = rapid[Math.floor(Math.random() * rapid.length)];\n    rfItem = item;\n    const opts = [item[1]];\n    while(opts.length \u003c 4){\n      const c = rapid[Math.floor(Math.random() * rapid.length)][1];\n      if(!opts.includes(c)) opts.push(c);\n    }\n    opts.sort(() => Math.random() - .5);\n    $('rfQ').textContent = item[0];\n    $('rfOpts').innerHTML = opts.map((o,i) => '\u003cbutton class=\"arena-opt\" data-rf=\"' + o.replace(/\"/g,'&quot;') + '\">\u003cspan>' + (i+1) + '\u003c/span>' + o + '\u003c/button>').join('');\n    $('rfOpts').querySelectorAll('[data-rf]').forEach(b => b.addEventListener('click', () => rfAnswer(b.dataset.rf, b)));\n  }\n  function rfAnswer(ans, btn){\n    if(!rfTimer) return;\n    const ok = ans === rfItem[1];\n    if(ok){\n      rfCombo++; rfScore += 10 * rfMul(); good();\n      btn.classList.add('hit');\n    } else {\n      rfCombo = 0; bad();\n      btn.classList.add('miss');\n      $('rfOpts').querySelectorAll('[data-rf]').forEach(b => { if(b.dataset.rf === rfItem[1]) b.classList.add('hit'); });\n    }\n    $('rfScore').textContent = rfScore;\n    $('rfCombo').textContent = '×' + rfMul();\n    setTimeout(rfNext, ok ? 140 : 620);\n  }\n  function rfStop(){\n    clearInterval(rfTimer); rfTimer = null;\n    $('rfStart').textContent = 'Ещё рейс';\n    $('rfOpts').innerHTML = '';\n    const record = rfScore > G.best;\n    if(record){ G.best = rfScore; }\n    G.plays = (G.plays || 0) + 1;\n    addXP(Math.round(rfScore / 5), 'скоростной рейс');\n    gsave();\n    $('rfBest').textContent = G.best;\n    $('rfQ').textContent = record ? 'Новый рекорд: ' + rfScore + ' очков' : 'Итог рейса: ' + rfScore + ' очков';\n    if(record) toast('Рекорд побит');\n  }\n  $('rfStart').addEventListener('click', () => {\n    if(rfTimer) return;\n    rfLeft = 60; rfScore = 0; rfCombo = 0;\n    $('rfScore').textContent = '0'; $('rfCombo').textContent = '×1'; $('rfStart').textContent = 'Идёт рейс…';\n    rfNext();\n    rfTimer = setInterval(() => {\n      rfLeft--; $('rfTime').textContent = rfLeft;\n      $('rfBar').style.width = (rfLeft / 60 * 100) + '%';\n      if(rfLeft \u003c= 5) blip(420, .06);\n      if(rfLeft \u003c= 0) rfStop();\n    }, 1000);\n  });\n  document.addEventListener('keydown', e => {\n    if(!rfTimer || !/^[1-4]$/.test(e.key)) return;\n    const b = $('rfOpts').querySelectorAll('[data-rf]')[+e.key - 1];\n    b && b.click();\n  });\n\n  /* ---- голосовой рапорт ---- */\n  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;\n  function renderVoice(){\n    $('voiceList').innerHTML = voiceLines.map((line,i) => {\n      const sc = G.voice[i];\n      return '\u003cdiv class=\"write ' + (sc >= 70 ? 'ok' : sc ? 'no' : '') + '\" data-v=\"' + i + '\">' +\n        '\u003cdiv class=\"write-head\">\u003cspan class=\"n\">' + (i+1) + '\u003c/span>\u003cspan class=\"q\">' + line + '\u003c/span>' +\n        '\u003cdiv class=\"tools\">\u003cbutton class=\"btn ghost small\" data-vsay=\"' + i + '\">эталон\u003c/button>' +\n        '\u003cbutton class=\"btn small\" data-vrec=\"' + i + '\">' + (SR ? 'сказать' : 'записать') + '\u003c/button>\u003c/div>\u003c/div>' +\n        '\u003cdiv class=\"fb\" data-vfb=\"' + i + '\">' + (sc ? 'Совпадение: ' + sc + '%' : '') + '\u003c/div>\u003c/div>';\n    }).join('');\n    voiceLines.forEach((line,i) => {\n      document.querySelector('[data-vsay=\"' + i + '\"]').addEventListener('click', () => say(line, .82));\n      document.querySelector('[data-vrec=\"' + i + '\"]').addEventListener('click', e => SR ? listen(i, e.currentTarget) : record(i, e.currentTarget));\n    });\n    const done = voiceLines.filter((l,i) => (G.voice[i] || 0) >= 70).length;\n    $('voiceScore').textContent = done + ' / ' + voiceLines.length;\n    $('voiceNote').textContent = SR ? 'распознавание включено' : 'распознавание недоступно — включён режим записи';\n  }\n  function score(target, heard){\n    const t = norm(target).split(' '), h = norm(heard).split(' ');\n    let hit = 0;\n    const pool = [...h];\n    t.forEach(w => { const k = pool.indexOf(w); if(k > -1){ hit++; pool.splice(k,1); } });\n    return { pct: Math.round(hit / t.length * 100), marked: t.map(w => '\u003cspan class=\"' + (h.includes(w) ? 'w-ok' : 'w-no') + '\">' + w + '\u003c/span>').join(' ') };\n  }\n  function listen(i, btn){\n    const rec = new SR();\n    rec.lang = 'en-GB'; rec.interimResults = false; rec.maxAlternatives = 3;\n    const fb = document.querySelector('[data-vfb=\"' + i + '\"]');\n    btn.textContent = 'слушаю…'; btn.classList.add('live'); fb.textContent = 'Говори фразу целиком.';\n    rec.onresult = ev => {\n      const heard = [...ev.results[0]].map(r => r.transcript).join(' ');\n      const r = score(voiceLines[i], heard);\n      G.voice[i] = r.pct; gsave();\n      fb.innerHTML = 'Совпадение: \u003cb>' + r.pct + '%\u003c/b> · ' + r.marked + '\u003cspan class=\"model\">Услышано: ' + heard + '\u003c/span>';\n      const box = document.querySelector('[data-v=\"' + i + '\"]');\n      box.classList.toggle('ok', r.pct >= 70); box.classList.toggle('no', r.pct \u003c 70);\n      if(r.pct >= 70){ good(); addXP(15, 'фраза произнесена'); } else bad();\n      const done = voiceLines.filter((l,n) => (G.voice[n] || 0) >= 70).length;\n      $('voiceScore').textContent = done + ' / ' + voiceLines.length;\n    };\n    rec.onerror = ev => {\n      fb.textContent = ev.error === 'not-allowed'\n        ? 'Браузер не дал доступ к микрофону. Разреши его в адресной строке.'\n        : 'Не расслышал. Попробуй ещё раз, ближе к микрофону.';\n    };\n    rec.onend = () => { btn.textContent = 'сказать'; btn.classList.remove('live'); };\n    try { rec.start(); } catch(e){ fb.textContent = 'Распознавание уже запущено.'; }\n  }\n  let mrec = null, chunks = [];\n  async function record(i, btn){\n    const fb = document.querySelector('[data-vfb=\"' + i + '\"]');\n    if(mrec && mrec.state === 'recording'){ mrec.stop(); return; }\n    try{\n      const stream = await navigator.mediaDevices.getUserMedia({ audio:true });\n      chunks = []; mrec = new MediaRecorder(stream);\n      mrec.ondataavailable = e => chunks.push(e.data);\n      mrec.onstop = () => {\n        stream.getTracks().forEach(t => t.stop());\n        const url = URL.createObjectURL(new Blob(chunks, { type:'audio/webm' }));\n        fb.innerHTML = 'Сравни себя с эталоном: \u003caudio controls src=\"' + url + '\">\u003c/audio>';\n        btn.textContent = 'записать'; btn.classList.remove('live');\n        G.voice[i] = Math.max(G.voice[i] || 0, 70); gsave(); addXP(10, 'запись сделана');\n      };\n      mrec.start(); btn.textContent = 'стоп'; btn.classList.add('live');\n      fb.textContent = 'Идёт запись. Нажми «стоп», когда договоришь.';\n    } catch(e){ fb.textContent = 'Микрофон недоступен в этом браузере.'; }\n  }\n  renderVoice();\n\n  /* ---- запись финального ответа на листе слушания ---- */\n  const clock = document.querySelector('.clock');\n  if(clock && !$('memoBox')){\n    clock.insertAdjacentHTML('afterend',\n      '\u003cdiv id=\"memoBox\" class=\"memo\">\u003cdiv class=\"row\" style=\"justify-content:space-between\">' +\n      '\u003cspan class=\"mono-note\">Записать ответ и послушать себя\u003c/span>' +\n      '\u003cbutton class=\"btn small\" id=\"memoBtn\">Записать\u003c/button>\u003c/div>' +\n      '\u003cdiv id=\"memoOut\" class=\"fb\">\u003c/div>\u003c/div>');\n    let mr = null, ch = [];\n    $('memoBtn').addEventListener('click', async () => {\n      if(mr && mr.state === 'recording'){ mr.stop(); return; }\n      try{\n        const stream = await navigator.mediaDevices.getUserMedia({ audio:true });\n        ch = []; mr = new MediaRecorder(stream);\n        mr.ondataavailable = e => ch.push(e.data);\n        mr.onstop = () => {\n          stream.getTracks().forEach(t => t.stop());\n          const url = URL.createObjectURL(new Blob(ch, { type:'audio/webm' }));\n          $('memoOut').innerHTML = '\u003caudio controls src=\"' + url + '\">\u003c/audio> \u003ca class=\"btn ghost small\" download=\"benbow-answer.webm\" href=\"' + url + '\">скачать\u003c/a>';\n          $('memoBtn').textContent = 'Записать заново'; $('memoBtn').classList.remove('live');\n          addXP(20, 'устный ответ записан');\n        };\n        mr.start(); $('memoBtn').textContent = 'Стоп'; $('memoBtn').classList.add('live');\n        setTimeout(() => { if(mr && mr.state === 'recording') mr.stop(); }, 60000);\n      } catch(e){ $('memoOut').textContent = 'Микрофон недоступен.'; }\n    });\n  }\n\n  /* ---- интервальное повторение ---- */\n  const DAY = 864e5;\n  const dueList = () => deck.filter(c => !G.sched[c.id] || G.sched[c.id].due \u003c= Date.now());\n  function renderDue(){ $('revCount').textContent = dueList().length; }\n  const revBg = document.createElement('div');\n  revBg.className = 'drawer-bg';\n  revBg.innerHTML = '\u003caside class=\"drawer\">\u003cdiv class=\"row\" style=\"justify-content:space-between;align-items:flex-start\">' +\n    '\u003cdiv>\u003cp class=\"kicker\">Интервальное повторение\u003c/p>\u003ch2 class=\"display\">Вахта памяти\u003c/h2>\u003c/div>' +\n    '\u003cbutton class=\"btn ghost small\" id=\"revClose\">Закрыть\u003c/button>\u003c/div>' +\n    '\u003cp class=\"task\" style=\"margin-top:12px\">Вспомни выражение по русскому значению, потом открой и честно оцени себя. Лёгкие карточки вернутся через неделю, трудные — завтра.\u003c/p>' +\n    '\u003cdiv id=\"revStage\">\u003c/div>\u003c/aside>';\n  document.body.appendChild(revBg);\n  let revQueue = [], revCard = null, revShown = false;\n  function revNext(){\n    const stage = document.getElementById('revStage');\n    revCard = revQueue.shift();\n    if(!revCard){\n      stage.innerHTML = '\u003cdiv class=\"empty\">Вахта сдана. Возвращайся, когда карточки снова станут доступны.\u003c/div>';\n      renderDue(); return;\n    }\n    revShown = false;\n    stage.innerHTML = '\u003cdiv class=\"rev-card\">\u003cspan class=\"kicker\">значение\u003c/span>\u003cp class=\"rev-ru\">' + revCard.ru + '\u003c/p>' +\n      '\u003cp class=\"rev-en\" id=\"revEn\" hidden>' + revCard.en + '\u003c/p>' +\n      '\u003cdiv class=\"row\" id=\"revActs\">\u003cbutton class=\"btn\" id=\"revShow\">Показать\u003c/button>\u003c/div>\u003c/div>' +\n      '\u003cp class=\"mono-note\" style=\"margin-top:10px\">Осталось в очереди: ' + revQueue.length + '\u003c/p>';\n    document.getElementById('revShow').addEventListener('click', () => {\n      revShown = true;\n      document.getElementById('revEn').hidden = false;\n      say(revCard.en, .82);\n      document.getElementById('revActs').innerHTML =\n        '\u003cbutton class=\"btn ghost small\" data-rev=\"1\">снова\u003c/button>' +\n        '\u003cbutton class=\"btn ghost small\" data-rev=\"2\">трудно\u003c/button>' +\n        '\u003cbutton class=\"btn small\" data-rev=\"3\">легко\u003c/button>';\n      document.querySelectorAll('[data-rev]').forEach(b => b.addEventListener('click', () => {\n        const g = +b.dataset.rev;\n        const prev = G.sched[revCard.id] || { ivl:0 };\n        const ivl = g === 1 ? 0 : g === 2 ? Math.max(1, prev.ivl || 1) : Math.max(3, Math.round((prev.ivl || 1) * 2.4));\n        G.sched[revCard.id] = { ivl, due: Date.now() + (g === 1 ? 6e5 : ivl * DAY) };\n        if(g === 1) revQueue.push(revCard);\n        gsave(); addXP(g === 1 ? 2 : 6, 'повторение'); renderDue(); revNext();\n      }));\n    });\n  }\n  $('revBtn').addEventListener('click', () => {\n    revQueue = dueList().sort(() => Math.random() - .5);\n    revBg.classList.add('open'); revNext();\n  });\n  revBg.addEventListener('click', e => { if(e.target === revBg) revBg.classList.remove('open'); });\n  document.getElementById('revClose').addEventListener('click', () => revBg.classList.remove('open'));\n\n  /* ---- карточка результата ---- */\n  function drawCard(){\n    const c = document.createElement('canvas');\n    c.width = 1080; c.height = 1350;\n    const x = c.getContext('2d');\n    const g = x.createRadialGradient(160,1300,40,160,1300,1100);\n    g.addColorStop(0,'#3a2412'); g.addColorStop(1,'#080c0d');\n    x.fillStyle = g; x.fillRect(0,0,1080,1350);\n    x.strokeStyle = 'rgba(236,228,208,.22)'; x.lineWidth = 2; x.strokeRect(54,54,972,1242);\n    x.strokeStyle = '#e0892c'; x.lineWidth = 4;\n    x.beginPath(); x.moveTo(54,110); x.lineTo(54,54); x.lineTo(110,54); x.stroke();\n    x.beginPath(); x.moveTo(1026,1240); x.lineTo(1026,1296); x.lineTo(970,1296); x.stroke();\n    x.fillStyle = '#e0892c'; x.font = '500 30px Oswald, sans-serif';\n    x.fillText('THE BENBOW LEDGER · TREASURE ISLAND I—II', 110, 170);\n    const name = (document.getElementById('agentName') || {}).textContent || '';\n    x.fillStyle = '#a9a293'; x.font = 'italic 38px Alegreya, Georgia, serif';\n    x.fillText(name, 110, 250);\n    x.fillStyle = '#ece4d0'; x.font = 'italic 170px Alegreya, Georgia, serif';\n    x.fillText(rankOf(G.xp), 104, 450);\n    x.fillStyle = '#e0892c'; x.font = '500 34px Oswald, sans-serif';\n    x.fillText(G.xp + ' XP', 110, 520);\n    const rows = [\n      ['Заданий выполнено', G.seals + ' из 9'],\n      ['Рекорд скоростного рейса', G.best + ' очков'],\n      ['Фраз произнесено вслух', voiceLines.filter((l,i) => (G.voice[i] || 0) >= 70).length + ' из 6'],\n      ['Карточек на вахте памяти', Object.keys(G.sched).length + ' из 11']\n    ];\n    rows.forEach(([k,v],i) => {\n      const y = 680 + i * 110;\n      x.fillStyle = '#a9a293'; x.font = 'italic 36px Alegreya, Georgia, serif'; x.textAlign = 'left'; x.fillText(k, 110, y);\n      x.fillStyle = '#ece4d0'; x.font = '500 40px Oswald, sans-serif'; x.textAlign = 'right'; x.fillText(v, 970, y); x.textAlign = 'left';\n      x.strokeStyle = 'rgba(236,228,208,.16)'; x.lineWidth = 1; x.beginPath(); x.moveTo(110, y + 30); x.lineTo(970, y + 30); x.stroke();\n    });\n    x.fillStyle = '#a9a293'; x.font = 'italic 30px Alegreya, Georgia, serif';\n    x.fillText(new Date().toLocaleDateString('ru-RU'), 110, 1220);\n    return c;\n  }\n  $('cardBtn').addEventListener('click', () => {\n    const c = drawCard();\n    c.toBlob(async blob => {\n      const file = new File([blob], 'benbow-result.png', { type:'image/png' });\n      if(navigator.canShare && navigator.canShare({ files:[file] })){\n        try { await navigator.share({ files:[file], title:'The Benbow Ledger' }); return; } catch(e){}\n      }\n      const a = document.createElement('a');\n      a.href = URL.createObjectURL(blob); a.download = 'benbow-result.png'; a.click();\n      toast('Карточка результата сохранена');\n    });\n  });\n\n  renderXP(); renderDue(); drawCourse();\n  const due = dueList().length;\n  if(due && G.xp > 0) setTimeout(() => toast('К повторению готово карточек: ' + due), 1200);\n}\n\nif(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);\nelse init();\n})();\n\n\u003c/script>\n\u003cscript>\n(() => {\n'use strict';\n\n/* ============ данные ============ */\nconst events = [\n  'A brown old seaman with a sabre cut arrives at the Admiral Benbow.',\n  'He pays for a few weeks, then stays month after month without paying more.',\n  'He gives Jim silver and asks him to watch for a sailor with one leg.',\n  'Every evening his songs and stories frighten the guests.',\n  'Dr Live е let — чистый глагол без to', model:'be' }\n];\n\nconst timeRows = [\n  { t:'Every day he would ask about seafaring men.', a:0 },\n  { t:'One evening Dr Livesey came into the parlour.', a:1 },\n  { t:'He would sit by the fire and drink rum all evening.', a:0 },\n  { t:'Suddenly the captain sprang to his feet.', a:1 },\n  { t:'Sometimes he would force the whole room to sing.', a:0 },\n  { t:'The doctor looked at him and said one quiet sentence.', a:1 }\n];\n\nconst dictation = [\n  { en:'Jim had to keep an eye out for a sailor with one leg.', tip:'keep an eye out for' },\n  { en:'The captain avoided meeting other seamen.', tip:'avoid + doing' },\n  { en:'Let me know the moment he appears.', tip:'let somebody know' },\n  { en:'He threatened to hurt the doctor in front of everyone.', tip:'threaten to do' },\n  { en:'In the end the old captain gave in.', tip:'give in' }\n];\n\nconst forge = [\n  { task:'He did not want to meet other sailors.', target:'avoid + doing', must:[['avoid'],['meet','see']], tip:'avoid meeting — без to', model:'He avoided meeting other sailors.' },\n  { task:'Tell me the second the sailor arrives.', target:'let somebody know', must:[['let'],['know']], tip:'Let me know when / the moment …', model:'Let me know the moment the sailor arrives.' },\n  { task:'The guests did not want to sing, but they had no choice.', target:'force somebody to do', must:[['forc'],['sing']], tip:'force + кого + to + глагол', model:'The captain forced the guests to sing.' },\n  { task:'He said he would hurt the doctor.', target:'threaten to do', must:[['threaten'],['hurt','kill','pin']], tip:'threaten + to + глагол', model:'He threatened to hurt the doctor.' },\n  { task:'The young men acted as if they admired him.', target:'pretend to do', must:[['pretend'],['admire']], tip:'pretend + to + глагол', model:'The young men pretended to admire him.' },\n  { task:'In the end he stopped fighting and did what the doctor said.', target:'give in', must:[['gave in','give in','giv er, cowardly, or both?','If Jim had a phone, what warning would he send, and to whom?','Does the fight make Billy look stronger or weaker in the end?','Dr Livesey helps a man he dislikes. What does that show about him?'],\n    tw:['Отвечай как свидетель на допросе.','Защищай Black Dog как его адвокат.','Преврати ответ в газетный заголовок.'],\n    frame:'\u003cb>A2:\u003c/b> “I think … because …” · \u003cb>B1:\u003c/b> “At first …; however, the detail that … suggests …”' }\n};\n\nconst c2Hunt = [\n  'Who is Black Dog, and how does Billy react when he sees him?',\n  'Why does Black Dog choose a seat near the door?',\n  'Find the first sign that Black Dog is frightened too.',\n  'What happens to the inn sign during the fight?',\n  'What warning does Dr Livesey give Billy?'\n];\nconst c2Chunks = [\n  ['set-out','set out'], ['point-out','point something out'], ['call-back','call somebody back'],\n  ['get-away','get away from'], ['no-idea','have no idea what to do'], ['warn','warn somebody that…']\n];\n\nconst seals = {\n  coast:{ t:'Наблюдатель', d:'Капитан выбрал пустой берег и следит за дорогой не из любопытства.' },\n  chain:{ t:'Вечер восстановлен', d:'Он угрожает доктору, но доктор остаётся спокоен — и капитан уступает.' },\n  cargo:{ t:'Манифест разобран', d:'Живые выражения о поведении важнее красивых морских слов.' },\n  patterns:{ t:'Хвосты на месте', d:'avoid + doing, force + to do, let + чистый глагол.' },\n  time:{ t:'Два времени рассказа', d:'would — фон и привычка, Past Simple — сцена, которая ломает привычку.' },\n  dict:{ t:'Показания записаны', d:'Целевые выражения опознаны на слух, а не только на бумаге.' },\n  forge:{ t:'Показания переписаны', d:'Одна мысль — несколько конструкций; выбор конструкции меняет силу фразы.' },\n  hearing:{ t:'Вывод по делу', d:'Решение держится на двух деталях из главы и новом языке.' },\n  exit:{ t:'Печать поставлена', d:'Лексика вернулась без опоры на карточки.' }\n};\n\nconst glossary = {\n  'keep an eye out for':'высма
