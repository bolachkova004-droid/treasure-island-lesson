], cache:{}, c2g:[], c2h:[], c2w:[], c2open:false, c2r:'',\n  a2:false, hard:false, tap:true, teacher:false\n};\ntry { S = { ...S, ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch(e){}\n['seals','spots','guesses','order','learned','words','bank','req','cando','c2g','c2h','c2w','contrast'].forEach(k => { if(!Array.isArray(S[k])) S[k] = []; });\nif(!S.order.length) S.order = [2,0,4,1,5,3];\nif(S.contrast.length \u003c 2) S.contrast = ['',''];\nconst save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };\n\nconst $ = id => document.getElementById(id);\nconst pages = [...document.querySelectorAll('.page')];\nconst clean = s => (s||'').toLowerCase().replace(/[^a-z0-9'’\\s-]/g,' ').replace(/\\s+/g,' ').trim();\nconst wordsOf = s => clean(s).split(' ').filter(Boolean);\nlet toastT;\nfunction toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }\nfunction speak(text, rate){\n  if(window.TTS) TTS.speak(text, rate);\n  else toast('Озвучка не загрузилась — обнови страницу');\n}\nfunction stamp(id){\n  if(S.seals.includes(id)) return;\n  S.seals.push(id); save(); renderBar(); renderFile();\n  toast('Печать поставлена: ' + seals[id].t);\n}\n\n/* ============ навигация ============ */\nfunction renderTabs(){\n  const html = pages.map((p,i) => {\n    const [c1,c2] = (p.dataset.flag || '#10293d,#f2e8d5').split(',');\n    return '\u003cbutton class=\"tab ' + (i===S.page?'on':'') + '\" data-i=\"' + i + '\">' +\n      '\u003cspan class=\"flag\" style=\"background:linear-gradient(135deg,' + c1 + ' 50%,' + c2 + ' 50%)\">\u003c/span>' +\n      '\u003cspan>' + p.dataset.tab + '\u003c/span>\u003c/button>';\n  }).join('');\n  $('tabsDesktop').innerHTML = html; $('tabsMobile').innerHTML = html;\n  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {\n    go(+b.dataset.i); $('mobNav').classList.remove('open'); $('mobBtn').setAttribute('aria-expanded','false');\n  }));\n}\nfunction go(i){\n  S.page = Math.max(0, Math.min(pages.length-1, Number(i) || 0)); save(); render();\n  try { history.replaceState(null, '', '#page-' + (S.page+1)); } catch(e){}\n  window.scrollTo(0, 0);\n}\nfunction render(){\n  pages.forEach((p,i) => p.classList.toggle('on', i===S.page));\n  renderTabs();\n  const pct = Math.round(S.seals.length / Object.keys(seals).length * 100);\n  $('gauge').style.width = pct + '%'; $('gaugeText').textContent = pct + '%';\n  $('mobStep').textContent = 'Лист ' + (S.page+1) + ' из ' + pages.length;\n  $('footLabel').textContent = pages[S.page].dataset.tab + ' · ' + (S.page+1) + ' / ' + pages.length;\n  $('prevBtn').disabled = S.page === 0;\n  $('nextBtn').textContent = S.page === pages.length-1 ? 'В начало ↺' : 'Дальше →';\n  document.body.classList.toggle('a2', !!S.a2);\n  document.body.classList.toggle('hard', !!S.hard);\n  document.body.classList.toggle('teacher', !!S.teacher);\n  renderBar();\n}\nfunction renderBar(){\n  $('agentName').textContent = S.agent || 'имя не вписано';\n  $('sealRow').innerHTML = Object.keys(seals).map(k => '\u003cspan class=\"seal-dot ' + (S.seals.includes(k)?'on':'') + '\" title=\"' + seals[k].t + '\">\u003c/span>').join('');\n  $('fileCount').textContent = S.seals.length;\n  $('wordCount').textContent = S.words.length;\n}\nfunction renderFile(){\n  $('fileList').innerHTML = S.seals.length\n    ? S.seals.map((k,i) => '\u003cdiv class=\"slip\">\u003cb>' + String(i+1).padStart(2,'0') + ' · ' + seals[k].t + '\u003c/b>\u003cspan>' + seals[k].d + '\u003c/span>\u003c/div>').join('')\n    : '\u003cdiv class=\"empty\">Пока пусто. Первый вывод прячется на карте берега.\u003c/div>';\n}\n\n/* ============ лист 2: берег ============ */\nfunction renderSpots(){\n  document.querySelectorAll('.spot').forEach(b => b.classList.toggle('found', S.spots.includes(+b.dataset.spot)));\n  $('spotCount').textContent = 'Отметок открыто: ' + S.spots.length + ' / 4';\n  if(S.spots.length === 4){\n    $('guessStatus').textContent = S.guesses.length === 2\n      ? 'Теперь защити обе версии: одна деталь на каждую.'\n      : 'Берег осмотрен. Выбери две версии.';\n    stamp('coast');\n  }\n}\nfunction renderGuesses(){\n  document.querySelectorAll('#guessList .opt').forEach((b,i) => b.classList.toggle('pick', S.guesses.includes(i)));\n}\n\n/* ============ лист 3: цепь ============ */\nfunction renderChain(){\n  $('chain').innerHTML = S.order.map((n,pos) =>\n    '\u003cdiv class=\"link\" data-pos=\"' + pos + '\">\u003cspan>' + events[n] + '\u003c/span>' +\n    '\u003cdiv class=\"arrows\">\u003cbutton data-mv=\"up\" aria-label=\"Выше\">↑\u003c/button>\u003cbutton data-mv=\"down\" aria-label=\"Ниже\">↓\u003c/button>\u003c/div>\u003c/div>').join('');\n  $('chain').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {\n    const p = +b.closest('.link').dataset.pos, q = b.dataset.mv === 'up' ? p-1 : p+1;\n    if(q \u003c 0 || q >= S.order.length) return;\n    [S.order[p], S.order[q]] = [S.order[q], S.order[p]]; save(); renderChain();\n  }));\n}\n\n/* ============ лист 4: манифест и карточки ============ */\nfunction renderCrate(){\n  if(S.crate >= crates.length){\n    $('crateProgress').textContent = 'Манифест разобран';\n    $('crate').innerHTML = '\u003cdiv>\u003cb style=\"font-size:34px\">' + S.crateScore + ' / ' + crates.length + '\u003c/b>\u003cbr>\u003cspan style=\"font-size:14px\">решений верно\u003c/span>\u003c/div>';\n    $('crateActs').innerHTML = '\u003cbutton class=\"btn small ghost\" id=\"crateAgain\" style=\"grid-column:1/-1\">Пересортировать\u003c/button>';\n    $('crateFb').textContent = S.crateScore >= 10 ? 'Отбор точный: живое отделено от музейного.' : 'Посмотри пояснения и попробуй ещё раз.';\n    $('crateFb').className = 'status ' + (S.crateScore >= 10 ? 'ok' : 'no');\n    $('crateAgain').addEventListener('click', () => { S.crate = 0; S.crateScore = 0; save(); renderCrate(); });\n    stamp('cargo');\n    return;\n  }\n  const it = crates[S.crate];\n  $('crateProgress').textContent = 'Единица ' + (S.crate+1) + ' из ' + crates.length + ' · верно: ' + S.crateScore;\n  $('crate').textContent = it.w;\n  $('crateFb').textContent = ''; $('crateFb').className = 'status';\n  $('crateActs').innerHTML = '\u003cbutton class=\"btn small\" data-crate=\"cargo\">CARGO · в речь\u003c/button>\u003cbutton class=\"btn small ghost\" data-crate=\"ballast\">BALLAST · понять\u003c/button>';\n  $('crateActs').querySelectorAll('[data-crate]').forEach(b => b.addEventListener('click', () => {\n    const right = b.dataset.crate === it.type;\n    if(right) S.crateScore++;\n    toast((right ? 'Верно. ' : 'Не совсем. ') + it.why);\n    S.crate++; save(); renderCrate();\n  }));\n}\nfunction renderCards(){\n  const vis = words.filter(w => !(S.a2 && w.b1));\n  $('cards').innerHTML = vis.map(w =>\n    '\u003carticle class=\"card ' + (w.b1?'b1':'') + ' ' + (S.learned.includes(w.id)?'done':'') + '\">' +\n    '\u003cspan class=\"tagline\">' + (w.b1 ? 'B1 · сверх нормы' : 'в активную речь') + '\u003c/span>' +\n    '\u003ch3 class=\"term\">' + w.term + '\u003c/h3>' +\n    '\u003cp class=\"gloss\">' + w.gloss + '\u003c/p>' +\n    '\u003cp class=\"ru\" id=\"ru-' + w.id + '\">' + w.ru + '\u003c/p>' +\n    '\u003cp class=\"ex\">' + w.ex + '\u003c/p>' +\n    '\u003cdiv class=\"card-acts\">' +\n    '\u003cbutton class=\"btn ghost small\" data-say=\"' + w.term.replace(/\"/g,'') + '\">Звук\u003c/button>' +\n    '\u003cbutton class=\"btn ghost small\" data-reveal=\"' + w.id + '\">перевод\u003c/button>' +\n    '\u003cbutton class=\"btn ghost small\" data-learn=\"' + w.id + '\">' + (S.learned.includes(w.id)?'✓ в работе':'взять в работу') + '\u003c/button>' +\n    '\u003c/div>\u003c/article>').join('');\n  $('cardCount').textContent = 'Отмечено в работу: ' + S.learned.length;\n  $('cards').querySelectorAll('[data-say]').forEach(b => b.addEventListener('click', () => speak(b.dataset.say, .8)));\n  $('cards').querySelectorAll('[data-reveal]').forEach(b => b.addEventListener('click', () => $('ru-' + b.dataset.reveal).classList.toggle('open')));\n  $('cards').querySelectorAll('[data-learn]').forEach(b => b.addEventListener('click', () => {\n    const id = b.dataset.learn;\n    S.learned = S.learned.includes(id) ? S.learned.filter(x => x !== id) : [...S.learned, id];\n    save(); renderCards(); renderBank();\n  }));\n}\n\n/* ============ лист 5: конструкции ============ */\nfunction renderPatterns(){\n  $('patternRows').innerHTML = patterns.map((p,i) =>\n    '\u003cdiv class=\"rowline\">\u003cspan>\u003cb>' + p.lead + '\u003c/b> …\u003c/span>\u003cdiv class=\"pair\">' +\n    p.opts.map((o,n) => '\u003cbutton class=\"pick ' + (S.patterns[i] !== undefined ? (n===p.a?'right':(S.patterns[i]===n?'wrong':'')) : '') + '\" data-p=\"' + i + '\" data-o=\"' + n + '\">' + o + '\u003c/button>').join('') +\n    '\u003c/div>\u003c/div>').join('');\n  $('patternRows').querySelectorAll('.pick').forEach(b => b.addEventListener('click', () => {\n    S.patterns[b.dataset.p] = +b.dataset.o; save(); renderPatterns();\n    const done = Object.keys(S.patterns).length;\n    const right = patterns.filter((p,i) => S.patterns[i] === p.a).length;\n    $('patternStatus').textContent = done === patterns.length ? right + ' из ' + patterns.length + '. Прочитай верные варианты вслух целиком.' : done + ' из ' + patterns.length;\n    $('patternStatus').className = 'status ' + (done === patterns.length && right === patterns.length ? 'ok' : '');\n    if(done === patterns.length) stamp('patterns');\n  }));\n}\nfunction renderPatternWrite(){\n  $('patternWrite').innerHTML = patternWrite.map((it,i) =>\n    '\u003cdiv class=\"write\" data-pw=\"' + i + '\">\u003cdiv class=\"write-head\">\u003cspan class=\"n\">' + (i+1) + '\u003c/span>\u003cspan class=\"q\">' + it.q + '\u003c/span>' +\n    '\u003cdiv class=\"tools\">\u003cbutton class=\"btn ghost small\" data-pwtip=\"' + i + '\">подсказка\u003c/button>\u003c/div>\u003c/div>' +\n    '\u003cinput class=\"field\" data-pwin=\"' + i + '\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"только пропуск\">\u003cdiv class=\"fb\" data-pwfb=\"' + i + '\">\u003c/div>\u003c/div>').join('');\n  patternWrite.forEach((it,i) => {\n    const inp = document.querySelector('[data-pwin=\"' + i + '\"]');\n    inp.value = S.patternWrite[i] || '';\n    inp.addEventListener('input', e => { S.patternWrite[i] = e.target.value; save(); });\n    document.querySelector('[data-pwtip=\"' + i + '\"]').addEventListener('click', () => {\n      document.querySelector('[data-pwfb=\"' + i + '\"]').innerHTML = 'Форма: \u003cb>' + it.tip + '\u003c/b>';\n    });\n  });\n}\nfunction checkPatternWrite(){\n  let score = 0;\n  patternWrite.forEach((it,i) => {\n    const box = document.querySelector('[data-pw=\"' + i + '\"]');\n    const fb = document.querySelector('[data-pwfb=\"' + i + '\"]');\n    const v = clean(S.patternWrite[i] || '');\n    if(!v){ box.classList.remove('ok','no'); fb.textContent = 'Пусто.'; return; }\n    const ok = it.ok.some(a => v === a);\n    if(ok) score++;\n    box.classList.toggle('ok', ok); box.classList.toggle('no', !ok);\n    fb.innerHTML = ok ? 'Верно.' : 'Не та форма. \u003cspan class=\"model\">Нужно: ' + it.model + '\u003c/span>';\n  });\n  $('patternWriteScore').textContent = score + ' / ' + patternWrite.length;\n  if(score === patternWrite.length) stamp('patterns');\n}\n\n/* ============ лист 6: компас времени ============ */\nfunction renderTime(){\n  $('timeRows').innerHTML = timeRows.map((g,i) =>\n    '\u003cdiv class=\"rowline\">\u003cspan>' + g.t + '\u003c/span>\u003cdiv class=\"pair\">' +\n    ['фон · привычка','сцена · одно событие'].map((lab,n) =>\n      '\u003cbutton class=\"pick ' + (S.time[i] !== undefined ? (n===g.a?'right':(S.time[i]===n?'wrong':'')) : '') + '\" data-t=\"' + i + '\" data-o=\"' + n + '\">' + lab + '\u003c/button>').join('') +\n    '\u003c/div>\u003c/div>').join('');\n  $('timeRows').querySelectorAll('.pick').forEach(b => b.addEventListener('click', () => {\n    S.time[b.dataset.t] = +b.dataset.o; save(); renderTime();\n    const done = Object.keys(S.time).length;\n    const right = timeRows.filter((g,i) => S.time[i] === g.a).length;\n    $('timeStatus').textContent = done === timeRows.length ? right + ' из ' + timeRows.length + '. Скажи вслух: “Usually the captain would … But one evening he …”' : done + ' из ' + timeRows.length;\n    $('timeStatus').className = 'status ' + (done === timeRows.length && right === timeRows.length ? 'ok' : '');\n  }));\n}\nfunction renderContrast(){\n  const labels = ['Привычка: обязательно would + глагол','Сцена: Past Simple, без would'];\n  const holders = ['Every evening he would …','But one evening …'];\n  $('contrastWrite').innerHTML = labels.map((lab,i) =>\n    '\u003cdiv class=\"write\" data-cw=\"' + i + '\">\u003cdiv class=\"write-head\">\u003cspan class=\"n\">' + (i+1) + '\u003c/span>\u003cspan class=\"q\">' + lab + '\u003c/span>\u003c/div>' +\n    '\u003cinput class=\"field\" data-cwin=\"' + i + '\" autocomplete=\"off\" placeholder=\"' + holders[i] + '\">\u003cdiv class=\"fb\" data-cwfb=\"' + i + '\">\u003c/div>\u003c/div>').join('');\n  [0,1].forEach(i => {\n    const inp = document.querySelector('[data-cwin=\"' + i + '\"]');\n    inp.value = S.contrast[i] || '';\n    inp.addEventListener('input', e => { S.contrast[i] = e.target.value; save(); });\n  });\n}\nfunction checkContrast(){\n  let score = 0;\n  const tests = [\n    { ok: v => /\\bwould\\b/.test(v) && wordsOf(v).length >= 5, bad:'Нужна привычка через would и минимум пять слов.', model:'Every evening he would sit by the fire and sing the same song.' },\n    { ok: v => !/\\bwould\\b/.test(v) && wordsOf(v).length >= 5, bad:'Здесь would быть не должно: одно законченное событие в Past Simple.', model:'But one evening he drew his knife and threatened the doctor.' }\n  ];\n  tests.forEach((t,i) => {\n    const box = document.querySelector('[data-cw=\"' + i + '\"]');\n    const fb = document.querySelector('[data-cwfb=\"' + i + '\"]');\n    const v = clean(S.contrast[i] || '');\n    if(!v){ box.classList.remove('ok','no'); fb.textContent = 'Пусто.'; return; }\n    const ok = t.ok(v);\n    if(ok) score++;\n    box.classList.toggle('ok', ok); box.classList.toggle('no', !ok);\n    fb.innerHTML = ok ? 'Форма выдержана. \u003cspan class=\"model\" data-model=\"1\">Вариант: ' + t.model + '\u003c/span>' : t.bad + ' \u003cspan class=\"model\" data-model=\"1\">Вариант: ' + t.model + '\u003c/span>';\n  });\n  $('contrastScore').textContent = score + ' / 2';\n  if(score === 2) stamp('time');\n}\n\n/* ============ лист 7: диктовка ============ */\nfunction skeleton(s){\n  return s.split(' ').map(w => {\n    const l = w.replace(/[^A-Za-z’']/g,'');\n    return l.length \u003c= 2 ? w : w[0] + '_'.repeat(l.length - 1);\n  }).join(' ');\n}\nfunction renderDict(){\n  $('dictList').innerHTML = dictation.map((it,i) =>\n    '\u003cdiv class=\"write\" data-d=\"' + i + '\">\u003cdiv class=\"write-head\">\u003cspan class=\"n\">' + (i+1) + '\u003c/span>\u003cspan class=\"q\">Запись № ' + (i+1) + '\u003c/span>' +\n    '\u003cdiv class=\"tools\">\u003cbutton class=\"btn ghost small\" data-dplay=\"' + i + '\">слушать\u003c/button>' +\n    '\u003cbutton class=\"btn ghost small\" data-dslow=\"' + i + '\">медленно\u003c/button>' +\n    '\u003cbutton class=\"btn ghost small\" data-dtip=\"' + i + '\">подсказка\u003c/button>\u003c/div>\u003c/div>' +\n    '\u003cinput class=\"field\" data-din=\"' + i + '\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"запиши предложение целиком\">' +\n    '\u003cdiv class=\"fb\" data-dfb=\"' + i + '\">\u003c/div>\u003c/div>').join('');\n  dictation.forEach((it,i) => {\n    const inp = document.querySelector('[data-din=\"' + i + '\"]');\n    inp.value = S.dict[i] || '';\n    inp.addEventListener('input', e => { S.dict[i] = e.target.value; save(); });\n    document.querySelector('[data-dplay=\"' + i + '\"]').addEventListener('click', () => speak(it.en, .85));\n    document.querySelector('[data-dslow=\"' + i + '\"]').addEventListener('click', () => speak(it.en, .6));\n    document.querySelector('[data-dtip=\"' + i + '\"]').addEventListener('click', () => {\n      const lvl = Math.min((S.dictTip[i] || 0) + 1, 2); S.dictTip[i] = lvl; save();\n      document.querySelector('[data-dfb=\"' + i + '\"]').innerHTML = lvl === 1\n        ? 'Ключ: \u003cb>' + it.tip + '\u003c/b>\u003cbr>' + skeleton(it.en)\n        : 'Оригинал: \u003cb>' + it.en + '\u003c/b> — закрой и запиши по памяти.';\n    });\n  });\n}\nfunction checkDict(){\n  let score = 0;\n  dictation.forEach((it,i) => {\n    const box = document.querySelector('[data-d=\"' + i + '\"]');\n    const fb = document.querySelector('[data-dfb=\"' + i + '\"]');\n    const target = wordsOf(it.en), given = wordsOf(S.dict[i] || '');\n    if(!given.length){ box.classList.remove('ok','no'); fb.textContent = 'Пусто.'; return; }\n    let right = 0;\n    const marked = target.map((w,n) => {\n      const ok = given[n] === w; if(ok) right++;\n      return '\u003cspan class=\"' + (ok?'w-ok':'w-no') + '\">' + (given[n] || '…') + '\u003c/span>';\n    }).join(' ');\n    const full = right === target.length && given.length === target.length;\n    if(full) score++;\n    box.classList.toggle('ok', full); box.classList.toggle('no', !full);\n    fb.innerHTML = (full ? 'Точно. ' : 'Верных слов: ' + right + ' из ' + target.length + '. ') + marked +\n      (full ? '' : '\u003cspan class=\"model\">Оригинал: ' + it.en + '\u003c/span>');\n  });\n  $('dictScore').textContent = score + ' / ' + dictation.length;\n  if(score >= 4) stamp('dict');\n  toast(score === dictation.length ? 'Все показания расшифрованы' : 'Проверь зачёркнутые слова и послушай ещё раз');\n}\n\n/* ============ лист 8: переписывание ============ */\nfunction renderForge(){\n  $('forgeList').innerHTML = forge.map((it,i) =>\n    '\u003cdiv class=\"write\" data-f=\"' + i + '\">\u003cdiv class=\"write-head\">\u003cspan class=\"n\">' + (i+1) + '\u003c/span>\u003cspan class=\"q\">' + it.task + '\u003c/span>' +\n    '\u003cdiv class=\"tools\">\u003cbutton class=\"btn ghost small\" data-ftip=\"' + i + '\">подсказка\u003c/button>' +\n    '\u003cbutton class=\"btn ghost small\" data-model=\"1\" data-fmodel=\"' + i + '\">модель\u003c/button>\u003c/div>\u003c/div>' +\n    '\u003cspan class=\"target\">' + it.target + '\u003c/span>' +\n    '\u003cinput class=\"field\" data-fin=\"' + i + '\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"перепиши предложение\">' +\n    '\u003cdiv class=\"fb\" data-ffb=\"' + i + '\">\u003c/div>\u003c/div>').join('');\n  forge.forEach((it,i) => {\n    const inp = document.querySelector('[data-fin=\"' + i + '\"]');\n    inp.value = S.forge[i] || '';\n    inp.addEventListener('input', e => { S.forge[i] = e.target.value; save(); });\n    document.querySelector('[data-ftip=\"' + i + '\"]').addEventListener('click', () => {\n      document.querySelector('[data-ffb=\"' + i + '\"]').innerHTML = 'Форма: \u003cb>' + it.tip + '\u003c/b>';\n    });\n    document.querySelector('[data-fmodel=\"' + i + '\"]').addEventListener('click', () => {\n      document.querySelector('[data-ffb=\"' + i + '\"]').innerHTML = '\u003cspan class=\"model\">Модель: ' + it.model + '\u003c/span>';\n      speak(it.model, .85);\n    });\n  });\n}\nconst forgeOk = i => {\n  const v = clean(S.forge[i] || '');\n  return !!v && forge[i].must.every(g => g.some(p => v.includes(p)));\n};\nfunction checkForge(){\n  let score = 0;\n  forge.forEach((it,i) => {\n    const box = document.querySelector('[data-f=\"' + i + '\"]');\n    const fb = document.querySelector('[data-ffb=\"' + i + '\"]');\n    if(!clean(S.forge[i] || '')){ box.classList.remove('ok','no'); fb.textContent = 'Пусто.'; return; }\n    const ok = forgeOk(i); if(ok) score++;\n    box.classList.toggle('ok', ok); box.classList.toggle('no', !ok);\n    fb.innerHTML = ok\n      ? 'Принято. \u003cspan class=\"model\">Вариант эксперта: ' + it.model + '\u003c/span>'\n      : 'Нет нужной конструкции \u003cb>' + it.target + '\u003c/b> или сбит её хвост.';\n  });\n  $('forgeScore').textContent = score + ' / ' + forge.length;\n  if(score >= 5) stamp('forge');\n  toast(score === forge.length ? 'Все показания переписаны' : 'Проверь форму после выделенной конструкции');\n}\n\n/* ============ лист 9: слушание дела ============ */\nfunction renderVerdict(){\n  document.querySelectorAll('#verdictList .opt').forEach(b => b.classList.toggle('pick', b.textContent === S.verdict));\n}\nfunction renderBank(){\n  const core = words.filter(w => !w.b1);\n  $('bank').innerHTML = core.map(w =>\n    '\u003cbutton class=\"btn ghost small ' + (S.bank.includes(w.id)?'flag':'') + '\" data-bank=\"' + w.id + '\">' + w.term + '\u003c/button>').join('');\n  $('bank').querySelectorAll('[data-bank]').forEach(b => b.addEventListener('click', () => {\n    const id = b.dataset.bank;\n    S.bank = S.bank.includes(id) ? S.bank.filter(x => x !== id) : [...S.bank, id];\n    save(); renderBank();\n    if(S.verdict && S.bank.length >= 5) stamp('hearing');\n  }));\n}\nlet clockInt = null;\nfunction clockFace(){\n  const m = String(Math.floor(S.clock/60)).padStart(2,'0'), s = String(S.clock%60).padStart(2,'0');\n  $('clockFace').textContent = m + ':' + s;\n}\n\n/* ============ лист 10: печать ============ */\nfunction renderGaps(){\n  $('gapList').innerHTML = gaps.map((g,i) =>\n    '\u003clabel class=\"gapline\" data-g=\"' + i + '\">\u003cspan>' + g.pre + '\u003cb>______\u003c/b>' + g.post + '\u003c/span>' +\n    '\u003cinput class=\"field\" data-gin=\"' + i + '\" autocomplete=\"off\" aria-label=\"ответ ' + (i+1) + '\">' +\n    '\u003cbutton class=\"btn ghost small\" data-gtip=\"' + i + '\" type=\"button\">?\u003c/button>\u003c/label>').join('');\n  gaps.forEach((g,i) => {\n    const inp = document.querySelector('[data-gin=\"' + i + '\"]');\n    inp.value = S.gap[i] || '';\n    inp.addEventListener('input', e => { S.gap[i] = e.target.value; save(); });\n    document.querySelector('[data-gtip=\"' + i + '\"]').addEventListener('click', () => {\n      toast('Первые буквы: ' + g.ok[0].split(' ').map(w => w[0] + '_'.repeat(Math.max(0, w.length-1))).join(' '));\n    });});\n}\nfunction checkGaps(){\n  let score = 0;\n  gaps.forEach((g,i) => {\n    const row = document.querySelector('[data-g=\"' + i + '\"]');\n    const ok = g.ok.includes(clean(S.gap[i] || ''));\n    if(ok) score++;\n    row.classList.toggle('ok', ok); row.classList.toggle('no', !ok);\n  });\n  $('finalScore').textContent = score + '/' + gaps.length;\n  const rank = score >= 6 ? 'Дело закрыто — можно брать B1-набор' : score >= 4 ? 'Печать поставлена, повтор через сутки' : 'Слишком рано: вернись к заданию 3';\n  $('rankLine').textContent = rank;\n  if(score >= 4) stamp('exit');\n}\n\n/* ============ глава II ============ */\nfunction renderC2(){\n  document.querySelectorAll('[data-c2g]').forEach(b => b.classList.toggle('flag', S.c2g.includes(b.dataset.c2g)));\n  $('c2Hunt').innerHTML = c2Hunt.map((q,i) =>\n    '\u003clabel class=\"check\">\u003cinput type=\"checkbox\" data-c2h=\"' + i + '\" ' + (S.c2h.includes(i)?'checked':'') + '>' + q + '\u003c/label>').join('');\n  $('c2Hunt').querySelectorAll('[data-c2h]').forEach(b => b.addEventListener('change', () => {\n    const n = +b.dataset.c2h;\n    S.c2h = b.checked ? [...new Set([...S.c2h, n])] : S.c2h.filter(x => x !== n);\n    save(); renderC2();\n  }));\n  $('c2Chunks').innerHTML = c2Chunks.map(([id,label]) =>\n    '\u003cbutton class=\"btn ghost small ' + (S.c2w.includes(id)?'flag':'') + '\" data-c2w=\"' + id + '\">' + label + '\u003c/button>').join('');\n  $('c2Chunks').querySelectorAll('[data-c2w]').forEach(b => b.addEventListener('click', () => {\n    const id = b.dataset.c2w;\n    S.c2w = S.c2w.includes(id) ? S.c2w.filter(x => x !== id) : [...S.c2w, id].slice(-4);\n    save(); renderC2();\n  }));\n  const done = [S.c2g.length === 2, S.c2h.length >= 4, S.c2w.length === 4].filter(Boolean).length;\n  $('c2Score').textContent = done + ' / 3';\n  $('c2After').hidden = !S.c2open;\n  $('c2Open').textContent = S.c2open ? 'Скрыть часть после чтения' : 'Открыть часть после чтения';\n  if($('c2Report').value !== S.c2r && document.activeElement !== $('c2Report')) $('c2Report').value = S.c2r || '';\n}\n\n/* ============ карточки разговора ============ */\nfunction renderTalks(){\n  document.querySelectorAll('[data-talk]').forEach(box => {\n    const id = box.dataset.talk, set = talkSets[id];\n    if(!set) return;\n    if(!Number.isInteger(S.talkQ[id])) S.talkQ[id] = Math.floor(Math.random() * set.qs.length);\n    const q = set.qs[Math.min(S.talkQ[id], set.qs.length-1)];\n    const tw = Number.isInteger(S.talkT[id]) && S.talkT[id] >= 0 ? set.tw[S.talkT[id]] : null;\n    box.innerHTML =\n      '\u003cdiv>\u003cp class=\"kicker\" style=\"color:#e8442a\">' + set.label + '\u003c/p>\u003ch3 class=\"display\">' + set.title + '\u003c/h3>\u003cp>' + set.intro + '\u003c/p>\u003c/div>' +\n      '\u003cdiv class=\"talk-card\">\u003cp class=\"talk-q\">' + q + '\u003c/p>' +\n      '\u003cdiv class=\"row\">\u003cbutton class=\"btn small\" data-draw=\"' + id + '\">другая карта\u003c/button>' +\n      '\u003cbutton class=\"btn small ghost\" data-twist=\"' + id + '\">поворот\u003c/button>\u003c/div>' +\n      (tw ? '\u003cdiv class=\"twist\">' + tw + '\u003c/div>' : '') +\n      '\u003cdiv class=\"frame\">' + set.frame + '\u003c/div>\u003c/div>';\n  });\n  save();\n  document.querySelectorAll('[data-draw]').forEach(b => b.addEventListener('click', () => {\n    const id = b.dataset.draw, set = talkSets[id];\n    let n = Math.floor(Math.random() * set.qs.length);\n    if(set.qs.length > 1 && n === S.talkQ[id]) n = (n+1) % set.qs.length;\n    S.talkQ[id] = n; S.talkT[id] = -1; save(); renderTalks();\n  }));\n  document.querySelectorAll('[data-twist]').forEach(b => b.addEventListener('click', () => {\n    const id = b.dataset.twist, set = talkSets[id];\n    let n = Math.floor(Math.random() * set.tw.length);\n    if(set.tw.length > 1 && n === S.talkT[id]) n = (n+1) % set.tw.length;\n    S.talkT[id] = n; save(); renderTalks();\n  }));\n}\n\n/* ============ перевод по клику ============ */\nfunction lookup(raw){\n  const k = clean(raw);\n  if(!k) return null;\n  if(glossary[k]) return glossary[k];\n  const b = k.replace(/[’']s$/,'');\n  if(glossary[b]) return glossary[b];\n  const forms = [b.replace(/ies$/,'y'), b.replace(/(es|s)$/,''), b.replace(/ied$/,'y'),\n    b.replace(/ed$/,''), b.replace(/ed$/,'e'), b.replace(/ing$/,''), b.replace(/ing$/,'e'),\n    b.replace(/([a-z])\\1(ed|ing)$/,'$1')];\n  for(const f of forms) if(f && glossary[f]) return glossary[f];\n  return null;\n}\nasync function auto(text){\n  const k = clean(text);\n  if(S.cache[k]) return S.cache[k];\n  const ctrl = new AbortController();\n  const t = setTimeout(() => ctrl.abort(), 7000);\n  try{\n    const r = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=en|ru', { signal:ctrl.signal });\n    const d = await r.json();\n    const ru = d && d.responseData && d.responseData.translatedText;\n    if(ru){ S.cache[k] = ru; save(); }\n    return ru || null;\n  } catch(e){ return null; } finally { clearTimeout(t); }\n}\nlet trWord = '', trRu = '';\nfunction placeTr(rect){\n  const el = $('tr');\n  el.classList.add('open');\n  const w = el.offsetWidth, h = el.offsetHeight;\n  let left = rect.left + rect.width/2 - w/2;\n  left = Math.max(10, Math.min(left, window.innerWidth - w - 10));\n  let top = rect.bottom + 10;\n  if(top + h > window.innerHeight - 10) top = Math.max(10, rect.top - h - 10);\n  el.style.left = left + 'px'; el.style.top = top + 'px';\n}\nfunction hideTr(){ $('tr').classList.remove('open'); }\nasync function showTr(text, rect){\n  trWord = text.trim(); trRu = '';\n  $('trWord').textContent = trWord;\n  $('trKeep').classList.remove('done'); $('trKeep').textContent = 'В словарь';\n  const local = lookup(trWord);\n  if(local){ trRu = local; $('trRu').textContent = local; $('trSrc').textContent = 'словарь урока'; placeTr(rect); return; }\n  $('trRu').textContent = 'перевожу…'; $('trSrc').textContent = '';\n  placeTr(rect);\n  const ru = await auto(trWord);\n  if(trWord !== text.trim()) return;\n  if(ru){ trRu = ru; $('trRu').textContent = ru; $('trSrc').textContent = 'авто-перевод'; }\n  else { $('trRu').textContent = 'Нет связи со словарём. Спроси преподавателя или попробуй позже.'; }\n  placeTr(rect);\n}\nconst SKIP = 'button,input,textarea,select,a,summary,label,.tr,.drawer,.spot';\nfunction wordAt(x,y){\n  let range = null;\n  if(document.caretRangeFromPoint) range = document.caretRangeFromPoint(x,y);\n  else if(document.caretPositionFromPoint){\n    const p = document.caretPositionFromPoint(x,y);\n    if(p){ range = document.createRange(); range.setStart(p.offsetNode,p.offset); range.setEnd(p.offsetNode,p.offset); }\n  }\n  if(!range || !range.startContainer || range.startContainer.nodeType !== 3) return null;\n  const text = range.startContainer.textContent;\n  const isL = ch => /[A-Za-z’'-]/.test(ch || '');\n  let i = range.startOffset;\n  if(!isL(text[i]) && !isL(text[i-1])) return null;\n  let s = i, e = i;\n  while(s > 0 && isL(text[s-1])) s--;\n  while(e \u003c text.length && isL(text[e])) e++;\n  const w = text.slice(s,e).replace(/^[-’']+|[-’']+$/g,'');\n  if(w.length \u003c 2 || !/[A-Za-z]/.test(w)) return null;\n  const r = document.createRange(); r.setStart(range.startContainer,s); r.setEnd(range.startContainer,e);\n  return { w, rect:r.getBoundingClientRect() };\n}\nfunction onSel(){\n  setTimeout(() => {\n    const sel = window.getSelection();\n    if(!sel || sel.isCollapsed || !sel.rangeCount) return;\n    const t = sel.toString().trim();\n    if(!t || t.length > 70 || !/[A-Za-z]/.test(t)) return;\n    showTr(t, sel.getRangeAt(0).getBoundingClientRect());\n  }, 30);\n}\n\n/* ============ словарь ============ */\nfunction renderWords(){\n  $('wordCount').textContent = S.words.length;\n  $('wordsList').innerHTML = S.words.length\n    ? S.words.map((w,i) => '\u003cdiv class=\"vword\">\u003cdiv>\u003cb>' + w.en + '\u003c/b>\u003cspan>' + w.ru + '\u003c/span>\u003c/div>' +\n      '\u003cbutton data-wsay=\"' + i + '\" aria-label=\"Звук\">▶\u003c/button>\u003cbutton data-wdel=\"' + i + '\" aria-label=\"Удалить\">✕\u003c/button>\u003c/div>').join('')\n    : '\u003cdiv class=\"empty\">Пока пусто. Первое слово можно поймать прямо в тексте задания.\u003c/div>';\n  $('wordsList').querySelectorAll('[data-wsay]').forEach(b => b.addEventListener('click', () => speak(S.words[+b.dataset.wsay].en, .8)));\n  $('wordsList').querySelectorAll('[data-wdel]').forEach(b => b.addEventListener('click', () => { S.words.splice(+b.dataset.wdel,1); save(); renderWords(); }));\n}\n\n/* ============ переключатели ============ */\nfunction syncSwitches(){\n  const map = [['swA2','a2','Опоры A2'],['swHard','hard','Hard mode'],['swTap','tap','Перевод по клику'],['swTeacher','teacher','Заметки преподавателя'],\n    ['swA2m','a2','Опоры A2'],['swHardm','hard','Hard mode'],['swTapm','tap','Перевод по клику'],['swTeacherm','teacher','Преподаватель']];\n  map.forEach(([id,key,label]) => {\n    const el = $(id); if(!el) return;\n    el.setAttribute('aria-pressed', String(!!S[key]));\n    el.textContent = label + (S[key] ? ' · вкл' : ' · выкл');\n  });\n}\nfunction toggle(key, msg){\n  S[key] = !S[key]; save(); syncSwitches(); render();\n  if(key === 'a2') renderCards();\n  if(msg) toast(msg + (S[key] ? ' включён' : ' выключен'));\n}\n\n/* ============ запуск ============ */\nfunction init(){\n  const fromHash = location.hash.match(/^#page-(\\d+)$/);\n  if(fromHash) S.page = Math.max(0, Math.min(pages.length-1, +fromHash[1] - 1));\n  $('agentInput').value = S.agent || '';\n  $('agentSave').addEventListener('click', () => {\n    S.agent = $('agentInput').value.trim() || 'ведущая дела'; save(); renderBar(); toast('Имя вписано в журнал');\n  });\n  document.querySelectorAll tener('click', checkForge);\n  $('gapCheck').addEventListener('click', checkGaps);\n\n  document.querySelectorAll('#verdictList .opt').forEach(b => b.addEventListener('click', () => {\n    S.verdict = b.textContent; save(); renderVerdict();\n    if(S.bank.length >= 5) stamp('hearing');\n  }));\n  clockFace();\n  $('clockStart').addEventListener('click', () => {\n    if(clockInt){ clearInterval(clockInt); clockInt = null; $('clockStart').textContent = 'Продолжить'; return; }\n    if(S.clock \u003c= 0) S.clock = 45;\n    $('clockStart').textContent = 'Пауза';\n    clockInt = setInterval(() => {\n      S.clock--; clockFace(); save();\n      if(S.clock \u003c= 0){ clearInterval(clockInt); clockInt = null; $('clockStart').textContent = 'Ещё раз'; toast('Время. Договори начатое предложение.'); }\n    }, 1000);\n  });\n  $('clockReset').addEventListener('click', () => {\n    clearInterval(clockInt); clockInt = null; S.clock = 45; save(); clockFace(); $('clockStart').textContent = 'Старт';\n  });\n  document.querySelectorAll('.req').forEach((c,i) => {\n    c.checked = !!S.req[i];\n    c.addEventListener('change', e => { S.req[i] = e.target.checked; save(); });\n  });\n  document.querySelectorAll('.cando').forEach((c,i) => {\n    c.checked = !!S.cando[i];\n    c.addEventListener('change', e => { S.cando[i] = e.target.checked; save(); });\n  });\n\n  document.querySelectorAll('[data-c2g]').forEach(b => b.addEventListener('click', () => {\n    const v = b.dataset.c2g;\n    S.c2g = S.c2g.includes(v) ? S.c2g.filter(x => x !== v) : [...S.c2g, v].slice(-2);\n    save(); renderC2();\n  }));\n  $('c2Open').addEventListener('click', () => { S.c2open = !S.c2open; save(); renderC2(); });\n  $('c2Report').addEventListener('input', e => { S.c2r = e.target.value; save(); });\n\n  $('btnFile').addEventListener('click', () => { renderFile(); $('fileBg').classList.add('open'); });\n  document.querySelectorAll('#btnVoice,[data-voice-pick]').forEach(b => b.addEventListener('click', () => windo       folio.classList.add('has-hero');\n      }\n      const task = folio.querySelector(':scope > .task');\n      const who = SPEAK[key];\n      if(task && who && !task.classList.contains('has-portrait')){\n        task.classList.add('has-portrait');\n        const body = document.createElement('div');\n        while(task.firstChild) body.appendChild(task.firstChild);\n        task.innerHTML = '\u003cspan class=\"portrait\">' + mono(who) + '\u003c/span>';\n        body.insertAdjacentHTML('afterbegin', '\u003cspan class=\"speaker\">' + who + '\u003c/span>');\n        task.appendChild(body);\n      }\n    });\n  });\n\n  /* ---------- титульный экран ---------- */\n  const art = document.querySelector('.cover-art');\n  if(art){\n    const svg = art.querySelector('svg'); svg && svg.remove();\n    art.insertAdjacentHTML('afterbegin', '\u003cimg src=\"' + PAINT.cover + '\" alt=\"Трактир «Адмирал Бенбоу» на утёсе на закате, корабль на рейде\">');\n    const tag = art.querySelector('.art-tag');\n    if(tag) tag.innerHTML = '\u003cb>«Адмирал Бенбоу»\u003c/b>';\n  }\n  const coverFolio = document.querySelector('.folio.cover');\n  if(coverFolio && !coverFolio.querySelector('.cast-wrap')){\n    coverFolio.insertAdjacentHTML('beforeend', '\u003cdiv class=\"cast-wrap\">\u003cp class=\"kicker\">Действующие лица\u003c/p>\u003cdiv class=\"cast\">' +\n      Object.keys(CAST).map(n => '\u003cdiv class=\"cast-card\" style=\"--c:' + CAST[n][1] + '\">' + mono(n) + '\u003cdiv>\u003cb>' + n + '\u003c/b>\u003cspan>' + CAST[n][2] + '\u003c/span>\u003c/div>\u003c/div>').join('') +\n      '\u003c/div>\u003c/div>');\n  }\n  const saved = (() => { try { return JSON.parse(localStorage.getItem('benbow-ledger-v1') || '{}').page || 0; } catch(e){ return 0; } })();\n  const goTab = i => { const t = document.querySelector('#tabsDesktop .tab[data-i=\"' + i + '\"]'); t && t.click(); };\n  const byName = n => pages.findIndex(p => p.dataset.tab === n);\n  const idBox = document.querySelector('.cover .id-box');\n  if(idBox && !$('mainMenu')){\n    idBox.insertAdjacentHTML('afterend', '\u003cnav class=\"menu\" id=\"mainMenu\" aria-label=\"Главное меню\">' +\n      (saved > 0 ? '\u003cbutton class=\"main\" data-m=\"continue\">Продолжить \u003csmall>' + (pages[saved] ? pages[saved].dataset.tab : '') + '\u003c/small>\u003c/button>' : '') +\n      '\u003cbutton class=\"' + (saved > 0 ? '' : 'main') + '\" data-m=\"new\">Новая игра \u003csmall>осмотр берега\u003c/small>\u003c/button>' +\n      '\u003cbutton data-m=\"rapid\">Скоростной рейс \u003csmall>60 секунд\u003c/small>\u003c/button>' +\n      '\u003cbutton data-m=\"ch3\">Глава III · The Black Spot \u003csmall>9 заданий + домашка\u003c/small>\u003c/button>' +\n      '\u003cbutton data-m=\"ch4\">Глава IV · The Sea-Chest \u003csmall>9 заданий + домашка\u003c/small>\u003c/button>' +\n      '\u003cbutton data-m=\"ch5\">Глава V · The Last of the Blind Man \u003csmall>9 заданий + домашка\u003c/small>\u003c/button>' +\n      '\u003cbutton data-m=\"words\">Тренажёр слов A2 \u003csmall>20 частых слов\u003c/small>\u003c/button>' +\n      '\u003cbutton data-m=\"settings\">Настройки \u003csmall>сложность и подсказки\u003c/small>\u003c/button>\u003c/nav>');\n    $('mainMenu').addEventListener('click', e => {\n      const b = e.target.closest('[data-m]'); if(!b) return;\n      ({ continue:() => goTab(saved), new:() => goTab(1), rapid:() => goTab(byName('Скоростной рейс')), ch3:() => { __tiGo('chapter-3.html'); }, ch4:() => { __tiGo('chapter-4.html'); }, ch5:() => { __tiGo('chapter-5.html'); }, words:() => { __tiGo('a2-words.html'); }, settings:openSettings })[b.dataset.m]();\n    });\n  }\n\n  /* ---------- верхняя панель: одна строка ---------- */\n  const bar = document.querySelector('.bar');\n  if(bar && !bar.querySelector('.who')){\n    const first = bar.firstElementChild;\n    first.classList.add('who');\n    const text = document.createElement('div'); text.className = 'who-text';\n    text.appendChild($('agentName'));\n    $('xpRank') && text.appendChild($('xpRank'));\n    const line = document.querySelector('.xp-line'); line && text.appendChild(line);\n    first.innerHTML = '\u003cspan class=\"mono\" id=\"agentMono\" style=\"--c:var(--accent)\">?\u003c/span>';\n    first.appendChild(text);\n    const btns = bar.querySelector('.bar-btns');\n    ['revBtn','cardBtn'].forEach(id => $(id) && btns.appendChild($(id)));\n    const setMono = () => {\n      const n = ($('agentName').textContent || '').trim();\n      $('agentMono').textContent = n && n !== 'имя не вписано' ? n[0].toUpperCase() : '?';\n    };\n    new MutationObserver(setMono).observe($('agentName'), { childList:true, characterData:true, subtree:true });\n    setMono();\n  }\n\n  /* ---------- настройки ---------- */\n  const setBg = document.createElement('div');\n  setBg.className = 'drawer-bg';\n  setBg.innerHTML = '\u003caside class=\"drawer\">\u003cdiv class=\"row\" style=\"justify-content:space-between;align-items:flex-start\">' +\n    '\u003cdiv>\u003cp class=\"kicker\">Параметры\u003c/p>\u003ch2>Настройки\u003c/h2>\u003c/div>\u003cbutton class=\"btn ghost small\" data-close>Закрыть\u003c/button>\u003c/div>' +\n    '\u003cdiv id=\"setList\" style=\"margin-top:18px\">\u003c/div>' +\n    '\u003cbutton class=\"btn ghost small\" id=\"setReset\" style=\"margin-top:14px\">Очистить журнал\u003c/button>\u003c/aside>';\n  document.body.appendChild(setBg);\n  const opts = [\n    ['swA2','Опоры уровня A2','Прячет выражения B1 и оставляет ядро.'],\n    ['swHard','Высокая сложность','Убирает русские подсказки и готовые модели.'],\n    ['swTap','Перевод по нажатию','Нажатие на английское слово показывает перевод.'],\n    ['swTeacher','Режим мастера игры','Методические комментарии для преподавателя.'],\n    ['sndBtn','Звук и вибрация','Сигналы при верных и неверных ответах.']\n  ];\n  function renderSettings(){\n    $('setList').innerHTML = opts.map(([id, t, d]) => {\n      const on = $(id) && $(id).getAttribute('aria-pressed') === 'true';\n      return '\u003cbutton class=\"opt ' + (on ? 'pick' : '') + '\" data-sw=\"' + id + '\">\u003cspan>\u003cb style=\"display:block;font-weight:500;color:var(--ink)\">' +\n        t + ' · ' + (on ? 'вкл' : 'выкл') + '\u003c/b>\u003cspan style=\"font-size:14px\">' + d + '\u003c/span>\u003c/span>\u003c/button>';\n    }).join('');\n    $('setList').querySelectorAll('[data-sw]').forEach(b => b.addEventListener('click', () => { $(b.dataset.sw).click(); renderSettings(); }));\n  }\n  function openSettings(){ renderSettings(); setBg.classList.add('open'); }\n  setBg.addEventListener('click', e => { if(e.target === setBg || e.target.closest('[data-close]')) setBg.classList.remove('open'); });\n  $('setReset').addEventListener('click', () => $('swReset').click());\n  const mobBtn = $('mobBtn');\n  if(mobBtn && !$('mobSet')){\n    mobBtn.insertAdjacentHTML('beforebegin', '\u003cbutton id=\"mobSet\" style=\"background:transparent;color:var(--ink);border:1px solid var(--rule);margin-right:6px\">⚙\u003c/button>');\n    const wrap = document.createElement('div'); wrap.style.display = 'flex';\n    mobBtn.parentNode.insertBefore(wrap, $('mobSet')); wrap.appendChild($('mobSet')); wrap.appendChild(mobBtn);\n    $('mobSet').addEventListener('click', openSettings);\n  }\n\n  /* ---------- проверки навыков ---------- */\n  const skills = {\n    chainCheck:['Память','средне · 10','#7cb8f0'], patternWriteCheck:['Чутьё языка','легко · 8','#b69cff'],\n    contrastCheck:['Рассказчик','трудно · 12','#ff7aa8'], dictCheck:['Слух','трудно · 12','#b69cff'],\n    forgeCheck:['Красноречие','трудно · 13','#ff7aa8'], gapCheck:['Память','очень трудно · 14','#7cb8f0'],\n    rfStart:['Реакция','средне · 10','#f2c14e'], clockStart:['Убеждение','трудно · 12','#ff7aa8']\n  };\n  Object.entries(skills).forEach(([id, [n, dc, c]]) => {\n    const b = $(id); if(!b) return;\n    b.insertAdjacentHTML('beforebegin', '\u003cspan class=\"skill\" style=\"--sk:' + c + '\">' + n + ' \u003ci>' + dc + '\u003c/i>\u003c/span>');\n  });\n  const banner = document.createElement('div'); banner.className = 'check-banner'; banner.setAttribute('role','status');\n  document.body.appendChild(banner);\n  let bT;\n  Object.keys(skills).forEach(id => {\n    const b = $(id); if(!b || id === 'rfStart' || id === 'clockStart') return;\n    b.addEventListener('click', () => setTimeout(() => {\n      const scope = b.closest('.folio') || document;\n      const ok = scope.querySelectorAll('.ok:not(.status)').length, bad = scope.querySelectorAll('.no:not(.status)');\n      if(!ok && !bad.length) return;\n      bad.forEach(el => { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); });\n      const fail = ok === 0;\n      banner.className = 'check-banner' + (fail ? ' fail' : '');\n      banner.innerHTML = '\u003csmall>Проверка · ' + skills[id][0] + '\u003c/small>\u003cb>' + (bad.length === 0 ? 'Успех' : fail ? 'Провал' : 'Частичный успех') + '\u003c/b>\u003cspan>' +\n        (bad.length === 0 ? 'Всё сходится. Дело движется.' : fail ? 'Ни одна деталь не легла. Возьми подсказку и попробуй снова.' : 'Верно: ' + ok + ' · мимо: ' + bad.length) + '\u003c/span>';\n      requestAnimationFrame(() => banner.classList.add('show'));\n      clearTimeout(bT); bT = setTimeout(() => banner.classList.remove('show'), 2600);\n    }, 140));\n  });\n\n  /* ---------- «задание выполнено» ---------- */\n  const done = document.createElement('div'); done.className = 'quest-done'; document.body.appendChild(done);\n  let dT;\n  const sealRow = $('sealRow');\n  if(sealRow){\n    let count = sealRow.querySelectorAll('.seal-dot.on').length;\n    new MutationObserver(() => {\n      const n = sealRow.querySelectorAll('.seal-dot.on').length;\n      if(n > count){\n        const last = document.querySelector('#fileList .slip:last-child b');\n        const note = document.querySelector('#fileList .slip:last-child span');\n        done.innerHTML = '\u003csmall>Задание выполнено · +25 XP\u003c/small>\u003cb>' + (last ? last.textContent.replace(/^\\d+\\s*·\\s*/, '') : 'Лист закрыт') + '\u003c/b>\u003cspan>' + (note ? note.textContent : '') + '\u003c/span>';\n        done.classList.add('show'); clearTimeout(dT); dT = setTimeout(() => done.classList.remove('show'), 4200);\n      }\n      count = n;\n    }).observe(sealRow, { childList:true, subtree:true });\n  }\n\n  /* ---------- кто в зале ---------- */\n  const hearing = pages.find(p => p.dataset.tab === 'Слушание дела');\n  const hTask = hearing && hearing.querySelector('.folio > .task');\n  if(hTask && !hearing.querySelector('.court')){\n    const lines = { 'Джим Хокинс':'Видел всё, но ему никто не верит — он мальчик.', 'Билли Бонс':'Платит золотом и держит трактир в страхе.', 'Доктор Ливси':'Единственный, кто не испугался ножа.' };\n    hTask.insertAdjacentHTML('afterend', '\u003cdiv class=\"court\">' + Object.entries(lines).map(([n, t]) =>\n      '\u003cdiv class=\"court-card\" style=\"--c:' + CAST[n][1] + '\">' + mono(n) + '\u003cdiv>\u003cb>' + n + '\u003c/b>\u003cspan>' + t + '\u003c/span>\u003c/div>\u003c/div>').join('') + '\u003c/div>');\n  }\n\n  /* ---------- цвет текущей сцены ---------- */\n  function glow(){\n    const on = pages.find(p => p.classList.contains('on'));\n    const c = (on && ACCENT[on.dataset.tab]) || '#e59a45';\n    root.style.setProperty('--accent', c);\n    document.body.style.setProperty('--glow', c);\n  }\n  const tabs = $('tabsDesktop');\n  tabs && new MutationObserver(glow).observe(tabs, { childList:true });\n  glow();\n}\nif(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);\nelse init();\n})();\n\n\u003c/script>\n\u003cscript>\n(() => {\n  const FILES = {\"lesson-1-2.html\": \"12\", \"chapter-3.html\": \"ch3\", \"chapter-4.html\": \"ch4\", \"chapter-5.html\": \"ch5\", \"a2-words.html\": \"words\", \"index.html\": \"12\", \"index-3.html\": \"12\"};\n  const part = href => FILES[String(href || '').split('#')[0].split('?')[0].split('/').pop()];\n  const inHub = window.parent !== window;\n  window.__tiGo = href => { const id = part(href); if(inHub && id) window.parent.postMessage({ tiGo:id }, '*'); else location.href = href; };\n  document.addEventListener('click', e => {\n    const a = e.target.closest && e.target.closest('a[href]');\n    if(!a || !inHub) return;\n    const id = part(a.getAttribute('href'));\n    if(id){ e.preventDefault(); window.parent.postMessage({ tiGo:id }, '*'); }\n  }, true);\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>" },
  "ch3": { title:"Глава III · The Black Spot", html:"\u003c!doctype html>\n\u003chtml lang=\"ru\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003cmeta name=\"theme-color\" content=\"#9fdcff\">\n\u003cmeta name=\"format-detection\" content=\"telephone=no\">\n\u003ctitle>The Black Spot · Treasure Island III\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Nunito:ital,wght@0,600;0,700;0,800;1,600&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n/* Общие стили страниц с главами Treasure Island (III–V). */\n:root{\n  --ink:#233a57; --ink-soft:#5d6f88; --ink-dim:#98a6b8;\n  --paper-2:#f4f9ff; --line:#dbe7f3; --rule:#e6eef7; --shadow:#d3e1ef;\n  --tide:#38b6ff; --signal:#ff5a5f; --moss:#4cc25a; --accent:#e07a2e;\n  --ui:Rubik,\"Trebuchet MS\",sans-serif; --story:Nunito,\"Trebuchet MS\",sans-serif;\n}\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%;background:#cfeeff;overflow-x:hidden}\nbody{margin:0;min-height:100vh;min-height:100dvh;overflow-x:clip;color:var(--ink);font-family:var(--story);font-size:17px;font-weight:600;line-height:1.5;\n  background:\n    radial-gradient(ellipse 22% 9% at 12% 16%,rgba(255,255,255,.9),transparent 70%),\n    radial-gradient(ellipse 18% 7% at 78% 10%,rgba(255,255,255,.85),transparent 70%),\n    linear-gradient(180deg,#9fdcff 0%,#d8f2ff 45%,#fff6e0 100%);background-attachment:fixed}\nbutton,input,textarea{font:inherit;color:inherit}\nbutton{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}\n:focus-visible{outline:3px solid var(--accent);outline-offset:3px}\nh1,h2,h3{margin:0;font-family:var(--ui);font-weight:800;line-height:1.1}\np{margin:0 0 10px}\nb,strong{font-weight:800}\n[hidden]{display:none!important}\n\n.wrap{max-width:1100px;margin:0 auto;padding:18px 18px 110px}\n\n/* шапка */\n.top{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:18px;align-items:center;padding:22px 24px;overflow:hidden;\n  color:#fff;background:linear-gradient(150deg,#16324f 0%,#23476e 55%,#3a5d86 100%);border-radius:26px;box-shadow:0 7px 0 #0f2238}\n.top::before{content:\"\";position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,rgba(255,214,120,.35),transparent 40%);pointer-events:none}\n.top .mark{display:inline-block;padding:3px 10px;font-family:var(--ui);font-size:11px;font-weight:700;letter-spacing:.12em;color:#16324f;background:#ffd36b;border-radius:999px}\n.top h1{margin-top:8px;font-size:clamp(32px,5vw,52px)}\n.top h1 i{display:block;font-style:normal;font-size:.55em;color:#ffd36b}\n.top p{max-width:56ch;margin:8px 0 0;font-size:15.5px;color:rgba(255,255,255,.88)}\n.top-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}\n.top-links a{display:inline-flex;align-items:center;min-height:40px;padding:6px 14px;font-family:var(--ui);font-size:13px;font-weight:700;color:#fff;text-decoration:none;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);border-radius:14px}\n.top svg{position:relative;width:100%;height:auto}\n.progress{display:flex;align-items:center;gap:10px;margin-top:14px;font-family:var(--ui);font-size:13px;font-weight:700;color:rgba(255,255,255,.85)}\n.progress .bar{flex:1;max-width:260px;height:10px;background:rgba(255,255,255,.18);border-radius:10px;overflow:hidden}\n.progress .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd36b,#ffb020);border-radius:10px;transition:width .4s}\n\n/* шаги */\n.steps{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px;margin:22px 0 0}\n.step{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:74px;padding:8px 4px;text-align:center;background:#fff;border:2px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--shadow)}\n.step b{display:grid;place-items:center;width:30px;height:30px;font-family:var(--ui);font-size:14px;color:#fff;background:var(--accent);border-radius:50%}\n.step span{font-family:var(--ui);font-size:11.5px;font-weight:700;line-height:1.15;color:var(--ink-soft)}\n.step.done b{background:var(--moss)}\n.step.done b::after{content:\"✓\";font-size:13px}\n.step.done b em{display:none}\n.step em{font-style:normal}\n.step.on{background:var(--accent);border-color:color-mix(in srgb,var(--accent) 75%,#000);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000)}\n.step.on span{color:#fff}\n.step.on b{color:var(--accent);background:#fff}\n\n/* лист */\n.stage{margin-top:22px;padding:26px;background:#fff;border:2px solid var(--line);border-radius:26px;box-shadow:0 7px 0 var(--shadow)}\n.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:14px;margin-bottom:18px;border-bottom:2px dashed var(--line)}\n.kicker{margin:0 0 6px;font-family:var(--ui);font-size:12.5px;font-weight:700;letter-spacing:.08em;color:var(--accent)}\n.head h2{font-size:clamp(26px,3.4vw,38px)}\n.stamp{padding:6px 12px;font-family:var(--ui);font-size:13px;font-weight:700;color:#fff;background:var(--accent);border-radius:999px}\n.task{max-width:72ch;font-size:17px}\n.task b{color:color-mix(in srgb,var(--accent) 85%,#000)}\n.note{max-width:72ch;padding:14px 16px;font-size:15.5px;color:var(--ink-soft);background:#eef8ff;border-radius:16px}\n.note b{color:var(--ink)}\n.teach{margin-top:18px;padding:0;font-size:15px;color:#5a4a1a;background:#fff8dc;border:2px dashed #f0d27a;border-radius:18px}\n.teach summary{padding:12px 16px;font-family:var(--ui);font-size:13px;font-weight:800;color:#b07a00;cursor:pointer}\n.teach p{margin:0;padding:0 16px 14px}\n\n.btn{min-height:46px;padding:10px 20px;font-family:var(--ui);font-size:15px;font-weight:800;color:#fff;background:var(--tide);border:0;border-radius:16px;box-shadow:0 5px 0 color-mix(in srgb,var(--tide) 70%,#000);transition:transform .1s}\n.btn:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--tide) 70%,#000)}\n.btn.ghost{color:var(--ink);background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--shadow)}\n.btn.go{background:linear-gradient(180deg,#5ddc6a,#35c04a);box-shadow:0 5px 0 #248a37}\n.btn.warm{background:var(--accent);box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 65%,#000)}\n.btn.small{min-height:40px;padding:6px 13px;font-size:13.5px;border-radius:13px}\n.btn:disabled{opacity:.4}\n.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}\n.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}\n.slab{padding:18px;background:var(--paper-2);border:2px solid var(--rule);border-radius:20px}\n.slab h3{font-size:20px;margin-bottom:8px}\n.status{min-height:24px;margin-top:12px;font-size:16px;font-weight:700;color:var(--ink-soft)}\n.status.ok{color:#2e9e3c}\n.status.no{color:var(--signal)}\n.field{width:100%;min-height:48px;padding:11px 14px;color:var(--ink);background:#f6faff;border:2px solid var(--line);border-radius:14px;font-weight:700}\n.field:focus{outline:none;border-color:var(--accent);background:#fff}\ntextarea.field{min-height:180px;resize:vertical;line-height:1.5}\n.frame{margin-top:12px;padding-top:10px;border-top:2px dashed var(--line);font-size:15px;color:var(--ink-soft)}\n\n/* выбор вариантов */\n.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}\n.opt{display:flex;align-items:center;gap:10px;min-height:54px;padding:10px 14px;text-align:left;font-size:16px;font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--shadow)}\n.opt:hover{border-color:var(--accent)}\n.opt.pick{color:#fff;background:var(--accent);border-color:color-mix(in srgb,var(--accent) 75%,#000)}\n.opt.hit{color:#fff;background:var(--moss);border-color:#2ea343}\n.opt.miss{color:#fff;background:var(--sig q{min-height:52px;margin:0 0 14px;font-family:var(--ui);font-size:clamp(18px,2vw,22px);font-weight:700;line-height:1.3}\n.twist{margin-top:12px;padding:9px 12px;font-size:15px;font-weight:700;color:#8a4a00;background:#fff3cf;border-radius:12px}\n.clock{padding:16px;text-align:center;background:#fff;border:2px solid var(--line);border-radius:18px}\n.clock b{display:block;font-family:var(--ui);font-size:46px;font-weight:800;font-variant-numeric:tabular-nums}\n.check{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;font-size:16px}\n.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--moss)}\n\n/* дневник */\n.targets{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}\n.targets span{padding:4px 10px;font-family:var(--ui);font-size:13px;font-weight:700;color:var(--ink-soft);background:var(--paper-2);border:2px solid var(--line);border-radius:999px}\n.targets span.hit{color:#fff;background:var(--moss);border-color:#2ea343}\n.meter-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-family:var(--ui);font-size:14px;font-weight:700;color:var(--ink-soft)}\n.meter-row b{color:var(--ink)}\n\n/* финал */\n.gapline{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,.35fr);gap:12px;align-items:center;padding:12px 14px;background:#fff;border:2px solid var(--line);border-radius:16px}\n.gapline+.gapline{margin-top:10px}\n.hw-part{margin-top:22px;padding:18px;background:var(--paper-2);border:2px solid var(--rule);border-radius:20px}\n.hw-part:first-of-type{margin-top:4px}\n.hw-part h3{display:flex;align-items:center;gap:10px;font-size:21px;margin-bottom:6px}\n.hw-part h3 b{display:grid;place-items:center;width:32px;height:32px;font-size:15px;color:#fff;background:var(--accent);border-radius:50%}\n.hw-part.done h3 b{background:var(--moss)}\n.hw-line{padding:12px 14px;background:#fff;border:2px solid var(--line);border-radius:16px}\n.hw-line+.hw-line{margin-top:10px}\n.hw-line.ok{background:#eafbe9;border-color:#9fe0a5}\n.hw-line.no{background:#fff0f0;border-color:#ffb3b5}\n.hw-line .q{margin-bottom:8px;font-weight:800}\n.hw-line .tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}\n.fb .w-ok{color:#2e9e3c;font-weight:800}\n.fb .w-no{color:var(--signal);text-decoration:line-through}\n.gapline.ok{background:#eafbe9;border-color:#9fe0a5}\n.gapline.no{background:#fff0f0;border-color:#ffb3b5}\n.seal{display:grid;place-items:center;width:160px;height:160px;margin:6px auto 14px;text-align:center;background:radial-gradient(circle at 35% 30%,#ffe066,#ffb020 70%);border:4px solid #fff;border-radius:50%;box-shadow:0 7px 0 #e59400,0 0 0 8px rgba(255,194,26,.25)}\n.seal b{display:block;font-family:var(--ui);font-size:40px;font-weight:800;color:#7a4a00}\n.seal span{font-family:var(--ui);font-size:11px;font-weight:800;color:#7a4a00}\n\n/* низ */\n.foot{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;\n  padding:12px max(18px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));background:rgba(255,255,255,.96);border-top:2px solid var(--line)}\n.foot .mid{font-family:var(--ui);font-size:13px;font-weight:700;color:var(--ink-soft)}\n.toast{position:fixed;left:50%;bottom:92px;z-index:50;max-width:min(440px,calc(100vw - 32px));padding:12px 18px;font-size:15.5px;font-weight:700;color:#fff;background:var(--ink);border-radius:16px;box-shadow:0 5px 0 rgba(0,0,0,.2);transform:translate(-50%,14px);opacity:0;transition:.25s;pointer-events:none}\n.toast.show{opacity:1;transform:translate(-50%,0)}\n.pop{animation:pop .4s cubic-bezier(.2,1.3,.4,1) both}\n@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}\n.shake{animation:shake .38s linear}\n@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}\n\n@media (max-width:900px){\n  .steps{grid-template-columns:repeat(5,minmax(0, th('en')) return -1;\n  const name = v.name || '';\n  if(NOVELTY.test(name)) return -1;\n  let s = 10;\n  if(ROBOTIC.test(name)) s -= 30;\n  if(HQ.test(name)) s += 50;\n  if(NICE.test(name)) s += 40;\n  if(/^microsoft .* desktop/i.test(name)) s += 5;\n  if(lang === 'en-gb') s += 20; else if(lang === 'en-us') s += 15; else s += 5;\n  return s;\n}\nfunction english(){\n  return load().filter(v => score(v) > -1).sort((a, b) => score(b) - score(a));\n}\nfunction current(){\n  const list = english();\n  let pref = '';\n  try { pref = localStorage.getItem(PREF) || ''; } catch(e){}\n  return list.find(v => v.voiceURI === pref || v.name === pref) || list[0] || null;\n}\n\nlet warned = false;\nfunction notice(msg){\n  const t = document.getElementById('toast');\n  if(t){ t.textContent = msg; t.classList.add('show'); clearTimeout(notice._t); notice._t = setTimeout(() => t.classList.remove('show'), 3200); }\n}\n\n/* rate: 1 — обычная речь; всё ниже .7 у большинства голосов звучит «сломанно» */\nfunction speak(text, rate, voiceOverride){\n  if(!synth){ notice('В этом браузере нет озвучки. Попробуйте Chrome, Edge или Safari.'); return false; }\n  const v = voiceOverride || current();\n  if(!v && !warned){ warned = true; notice('На устройстве нет английского голоса — нажмите «🔊 Голос», там инструкция.'); }\n  synth.cancel();\n  const u = new SpeechSynthesisUtterance(String(text));\n  if(v){ u.voice = v; u.lang = v.lang; } else u.lang = 'en-GB';\n  const r = Number(rate) || .9;\n  u.rate = Math.min(1.05, Math.max(.72, r \u003c .75 ? .72 : r + .08));\n  u.pitch = 1;\n  window.__ttsUtterance = u;           /* Chrome иначе может собрать фразу сборщиком мусора и оборвать её */\n  setTimeout(() => synth.speak(u), 50); /* Chrome теряет фразу, если speak вызвать сразу после cancel */\n  return true;\n}\n\n/* Длинный текст читаем по предложениям: Chrome обрывает одну длинную фразу\n   примерно через 15 секунд. onEach(i) вызывается в начале каждого предложения. */\nlet queueId = 0;\nfunction speakQueue(list, rate, onEach, onDone){\n  if(!synth){ notice('В этом браузере нет озвучки. Попробуйте Chrome, Edge или Safari.'); return false; }\n  const v = current(), id = ++queueId;\n  if(!v && !warned){ warned = true; notice('На устройстве нет английского голоса — нажмите «🔊 Голос», там инструкция.'); }\n  synth.cancel();\n  const r = Number(rate) || .9;\n  const us = list.map((text, i) => {\n    const u = new SpeechSynthesisUtterance(String(text));\n    if(v){ u.voice = v; u.lang = v.lang; } else u.lang = 'en-GB';\n    u.rate = Math.min(1.05, Math.max(.72, r \u003c .75 ? .72 : r + .08)); u.pitch = 1;\n    u.onstart = () => { if(id === queueId && onEach) onEach(i); };\n    if(i === list.length - 1) u.onend = () => { if(id === queueId && onDone) onDone(); };\n    return u;\n  });\n  window.__ttsUtterance = us;\n  setTimeout(() => us.forEach(u => synth.speak(u)), 50);\n  return true;\n}\nfunction stop(){ queueId++; if(synth) synth.cancel(); }\n\n/* ---------- окно выбора голоса ---------- */\nlet box = null;\nfunction css(){\n  if(document.getElementById('tts-style')) return;\n  const st = document.createElement('style'); st.id = 'tts-style';\n  st.textContent =\n    '.tts-bg{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center;background:rgba(35,58,87,.45)}' +\n    '.tts-bg.open{display:flex}' +\n    '.tts{width:min(560px,100%);max-height:88vh;overflow-y:auto;padding:22px 18px calc(22px + env(safe-area-inset-bottom));color:#233a57;background:#f4f9ff;border-radius:26px 26px 0 0;font-family:Nunito,\"Trebuchet MS\",sans-serif;font-weight:600}' +\n    '@media (min-width:640px){.tts-bg{align-items:center}.tts{border-radius:26px}}' +\n    '.tts h2{margin:0;font-family:Rubik,\"Trebuchet MS\",sans-serif;font-size:26px;font-weight:800}' +\n    '.tts p{margin:8px 0;font-size:15px;color:#5d6f88}' +\n    '.tts-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;margin-top:8px;padding:10px 12px;background:#fff;border:2px solid #dbe7f3;border-radius:16px}' +\n    '.tts-row.on{border-color:#4cc25a;background:#eafbe9}' +\n    '.tts-row b{display:block;font-family:Rubik,\"Trebuchet MS\",sans-serif;font-size:15.5px}' +\n    '.tts-row span{font-size:13px;color:#5d6f88}' +\n    '.tts-row em{display:inline-block;margin-left:6px;padding:1px 7px;font-style:normal;font-size:11px;font-weight:800;color:#fff;background:#ffb020;border-radius:999px}' +\n    '.tts button{min-height:40px;padding:6px 12px;font-family:Rubik,\"Trebuchet MS\",sans-serif;font-size:13.5px;font-weight:800;color:#233a57;background:#fff;border:2px solid #dbe7f3;border-radius:12px;cursor:pointer}' +\n    '.tts button.pick{color:#fff;background:#38b6ff;border-color:#38b6ff}' +\n    '.tts .tts-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}' +\n    '.tts details{margin-top:14px;padding:10px 12px;background:#fff8dc;border:2px dashed #f0d27a;border-radius:16px;font-size:14.5px}' +\n    '.tts summary{font-family:Rubik,\"Trebuchet MS\",sans-serif;font-weight:800;color:#b07a00;cursor:pointer}' +\n    '.tts details li{margin:6px 0}' +\n    '.tts .tts-empty{padding:14px;text-align:center;background:#fff0f0;border:2px solid #ffd0d2;border-radius:16px;color:#b82c31}';\n  document.head.appendChild(st);\n}\nfunction rows(){\n  const list = english().slice(0, 14), cur = current();\n  if(!list.length){\n    return '\u003cdiv class=\"tts-empty\">Английских голосов на этом устройстве не найдено. Установите голос по инструкции ниже и перезагрузите страницу.\u003c/div>';\n  }\n  return list.map((v, i) =>\n    '\u003cdiv class=\"tts-row ' + (cur && v.voiceURI === cur.voiceURI ? 'on' : '') + '\">\u003cdiv>\u003cb>' + v.name.replace(/\u003c/g, '&lt;') +\n    (HQ.test(v.name) || NICE.test(v.name) ? '\u003cem>хороший\u003c/em>' : '') + '\u003c/b>\u003cspan>' + v.lang + (v.localService === false ? ' · нужен интернет' : '') + '\u003c/span>\u003c/div>' +\n    '\u003cbutton data-tts-try=\"' + i + '\" aria-label=\"Послушать\">▶\u003c/button>' +\n    '\u003cbutton class=\"' + (cur && v.voiceURI === cur.voiceURI ? 'pick' : '') + '\" data-tts-use=\"' + i + '\">' + (cur && v.voiceURI === cur.voiceURI ? 'выбран' : 'выбрать') + '\u003c/button>\u003c/div>').join('');\n}\nfunction refreshPicker(){\n  if(!box || !box.classList.contains('open')) return;\n  const list = english().slice(0, 14);\n  box.querySelector('#ttsList').innerHTML = rows();\n  box.querySelectorAll('[data-tts-try]').forEach(b => b.addEventListener('click', () => speak(SAMPLE, .9, list[+b.dataset.ttsTry])));\n  box.querySelectorAll('[data-tts-use]').forEach(b => b.addEventListener('click', () => {\n    const v = list[+b.dataset.ttsUse];\n    try { localStorage.setItem(PREF, v.voiceURI || v.name); } catch(e){}\n    speak(SAMPLE, .9, v); refreshPicker();\n  }));\n}\nfunction openPicker(){\n  css();\n  if(!box){\n    box = document.createElement('div');\n    box.className = 'tts-bg';\n    box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true'); box.setAttribute('aria-label', 'Выбор голоса');\n    box.innerHTML = '\u003cdiv class=\"tts\">\u003cdiv class=\"tts-head\">\u003cdiv>\u003ch2>Английский голос\u003c/h2>' +\n      '\u003cp>Нажми ▶, чтобы послушать, и выбери голос, который звучит естественно. Лучшие стоят сверху и помечены «хороший».\u003c/p>\u003c/div>' +\n      '\u003cbutton data-tts-close>Закрыть\u003c/button>\u003c/div>\u003cdiv id=\"ttsList\">\u003c/div>' +\n      '\u003cdetails>\u003csummary>Голос звучит плохо или его нет?\u003c/summary>\u003cul>' +\n      '\u003cli>\u003cb>iPhone / iPad:\u003c/b> Настройки → Универсальный доступ → Устный контент → Голоса → Английский → скачайте голос с пометкой «улучшенный» или «премиум» (например, Serena, Daniel, Samantha).\u003c/li>' +\n      '\u003cli>\u003cb>Mac:\u003c/b> Системные настройки → Универсальный доступ → Устный контент → Системный голос → Управлять голосами → English.\u003c/li>' +\n      '\u003cli>\u003cb>Windows:\u003c/b> откройте ый Пёс; капитан подрался с ним и прогнал его, а потом рухнул на пол — с ним случился удар. Доктор Ливси предупредил: ещё немного рома — и капитан умрёт.',\n    task:'Сегодня к трактиру придёт новый страшный гость — \u003cb>слепой нищий\u003c/b>. Как он выглядит? Выбери три детали, которые, по-твоему, будут в описании. После чтения проверишь себя в задании 5.',\n    doneText:'Прогноз записан. Теперь читай главу III и проверь себя в задании 5.',\n    frame:'“I think he has … / he wears … because …” / “I don’t think he has … because …”',\n    teach:'Не подтверждайте прогноз до чтения. Вопрос перед чтением: “Why can a blind man be scary?” — пусть студент выскажет две гипотезы и проверит их по тексту.'\n  },\n  words:{\n    items:[\n      { id:'beg',    en:'beg somebody for something', ru:'умолять кого-то о чём-то',     ex:'The sick captain begged Jim for a glass of rum.' },\n      { id:'refuse', en:'refuse to do',               ru:'отказываться что-то делать',   ex:'At first Jim refused to bring him any rum.' },\n      { id:'after',  en:'be after something',         ru:'охотиться за чем-то',          ex:'“It’s my old sea-chest they’re after,” said the captain.' },\n      { id:'die',    en:'die suddenly',               ru:'внезапно умереть',             ex:'That evening Jim’s father died suddenly.' },\n      { id:'lead',   en:'lead somebody to',           ru:'отвести кого-то к',            ex:'Jim had to lead the blind man to the captain.' },\n      { id:'grip',   en:'grip',                       ru:'крепко схватить',              ex:'The blind man gripped Jim’s hand like a vice.' },\n      { id:'letgo',  en:'let go of',                  ru:'отпустить',                    ex:'He didn’t let go of Jim’s hand.' },\n      { id:'tears',  en:'burst into tears',           ru:'расплакаться',                 ex:'When the captain fell dead, Jim burst into tears.' }\n    ],\n    ballast:'the black spot — чёрная метка, пиратский вызов · first mate — старший помощник · green shade —
